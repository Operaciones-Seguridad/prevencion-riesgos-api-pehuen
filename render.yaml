      </div>
      <label style="margin-top:4px;">Meses de revisión (en qué meses corresponde exigir esta actividad)</label>
      <div class="desc" style="margin-top:0;">Use un atajo (Todos los meses, Trimestral, Semestral) o marque manualmente los meses que correspondan.</div>
      <div id="newCompItemMesesBlock">
      <div class="toolbar" style="flex-wrap:wrap;gap:8px;margin-bottom:6px;">
        <button type="button" class="subtle-btn" data-comp-preset-new="todos">Todos los meses</button>
        <button type="button" class="subtle-btn" data-comp-preset-new="trimestral">Trimestral (Mar/Jun/Sep/Dic)</button>
        <button type="button" class="subtle-btn" data-comp-preset-new="semestral">Semestral (Jun/Dic)</button>
      </div>
      <div class="toolbar" style="flex-wrap:wrap;gap:6px 14px;" id="newCompItemMesesWrap"></div>
      </div>
      <table><thead><tr><th>Actividad</th><th>Meta mensual</th><th>Meses de revisión</th><th></th></tr></thead><tbody id="compromisosItemsTable"></tbody></table>
      </div>
    </div>

    <div class="card">
