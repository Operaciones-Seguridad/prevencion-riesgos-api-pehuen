   ========================================================= */
function nivelRiesgo(p,c){
  const v = p*c;
  if(v<=4) return "bajo";
  if(v<=9) return "medio";
  if(v<=16) return "alto";
  return "critico";
}
function nivelLabel(n){ return {bajo:"Bajo",medio:"Medio",alto:"Alto",critico:"Crítico"}[n]||n; }

/* =========================================================
   JERARQUÍA DE CONTROLES (DS N°44)
   El DS 44 exige aplicar las medidas de control en orden de
   prioridad: A) Eliminación, B) Sustitución, C) Control de
   ingeniería, D) Control administrativo, E) Elementos de
   Protección Personal (EPP) — el EPP debe ser la última
   barrera, no la primera ni la única. Cada línea de la matriz
   puede tener varias medidas de control, cada una clasificada
   en esta jerarquía.
   Compatibilidad: las líneas cargadas antes de esta función
   (matriz de ejemplo, matriz real importada en v1.15/v1.16)
   solo tienen texto libre en "controles"/"responsable", con el
   mismo convenio de viñetas "• X) texto" ya usado en esos datos
   reales; jerarquiaDe() los interpreta al vuelo sin necesidad
   de volver a cargarlos.
   ========================================================= */
const JERARQUIA_DS44 = [
  {code:"A", label:"Eliminación", color:"#0a6b0a"},
  {code:"B", label:"Sustitución", color:"#1baf7a"},
  {code:"C", label:"Control de ingeniería", color:"#2a78d6"},
  {code:"D", label:"Control administrativo", color:"#eda100"},
  {code:"E", label:"Elementos de protección personal (EPP)", color:"#d03b3b"},
];
const JERARQUIA_LABEL = Object.fromEntries(JERARQUIA_DS44.map(j=>[j.code,j.label]));
const JERARQUIA_COLOR = Object.fromEntries(JERARQUIA_DS44.map(j=>[j.code,j.color]));
const JERARQUIA_ORDER = JERARQUIA_DS44.map(j=>j.code);

/* Interpreta texto libre con el convenio "• X) texto" (uno por línea) ya usado
   en los datos reales de ANGOLEC SPA, tanto para las medidas como para sus
   responsables (alineados por orden). Si una línea no trae letra reconocible,
   queda "sin clasificar" (jerarquia:""), nunca se inventa una clasificación. */
function parseControlesBullets(controlesTxt, responsableTxt){
  const partirLineas = (txt) => String(txt||"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const bulletRe = /^[•\-\*]?\s*([A-E])\)\s*(.*)$/i;
  const cLineas = partirLineas(controlesTxt);
  const rLineas = partirLineas(responsableTxt);
  if(!cLineas.length) return [];
  return cLineas.map((linea, idx) => {
    const m = linea.match(bulletRe);
    const jerarquia = m ? m[1].toUpperCase() : "";
    const texto = m ? m[2].trim() : linea;
    let responsable = "";
    if(rLineas[idx]){
      const rm = rLineas[idx].match(bulletRe);
      responsable = rm ? rm[2].trim() : rLineas[idx];
    }
    return { jerarquia, texto, responsable, plazo:"" };
  });
}
/* Devuelve las medidas de control jerarquizadas de una línea de la matriz,
   ya sea desde el campo estructurado (controlesJerarquizados) si existe, o
   interpretando al vuelo el texto libre heredado (controles/responsable). */
function jerarquiaDe(m){
  if(Array.isArray(m.controlesJerarquizados) && m.controlesJerarquizados.length) return m.controlesJerarquizados;
  return parseControlesBullets(m.controles, m.responsable);
}
/* Una línea "depende solo de EPP" si TODAS sus medidas clasificadas son E
   (y hay al menos una) — el caso que el DS 44 pide evitar como única barrera. */
function soloEpp(m){
  const items = jerarquiaDe(m);
  return items.length>0 && items.every(it=>it.jerarquia==="E");
}
function controlesTextoPlano(items){
  return (items||[]).map(c=>`• ${c.jerarquia||"?"}) ${c.texto}`).join("\n");
}
function responsableTextoPlano(items){
  return (items||[]).filter(c=>c.responsable).map(c=>`• ${c.jerarquia||"?"}) ${c.responsable}`).join("\n");
}
function plazoResumenControles(items){
  const fechas = (items||[]).map(c=>c.plazo).filter(Boolean).sort();
  return fechas.length? fechas[0] : "";
}
/* Insignia compacta (una letra) para tablas; insignia completa para el
   formulario de carga, donde conviene mostrar también el nombre del nivel. */
function jerarquiaChipHtml(code){
  const j = JERARQUIA_DS44.find(x=>x.code===code);
  const bg = j? j.color : "#898781";
  const label = j? j.code : "SC";
  const titulo = j? j.label : "Sin clasificar";
  return `<span title="${titulo}" style="display:inline-block;min-width:20px;text-align:center;background:${bg};color:#fff;border-radius:4px;font-size:11px;font-weight:700;padding:1px 5px;">${label}</span>`;
}
function jerarquiaBadgeHtml(code){
  const j = JERARQUIA_DS44.find(x=>x.code===code);
  if(!j) return `<span class="pill pendiente">Sin clasificar</span>`;
  return `<span class="pill" style="background:${j.color}22;color:${j.color};border:1px solid ${j.color}55;">${j.code} · ${j.label}</span>`;
}
function addMonths(dateStr, months){
  const d = new Date(dateStr);
  d.setMonth(d.getMonth()+months);
  return d;
}
function fmtDate(d){
  if(!d) return "—";
  const dt = (d instanceof Date)? d : new Date(d);
  if(isNaN(dt)) return "—";
  return dt.toLocaleDateString("es-CL");
}
const MESES_NOMBRE = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function mesLabel(ym){
  const [y,m] = (ym||"").split("-");
  const idx = (+m||0) - 1;
  return MESES_NOMBRE[idx] ? `${MESES_NOMBRE[idx]} ${y}` : ym;
}
/* Repuebla un <select> de filtro con las opciones distintas presentes en una
   lista de fechas ("YYYY-MM-DD" o "YYYY-MM"), preservando la selección actual
   si sigue siendo válida. Usado por los filtros de mes de Programa de
   seguridad y Plan de capacitación. */
function fillMesFilter(selectEl, fechas){
  if(!selectEl) return;
  const prev = selectEl.value;
  const meses = Array.from(new Set(fechas.map(f=> (f||"").slice(0,7)).filter(Boolean))).sort();
  selectEl.innerHTML = '<option value="">Todos los meses</option>' + meses.map(m=>`<option value="${m}">${mesLabel(m)}</option>`).join("");
  selectEl.value = meses.includes(prev) ? prev : "";
}
/* Repuebla un <select> de filtro con los valores de texto distintos (nombres
   de responsable/relator) presentes en una lista, preservando la selección
   actual si sigue siendo válida. */
function fillTextFilter(selectEl, valores, placeholder){
  if(!selectEl) return;
  const prev = selectEl.value;
  const distintos = Array.from(new Set(valores.map(v=>(v||"").trim()).filter(Boolean))).sort((a,b)=>a.localeCompare(b));
  selectEl.innerHTML = `<option value="">${placeholder}</option>` + distintos.map(v=>`<option value="${v}">${v}</option>`).join("");
  selectEl.value = distintos.includes(prev) ? prev : "";
}
function daysUntil(d){
  const now = new Date(); now.setHours(0,0,0,0);
  const dt = new Date(d); dt.setHours(0,0,0,0);
  return Math.round((dt-now)/86400000);
}
function estadoVencimiento(d){
  const days = daysUntil(d);
  if(days < 0) return "vencido";
  if(days <= 30) return "proximo";
  return "vigente";
}

