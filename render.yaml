   ========================================================= */
/* Cambia de pestaña programáticamente (sin un clic real en el menú),
   reutilizando la misma lógica de activar el botón/vista correspondiente
   y disparar los render específicos de cada pestaña. La usa, por ejemplo,
   "Editar" en el historial de Inspecciones para saltar a la pestaña
   "Realizar inspecciones", donde vive el formulario. */
function irAVista(nombreVista){
  document.querySelectorAll("#mainNav button").forEach(b=>b.classList.remove("active"));
  const btn = document.querySelector(`#mainNav button[data-view="${nombreVista}"]`);
  if(btn) btn.classList.add("active");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-"+nombreVista).classList.add("active");
  if(nombreVista==="dashboard") renderDashboard();
  if(nombreVista==="accidentabilidad") renderAccidentabilidad();
  if(nombreVista==="seguridad"){ renderInfractores(); renderVelocidad(); }
  if(nombreVista==="cphys") renderCphys();
  if(nombreVista==="emergencia") renderEmergencia();
  if(nombreVista==="config") poblarFormConfigEmpresa();
  document.getElementById("view-"+nombreVista).scrollIntoView({behavior:"smooth", block:"start"});
}
document.getElementById("mainNav").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-view]");
  if(!btn) return;
  irAVista(btn.dataset.view);
  cerrarSidebarMovil();
});

