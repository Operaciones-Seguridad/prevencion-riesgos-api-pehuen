      ${categoriasTodas.length ? categoriasTodas.map(c=>`<div class="kv" style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="font-size:16px;">${iconoCategoria(c.categoria)}</span>${c.categoria}</div>`).join("") : '<div class="kv">Sin categorías registradas</div>'}
    </div>
  </div>`;
}
let planoDragState = null;
function attachPlanoDrag(){
  const wrap = document.getElementById("planoImgWrap");
  if(!wrap) return;
  wrap.querySelectorAll(".plano-marker").forEach(marker=>{
    marker.addEventListener("pointerdown", (e)=>{
      e.preventDefault();
      planoDragState = { areaId: marker.dataset.areaId, rect: wrap.getBoundingClientRect(), x:null, y:null };
      marker.style.cursor = "grabbing";
      try{ marker.setPointerCapture(e.pointerId); }catch(err){}
    });
    marker.addEventListener("pointermove", (e)=>{
      if(!planoDragState || planoDragState.areaId !== marker.dataset.areaId) return;
      const rect = planoDragState.rect;
      let x = ((e.clientX - rect.left) / rect.width) * 100;
      let y = ((e.clientY - rect.top) / rect.height) * 100;
      x = Math.max(2, Math.min(98, x));
      y = Math.max(2, Math.min(98, y));
      marker.style.left = x + "%";
      marker.style.top = y + "%";
      planoDragState.x = x; planoDragState.y = y;
    });
    marker.addEventListener("pointerup", async (e)=>{
      if(!planoDragState || planoDragState.areaId !== marker.dataset.areaId) return;
      marker.style.cursor = "grab";
      const {areaId, x, y} = planoDragState;
      planoDragState = null;
      if(x!=null && y!=null){
        const cfg = planoConfigActual();
        cfg.marcas[areaId] = {x, y};
        await savePlanoConfig(cfg);
      }
    });
  });
}
