/* Filtro común (área+cargo) reutilizado por la tabla en pantalla y por la
   descarga en PDF, para que el PDF siempre refleje exactamente lo que se ve
   filtrado en ese momento. */
function eppEstudioFiltrado(){
  const fArea = document.getElementById("filterEppEstArea").value;
