  }
  const wordBtn = e.target.closest("[data-documento-word]");
  if(wordBtn){
    const rec = CACHE.documentos.find(d=>d.id===wordBtn.dataset.documentoWord);
    if(rec) generarDocumentoWord(rec);
    return;
  }
  const delBtn = e.target.closest("[data-documento-eliminar]");
  if(delBtn){
    const rec = CACHE.documentos.find(d=>d.id===delBtn.dataset.documentoEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar la versión ${rec.version} de "${rec.nombre}"? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("documentos", rec.id);
    await loadCache();
    if(documentoEditingId===rec.id) resetDocumentoForm();
    renderControlDocumental();
  }
});
document.getElementById("filterDocTipo").addEventListener("change", renderDocumentosTable);
function renderControlDocumental(){
  renderProcedimientosMatriz();
  renderDocumentosTable();
  const vigentes = Array.from(documentosVigentesMap().values());
  const politica = vigentes.filter(d=>d.tipo==="politica").sort((a,b)=> new Date(b.fechaActualizacion||b.fechaConfeccion||0) - new Date(a.fechaActualizacion||a.fechaConfeccion||0))[0];
  const matrizDoc = vigentes.filter(d=>d.tipo==="matriz").sort((a,b)=> new Date(b.fechaActualizacion||b.fechaConfeccion||0) - new Date(a.fechaActualizacion||a.fechaConfeccion||0))[0];
  const procedimientosVigentes = vigentes.filter(d=>d.tipo==="procedimiento").length;
  document.getElementById("controlDocumentalTiles").innerHTML = [
    tile("Política de SST vigente", politica ? ("v."+politica.version) : "Sin registrar", politica && politica.fechaActualizacion ? ("actualizada el "+fmtDate(politica.fechaActualizacion)) : "registra la política vigente"),
    tile("Matriz de riesgos (documento) vigente", matrizDoc ? ("v."+matrizDoc.version) : "Sin registrar", matrizDoc && matrizDoc.fechaActualizacion ? ("actualizada el "+fmtDate(matrizDoc.fechaActualizacion)) : "registra la versión formal aprobada"),
    tile("Procedimientos vigentes", procedimientosVigentes, "documentos de tipo Procedimiento"),
    tile("Documentos registrados en total", (CACHE.documentos||[]).length, "todas las versiones históricas"),
  ].join("");
}

/* --- Confección automática de Procedimientos/Instructivos en PDF ---
   Genera un PDF con portada, control de versiones, riesgos principales
   (cruzados con la Matriz de riesgos por coincidencia exacta de texto de
   la medida de control administrativa D), contenido, y hoja de firmas
   de aprobación (elaborado/revisado/aprobado), con pie de página con el
   número de página y el total (cantidad de páginas del documento). */
function historialVersionesDocumento(docRec){
  const key = documentoKey(docRec);
  const vigente = documentosVigentesMap().get(key);
  return (CACHE.documentos||[])
    .filter(d=> documentoKey(d)===key)
    .slice()
    .sort((a,b)=> new Date(b.fechaActualizacion||b.fechaConfeccion||0) - new Date(a.fechaActualizacion||a.fechaConfeccion||0))
    .map(d=> ({...d, vigente: !!(vigente && d.id===vigente.id)}));
}
/* Líneas de la Matriz de riesgos cuya medida de control administrativa (D)
   coincide (texto normalizado) exactamente con el nombre de este documento
   — mismo criterio de cruce que ya usa Control Documental (v1.48). */
function matrizLineasParaDocumento(docRec){
  if(docRec.tipo !== "procedimiento" || !docRec.nombre) return [];
  const norm = s => (s||"").toLowerCase().replace(/\s+/g," ").trim();
  const keyTexto = norm(docRec.nombre);
  return (CACHE.matriz||[]).filter(m => jerarquiaDe(m).some(it=> it.jerarquia==="D" && norm(it.texto)===keyTexto));
}
function agregarPiePaginasPdf(doc, etiqueta){
  const total = doc.internal.getNumberOfPages();
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(140);
    doc.text(`${etiqueta} — Página ${i} de ${total}`, 14, 289);
    doc.setTextColor(0);
  }
}
function generarDocumentoAutomaticoPDF(docRec){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  if(!docRec.nombre){ alert("Indica al menos el nombre del documento para poder generar el PDF."); return; }
  const doc = new JsPDFClass();
  const tipoLabel = tipoDocumentoLabel(docRec);

  // Portada
  addLogoPdf(doc);
  doc.setFontSize(11);
  doc.text((CACHE.empresa&&CACHE.empresa.razonSocial)||"—", 14, 20);
  const lineaEmp = datosEmpresaLineaPdf();
  if(lineaEmp) doc.text(lineaEmp, 14, 26);
  doc.setFontSize(18);
  doc.text(tipoLabel.toUpperCase(), 14, 62);
  doc.setFontSize(15);
  const nombreLineas = doc.splitTextToSize(docRec.nombre, 180);
  doc.text(nombreLineas, 14, 74);
  const yTabla = 74 + nombreLineas.length*8 + 10;
  doc.autoTable({ startY:yTabla, theme:"plain", styles:{fontSize:10, cellPadding:1.5}, body:[
    ["Tipo de documento", tipoLabel],
    ["N° de versión", docRec.version || "—"],
    ["Fecha de confección", docRec.fechaConfeccion ? fmtDate(docRec.fechaConfeccion) : "—"],
    ["Fecha de revisión", docRec.fechaRevision ? fmtDate(docRec.fechaRevision) : "—"],
    ["Fecha de actualización (vigencia)", docRec.fechaActualizacion ? fmtDate(docRec.fechaActualizacion) : "—"],
    ["Elaborado por", docRec.responsableElaboracion || "—"],
    ["Revisado por", docRec.responsableRevision || "—"],
    ["Aprobado por", docRec.responsableAprobacion || "—"],
  ]});

  // Control de versiones
  doc.addPage();
  doc.setFontSize(14); doc.text("Control de versiones", 14, 20);
  const historial = historialVersionesDocumento(docRec);
  doc.autoTable({ startY:26, head:[["Versión","Fecha","Descripción de cambios","Estado"]],
    body: historial.map(d=>[
      d.version || "—",
      d.fechaActualizacion ? fmtDate(d.fechaActualizacion) : (d.fechaConfeccion ? fmtDate(d.fechaConfeccion) : "—"),
      d.descripcion || "—",
      d.vigente ? "Vigente" : "Anterior",
    ]),
    styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });

  // Riesgos principales (cruce con la Matriz de riesgos)
  doc.addPage();
  doc.setFontSize(14); doc.text("Riesgos principales asociados (cruce con la Matriz de riesgos)", 14, 20);
  const lineas = matrizLineasParaDocumento(docRec);
  if(lineas.length){
    doc.autoTable({ startY:26, head:[["Área","Proceso / Actividad","Peligro","Riesgo asociado","Nivel"]],
      body: lineas.map(m=>[
        areaName(m.areaId),
        `${m.proceso? m.proceso+" / " : ""}${m.actividad||"—"}`,
        m.peligro || "—",
        m.riesgo || "—",
        nivelLabel(nivelRiesgo(m.probabilidad, m.consecuencia)),
      ]),
      styles:{fontSize:9}, headStyles:{fillColor:[236,131,90]} });
  } else {
    doc.setFontSize(10);
    doc.text("No se encontraron líneas de la Matriz de riesgos cuya medida de control administrativa (D) coincida exactamente con el nombre de este documento.", 14, 30, {maxWidth:180});
  }

  // Contenido
  doc.addPage();
  doc.setFontSize(14); doc.text("Contenido", 14, 20);
  doc.setFontSize(10);
  if(docRec.contenido && docRec.contenido.trim()){
    doc.text(doc.splitTextToSize(docRec.contenido, 180), 14, 30);
  } else {
    doc.text('Sin contenido registrado todavía. Complete el campo "Contenido del procedimiento/instructivo" en Control Documental para que aparezca aquí.', 14, 30, {maxWidth:180});
  }

  // Firmas de aprobación
  doc.addPage();
  doc.setFontSize(14); doc.text("Firmas de aprobación", 14, 20);
  doc.setFontSize(10);
  let yFirma = 40;
  [["Elaborado por", docRec.responsableElaboracion], ["Revisado por", docRec.responsableRevision], ["Aprobado por", docRec.responsableAprobacion]].forEach(([label, nombre])=>{
    doc.text(`${label}:`, 14, yFirma);
    doc.text(nombre || "—", 55, yFirma);
    doc.line(14, yFirma+18, 100, yFirma+18);
    doc.setFontSize(8); doc.text("Firma", 14, yFirma+23); doc.setFontSize(10);
    doc.text("Fecha:", 120, yFirma+18);
    doc.line(140, yFirma+18, 196, yFirma+18);
    yFirma += 42;
  });

  agregarPiePaginasPdf(doc, docRec.nombre);
  doc.save(`${tipoLabel.replace(/[^a-zA-Z0-9]+/g,"_")}_${docRec.nombre.replace(/[^a-zA-Z0-9]+/g,"_").slice(0,60)}_v${docRec.version||"s-v"}.pdf`);
}

/* --- Confección automática de Política de SST / Procedimientos / Instructivos en Word ---
   Genera un documento Word (.doc) editable, con la misma estructura del PDF
   automático (portada, control de versiones, riesgos principales cuando
   corresponde a un Procedimiento/Instructivo, contenido y firmas de
   aprobación), pero en un formato que el usuario puede seguir editando en
   Microsoft Word. No depende de ninguna librería externa ni de conexión a
   internet: se arma un HTML compatible con Word (con los espacios de nombres
   de Office) y se descarga con extensión .doc, que Word reconoce y abre
   directamente como documento editable. */
function construirHtmlDocumentoWord(docRec){
  const esc = s => (s==null? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const tipoLabel = tipoDocumentoLabel(docRec);
  const empresa = (CACHE.empresa && CACHE.empresa.razonSocial) || "—";
  const lineaEmp = datosEmpresaLineaPdf() || "";
  const historial = historialVersionesDocumento(docRec);
  const esProcedimiento = docRec.tipo === "procedimiento";
  const lineas = esProcedimiento ? matrizLineasParaDocumento(docRec) : [];

  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
<style>
  body{font-family:Calibri, Arial, sans-serif; font-size:11pt;}
  h1{font-size:20pt; text-align:center; margin-bottom:4px;}
  h2{font-size:14pt; border-bottom:1px solid #2a78d6; padding-bottom:4px; margin-top:26px;}
  table{border-collapse:collapse; width:100%; margin-top:8px;}
  td, th{border:1px solid #999; padding:6px; font-size:10pt; vertical-align:top;}
  th{background:#2a78d6; color:#fff;}
  .portada{text-align:center; margin-bottom:24px;}
  .firma-linea{border-top:1px solid #000; width:260px; margin-top:40px;}
  .firma-bloque{margin-top:26px;}
  .pie{font-size:8pt; color:#888; margin-top:36px; text-align:center;}
</style></head><body>
<div class="portada">
  <p>${esc(empresa)}</p>
  <p>${esc(lineaEmp)}</p>
  <h1>${esc(tipoLabel.toUpperCase())}</h1>
  <h2 style="border:none;">${esc(docRec.nombre||"—")}</h2>
  <table>
    <tr><td><strong>Tipo de documento</strong></td><td>${esc(tipoLabel)}</td></tr>
    <tr><td><strong>N° de versión</strong></td><td>${esc(docRec.version||"—")}</td></tr>
    <tr><td><strong>Fecha de confección</strong></td><td>${docRec.fechaConfeccion? esc(fmtDate(docRec.fechaConfeccion)) : "—"}</td></tr>
    <tr><td><strong>Fecha de revisión</strong></td><td>${docRec.fechaRevision? esc(fmtDate(docRec.fechaRevision)) : "—"}</td></tr>
    <tr><td><strong>Fecha de actualización (vigencia)</strong></td><td>${docRec.fechaActualizacion? esc(fmtDate(docRec.fechaActualizacion)) : "—"}</td></tr>
    <tr><td><strong>Elaborado por</strong></td><td>${esc(docRec.responsableElaboracion||"—")}</td></tr>
    <tr><td><strong>Revisado por</strong></td><td>${esc(docRec.responsableRevision||"—")}</td></tr>
    <tr><td><strong>Aprobado por</strong></td><td>${esc(docRec.responsableAprobacion||"—")}</td></tr>
  </table>
</div>
<h2>Control de versiones</h2>
<table>
  <tr><th>Versión</th><th>Fecha</th><th>Descripción de cambios</th><th>Estado</th></tr>
  ${historial.map(d=>`<tr><td>${esc(d.version||"—")}</td><td>${d.fechaActualizacion? esc(fmtDate(d.fechaActualizacion)) : (d.fechaConfeccion? esc(fmtDate(d.fechaConfeccion)) : "—")}</td><td>${esc(d.descripcion||"—")}</td><td>${d.vigente?"Vigente":"Anterior"}</td></tr>`).join("")}
</table>`;

  if(esProcedimiento){
    html += `<h2>Riesgos principales asociados (cruce con la Matriz de riesgos)</h2>`;
    if(lineas.length){
      html += `<table><tr><th>Área</th><th>Proceso / Actividad</th><th>Peligro</th><th>Riesgo asociado</th><th>Nivel</th></tr>`;
      html += lineas.map(m=>`<tr><td>${esc(areaName(m.areaId))}</td><td>${esc((m.proceso? m.proceso+" / " : "")+(m.actividad||"—"))}</td><td>${esc(m.peligro||"—")}</td><td>${esc(m.riesgo||"—")}</td><td>${esc(nivelLabel(nivelRiesgo(m.probabilidad, m.consecuencia)))}</td></tr>`).join("");
      html += `</table>`;
    } else {
      html += `<p>No se encontraron líneas de la Matriz de riesgos cuya medida de control administrativa (D) coincida exactamente con el nombre de este documento.</p>`;
    }
  }

  html += `<h2>Contenido</h2>`;
  if(docRec.contenido && docRec.contenido.trim()){
    html += docRec.contenido.split(/\n{2,}/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
  } else {
    html += `<p>Sin contenido registrado todavía. Complete el campo "Contenido del documento" en Control Documental para que aparezca aquí.</p>`;
  }

  html += `<h2>Firmas de aprobación</h2>`;
  [["Elaborado por", docRec.responsableElaboracion], ["Revisado por", docRec.responsableRevision], ["Aprobado por", docRec.responsableAprobacion]].forEach(([label, nombre])=>{
    html += `<div class="firma-bloque"><p><strong>${label}:</strong> ${esc(nombre||"—")}</p><div class="firma-linea"></div><p style="font-size:8pt;">Firma</p></div>`;
  });

  html += `<p class="pie">${esc(docRec.nombre||"")} — Documento generado automáticamente por la app de Prevención de Riesgos</p>`;
  html += `</body></html>`;
  return html;
}
function generarDocumentoWord(docRec){
  if(!docRec.nombre){ alert("Indica al menos el nombre del documento para poder generar el Word."); return; }
  if(docRec.tipo !== "politica" && docRec.tipo !== "procedimiento" && docRec.tipo !== "manual"){
    alert("La generación automática en Word está disponible para documentos de tipo Política de SST, Procedimiento/Instructivo o Manual.");
    return;
  }
  const html = construirHtmlDocumentoWord(docRec);
  const blob = new Blob(["﻿", html], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const tipoLabel = tipoDocumentoLabel(docRec);
  a.download = `${tipoLabel.replace(/[^a-zA-Z0-9]+/g,"_")}_${docRec.nombre.replace(/[^a-zA-Z0-9]+/g,"_").slice(0,60)}_v${docRec.version||"s-v"}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* =========================================================
   CPHyS — Comité Paritario de Higiene y Seguridad
   Representantes de la empresa y de los trabajadores, control de
   reuniones (DS 44, art. 39), y seguimiento —desde la mirada del
   Comité— del Programa de seguridad, el Plan de capacitación y las
   investigaciones de accidentes (art. 47).
   Stores: "cphysMiembros" y "cphysReuniones".
   ========================================================= */
const CPHYS_REPRESENTACION_LABEL = {empresa:"Empresa", trabajadores:"Trabajadores"};
const CPHYS_CALIDAD_LABEL = {titular:"Titular", suplente:"Suplente"};
function cphysMiembroVigente(m){
  if(!m.fechaTermino) return true;
  return new Date(m.fechaTermino) >= new Date(new Date().toDateString());
}

/* --- Miembros --- */
let cphysMiembroEditingId = null;
function resetCphysMiembroForm(){
  cphysMiembroEditingId = null;
  document.getElementById("cphysMiembroNombre").value = "";
  document.getElementById("cphysMiembroRepresentacion").value = "empresa";
  document.getElementById("cphysMiembroCalidad").value = "titular";
  document.getElementById("cphysMiembroCargo").value = "";
  document.getElementById("cphysMiembroFechaInicio").value = "";
  document.getElementById("cphysMiembroFechaTermino").value = "";
  document.getElementById("cphysMiembroFormTitle").textContent = "Miembros del Comité Paritario de Higiene y Seguridad";
  document.getElementById("cancelEditCphysMiembroBtn").style.display = "none";
}
function startEditCphysMiembro(id){
  const rec = CACHE.cphysMiembros.find(m=>m.id===id);
  if(!rec) return;
  cphysMiembroEditingId = id;
  document.getElementById("cphysMiembroNombre").value = rec.nombre || "";
  document.getElementById("cphysMiembroRepresentacion").value = rec.representacion || "empresa";
  document.getElementById("cphysMiembroCalidad").value = rec.calidad || "titular";
  document.getElementById("cphysMiembroCargo").value = rec.cargo || "";
  document.getElementById("cphysMiembroFechaInicio").value = rec.fechaInicio || "";
  document.getElementById("cphysMiembroFechaTermino").value = rec.fechaTermino || "";
  document.getElementById("cphysMiembroFormTitle").textContent = "Editando a "+(rec.nombre||"miembro");
  document.getElementById("cancelEditCphysMiembroBtn").style.display = "";
  document.getElementById("hdrCphysMiembros").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("cancelEditCphysMiembroBtn"), "click", ()=> resetCphysMiembroForm());
on(document.getElementById("saveCphysMiembroBtn"), "click", async ()=>{
  const nombre = document.getElementById("cphysMiembroNombre").value.trim();
  if(!nombre){ alert("Indica el nombre del miembro del Comité Paritario."); return; }
  const rec = {
    id: cphysMiembroEditingId || uid(),
    nombre,
    representacion: document.getElementById("cphysMiembroRepresentacion").value,
    calidad: document.getElementById("cphysMiembroCalidad").value,
    cargo: document.getElementById("cphysMiembroCargo").value.trim(),
    fechaInicio: document.getElementById("cphysMiembroFechaInicio").value,
    fechaTermino: document.getElementById("cphysMiembroFechaTermino").value,
  };
  await put("cphysMiembros", rec);
  await loadCache();
  resetCphysMiembroForm();
  renderCphys();
});
function renderCphysMiembrosTable(){
  const rows = (CACHE.cphysMiembros||[]).slice().sort((a,b)=> (a.representacion||"").localeCompare(b.representacion||"") || (a.nombre||"").localeCompare(b.nombre||""));
  document.getElementById("cphysMiembrosTable").innerHTML = rows.length ? rows.map(m=>{
    const vigente = cphysMiembroVigente(m);
    return `<tr>
      <td>${m.nombre}</td>
      <td>${CPHYS_REPRESENTACION_LABEL[m.representacion]||m.representacion}</td>
      <td>${CPHYS_CALIDAD_LABEL[m.calidad]||m.calidad}</td>
      <td>${m.cargo || "—"}</td>
      <td>${m.fechaInicio? fmtDate(m.fechaInicio) : "—"}</td>
      <td>${m.fechaTermino? fmtDate(m.fechaTermino) : "—"}</td>
      <td><span class="pill ${vigente?'vigente':'vencido'}">${vigente?'Vigente':'Mandato vencido'}</span></td>
      <td>
        <button class="subtle-btn" data-cphys-miembro-editar="${m.id}">Editar</button>
        <button class="subtle-btn" data-cphys-miembro-eliminar="${m.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join("") : `<tr><td class="empty" colspan="8">Sin miembros registrados todavía</td></tr>`;
}
on(document.getElementById("cphysMiembrosTable"), "click", async (e) => {
  const editBtn = e.target.closest("[data-cphys-miembro-editar]");
  if(editBtn){ startEditCphysMiembro(editBtn.dataset.cphysMiembroEditar); return; }
  const delBtn = e.target.closest("[data-cphys-miembro-eliminar]");
  if(delBtn){
    const rec = CACHE.cphysMiembros.find(m=>m.id===delBtn.dataset.cphysMiembroEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar a ${rec.nombre} del Comité Paritario? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("cphysMiembros", rec.id);
    await loadCache();
    if(cphysMiembroEditingId===rec.id) resetCphysMiembroForm();
    renderCphys();
  }
});
function renderCphysMiembrosTiles(){
  const vigentes = (CACHE.cphysMiembros||[]).filter(cphysMiembroVigente);
  const empresaVig = vigentes.filter(m=>m.representacion==="empresa").length;
  const trabVig = vigentes.filter(m=>m.representacion==="trabajadores").length;
  const proximosVencer = vigentes.filter(m=> m.fechaTermino && daysUntil(m.fechaTermino) >= 0 && daysUntil(m.fechaTermino) <= 60).length;
  document.getElementById("cphysMiembrosTiles").innerHTML = [
    tile("Miembros vigentes", vigentes.length, "de "+(CACHE.cphysMiembros||[]).length+" registrados en total"),
    tile("Representantes de la empresa (vigentes)", empresaVig, ""),
    tile("Representantes de los trabajadores (vigentes)", trabVig, ""),
    tile("Mandatos próximos a vencer", proximosVencer, "dentro de 60 días"),
  ].join("");
}

/* --- Reuniones --- */
let cphysReunionEditingId = null;
let cphysReunionAsistentes = [];
let cphysReunionActaPendiente = null;
document.getElementById("cphysReunionActaInput").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if(!file){ cphysReunionActaPendiente = null; return; }
  cphysReunionActaPendiente = {nombre:file.name, data: await readFileAsDataUrl(file)};
});
function renderCphysAsistenteOptions(){
  const sel = document.getElementById("cphysReunionAsistenteSel");
  fillSelect(sel, (CACHE.cphysMiembros||[]).filter(cphysMiembroVigente).map(m=>({id:m.id, label:m.nombre+" ("+(CPHYS_REPRESENTACION_LABEL[m.representacion]||m.representacion)+")"})), true);
}
function drawCphysAsistentes(){
  document.getElementById("cphysReunionAsistentesWrap").innerHTML = cphysReunionAsistentes.length
    ? cphysReunionAsistentes.map((mid,idx)=>{
        const m = (CACHE.cphysMiembros||[]).find(x=>x.id===mid);
        return `<div class="kv" style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;">
          <span>${m ? m.nombre+" ("+(CPHYS_REPRESENTACION_LABEL[m.representacion]||m.representacion)+")" : "(miembro ya no existe)"}</span>
          <button class="subtle-btn" data-cphys-asistente-quitar="${idx}">Quitar</button>
        </div>`;
      }).join("")
    : `<div class="empty">Sin asistentes agregados</div>`;
}
on(document.getElementById("addCphysAsistenteBtn"), "click", ()=>{
  const sel = document.getElementById("cphysReunionAsistenteSel");
  if(!sel.value) return;
  if(!cphysReunionAsistentes.includes(sel.value)) cphysReunionAsistentes.push(sel.value);
  drawCphysAsistentes();
});
document.getElementById("cphysReunionAsistentesWrap").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-cphys-asistente-quitar]");
  if(!btn) return;
  cphysReunionAsistentes.splice(+btn.dataset.cphysAsistenteQuitar,1);
  drawCphysAsistentes();
});
function resetCphysReunionForm(){
  cphysReunionEditingId = null;
  cphysReunionAsistentes = [];
  cphysReunionActaPendiente = null;
  document.getElementById("cphysReunionFecha").value = "";
  document.getElementById("cphysReunionTipo").value = "ordinaria";
  document.getElementById("cphysReunionMotivo").value = "";
  document.getElementById("cphysReunionPlazo").value = "";
  document.getElementById("cphysReunionResponsable").value = "";
  document.getElementById("cphysReunionTemas").value = "";
  document.getElementById("cphysReunionAcuerdos").value = "";
  document.getElementById("cphysReunionObservaciones").value = "";
  document.getElementById("cphysReunionActaInput").value = "";
  document.getElementById("cphysReunionActaActual").textContent = "";
  document.getElementById("cphysReunionFormTitle").textContent = "Registrar reunión del Comité Paritario";
  document.getElementById("cancelEditCphysReunionBtn").style.display = "none";
  renderCphysAsistenteOptions();
  drawCphysAsistentes();
}
function startEditCphysReunion(id){
  const rec = CACHE.cphysReuniones.find(r=>r.id===id);
  if(!rec) return;
  cphysReunionEditingId = id;
  cphysReunionAsistentes = (rec.asistentesIds||[]).slice();
  cphysReunionActaPendiente = null;
  document.getElementById("cphysReunionFecha").value = rec.fecha || "";
  document.getElementById("cphysReunionTipo").value = rec.tipo || "ordinaria";
  document.getElementById("cphysReunionMotivo").value = rec.motivo || "";
  document.getElementById("cphysReunionPlazo").value = rec.plazoCumplimiento || "";
  document.getElementById("cphysReunionResponsable").value = rec.responsableSeguimiento || "";
