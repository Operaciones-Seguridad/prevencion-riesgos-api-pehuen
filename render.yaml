on(document.getElementById("cancelEditEppEstBtn"), "click", async () => { resetEppEstForm(); });
on(document.getElementById("saveEppEstBtn"), "click", async () => {
  const cargo = document.getElementById("eppEstCargo").value.trim();
  const areaId = document.getElementById("eppEstArea").value;
  const peligro = document.getElementById("eppEstPeligro").value.trim();
  const riesgo = document.getElementById("eppEstRiesgo").value.trim();
  const epp = document.getElementById("eppEstEpp").value.trim();
  const certificacion = document.getElementById("eppEstCertificacion").value.trim();
  const vidaUtil = document.getElementById("eppEstVidaUtil").value.trim();
  if(!cargo || !areaId || !peligro || !epp){ alert("Complete al menos cargo/puesto, área, peligro y EPP recomendado."); return; }
