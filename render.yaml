        <thead><tr><th>Amenaza</th><th>Pasos ACCEDER completos</th><th>Acciones</th></tr></thead>
        <tbody id="grdRespuestaTable"></tbody>
      </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header-row" id="hdrGrdSimulacros"><h2 id="grdSimulacroFormTitle">Etapa 3 — Simulacros y simulaciones</h2><button class="collapse-toggle" id="toggleGrdSimulacros" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyGrdSimulacros">
      <div class="desc">Registra los ejercicios de puesta a prueba del plan: <strong>simulacro</strong> (ejercicio práctico a gran escala, con desplazamiento de recursos, ej.: evacuación real) o <strong>simulación</strong> (ejercicio de gabinete/juego de roles, sin desplazamiento real). Se recomienda al menos uno cada 6 meses.</div>
      <div class="form-grid">
        <div><label>Fecha</label><input type="date" id="grdSimFecha"></div>
        <div><label>Tipo de ejercicio</label>
          <select id="grdSimTipo">
            <option value="simulacro">Simulacro (evacuación real)</option>
            <option value="simulacion">Simulación (gabinete / juego de roles)</option>
          </select>
        </div>
        <div><label>Amenaza puesta a prueba</label><select id="grdSimAmenaza"></select></div>
        <div><label>N° de participantes</label><input type="number" id="grdSimParticipantes" min="0"></div>
      </div>
      <label>Observaciones del ejercicio</label>
      <textarea id="grdSimObservaciones" placeholder="Qué se puso a prueba, tiempos de evacuación, participación, dificultades observadas"></textarea>
      <label>Mejoras identificadas</label>
      <textarea id="grdSimMejoras" placeholder="Ajustes a realizar al plan a partir de lo observado en el ejercicio"></textarea>
      <div class="toolbar" style="margin-top:10px;">
        <button class="btn" id="saveGrdSimBtn">Guardar ejercicio</button>
        <button class="btn secondary" id="cancelEditGrdSimBtn" style="display:none;">Cancelar edición</button>
      </div>
      <table style="margin-top:14px;">
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Amenaza</th><th>Participantes</th><th>Acciones</th></tr></thead>
        <tbody id="grdSimulacrosTable"></tbody>
      </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header-row" id="hdrGrdPlanAccion"><h2 id="grdAccionFormTitle">Plan de acción GRD</h2><button class="collapse-toggle" id="toggleGrdPlanAccion" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyGrdPlanAccion">
      <div class="desc">Consolida las medidas pendientes de cualquiera de las 3 etapas (diagnóstico, respuesta o implementación), con responsable, plazo y estado, para hacer seguimiento hasta su cierre.</div>
      <div class="form-grid">
        <div><label>Etapa</label>
          <select id="grdAccionEtapa">
            <option value="diagnostico">Etapa 1 — Diagnóstico</option>
            <option value="respuesta">Etapa 2 — Respuesta</option>
            <option value="implementacion">Etapa 3 — Implementación</option>
          </select>
        </div>
        <div><label>Prioridad</label>
          <select id="grdAccionPrioridad">
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
        <div><label>Responsable</label><input id="grdAccionResponsable"></div>
        <div><label>Fecha programada</label><input type="date" id="grdAccionFechaProg"></div>
        <div><label>Fecha realizada</label><input type="date" id="grdAccionFechaReal"></div>
      </div>
      <label>Medida</label>
      <input id="grdAccionMedida" placeholder="Ej: Instalar generador de respaldo en bodega">
      <div class="toolbar" style="margin-top:10px;">
        <button class="btn" id="saveGrdAccionBtn">Guardar</button>
        <button class="btn secondary" id="cancelEditGrdAccionBtn" style="display:none;">Cancelar edición</button>
      </div>
      <table style="margin-top:14px;">
        <thead><tr><th>Medida</th><th>Etapa</th><th>Responsable</th><th>Fecha programada</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="grdPlanAccionTable"></tbody>
      </table>
      </div>
    </div>
  </div>

  <!-- CONTROL DE COMPROMISOS -->
