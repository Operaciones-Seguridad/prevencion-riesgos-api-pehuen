/* Formatos de inspección/observación (checklists reutilizables), v1.57:
   cada ítem se agrega uno por uno indicando su tipo de respuesta —
   "check" (Cumple/No cumple/N/A) o "texto" (cuadro de texto de escritura
   manual) — en vez de una lista de líneas planas de texto (todas con la
   misma respuesta fija Cumple/No cumple/N/A, como hasta la v1.56). */
let currentFmtItems = [];
function drawFmtItems(){
  const TIPO_LABEL = {check:"Cumple / No cumple / N/A", texto:"Cuadro de texto (escritura manual)"};
  document.getElementById("fmtItemsWrap").innerHTML = currentFmtItems.length ? currentFmtItems.map((it,idx)=>`
    <tr>
      <td>${idx+1}</td>
      <td>${it.text}</td>
      <td>${TIPO_LABEL[it.tipo]||TIPO_LABEL.check}</td>
      <td><button class="subtle-btn" data-removefmtitem="${idx}">Quitar</button></td>
    </tr>
  `).join("") : `<tr><td class="empty" colspan="4">Sin ítems agregados todavía</td></tr>`;
}
on(document.getElementById("addFmtItemBtn"), "click", () => {
  const text = document.getElementById("fmtItemTexto").value.trim();
  if(!text){ alert("Escribe el texto del ítem antes de agregarlo."); return; }
  const tipo = document.getElementById("fmtItemTipo").value;
  currentFmtItems.push({text, tipo});
  document.getElementById("fmtItemTexto").value = "";
  document.getElementById("fmtItemTexto").focus();
  drawFmtItems();
});
document.getElementById("fmtItemsWrap").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-removefmtitem]");
  if(!btn) return;
  currentFmtItems.splice(+btn.dataset.removefmtitem, 1);
  drawFmtItems();
});
drawFmtItems();

/* Edición de formatos ya creados (v1.58): el mismo formulario/constructor
   de arriba sirve tanto para crear como para editar — se reutiliza
   formatoEditingId (null = creando uno nuevo) para decidir si "put" crea
   un registro nuevo o actualiza uno existente con el mismo id. */
let formatoEditingId = null;
function resetFormatoForm(){
  formatoEditingId = null;
  document.getElementById("fmtNombre").value = "";
  document.getElementById("fmtCategoria").value = "ambos";
  currentFmtItems = [];
  drawFmtItems();
  document.getElementById("fmtFormTitle").textContent = "Formatos de inspección / observación";
  document.getElementById("addFormatoBtn").textContent = "+ Crear formato";
  document.getElementById("cancelEditFormatoBtn").style.display = "none";
}
function startEditFormato(id){
  const rec = (CACHE.checklists||[]).find(c=>c.id===id);
  if(!rec) return;
  formatoEditingId = id;
  document.getElementById("fmtNombre").value = rec.nombre || "";
  document.getElementById("fmtCategoria").value = rec.categoria || "ambos";
  currentFmtItems = (rec.items||[]).map(it=>({text: checklistItemTexto(it), tipo: checklistItemTipo(it)}));
  drawFmtItems();
  document.getElementById("fmtFormTitle").textContent = 'Editando formato "'+(rec.nombre||"")+'"';
  document.getElementById("addFormatoBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditFormatoBtn").style.display = "";
  document.getElementById("fmtFormTitle").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("cancelEditFormatoBtn"), "click", ()=> resetFormatoForm());
on(document.getElementById("addFormatoBtn"), "click", async () => {
  const nombre = document.getElementById("fmtNombre").value.trim();
  const categoria = document.getElementById("fmtCategoria").value;
  if(!nombre || !currentFmtItems.length){ alert("Complete el nombre del formato y agregue al menos un ítem del checklist."); return; }
  await put("checklists", {id: formatoEditingId || uid(), nombre, categoria, items: currentFmtItems.slice()});
  await loadCache();
  const creando = !formatoEditingId;
  resetFormatoForm();
  renderInsTipoOptions();
  renderFormatosTable();
  alert(creando ? `Formato "${nombre}" creado.` : `Formato "${nombre}" actualizado.`);
});
function renderFormatosTable(){
  const CAT_LABEL = {ambos:"Inspección y Observación", inspeccion:"Solo Inspección", observacion:"Solo Observación"};
  const rows = CACHE.checklists || [];
  document.getElementById("formatosTable").innerHTML = rows.length ? rows.map(c=>`
    <tr>
      <td>${c.nombre}</td>
      <td>${CAT_LABEL[c.categoria||"ambos"]||"—"}</td>
      <td>${(c.items||[]).length}</td>
      <td>
        <button class="subtle-btn" data-formato-editar="${c.id}">Editar</button>
        <button class="subtle-btn" data-formato-eliminar="${c.id}">Eliminar</button>
      </td>
    </tr>
  `).join("") : `<tr><td class="empty" colspan="4">Sin formatos creados todavía</td></tr>`;
}
on(document.getElementById("formatosTable"), "click", async (e) => {
  const editBtn = e.target.closest("[data-formato-editar]");
  if(editBtn){ startEditFormato(editBtn.dataset.formatoEditar); return; }
  const delBtn = e.target.closest("[data-formato-eliminar]");
  if(delBtn){
    const rec = (CACHE.checklists||[]).find(c=>c.id===delBtn.dataset.formatoEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar el formato "${rec.nombre}"? Las inspecciones/observaciones ya guardadas con este formato conservan su checklist ya completado, pero el formato dejará de estar disponible para nuevos registros.`)) return;
    await deleteRecord("checklists", rec.id);
    await loadCache();
    if(formatoEditingId===rec.id) resetFormatoForm();
    renderInsTipoOptions();
    renderFormatosTable();
  }
});

/* Importar ítems de un formato desde Excel (v1.58): columna "Ítem" (texto
   del ítem) y columna opcional "Tipo" ("Cumple/No cumple/N/A" o
   "Texto"/"Manual"/"Cuadro de texto"); si no se reconoce, se agrega como
   Cumple/No cumple/N/A. Los ítems leídos se suman a los ya agregados en
   el constructor de arriba, sin reemplazarlos, para poder revisarlos
   antes de crear o guardar el formato. */
function tipoDesdeTextoImportado(v){
  const t = String(v||"").trim().toLowerCase();
  if(!t) return "check";
  if(/texto|manual|libre|abiert/.test(t)) return "texto";
  return "check";
}
on(document.getElementById("downloadFmtPlantillaBtn"), "click", () => {
  if(typeof XLSX === "undefined"){ alert("No se pudo cargar el generador de Excel (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const data = [
    {"Ítem": "Extintor con carga vigente", "Tipo": "Cumple/No cumple/N/A"},
    {"Ítem": "N° de extintores encontrados", "Tipo": "Texto"},
    {"Ítem": "Señalización de vías de evacuación visible", "Tipo": "Cumple/No cumple/N/A"},
    {"Ítem": "Observaciones adicionales del inspector", "Tipo": "Texto"},
  ];
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{wch:45},{wch:22}];
  XLSX.utils.book_append_sheet(wb, ws, "Ítems del formato");
  XLSX.writeFile(wb, "Formato_ejemplo_items_checklist.xlsx");
});
on(document.getElementById("importFmtBtn"), "click", async () => {
  const fileInput = document.getElementById("importFmtFile");
  const file = fileInput.files[0];
  if(!file){ alert("Selecciona un archivo Excel (.xlsx) para importar."); return; }
  if(typeof XLSX === "undefined"){ alert("No se pudo cargar el lector de Excel (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, {type:"array"});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
  if(!rows.length){ alert("El archivo no tiene filas de datos."); return; }
  const norm = s => String(s||"").trim().toLowerCase();
  let agregados = 0, omitidos = 0;
  for(const row of rows){
    const keys = Object.keys(row);
    const kItem = keys.find(k=>["ítem","item","ítem del checklist","texto"].includes(norm(k)));
    const kTipo = keys.find(k=>["tipo","tipo de respuesta"].includes(norm(k)));
    const text = kItem? String(row[kItem]).trim() : "";
    if(!text){ omitidos++; continue; }
    const tipo = kTipo ? tipoDesdeTextoImportado(row[kTipo]) : "check";
    currentFmtItems.push({text, tipo});
    agregados++;
  }
  drawFmtItems();
  fileInput.value = "";
  alert(`Importación completa: ${agregados} ítem(s) agregado(s) al formato${omitidos? `, ${omitidos} fila(s) omitida(s) por no tener texto de ítem`:""}. Revisa la tabla de ítems y luego crea o guarda el formato.`);
});

/* Alta y edición de inspecciones/observaciones */
let insEditingId = null;
function resetInsForm(){
  insEditingId = null;
  document.getElementById("insInspector").value = "";
  document.getElementById("insFecha").value = "";
  document.getElementById("insDescripcion").value = "";
  currentFindings = []; currentChecklistItems = []; currentInspeccionados = [];
  drawFindings(); drawChecklist(); drawInspeccionados();
  document.getElementById("insFormTitle").textContent = "Nueva inspección / observación en terreno";
  document.getElementById("saveInspeccionBtn").textContent = "Guardar inspección";
  document.getElementById("cancelEditInsBtn").style.display = "none";
}
on(document.getElementById("cancelEditInsBtn"), "click", async () => { resetInsForm(); });

function startEditInspeccion(id){
  const rec = CACHE.inspecciones.find(i=>i.id===id);
  if(!rec) return;
  insEditingId = id;
  document.getElementById("insTipoRegistro").value = rec.tipoRegistro || "inspeccion";
  renderInsTipoOptions();
  document.getElementById("insTipo").value = rec.tipoId || "";
  document.getElementById("insArea").value = rec.areaId || "";
  document.getElementById("insInspector").value = rec.inspector || "";
  document.getElementById("insFecha").value = rec.fecha || "";
  document.getElementById("insDescripcion").value = rec.descripcion || "";
  currentChecklistItems = (rec.checklist||[]).slice();
  currentFindings = (rec.findings||[]).slice();
  currentInspeccionados = (rec.inspeccionados||[]).slice();
  drawChecklist(); drawFindings(); drawInspeccionados();
  document.getElementById("insFormTitle").textContent = "Editando inspección / observación";
  document.getElementById("saveInspeccionBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditInsBtn").style.display = "";
  closeModal();
  irAVista("realizar-inspecciones");
}

on(document.getElementById("saveInspeccionBtn"), "click", async () => {
  const tipoRegistro = document.getElementById("insTipoRegistro").value;
  const tipoId = document.getElementById("insTipo").value;
  const areaId = document.getElementById("insArea").value;
  const inspector = document.getElementById("insInspector").value.trim();
  const fecha = document.getElementById("insFecha").value || new Date().toISOString().slice(0,10);
  const descripcion = document.getElementById("insDescripcion").value.trim();
  if(!areaId || !inspector){ alert("Complete área e inspector."); return; }

  if(insEditingId){
    const anterior = CACHE.inspecciones.find(i=>i.id===insEditingId);
    if(!anterior){ alert("El registro que estabas editando ya no existe."); resetInsForm(); return; }
    const rec = {
      ...anterior, tipoRegistro, tipoId, areaId, inspector, fecha, descripcion,
      checklist: currentChecklistItems.slice(),
      findings: currentFindings.slice(),
      inspeccionados: currentInspeccionados.slice(),
    };
    await put("inspecciones", rec);
    await loadCache();
    resetInsForm();
    renderInspeccionesTable();
    renderInsStats();
    if(hallazgosPendientesConCorreo(rec).length) mostrarCorreosPendientes(rec);
    else alert("Registro actualizado.");
    return;
  }

  const rec = {
    id: uid(), tipoRegistro, tipoId, areaId, inspector, fecha, descripcion,
    checklist: currentChecklistItems.slice(),
    findings: currentFindings.slice(),
    inspeccionados: currentInspeccionados.slice(),
    estado: "abierta",
    fechaCreacion: new Date().toISOString()
  };
  await put("inspecciones", rec);
  await loadCache();
  resetInsForm();
  renderInspeccionesTable();
  renderInsStats();
  if(hallazgosPendientesConCorreo(rec).length) mostrarCorreosPendientes(rec);
  else alert(`${TIPO_REGISTRO_LABEL[tipoRegistro]} guardada.`);
});

function renderInspeccionesTable(){
  const filterArea = document.getElementById("filterInsArea").value;
  const filterTipo = document.getElementById("filterInsTipoRegistro").value;
  const filterEstado = document.getElementById("filterInsEstado").value;
  const filterMes = document.getElementById("filterInsMes").value;
  const rows = CACHE.inspecciones
    .filter(i=> !filterArea || i.areaId===filterArea)
    .filter(i=> !filterTipo || (i.tipoRegistro||"inspeccion")===filterTipo)
    .filter(i=> !filterEstado || (i.estado||"abierta")===filterEstado)
    .filter(i=> !filterMes || (i.fecha||"").slice(5,7)===filterMes)
    .sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  document.getElementById("inspeccionesTable").innerHTML = rows.map(i=>{
    const cl = CACHE.checklists.find(c=>c.id===i.tipoId);
    const abiertas = (i.findings||[]).filter(f=>f.estado!=="cerrada").length;
    const tipoReg = i.tipoRegistro||"inspeccion";
    const estado = i.estado||"abierta";
    return `<tr>
      <td>${fmtDate(i.fecha)}</td>
      <td><span class="pill ${tipoReg==='observacion'?'medio':'pendiente'}">${TIPO_REGISTRO_LABEL[tipoReg]}</span></td>
      <td>${cl?cl.nombre:"—"}</td><td>${areaName(i.areaId)}</td><td>${i.inspector}</td>
      <td>${(i.findings||[]).length}</td><td>${abiertas>0?`<span class="pill alto">${abiertas} abiertas</span>`:'<span class="pill bajo">0</span>'}</td>
      <td><span class="pill ${estado==='abierta'?'proceso':'cerrada'}">${ESTADO_INS_LABEL[estado]}</span></td>
      <td><button class="btn secondary small" data-ins-ver="${i.id}">Ver / Cerrar</button></td>
    </tr>`;
  }).join("") || `<tr><td class="empty" colspan="9">Aún no hay inspecciones registradas</td></tr>`;
}
document.getElementById("filterInsArea").addEventListener("change", renderInspeccionesTable);
document.getElementById("filterInsTipoRegistro").addEventListener("change", renderInspeccionesTable);
document.getElementById("filterInsEstado").addEventListener("change", renderInspeccionesTable);
