}
on(document.getElementById("cancelEditVelBtn"), "click", ()=>resetVelForm());
on(document.getElementById("saveVelBtn"), "click", async ()=>{
  const fecha = document.getElementById("velFecha").value;
  const patente = document.getElementById("velPatente").value.trim();
  const conductor = document.getElementById("velConductor").value.trim();
  const eventos = parseInt(document.getElementById("velEventos").value, 10);
  const velocidadMaxima = parseFloat(document.getElementById("velMaxima").value);
  if(!fecha || !patente || !conductor || isNaN(eventos) || isNaN(velocidadMaxima)){ alert("Complete fecha, patente, conductor, N° de eventos y velocidad máxima."); return; }
  const rec = { id: velEditingId || uid(), fecha, patente, conductor, eventos, velocidadMaxima };
  await put("rankingVelocidad", rec);
  await loadCache();
  const wasEditing = !!velEditingId;
  resetVelForm();
  renderVelocidad();
  alert(wasEditing ? "Registro actualizado." : "Evento de velocidad registrado.");
});
function renderVelocidadTable(){
  const rows = velocidadFiltrada().slice().sort((a,b)=>{
    if(b.eventos !== a.eventos) return b.eventos - a.eventos;
    return (b.velocidadMaxima||0) - (a.velocidadMaxima||0);
  });
  document.getElementById("velocidadTable").innerHTML = rows.map((v,idx)=>`
    <tr>
      <td>${idx+1}</td>
      <td>${fmtDate(v.fecha)}</td>
      <td>${v.patente||"–"}</td>
      <td>${v.conductor||"–"}</td>
      <td>${v.eventos}</td>
      <td>${v.velocidadMaxima}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-vel-editar="${v.id}">Editar</button>
        <button class="subtle-btn" data-vel-eliminar="${v.id}">Eliminar</button>
      </td>
    </tr>
  `).join("") || `<tr><td class="empty" colspan="7">Sin registros de velocidad</td></tr>`;
}
on(document.getElementById("velocidadTable"), "click", async (e)=>{
  const editBtn = e.target.closest("button[data-vel-editar]");
  if(editBtn){ startEditVel(editBtn.dataset.velEditar); return; }
  const delBtn = e.target.closest("button[data-vel-eliminar]");
  if(delBtn){
    const rec = CACHE.rankingVelocidad.find(v=>v.id===delBtn.dataset.velEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar el registro de "${rec.patente}" (${fmtDate(rec.fecha)})? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("rankingVelocidad", rec.id);
    await loadCache();
    if(velEditingId===rec.id) resetVelForm();
    renderVelocidad();
  }
});
["filterVelPatente","filterVelConductor"].forEach(id=>{
  document.getElementById(id).addEventListener("change", ()=>renderVelocidadTable());
});
function renderVelocidad(){
  renderVelFiltros();
  renderVelocidadTable();
  const rows = CACHE.rankingVelocidad;
  const totalEventos = rows.reduce((s,v)=>s+(v.eventos||0), 0);
  const velMaxHistorica = rows.length ? Math.max(...rows.map(v=>v.velocidadMaxima||0)) : 0;
  const porConductor = new Map();
  rows.forEach(v=>{ porConductor.set(v.conductor, (porConductor.get(v.conductor)||0) + (v.eventos||0)); });
  const conductorTop = Array.from(porConductor.entries()).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("velTiles").innerHTML = [
    tile("Total de eventos de exceso de velocidad", totalEventos, "acumulado del registro"),
    tile("Velocidad máxima histórica registrada", velMaxHistorica+" km/h", "de todos los registros"),
    tile("Conductor con más eventos", conductorTop? conductorTop[0] : "—", conductorTop? (conductorTop[1]+" evento(s)") : "sin datos aún"),
  ].join("");
  const rankingRows = rows.slice().sort((a,b)=>b.eventos-a.eventos).slice(0,10).map(v=>({label:`${v.patente} — ${v.conductor}`, value:v.eventos, display:`${v.eventos} (máx ${v.velocidadMaxima} km/h)`}));
  renderBarChart(document.getElementById("chartVelRanking"), rankingRows, ()=>"#eb6834");
}

/* =========================================================
   ENTREGA DE EPP (elementos de protección personal)
   Cada vale queda con un folio correlativo automático (el
   máximo folio existente + 1), es editable (para corregir
   errores sin perder el folio original) y se puede imprimir
   usando el área oculta #valePrintArea + window.print(). El
   listado "por trabajador" se genera automáticamente a partir
   de todos los vales guardados, sin necesidad de mantenerlo
   aparte.
   ========================================================= */
let valeEditingId = null;
let currentValeItems = []; // [{epp, cantidad}]

function nextFolioEpp(){
  const max = (CACHE.epp||[]).reduce((m,v)=> Math.max(m, +v.folio || 0), 0);
  return max + 1;
}
function fmtFolio(n){ return "N° " + String(n).padStart(6,"0"); }

function drawValeItems(){
  document.getElementById("valeItemsWrap").innerHTML = currentValeItems.map((it,idx)=>`
    <div class="checklist-item">
      <div>${it.epp} <span class="pill pendiente">x${it.cantidad}</span></div>
      <button class="subtle-btn" data-vale-item-quitar="${idx}">Quitar</button>
    </div>
  `).join("") || '<div class="empty">Sin elementos agregados todavía</div>';
}
on(document.getElementById("addValeItemBtn"), "click", async ()=>{
  const eppInput = document.getElementById("valeEppInput");
  const cantInput = document.getElementById("valeCantidad");
  const epp = eppInput.value.trim();
  const cantidad = Math.max(1, +cantInput.value || 1);
  if(!epp) { alert("Indica el elemento de protección personal a agregar."); return; }
  await addCatalogValue("epp", epp);
  fillDatalist(document.getElementById("dlEpp"), getCatalog("epp"));
  const existente = currentValeItems.find(it=>it.epp.toLowerCase()===epp.toLowerCase());
  if(existente) existente.cantidad += cantidad;
  else currentValeItems.push({epp, cantidad});
  eppInput.value = ""; cantInput.value = "1";
  drawValeItems();
});
on(document.getElementById("valeItemsWrap"), "click", async (e)=>{
  const btn = e.target.closest("button[data-vale-item-quitar]");
  if(!btn) return;
  currentValeItems.splice(+btn.dataset.valeItemQuitar, 1);
  drawValeItems();
});

function resetValeForm(){
  valeEditingId = null;
  document.getElementById("valeFolio").value = fmtFolio(nextFolioEpp());
  document.getElementById("valeTrabajador").value = "";
  document.getElementById("valeFecha").value = new Date().toISOString().slice(0,10);
  document.getElementById("valeObservaciones").value = "";
  currentValeItems = [];
  drawValeItems();
  document.getElementById("valeFormTitle").textContent = "Emitir vale de entrega de EPP";
  document.getElementById("saveValeBtn").textContent = "Emitir vale";
  document.getElementById("cancelEditValeBtn").style.display = "none";
}

function startEditVale(id){
  const rec = CACHE.epp.find(v=>v.id===id);
  if(!rec) return;
  valeEditingId = id;
  document.getElementById("valeFolio").value = fmtFolio(rec.folio);
  document.getElementById("valeTrabajador").value = rec.trabajadorId || "";
  document.getElementById("valeFecha").value = rec.fecha || "";
  document.getElementById("valeObservaciones").value = rec.observaciones || "";
  currentValeItems = (rec.items||[]).map(it=>({...it}));
  drawValeItems();
  document.getElementById("valeFormTitle").textContent = `Editando vale ${fmtFolio(rec.folio)}`;
  document.getElementById("saveValeBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditValeBtn").style.display = "";
  document.getElementById("view-epp").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("cancelEditValeBtn"), "click", async ()=>{ resetValeForm(); });

on(document.getElementById("saveValeBtn"), "click", async ()=>{
  const trabajadorId = document.getElementById("valeTrabajador").value;
  const fecha = document.getElementById("valeFecha").value || new Date().toISOString().slice(0,10);
  const observaciones = document.getElementById("valeObservaciones").value.trim();
  if(!trabajadorId){ alert("Selecciona el trabajador que recibe el EPP."); return; }
  if(!currentValeItems.length){ alert("Agrega al menos un elemento de protección personal al vale."); return; }

  if(valeEditingId){
    const anterior = CACHE.epp.find(v=>v.id===valeEditingId);
    if(!anterior){ alert("El vale que estabas editando ya no existe."); resetValeForm(); return; }
    const rec = { ...anterior, trabajadorId, fecha, observaciones, items: currentValeItems.slice(), fechaModificacion: new Date().toISOString() };
    await put("epp", rec);
    await loadCache();
    resetValeForm();
    renderValesTable(); renderEppPorTrabajador();
    alert(`Vale ${fmtFolio(rec.folio)} actualizado.`);
    return;
  }

  const rec = {
    id: uid(),
    folio: nextFolioEpp(),
    trabajadorId, fecha, observaciones,
    items: currentValeItems.slice(),
    fechaCreacion: new Date().toISOString(),
  };
  await put("epp", rec);
  await loadCache();
  resetValeForm();
  renderValesTable(); renderEppPorTrabajador();
  alert(`Vale ${fmtFolio(rec.folio)} emitido.`);
});

/* Opciones del filtro por elemento EPP: se arman a partir de los
   elementos realmente entregados en los vales (no del catálogo completo
   de EPP), para no mostrar elementos que nunca se han entregado. */
function renderFilterValeElementoOptions(){
  const sel = document.getElementById("filterValeElemento");
  const cur = sel.value;
  const elementos = Array.from(new Set(
    (CACHE.epp||[]).flatMap(v => (v.items||[]).map(it => it.epp)).filter(Boolean)
  )).sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = '<option value="">Todos</option>' + elementos.map(el=>`<option value="${el}">${el}</option>`).join("");
  if(elementos.includes(cur)) sel.value = cur;
}
function renderValesTable(){
  renderFilterValeElementoOptions();
  const filtroTrab = document.getElementById("filterValeTrabajador").value;
  const filtroElemento = document.getElementById("filterValeElemento").value;
  const filtroFecha = document.getElementById("filterValeFecha").value;
  const rows = (CACHE.epp||[])
    .filter(v=> !filtroTrab || v.trabajadorId===filtroTrab)
    .filter(v=> !filtroElemento || (v.items||[]).some(it=>it.epp===filtroElemento))
    .filter(v=> !filtroFecha || v.fecha===filtroFecha)
    .sort((a,b)=> (b.folio||0) - (a.folio||0));
  document.getElementById("valesTable").innerHTML = rows.map(v=>{
    const itemsTxt = (v.items||[]).map(it=>`${it.epp} (x${it.cantidad})`).join(", ") || "—";
    return `<tr>
      <td>${fmtFolio(v.folio)}</td>
      <td>${fmtDate(v.fecha)}</td>
      <td>${trabName(v.trabajadorId)}</td>
      <td>${itemsTxt}</td>
      <td>${v.observaciones || "—"}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-vale-editar="${v.id}">Editar</button>
        <button class="btn secondary small" data-vale-imprimir="${v.id}">Imprimir</button>
        <button class="subtle-btn" data-vale-eliminar="${v.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td class="empty" colspan="6">Sin vales para el filtro seleccionado</td></tr>`;
}
document.getElementById("filterValeTrabajador").addEventListener("change", renderValesTable);
document.getElementById("filterValeElemento").addEventListener("change", renderValesTable);
document.getElementById("filterValeFecha").addEventListener("change", renderValesTable);
on(document.getElementById("clearFilterValeFechaBtn"), "click", () => {
  document.getElementById("filterValeFecha").value = "";
  renderValesTable();
});
on(document.getElementById("valesTable"), "click", async (e)=>{
  const editBtn = e.target.closest("button[data-vale-editar]");
  if(editBtn){ startEditVale(editBtn.dataset.valeEditar); return; }
  const printBtn = e.target.closest("button[data-vale-imprimir]");
  if(printBtn){ imprimirVale(printBtn.dataset.valeImprimir); return; }
  const delBtn = e.target.closest("button[data-vale-eliminar]");
  if(delBtn){
    const rec = CACHE.epp.find(v=>v.id===delBtn.dataset.valeEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar el vale ${fmtFolio(rec.folio)} de ${trabName(rec.trabajadorId)}? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("epp", rec.id);
    await loadCache();
    renderValesTable(); renderEppPorTrabajador();
  }
});

/* Imprime un vale de entrega de EPP usando el área oculta #valePrintArea,
   que la hoja de estilos @media print muestra en pantalla completa y
   oculta todo lo demás (nav, sidebar, otros cards, etc.). */
function imprimirVale(id){
  const rec = CACHE.epp.find(v=>v.id===id);
  if(!rec) return;
  const trabajador = CACHE.trabajadores.find(t=>t.id===rec.trabajadorId);
  const itemsRows = (rec.items||[]).map(it=>`<tr><td>${it.epp}</td><td style="text-align:center;">${it.cantidad}</td></tr>`).join("")
    || `<tr><td colspan="2">Sin elementos</td></tr>`;
  document.getElementById("valePrintArea").innerHTML = `
    <div class="vale-print">
      <div class="folio-box"><div style="font-size:11px;">FOLIO</div><div class="num">${fmtFolio(rec.folio)}</div></div>
      <h2>Vale de entrega de Elementos de Protección Personal (EPP)</h2>
      <div>${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}${(CACHE.empresa&&CACHE.empresa.rut)?(" — RUT "+CACHE.empresa.rut):""}</div>
      <div style="clear:both;"></div>
      <table>
        <tr><td style="width:35%;"><strong>Trabajador</strong></td><td>${trabajador? trabajador.nombre : "—"}</td></tr>
        <tr><td><strong>RUT</strong></td><td>${trabajador? (trabajador.rut||"—") : "—"}</td></tr>
        <tr><td><strong>Cargo</strong></td><td>${trabajador? (trabajador.cargo||"—") : "—"}</td></tr>
        <tr><td><strong>Área</strong></td><td>${trabajador? areaName(trabajador.areaId) : "—"}</td></tr>
        <tr><td><strong>Fecha de entrega</strong></td><td>${fmtDate(rec.fecha)}</td></tr>
      </table>
      <table>
        <thead><tr><th>Elemento de protección personal (EPP)</th><th style="text-align:center;">Cantidad</th></tr></thead>
        <tbody>${itemsRows}</tbody>
      </table>
      ${rec.observaciones? `<div style="margin-top:12px;"><strong>Observaciones:</strong> ${rec.observaciones}</div>` : ""}
      <div style="margin-top:14px;font-size:12px;color:#555;">Declaro haber recibido conforme los elementos de protección personal detallados en este vale, comprometiéndome a usarlos correctamente y a mantenerlos en buen estado, conforme al DS N°44 y DS N°594.</div>
      <div class="firma-row">
        <div>Firma trabajador</div>
        <div>Firma responsable de entrega</div>
      </div>
    </div>
  `;
  window.print();
}

/* Listado automático de EPP entregados por trabajador, agrupado por
   trabajador + tipo de elemento, generado a partir de todos los vales. */
/* Opciones del filtro por elemento EPP del listado "por trabajador": igual
   criterio que en Vales emitidos, solo con los elementos realmente
   entregados (no el catálogo completo de EPP). */
function renderFilterEppPorTrabElementoOptions(){
  const sel = document.getElementById("filterEppPorTrabElemento");
  const cur = sel.value;
  const elementos = Array.from(new Set(
    (CACHE.epp||[]).flatMap(v => (v.items||[]).map(it => it.epp)).filter(Boolean)
  )).sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = '<option value="">Todos</option>' + elementos.map(el=>`<option value="${el}">${el}</option>`).join("");
  if(elementos.includes(cur)) sel.value = cur;
}
function renderEppPorTrabajador(){
  renderFilterEppPorTrabElementoOptions();
  const filtroTrab = document.getElementById("filterEppPorTrabTrabajador").value;
  const filtroElemento = document.getElementById("filterEppPorTrabElemento").value;
  const filtroFecha = document.getElementById("filterEppPorTrabFecha").value;

  const agg = new Map(); // key: trabajadorId||epp -> {trabajadorId, epp, cantidad, vales, ultimaFecha}
  (CACHE.epp||[])
    .filter(v=> !filtroTrab || v.trabajadorId===filtroTrab)
    .filter(v=> !filtroFecha || v.fecha===filtroFecha)
    .forEach(v=>{
      (v.items||[]).forEach(it=>{
        if(filtroElemento && it.epp!==filtroElemento) return;
        const key = v.trabajadorId + "||" + it.epp.toLowerCase();
        if(!agg.has(key)) agg.set(key, { trabajadorId: v.trabajadorId, epp: it.epp, cantidad:0, vales:0, ultimaFecha:"" });
        const row = agg.get(key);
        row.cantidad += (+it.cantidad || 0);
        row.vales += 1;
        if(!row.ultimaFecha || new Date(v.fecha) > new Date(row.ultimaFecha)) row.ultimaFecha = v.fecha;
      });
    });
  const rows = Array.from(agg.values()).sort((a,b)=> trabName(a.trabajadorId).localeCompare(trabName(b.trabajadorId)) || a.epp.localeCompare(b.epp));
  document.getElementById("eppPorTrabajadorTable").innerHTML = rows.map(r=>`
    <tr><td>${trabName(r.trabajadorId)}</td><td>${r.epp}</td><td>${r.cantidad}</td><td>${r.vales}</td><td>${r.ultimaFecha?fmtDate(r.ultimaFecha):"—"}</td></tr>
  `).join("") || `<tr><td class="empty" colspan="5">Sin entregas de EPP para el filtro seleccionado</td></tr>`;
}
document.getElementById("filterEppPorTrabTrabajador").addEventListener("change", renderEppPorTrabajador);
document.getElementById("filterEppPorTrabElemento").addEventListener("change", renderEppPorTrabajador);
document.getElementById("filterEppPorTrabFecha").addEventListener("change", renderEppPorTrabajador);
on(document.getElementById("clearFilterEppPorTrabFechaBtn"), "click", () => {
  document.getElementById("filterEppPorTrabFecha").value = "";
  renderEppPorTrabajador();
});

