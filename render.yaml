ad empleadora registra y respalda de forma documental y fidedigna toda la información vinculada a la gestión de los riesgos y la mantiene a disposición de las entidades fiscalizadoras y del respectivo Organismos Administrador del Seguro de la Ley 16.744?", "articulo": "72, inc. 1"}];

const FUF_NIVEL_LABEL = {sin_evaluar:"Sin evaluar", cumple:"Cumple", cumple_parcial:"Cumple parcialmente", no_cumple:"No cumple", no_aplica:"No aplica"};
function fufRecord(numero){
  return CACHE.cumplimientoLegal.find(r=>r.numero===numero) || {numero, nivel:"sin_evaluar", fecha:"", observaciones:"", evidenciaNombre:null, evidenciaData:null};
}
function renderFufFiltros(){
  const seccionSel = document.getElementById("filterFufSeccion");
  const current = seccionSel.value;
  const secciones = Array.from(new Set(FUF_ITEMS.map(it=>it.seccion)));
  fillSelect(seccionSel, secciones.map(s=>({id:s,label:s})), false);
  seccionSel.insertAdjacentHTML("afterbegin",'<option value="">Todas las materias</option>');
  seccionSel.value = current || "";
}
function fufFiltrados(){
  const fSeccion = document.getElementById("filterFufSeccion").value;
  const fNivel = document.getElementById("filterFufNivel").value;
  return FUF_ITEMS.filter(it=>{
    if(fSeccion && it.seccion!==fSeccion) return false;
    if(fNivel){
      const rec = fufRecord(it.numero);
      if((rec.nivel||"sin_evaluar")!==fNivel) return false;
    }
    return true;
  });
}
function renderFufStats(){
  const counts = {cumple:0, cumple_parcial:0, no_cumple:0, no_aplica:0, sin_evaluar:0};
  FUF_ITEMS.forEach(it=>{
    const rec = fufRecord(it.numero);
    const n = rec.nivel || "sin_evaluar";
    counts[n] = (counts[n]||0) + 1;
  });
  const evaluables = FUF_ITEMS.length - counts.no_aplica;
  const pct = evaluables>0 ? Math.round((counts.cumple / evaluables) * 1000)/10 : 0;
  document.getElementById("fufCumplimientoTotal").textContent = pct + "%";
  document.getElementById("fufCountCumple").textContent = counts.cumple;
  document.getElementById("fufCountParcial").textContent = counts.cumple_parcial;
  document.getElementById("fufCountNoCumple").textContent = counts.no_cumple;
  document.getElementById("fufCountOtros").textContent = (counts.no_aplica + counts.sin_evaluar);
}
function renderFufTable(){
  const rows = fufFiltrados();
  let lastSeccion = null;
  const html = [];
  rows.forEach(it=>{
    if(it.seccion !== lastSeccion){
      html.push(`<tr><td colspan="6" style="background:#f2f4f7;font-weight:700;padding:8px 10px;">${it.seccion}</td></tr>`);
      lastSeccion = it.seccion;
    }
    const rec = fufRecord(it.numero);
    const nivel = rec.nivel || "sin_evaluar";
    const nivelCls = nivel==="cumple" ? "vigente" : nivel==="no_cumple" ? "vencido" : nivel==="cumple_parcial" ? "proximo" : "";
    html.push(`<tr>
      <td>${it.numero}</td>
      <td><div>${it.texto}</div>${it.articulo?`<div class="kv" style="margin-top:4px;">Art. ${it.articulo}</div>`:""}</td>
      <td>
        <select data-fuf-field="nivel" data-fuf-id="${it.numero}">
          <option value="sin_evaluar" ${nivel==="sin_evaluar"?"selected":""}>Sin evaluar</option>
          <option value="cumple" ${nivel==="cumple"?"selected":""}>Cumple</option>
          <option value="cumple_parcial" ${nivel==="cumple_parcial"?"selected":""}>Cumple parcialmente</option>
          <option value="no_cumple" ${nivel==="no_cumple"?"selected":""}>No cumple</option>
          <option value="no_aplica" ${nivel==="no_aplica"?"selected":""}>No aplica</option>
        </select>
        ${nivelCls?`<div style="margin-top:4px;"><span class="pill ${nivelCls}">${FUF_NIVEL_LABEL[nivel]}</span></div>`:""}
      </td>
      <td><input type="date" data-fuf-field="fecha" data-fuf-id="${it.numero}" value="${rec.fecha||""}"></td>
      <td><textarea data-fuf-field="observaciones" data-fuf-id="${it.numero}" rows="2" placeholder="Observaciones">${rec.observaciones||""}</textarea></td>
      <td>
        ${rec.evidenciaNombre ? `<div class="kv">📎 ${rec.evidenciaNombre}</div><div style="margin-top:4px;display:flex;gap:6px;"><button class="subtle-btn" data-fuf-ver="${it.numero}" type="button">Ver</button><button class="subtle-btn" data-fuf-quitar="${it.numero}" type="button">Quitar</button></div>` : `<span class="kv">Sin evidencia</span>`}
        <input type="file" data-fuf-file="${it.numero}" accept="image/*,application/pdf" style="margin-top:6px;font-size:11px;">
      </td>
    </tr>`);
  });
  document.getElementById("fufTable").innerHTML = html.join("") || `<tr><td class="empty" colspan="6">Sin ítems para el filtro seleccionado</td></tr>`;
  renderFufStats();
}
on(document.getElementById("fufTable"), "change", async (e) => {
  const el = e.target.closest("[data-fuf-field]");
  if(el){
    const numero = el.dataset.fufId;
    const rec = CACHE.cumplimientoLegal.find(r=>r.numero===numero) || {id:"fuf-"+numero, numero, nivel:"sin_evaluar", fecha:"", observaciones:"", evidenciaNombre:null, evidenciaData:null};
    rec[el.dataset.fufField] = el.value;
    await put("cumplimientoLegal", rec);
    await loadCache();
    renderFufTable();
    return;
  }
  const fileEl = e.target.closest("[data-fuf-file]");
  if(fileEl){
    const file = fileEl.files[0];
    if(!file) return;
    const dataUrl = await readFileAsDataUrl(file);
    const numero = fileEl.dataset.fufFile;
    const rec = CACHE.cumplimientoLegal.find(r=>r.numero===numero) || {id:"fuf-"+numero, numero, nivel:"sin_evaluar", fecha:"", observaciones:""};
    rec.evidenciaNombre = file.name;
    rec.evidenciaData = dataUrl;
    await put("cumplimientoLegal", rec);
    await loadCache();
    renderFufTable();
  }
});
on(document.getElementById("fufTable"), "click", async (e) => {
  const verBtn = e.target.closest("[data-fuf-ver]");
  if(verBtn){
    const rec = fufRecord(verBtn.dataset.fufVer);
    if(rec.evidenciaData){
      const w = window.open();
      if(w) w.document.write(`<title>${rec.evidenciaNombre||"Evidencia"}</title><body style="margin:0;background:#222;display:flex;align-items:center;justify-content:center;height:100vh;">${/^data:application\/pdf/.test(rec.evidenciaData) ? `<embed src="${rec.evidenciaData}" style="width:100%;height:100%;">` : `<img src="${rec.evidenciaData}" style="max-width:100%;max-height:100%;">`}</body>`);
    }
    return;
  }
  const quitarBtn = e.target.closest("[data-fuf-quitar]");
  if(quitarBtn){
    if(!confirm("¿Quitar la evidencia adjunta de este ítem?")) return;
    const numero = quitarBtn.dataset.fufQuitar;
    const rec = CACHE.cumplimientoLegal.find(r=>r.numero===numero);
    if(rec){
      rec.evidenciaNombre = null;
      rec.evidenciaData = null;
      await put("cumplimientoLegal", rec);
      await loadCache();
      renderFufTable();
    }
  }
});
["filterFufSeccion","filterFufNivel"].forEach(id=>{
  document.getElementById(id).addEventListener("change", renderFufTable);
});
on(document.getElementById("exportFufBtn"), "click", async () => {
  if(typeof XLSX === "undefined"){ alert("No se pudo cargar el generador de Excel (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const data = fufFiltrados().map(it=>{
    const rec = fufRecord(it.numero);
    return {
      "N°": it.numero,
      "Materia": it.seccion,
      "Ítem": it.texto,
      "Artículo": it.articulo,
      "Nivel de cumplimiento": FUF_NIVEL_LABEL[rec.nivel||"sin_evaluar"],
      "Fecha de evaluación": rec.fecha ? fmtDate(rec.fecha) : "",
      "Observaciones": rec.observaciones || "",
      "Evidencia adjunta": rec.evidenciaNombre || "",
    };
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, "Cumplimiento FUF DS44");
  const empresaNombre = (CACHE.empresa && CACHE.empresa.razonSocial) ? CACHE.empresa.razonSocial.replace(/[^a-zA-Z0-9]+/g,"_") : "Empresa";
  XLSX.writeFile(wb, `Cumplimiento_FUF_DS44_${empresaNombre}_${new Date().toISOString().slice(0,10)}.xlsx`);
});

/* =========================================================
   RIOHyS — Reglamento Interno de Orden, Higiene y Seguridad
   Historial de versiones del reglamento (confección, revisión y
   actualización), con el documento del reglamento de cada versión y
   los respaldos de haberlo entregado a la SEREMI de Salud y a la
   Dirección del Trabajo (DS N°44, arts. 56 y 57 — ver también FUF
   ítems 50 y 51). Cada versión queda como un registro independiente
   en el store "riohys", igual convención de archivos adjuntos en
   base64 (data URL) que el resto de la app.
   ========================================================= */
let riohysEditingId = null;
let riohysArchivoPendiente = null; // {nombre, data} o null (se conserva el actual si no se sube uno nuevo)
let riohysSeremiPendiente = null;
let riohysDtPendiente = null;

document.getElementById("riohysArchivoInput").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if(!file){ riohysArchivoPendiente = null; return; }
  riohysArchivoPendiente = {nombre:file.name, data: await readFileAsDataUrl(file)};
});
document.getElementById("riohysSeremiInput").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if(!file){ riohysSeremiPendiente = null; return; }
  riohysSeremiPendiente = {nombre:file.name, data: await readFileAsDataUrl(file)};
});
document.getElementById("riohysDtInput").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if(!file){ riohysDtPendiente = null; return; }
  riohysDtPendiente = {nombre:file.name, data: await readFileAsDataUrl(file)};
});

function resetRiohysForm(){
  riohysEditingId = null;
  riohysArchivoPendiente = null;
  riohysSeremiPendiente = null;
  riohysDtPendiente = null;
  document.getElementById("riohysVersion").value = "";
  document.getElementById("riohysFechaConfeccion").value = "";
  document.getElementById("riohysFechaRevision").value = "";
  document.getElementById("riohysFechaActualizacion").value = "";
  document.getElementById("riohysDescripcion").value = "";
  document.getElementById("riohysFechaSeremi").value = "";
  document.getElementById("riohysFechaDt").value = "";
  document.getElementById("riohysObservaciones").value = "";
  document.getElementById("riohysArchivoInput").value = "";
  document.getElementById("riohysSeremiInput").value = "";
  document.getElementById("riohysDtInput").value = "";
  document.getElementById("riohysArchivoActual").textContent = "";
  document.getElementById("riohysSeremiActual").textContent = "";
  document.getElementById("riohysDtActual").textContent = "";
  document.getElementById("riohysFormTitle").textContent = "Reglamento Interno de Orden, Higiene y Seguridad (RIOHyS)";
  document.getElementById("cancelEditRiohysBtn").style.display = "none";
}
function startEditRiohys(id){
  const rec = CACHE.riohys.find(r=>r.id===id);
  if(!rec) return;
  riohysEditingId = id;
  riohysArchivoPendiente = null;
  riohysSeremiPendiente = null;
  riohysDtPendiente = null;
  document.getElementById("riohysVersion").value = rec.version || "";
  document.getElementById("riohysFechaConfeccion").value = rec.fechaConfeccion || "";
  document.getElementById("riohysFechaRevision").value = rec.fechaRevision || "";
  document.getElementById("riohysFechaActualizacion").value = rec.fechaActualizacion || "";
  document.getElementById("riohysDescripcion").value = rec.descripcion || "";
  document.getElementById("riohysFechaSeremi").value = rec.fechaSeremi || "";
  document.getElementById("riohysFechaDt").value = rec.fechaDt || "";
  document.getElementById("riohysObservaciones").value = rec.observaciones || "";
  document.getElementById("riohysArchivoInput").value = "";
  document.getElementById("riohysSeremiInput").value = "";
  document.getElementById("riohysDtInput").value = "";
  document.getElementById("riohysArchivoActual").textContent = rec.archivoNombre ? ("Archivo actual: "+rec.archivoNombre+" (se mantiene si no subes uno nuevo)") : "Sin archivo adjunto todavía";
  document.getElementById("riohysSeremiActual").textContent = rec.seremiNombre ? ("Respaldo actual: "+rec.seremiNombre+" (se mantiene si no subes uno nuevo)") : "Sin respaldo adjunto todavía";
  document.getElementById("riohysDtActual").textContent = rec.dtNombre ? ("Respaldo actual: "+rec.dtNombre+" (se mantiene si no subes uno nuevo)") : "Sin respaldo adjunto todavía";
  document.getElementById("riohysFormTitle").textContent = "Editando versión "+(rec.version||"")+" del RIOHyS";
  document.getElementById("cancelEditRiohysBtn").style.display = "";
  document.getElementById("hdrRiohys").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("cancelEditRiohysBtn"), "click", ()=> resetRiohysForm());
on(document.getElementById("saveRiohysBtn"), "click", async ()=>{
  const version = document.getElementById("riohysVersion").value.trim();
  if(!version){ alert("Indica el N° de versión del RIOHyS."); return; }
  const anterior = riohysEditingId ? CACHE.riohys.find(r=>r.id===riohysEditingId) : null;
  const rec = {
    id: riohysEditingId || uid(),
    version,
    fechaConfeccion: document.getElementById("riohysFechaConfeccion").value,
    fechaRevision: document.getElementById("riohysFechaRevision").value,
    fechaActualizacion: document.getElementById("riohysFechaActualizacion").value,
    descripcion: document.getElementById("riohysDescripcion").value.trim(),
    fechaSeremi: document.getElementById("riohysFechaSeremi").value,
    fechaDt: document.getElementById("riohysFechaDt").value,
    observaciones: document.getElementById("riohysObservaciones").value.trim(),
    archivoNombre: riohysArchivoPendiente ? riohysArchivoPendiente.nombre : (anterior && anterior.archivoNombre) || null,
