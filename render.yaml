/* --- Control de investigaciones de accidentes --- */
function investigacionDeAccidente(accidenteId){
  const analisis = (CACHE.arbolesCausales||[]).filter(a=>a.accidenteId===accidenteId);
  if(!analisis.length) return null;
  return analisis.slice().sort((a,b)=> new Date(b.fechaAnalisis||0)-new Date(a.fechaAnalisis||0))[0];
}
function renderCphysInvestigaciones(){
  const accidentes = (CACHE.accidentes||[]).slice().sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  const investigados = accidentes.filter(a=>investigacionDeAccidente(a.id));
  document.getElementById("cphysInvestigacionesTiles").innerHTML = [
    tile("Accidentes e incidentes registrados", accidentes.length, ""),
    tile("Investigados (con análisis de causa raíz)", investigados.length, ""),
    tile("Pendientes de investigar", accidentes.length-investigados.length, "requieren análisis de causa raíz", (accidentes.length-investigados.length)>0?"alto":"bajo"),
  ].join("");
  document.getElementById("cphysInvestigacionesTable").innerHTML = accidentes.length ? accidentes.map(a=>{
    const inv = investigacionDeAccidente(a.id);
    return `<tr>
      <td>${fmtDate(a.fecha)}</td>
      <td>${ACC_TIPO_LABEL[a.tipo]||a.tipo}</td>
      <td>${areaName(a.areaId)}</td>
      <td>${a.causa || "—"}</td>
      <td>${inv? '<span class="pill vigente">Investigado</span>' : '<span class="pill pendiente">Pendiente de investigar</span>'}</td>
      <td>${inv? (inv.responsable||"—") : "—"}</td>
      <td><button class="subtle-btn" data-cphys-investigar="${a.id}">${inv?"Ver investigación":"Investigar"}</button></td>
    </tr>`;
  }).join("") : `<tr><td class="empty" colspan="7">Sin accidentes/incidentes registrados todavía</td></tr>`;
}
