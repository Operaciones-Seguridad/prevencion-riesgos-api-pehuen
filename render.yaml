function descargarInformeCompromisos(){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const tipo = document.getElementById("compInformeTipo").value;
  const anio = +document.getElementById("compInformeAnio").value;
  const items = CACHE.compromisosItems||[];
  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(15);
  doc.text("Control de compromisos — Informe de cumplimiento", 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatos = datosEmpresaLineaPdf();
  if(lineaDatos){ doc.text(lineaDatos, 14, y); y += 6; }

  if(tipo === "mensual"){
    const mes = +document.getElementById("compInformeMes").value;
    doc.text(`Período: ${COMP_MESES[mes-1]} ${anio} · Generado el ${fmtDate(new Date().toISOString().slice(0,10))}`, 14, y); y += 8;
    const filas = items.map(it=>{
      const meta = it.metaMensual||1;
      const aplica = compMesesDe(it).includes(mes);
      if(!aplica) return [it.nombre, "No aplica este mes", "—", "—"];
      const reg = compRegistro(it.id, anio, mes);
      const cantidad = reg ? (+reg.cantidad||0) : 0;
      const pct = Math.round(Math.min(cantidad/meta,1)*100);
      return [it.nombre, String(meta), String(cantidad), pct+"%"];
    });
    const aplicables = items.filter(it=>compMesesDe(it).includes(mes));
    const pctGlobal = aplicables.length ? Math.round(aplicables.reduce((acc,it)=>{
      const meta = it.metaMensual||1;
      const reg = compRegistro(it.id, anio, mes);
      const cantidad = reg ? (+reg.cantidad||0) : 0;
      return acc + Math.min(cantidad/meta,1);
    },0)/aplicables.length*100) : 0;
    doc.autoTable({ startY:y, head:[["Actividad","Meta mensual","Realizado","% cumplimiento"]],
      body: filas.length? filas : [["Sin ítems de control configurados","","",""]],
      styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]},
      foot:[["Cumplimiento global del mes","","",pctGlobal+"%"]], footStyles:{fillColor:[230,230,230], textColor:[20,20,20], fontStyle:"bold"} });
    doc.save(`Control_Compromisos_${COMP_MESES[mes-1]}_${anio}_${(CACHE.empresa&&CACHE.empresa.razonSocial||"Empresa").replace(/[^a-zA-Z0-9]+/g,"_")}.pdf`);
  } else {
    doc.text(`Período: Año ${anio} · Generado el ${fmtDate(new Date().toISOString().slice(0,10))}`, 14, y); y += 8;
    const transcurridos = compMesesTranscurridos(anio);
    const filas = items.map(it=>{
      const meta = it.metaMensual||1;
      const mesesAplicables = compMesesDe(it);
      let sumaPct = 0, considerados = 0;
      const celdasMes = COMP_MESES.map((_,i)=>{
        const mes = i+1;
        if(!mesesAplicables.includes(mes)) return "—";
        const reg = compRegistro(it.id, anio, mes);
        const cantidad = reg ? (+reg.cantidad||0) : 0;
        if(mes<=transcurridos){ sumaPct += Math.min(cantidad/meta,1); considerados++; }
        return String(cantidad);
      });
      const pct = considerados>0 ? Math.round((sumaPct/considerados)*100) : 0;
      return [it.nombre, ...celdasMes, considerados>0? pct+"%" : "—"];
    });
    doc.autoTable({ startY:y, head:[["Actividad",...COMP_MESES,"% cumplimiento"]],
      body: filas.length? filas : [["Sin ítems de control configurados", ...COMP_MESES.map(()=>""), ""]],
      styles:{fontSize:7.5}, headStyles:{fillColor:[42,120,214]}, columnStyles:{0:{cellWidth:38}} });
    doc.save(`Control_Compromisos_Anual_${anio}_${(CACHE.empresa&&CACHE.empresa.razonSocial||"Empresa").replace(/[^a-zA-Z0-9]+/g,"_")}.pdf`);
  }
}
