<script>
/* =========================================================
   ALMACENAMIENTO: IndexedDB, con respaldo automático a
   localStorage o memoria si el navegador lo bloquea (frecuente
   al abrir el archivo HTML directamente con doble clic, sin
   servidor, en algunas configuraciones de Chrome/Edge).
   ========================================================= */
const DB_NAME = "prevencion_riesgos_db";
const DB_VERSION = 23;
const STORES = ["empresa","areas","trabajadores","protocolos","inspecciones","matriz","examenes","checklists","programa","capacitaciones","accidentes","horasHombre","matrizHistorial","catalogosExtra","epp","planoRiesgos","estudioEpp","medidasControlVS","cumplimientoLegal","bitacoraProtocolo","ganttProtocolo","infractores","rankingVelocidad","astRegistros","tmertRegistros","arbolesCausales","riohys","documentos","cphysMiembros","cphysReuniones","correosResponsables","cphysPrograma","cphysCapacitaciones","grdAmenazas","grdComite","grdPlanRespuesta","grdSimulacros","grdPlanAccion","iapRegistros","accesoPerfiles","accesoUsuarios","levantamientos","compromisosItems","compromisosRegistros"];
let db;
let storageMode = "indexeddb"; // "indexeddb" | "localstorage" | "memory" | "api"
let memStore = {};

/* =========================================================
   MODO "API" (backend real, v1.73): si se define API_BASE_URL, la
   app deja de usar IndexedDB/localStorage y guarda todo en un
   backend propio (Node+PostgreSQL) a través de esta URL, con
   autenticación real (login validado en el servidor, con la clave
   protegida por hash — nunca viaja en texto plano ni se guarda en
   el navegador). Para volver al modo de un solo archivo sin
   backend (como hasta la v1.72), basta con dejar esta constante
   vacía: el resto de la app sigue funcionando exactamente igual.
   ========================================================= */
const API_BASE_URL = "https://prevencion-riesgos-api-pehuen.onrender.com"; // Backend real de Pehuén desplegado en Render
const AUTH_TOKEN_KEY = "cprAuthToken";
let authToken = null;
try{ authToken = localStorage.getItem(AUTH_TOKEN_KEY) || null; }catch(e){}

async function apiFetch(method, path, body){
  const headers = {};
  if(authToken) headers["Authorization"] = "Bearer " + authToken;
  if(body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(API_BASE_URL + path, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
  if(res.status === 401){
    authToken = null;
    try{ localStorage.removeItem(AUTH_TOKEN_KEY); }catch(e){}
    SESION.usuarioId = null;
    try{ localStorage.removeItem(SESION_STORAGE_KEY); }catch(e){}
    mostrarLogin();
    throw new Error("Sesión expirada o inválida. Vuelve a iniciar sesión.");
  }
  if(res.status === 204) return null;
  if(!res.ok){
    let detail = "";
    try{ detail = (await res.json()).error || ""; }catch(e){}
    throw new Error(detail || `Error del servidor (${res.status}).`);
  }
  return res.json();
}
/* Login: NO pasa por apiFetch (que trataría un 401 como "sesión
   expirada" y redirigiría al login mostrando un mensaje genérico); un
   401 aquí simplemente significa "usuario o clave incorrectos", que ya
   se maneja con el mensaje de error propio del formulario de acceso. */
async function apiLogin(usuarioId, clave){
  const res = await fetch(API_BASE_URL + "/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ usuarioId, clave }),
  });
  if(!res.ok) return null;
  return res.json();
}
async function cargarUsuariosPublicos(){
  try{
    const res = await fetch(API_BASE_URL + "/api/public/usuarios");
    CACHE.accesoUsuarios = res.ok ? await res.json() : [];
  }catch(e){ console.error(e); CACHE.accesoUsuarios = []; }
}

function openDB(){
  if(API_BASE_URL){
    storageMode = "api";
    return Promise.resolve();
  }
  return new Promise((resolve)=>{
    try{
      if(!window.indexedDB) throw new Error("IndexedDB no está disponible en este navegador/contexto.");
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      let settled = false;
      const finishFallback = (reason)=>{
        if(settled) return; settled = true;
        console.warn("Usando almacenamiento alternativo:", reason);
        activateFallbackStorage();
        resolve();
      };
      // Salvavidas: si IndexedDB nunca responde (bloqueado silenciosamente), no dejar la app colgada.
      const timeout = setTimeout(()=>finishFallback("tiempo de espera agotado al abrir IndexedDB"), 2500);
      req.onupgradeneeded = (e)=>{
        const d = e.target.result;
        STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"id"}); });
      };
      req.onsuccess = ()=>{
        if(settled) return; settled = true;
        clearTimeout(timeout);
        db = req.result; storageMode = "indexeddb"; resolve();
      };
      req.onerror = ()=>{ clearTimeout(timeout); finishFallback(req.error); };
      req.onblocked = ()=>{ clearTimeout(timeout); finishFallback("IndexedDB bloqueado (otra pestaña con una versión distinta abierta)"); };
    } catch(err){
      activateFallbackStorage(err);
      resolve();
    }
  });
}

function activateFallbackStorage(reason){
  try{
    const testKey = "__pr_test__";
    localStorage.setItem(testKey,"1");
    localStorage.removeItem(testKey);
    storageMode = "localstorage";
  } catch(err){
    storageMode = "memory";
    STORES.forEach(s=>{ memStore[s] = memStore[s] || []; });
  }
  showStorageWarning(reason);
}

function showStorageWarning(reason){
  if(document.getElementById("storageWarningBanner")) return;
  const banner = document.createElement("div");
  banner.id = "storageWarningBanner";
  banner.style.cssText = "background:#fff4de;color:#8a5a00;padding:10px 16px;text-align:center;font-size:13px;border-bottom:1px solid #eda100;";
  banner.textContent = storageMode === "localstorage"
    ? "Aviso: este navegador no permitió usar IndexedDB para este archivo local; se está guardando con un método alternativo (localStorage) que igualmente conserva los datos entre sesiones."
    : "Aviso: este navegador bloqueó todo almacenamiento persistente para este archivo local; los datos NO se guardarán al cerrar o recargar la página. Prueba abriendo el archivo desde un servidor local o en otro navegador.";
  document.body.insertBefore(banner, document.body.firstChild);
}

function txStore(name, mode="readonly"){ return db.transaction(name, mode).objectStore(name); }

function lsKey(store){ return "prevencion_riesgos_"+store; }
function lsGetAll(store){
  try{ return JSON.parse(localStorage.getItem(lsKey(store)) || "[]"); } catch(e){ return []; }
}
function lsSetAll(store, arr){ localStorage.setItem(lsKey(store), JSON.stringify(arr)); }

function getAll(store){
  if(storageMode === "api") return apiFetch("GET", `/api/${store}`);
  if(storageMode === "indexeddb"){
    return new Promise((resolve)=>{
      // Auto-sanación: si el navegador tiene una base de datos más antigua que no
      // alcanzó a crear este almacén (por ejemplo, tras una actualización de la app
      // que agregó módulos nuevos), no fallar: devolver una lista vacía en vez de
      // lanzar un error que dejaría toda la pantalla en blanco.
      if(!db.objectStoreNames.contains(store)){
        console.warn(`El almacén "${store}" no existe todavía en esta base de datos local; se usará una lista vacía. Recarga la página o usa "Restaurar datos de ejemplo" en Configuración si el problema persiste.`);
        resolve([]);
        return;
      }
      const r = txStore(store).getAll();
      r.onsuccess = ()=>resolve(r.result || []);
      r.onerror = ()=>{ console.error(r.error); resolve([]); };
    });
  }
  if(storageMode === "localstorage") return Promise.resolve(lsGetAll(store) || []);
  return Promise.resolve(memStore[store] || []);
}
function put(store, obj){
  if(storageMode === "api") return apiFetch("POST", `/api/${store}`, obj);
  if(storageMode === "indexeddb"){
    return new Promise((resolve,reject)=>{
      const r = txStore(store,"readwrite").put(obj);
      r.onsuccess = ()=>resolve(obj);
      r.onerror = ()=>reject(r.error);
    });
  }
  if(storageMode === "localstorage"){
    const arr = lsGetAll(store);
    const idx = arr.findIndex(x=>x.id===obj.id);
    if(idx>-1) arr[idx]=obj; else arr.push(obj);
    lsSetAll(store, arr);
    return Promise.resolve(obj);
  }
  const arr = memStore[store] || (memStore[store]=[]);
  const idx = arr.findIndex(x=>x.id===obj.id);
  if(idx>-1) arr[idx]=obj; else arr.push(obj);
  return Promise.resolve(obj);
}
function deleteRecord(store, id){
  if(storageMode === "api") return apiFetch("DELETE", `/api/${store}/${encodeURIComponent(id)}`);
  if(storageMode === "indexeddb"){
    return new Promise((resolve,reject)=>{
      const r = txStore(store,"readwrite").delete(id);
      r.onsuccess = ()=>resolve();
      r.onerror = ()=>reject(r.error);
    });
  }
  if(storageMode === "localstorage"){
    lsSetAll(store, lsGetAll(store).filter(x=>x.id!==id));
    return Promise.resolve();
  }
  memStore[store] = (memStore[store]||[]).filter(x=>x.id!==id);
  return Promise.resolve();
}
function clearStore(store){
  if(storageMode === "api") return apiFetch("DELETE", `/api/${store}`);
  if(storageMode === "indexeddb"){
    return new Promise((resolve,reject)=>{
      const r = txStore(store,"readwrite").clear();
      r.onsuccess = ()=>resolve();
      r.onerror = ()=>reject(r.error);
    });
  }
  if(storageMode === "localstorage"){ lsSetAll(store, []); return Promise.resolve(); }
  memStore[store] = [];
  return Promise.resolve();
}

/* Envuelve un manejador async: si algo fallara, se muestra SIEMPRE un
   aviso visible en vez de fallar en silencio (ese silencio era el bug
   reportado: "no pasa nada" al crear áreas/empresa). */
function on(el, event, handler){
  if(!el) return;
  el.addEventListener(event, async (e)=>{
    try{ await handler(e); }
    catch(err){
      console.error(err);
      alert("No se pudo completar la acción: " + (err && err.message ? err.message : err));
    }
  });
}
function setupCollapsible(headerId, bodyId, toggleId, storageKey){
  const header = document.getElementById(headerId);
  const body = document.getElementById(bodyId);
  const btn = document.getElementById(toggleId);
  if(!header || !body || !btn) return;
  let open = true;
  try{
    const saved = localStorage.getItem(storageKey);
    if(saved !== null) open = saved === "1";
  }catch(e){}
  function apply(){
    body.classList.toggle("collapsed", !open);
    btn.textContent = open ? "▾" : "▸";
    btn.setAttribute("aria-expanded", String(open));
  }
  function toggle(){
    open = !open;
    try{ localStorage.setItem(storageKey, open ? "1" : "0"); }catch(e){}
    apply();
  }
  apply();
  btn.addEventListener("click", (e)=>{ e.stopPropagation(); toggle(); });
  header.addEventListener("click", (e)=>{ if(e.target.closest("select,input,button,a,label")) return; toggle(); });
}
