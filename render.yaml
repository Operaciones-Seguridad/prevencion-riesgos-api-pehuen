/* =========================================================
   LEVANTAMIENTO DE RIESGOS (IPER) POR ÁREA DE TRABAJO
   Formulario según la planilla "LEVANTAMIENTO DE PROCESOS IPER
   POR ÁREA DE TRABAJO": por área, se listan procesos/tareas/
   actividades y se marca su exposición a riesgos (reutiliza el
   catálogo CAT_PELIGROS, que ya coincide con esa planilla), a
   protocolos de salud y a riesgos de higiene. Cada levantamiento
   guardado puede "traducirse" en líneas de la Matriz de riesgos,
   una por cada actividad x riesgo marcado, quedando asociadas
   mediante el campo levantamientoId.
   ========================================================= */
const LV_PROTOCOLOS = ["Radiación U.V","MMC","TMERT","Psicosocial","Plaguicidas","PREXOR"];
const LV_HIGIENE = ["Sustancias peligrosas","Residuos peligrosos","Radiaciones","Combustibles líquidos","Desechos orgánicos"];
let lvFilas = [];
/* Cachés en memoria de los archivos recién seleccionados (no guardados
   en IndexedDB, solo el objeto File original), para poder "Detectar
   nombres automáticamente" sin depender de que el <input type="file">
   siga teniendo el archivo seleccionado tras un re-render de la lista
   (el navegador limpia el input al redibujarlo). */
let IAP_ARCHIVO_CACHE = {};
let CAP_ARCHIVO_CACHE = {};
let levantamientoEditingId = null;
function drawLvChecklist(wrapId, cssClass, opciones, seleccionadas){
  const wrap = document.getElementById(wrapId);
  wrap.innerHTML = opciones.map(op=>`<label style="display:flex;align-items:center;gap:5px;font-weight:400;min-width:auto;"><input type="checkbox" class="${cssClass}" value="${op}" style="width:auto;min-height:auto;" ${ (seleccionadas||[]).includes(op)?"checked":"" }> ${op}</label>`).join("");
}
function lvChecked(cssClass){ return Array.from(document.querySelectorAll("."+cssClass+":checked")).map(c=>c.value); }
function resetLvFilaCampos(){
  document.getElementById("lvProceso").value = "";
  document.getElementById("lvTarea").value = "";
  document.getElementById("lvActividad").value = "";
  drawLvChecklist("lvRiesgosCheckWrap", "lvRiesgoChk", CAT_PELIGROS, []);
  drawLvChecklist("lvProtocolosCheckWrap", "lvProtocoloChk", LV_PROTOCOLOS, []);
  drawLvChecklist("lvHigieneCheckWrap", "lvHigieneChk", LV_HIGIENE, []);
}
function renderLvFilasWrap(){
  const wrap = document.getElementById("lvFilasWrap");
  if(!lvFilas.length){ wrap.innerHTML = '<div class="empty">Aún no ha agregado actividades a este levantamiento.</div>'; return; }
  wrap.innerHTML = `<table><thead><tr><th>Proceso</th><th>Tarea</th><th>Actividad</th><th>Riesgos / Protocolos / Higiene</th><th></th></tr></thead><tbody>` +
    lvFilas.map((f,i)=>`
      <tr>
        <td>${f.proceso||"—"}</td>
        <td>${f.tarea||"—"}</td>
        <td>${f.actividad||"—"}</td>
        <td>${(f.riesgos||[]).map(r=>`<span class="pill medio" style="margin:1px;">${r}</span>`).join("")}${(f.protocolos||[]).map(r=>`<span class="pill bajo" style="margin:1px;">${r}</span>`).join("")}${(f.higiene||[]).map(r=>`<span class="pill bajo" style="margin:1px;">${r}</span>`).join("")}</td>
        <td><button class="subtle-btn" data-lvfila-del="${i}">Quitar</button></td>
      </tr>
    `).join("") + `</tbody></table>`;
}
on(document.getElementById("lvFilasWrap"), "click", (e) => {
  const btn = e.target.closest("button[data-lvfila-del]");
  if(!btn) return;
  lvFilas.splice(+btn.dataset.lvfilaDel, 1);
  renderLvFilasWrap();
});
on(document.getElementById("addLvFilaBtn"), "click", () => {
  const proceso = document.getElementById("lvProceso").value.trim();
  const tarea = document.getElementById("lvTarea").value.trim();
  const actividad = document.getElementById("lvActividad").value.trim();
  const riesgos = lvChecked("lvRiesgoChk");
  const protocolos = lvChecked("lvProtocoloChk");
  const higiene = lvChecked("lvHigieneChk");
  if(!actividad){ alert("Ingrese al menos la Actividad."); return; }
  if(!riesgos.length && !protocolos.length && !higiene.length){ alert("Marque al menos un riesgo, protocolo de salud o riesgo de higiene."); return; }
  lvFilas.push({proceso, tarea, actividad, riesgos, protocolos, higiene});
  resetLvFilaCampos();
  renderLvFilasWrap();
});
function resetLevantamientoForm(){
  levantamientoEditingId = null;
  lvFilas = [];
  document.getElementById("lvRealizadoPor").value = "";
  document.getElementById("lvArea").value = "";
  document.getElementById("lvFecha").value = "";
  resetLvFilaCampos();
  renderLvFilasWrap();
  document.getElementById("cancelEditLevantamientoBtn").style.display = "none";
  document.getElementById("saveLevantamientoBtn").textContent = "Guardar levantamiento";
}
function startEditLevantamiento(id){
  const lv = (CACHE.levantamientos||[]).find(l=>l.id===id);
  if(!lv) return;
  levantamientoEditingId = id;
  lvFilas = (lv.filas||[]).map(f=>({...f}));
  document.getElementById("lvRealizadoPor").value = lv.realizadoPor||"";
  document.getElementById("lvArea").value = lv.areaId||"";
  document.getElementById("lvFecha").value = lv.fecha||"";
  resetLvFilaCampos();
  renderLvFilasWrap();
  document.getElementById("cancelEditLevantamientoBtn").style.display = "";
  document.getElementById("saveLevantamientoBtn").textContent = "Guardar cambios";
  document.getElementById("hdrLevantamiento").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("cancelEditLevantamientoBtn"), "click", resetLevantamientoForm);
on(document.getElementById("saveLevantamientoBtn"), "click", async () => {
  const realizadoPor = document.getElementById("lvRealizadoPor").value.trim();
  const areaId = document.getElementById("lvArea").value;
  const fecha = document.getElementById("lvFecha").value;
  if(!areaId || !fecha){ alert("Complete Área y Fecha."); return; }
  if(!lvFilas.length){ alert("Agregue al menos una actividad al levantamiento."); return; }
  const id = levantamientoEditingId || uid();
  const existing = levantamientoEditingId ? (CACHE.levantamientos||[]).find(l=>l.id===id) : null;
  await put("levantamientos", { id, realizadoPor, areaId, fecha, filas: lvFilas, matrizGeneradaIds: (existing && existing.matrizGeneradaIds) || [] });
  await loadCache();
  resetLevantamientoForm();
  renderLevantamientosTable();
});
function renderLevantamientosTable(){
  const tbody = document.getElementById("levantamientosTable");
  if(!tbody) return;
  const rows = (CACHE.levantamientos||[]).slice().sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  tbody.innerHTML = rows.map(l=>`
    <tr>
      <td>${fmtDate(l.fecha)}</td>
      <td>${areaName(l.areaId)}</td>
      <td>${l.realizadoPor||"—"}</td>
      <td>${(l.filas||[]).length} actividad(es)</td>
      <td>${(l.matrizGeneradaIds||[]).length ? `<span class="pill bajo">${l.matrizGeneradaIds.length} línea(s)</span>` : '<span class="pill medio">Pendiente</span>'}</td>
      <td>
        <button class="subtle-btn" data-lv-generar="${l.id}">${(l.matrizGeneradaIds||[]).length? "Regenerar líneas en matriz":"Generar líneas en matriz"}</button>
        <button class="subtle-btn" data-lv-editar="${l.id}">Editar</button>
        <button class="subtle-btn" data-lv-eliminar="${l.id}">Eliminar</button>
      </td>
    </tr>
  `).join("") || `<tr><td class="empty" colspan="6">Sin levantamientos registrados</td></tr>`;
}
on(document.getElementById("levantamientosTable"), "click", async (e) => {
  const btnGen = e.target.closest("button[data-lv-generar]");
  const btnEdit = e.target.closest("button[data-lv-editar]");
  const btnDel = e.target.closest("button[data-lv-eliminar]");
  if(btnGen){
    const lv = (CACHE.levantamientos||[]).find(l=>l.id===btnGen.dataset.lvGenerar);
    if(!lv) return;
    if((lv.matrizGeneradaIds||[]).length){
      if(!confirm("Este levantamiento ya generó líneas en la Matriz de riesgos anteriormente. ¿Generar líneas nuevamente? (se agregarán líneas adicionales, sin borrar las anteriores; revise y elimine manualmente los duplicados si corresponde).")) return;
    }
    const nuevosIds = [];
    for(const f of (lv.filas||[])){
      const riesgosATraspasar = (f.riesgos||[]).length ? f.riesgos : ["Ver protocolo de salud / riesgo de higiene asociado"];
      for(const riesgo of riesgosATraspasar){
        const rec = {
          id: uid(),
          areaId: lv.areaId,
          proceso: f.proceso||"",
          actividad: [f.tarea, f.actividad].filter(Boolean).join(" — "),
          categoria: "",
          peligro: riesgo,
          riesgo: riesgo,
          hombres:0, mujeres:0, otros:0,
          efecto: [
            f.protocolos && f.protocolos.length ? `Protocolo(s) de salud aplicable(s): ${f.protocolos.join(", ")}.` : "",
            f.higiene && f.higiene.length ? `Riesgo(s) de higiene: ${f.higiene.join(", ")}.` : "",
            "Línea generada automáticamente desde el Levantamiento de riesgos (IPER) del " + fmtDate(lv.fecha) + "."
          ].filter(Boolean).join(" "),
          sensible:false, gruposSensibles:[],
          probabilidad:3, consecuencia:3,
          controles:[], estado:"pendiente",
          levantamientoId: lv.id,
        };
        await put("matriz", rec);
        nuevosIds.push(rec.id);
      }
    }
    lv.matrizGeneradaIds = (lv.matrizGeneradaIds||[]).concat(nuevosIds);
    await put("levantamientos", lv);
    await loadCache();
    renderLevantamientosTable();
    renderMatrizTable();
    renderMatrizCharts();
    renderMapaRiesgos();
    renderPlanoRiesgos();
    alert(`Se generaron ${nuevosIds.length} línea(s) nueva(s) en la Matriz de riesgos. Revíselas y ajuste categoría, probabilidad, consecuencia y medidas de control según corresponda (quedaron con valores por defecto).`);
    return;
  }
  if(btnEdit){ startEditLevantamiento(btnEdit.dataset.lvEditar); return; }
  if(btnDel){
    const lv = (CACHE.levantamientos||[]).find(l=>l.id===btnDel.dataset.lvEliminar);
    if(!lv) return;
    if(!confirm("¿Eliminar este levantamiento? Las líneas ya generadas en la Matriz de riesgos NO se eliminan; solo se borra el registro del levantamiento en sí.")) return;
    await deleteRecord("levantamientos", lv.id);
    await loadCache();
    renderLevantamientosTable();
    return;
  }
});

/* Equidad de género: agrupa por Proceso > Actividad usando los conteos de
   hombres/mujeres/otros registrados en cada línea de la matriz. El total por
   proceso toma el máximo entre sus actividades (no la suma) porque una misma
   persona suele figurar en más de una actividad del mismo proceso.
   Los valores de Hombres/Mujeres/Otros se pueden editar directamente en esta
   tabla; el cambio se aplica a TODAS las líneas de la matriz que compartan
   ese mismo Proceso + Actividad, y queda registrado en el histórico. */
let EQUIDAD_COMBOS = [];
function renderEquidadGenero(){
  const porProceso = new Map();
  CACHE.matriz.forEach(m=>{
    const proceso = m.proceso || "(sin proceso)";
    const actividad = m.actividad || "(sin actividad)";
    if(!porProceso.has(proceso)) porProceso.set(proceso, new Map());
    const actMap = porProceso.get(proceso);
    if(!actMap.has(actividad)){
      actMap.set(actividad, {hombres:+m.hombres||0, mujeres:+m.mujeres||0, otros:+m.otros||0});
    }
  });

  if(porProceso.size===0){
    EQUIDAD_COMBOS = [];
    document.getElementById("equidadGeneroWrap").innerHTML = '<div class="empty">Sin datos de dotación registrados en la matriz</div>';
    return;
  }

  EQUIDAD_COMBOS = [];
  let html = "";
  let granTotalH=0, granTotalM=0, granTotalO=0;
  porProceso.forEach((actMap, proceso)=>{
    let maxH=0, maxM=0, maxO=0;
    const filas = [];
    actMap.forEach((v, actividad)=>{
      maxH = Math.max(maxH, v.hombres); maxM = Math.max(maxM, v.mujeres); maxO = Math.max(maxO, v.otros);
      const idx = EQUIDAD_COMBOS.length;
      EQUIDAD_COMBOS.push({proceso, actividad});
      filas.push(`<tr>
        <td>${actividad}</td>
        <td><input type="number" min="0" step="1" value="${v.hombres}" data-equidad-idx="${idx}" data-equidad-campo="hombres" style="min-height:36px;padding:6px 8px;"></td>
        <td><input type="number" min="0" step="1" value="${v.mujeres}" data-equidad-idx="${idx}" data-equidad-campo="mujeres" style="min-height:36px;padding:6px 8px;"></td>
        <td><input type="number" min="0" step="1" value="${v.otros}" data-equidad-idx="${idx}" data-equidad-campo="otros" style="min-height:36px;padding:6px 8px;"></td>
      </tr>`);
    });
    const total = maxH+maxM+maxO;
    const pctM = total? Math.round(maxM/total*100) : 0;
    granTotalH += maxH; granTotalM += maxM; granTotalO += maxO;
    html += `<div class="finding" style="background:var(--surface-1);margin-top:12px;">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">
        <strong>${proceso}</strong>
        <span class="pill ${pctM>=30?'bajo':pctM>=15?'medio':'alto'}">${maxH} hombres · ${maxM} mujeres${maxO?` · ${maxO} otros`:""} (${pctM}% mujeres)</span>
      </div>
      <table style="margin-top:8px;"><thead><tr><th>Actividad</th><th>Hombres</th><th>Mujeres</th><th>Otros</th></tr></thead><tbody>${filas.join("")}</tbody></table>
    </div>`;
  });
  const granTotal = granTotalH+granTotalM+granTotalO;
  const granPctM = granTotal? Math.round(granTotalM/granTotal*100) : 0;
  html = `<div class="tile" style="margin-bottom:4px;"><div class="label">Dotación total estimada (suma de máximos por proceso)</div><div class="value">${granTotalH} H · ${granTotalM} M${granTotalO?` · ${granTotalO} otros`:""}</div><div class="foot">${granPctM}% mujeres sobre el total estimado</div></div>` + html;
  document.getElementById("equidadGeneroWrap").innerHTML = html;
}
on(document.getElementById("equidadGeneroWrap"), "change", async (e) => {
  const inp = e.target.closest("input[data-equidad-idx]");
  if(!inp) return;
  const combo = EQUIDAD_COMBOS[+inp.dataset.equidadIdx];
  if(!combo) return;
  const campo = inp.dataset.equidadCampo;
  const nuevo = Math.max(0, +inp.value || 0);
  const campoLabel = {hombres:"N° hombres (equidad de género)", mujeres:"N° mujeres (equidad de género)", otros:"N° otros (equidad de género)"}[campo];
  const afectados = CACHE.matriz.filter(m=> (m.proceso||"(sin proceso)")===combo.proceso && (m.actividad||"(sin actividad)")===combo.actividad);
  for(const m of afectados){
    const anterior = +m[campo] || 0;
    if(anterior === nuevo) continue;
    m[campo] = nuevo;
    await put("matriz", m);
    await logHistorial(m.id, matrizLineLabel(m), campoLabel, anterior, nuevo);
  }
  await loadCache();
  renderEquidadGenero();
  renderMatrizTable();
  renderMatrizHistorialTable();
});

/* Gráficos de la matriz: distribución por nivel de riesgo y por área,
   sobre el total de líneas registradas (no aplica los filtros de la tabla). */
const NIVEL_CHART_COLORS = { bajo:"#0ca30c", medio:"#fab219", alto:"#ec835a", critico:"#d03b3b" };
const AREA_CHART_PALETTE = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];
function chartBarsHtml(entries, colorFor){
  const total = entries.reduce((s,[,c])=>s+c, 0) || 1;
  return entries.map(([label,count],i)=>{
    const pct = Math.round(count/total*100);
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);margin-bottom:4px;">
        <span>${label}</span><span>${count} (${pct}%)</span>
      </div>
      <div style="background:var(--grid);border-radius:6px;height:14px;overflow:hidden;">
        <div style="width:${pct}%;background:${colorFor(label,i)};height:100%;"></div>
      </div>
    </div>`;
  }).join("");
}
function renderMatrizCharts(){
  const nivelOrder = ["bajo","medio","alto","critico"];
  const nivelCounts = {bajo:0, medio:0, alto:0, critico:0};
  CACHE.matriz.forEach(m=>{ const n = nivelRiesgo(m.probabilidad,m.consecuencia); if(nivelCounts[n]!==undefined) nivelCounts[n]++; });
  const nivelEntries = nivelOrder.map(n=>[nivelLabel(n), nivelCounts[n]]);
  document.getElementById("chartNivelWrap").innerHTML = CACHE.matriz.length
    ? chartBarsHtml(nivelEntries, (label,i)=> NIVEL_CHART_COLORS[nivelOrder[i]])
    : '<div class="empty">Sin líneas registradas</div>';

  const areaCounts = new Map();
  CACHE.matriz.forEach(m=>{
    const name = areaName(m.areaId);
    areaCounts.set(name, (areaCounts.get(name)||0)+1);
  });
  const areaEntries = Array.from(areaCounts.entries()).sort((a,b)=>b[1]-a[1]);
  document.getElementById("chartAreaWrap").innerHTML = areaEntries.length
    ? chartBarsHtml(areaEntries, (label,i)=> AREA_CHART_PALETTE[i % AREA_CHART_PALETTE.length])
    : '<div class="empty">Sin líneas registradas</div>';
}

/* Resumen de la jerarquía de controles (DS 44) de toda la matriz: cuántas
   medidas hay de cada tipo (A-E, más "sin clasificar" para texto libre sin
   viñeta reconocible) y qué líneas dependen únicamente de EPP. */
function renderJerarquiaControles(){
  const counts = {A:0,B:0,C:0,D:0,E:0,SC:0};
  const soloEppLineas = [];
  CACHE.matriz.forEach(m=>{
    const items = jerarquiaDe(m);
    items.forEach(it=>{
      const code = JERARQUIA_ORDER.includes(it.jerarquia)? it.jerarquia : "SC";
      counts[code]++;
    });
    if(soloEpp(m)) soloEppLineas.push(m);
  });
  const entries = JERARQUIA_DS44.map(j=>[`${j.code} · ${j.label}`, counts[j.code]]).concat([["Sin clasificar", counts.SC]]);
  const totalMedidas = Object.values(counts).reduce((s,n)=>s+n,0);
  document.getElementById("chartJerarquiaWrap").innerHTML = totalMedidas>0
    ? chartBarsHtml(entries, (label,i)=> i<5? JERARQUIA_DS44[i].color : "#898781")
    : '<div class="empty">Sin medidas de control registradas todavía</div>';

  document.getElementById("soloEppListWrap").innerHTML = soloEppLineas.length
    ? `<div class="desc" style="margin-bottom:8px;"><strong>${soloEppLineas.length} línea(s)</strong> dependen únicamente de EPP como medida de control — conviene revisar si corresponde agregar una medida de mayor jerarquía:</div>
       <table><thead><tr><th>Área</th><th>Peligro</th><th>Nivel</th><th></th></tr></thead><tbody>${
         soloEppLineas.map(m=>{
           const n = nivelRiesgo(m.probabilidad,m.consecuencia);
           return `<tr><td>${areaName(m.areaId)}</td><td>${m.peligro}</td><td><span class="pill ${n}">${nivelLabel(n)}</span></td><td><button class="btn secondary small" data-matriz-editar="${m.id}">Editar</button></td></tr>`;
         }).join("")
       }</tbody></table>`
    : '<div class="empty">Ninguna línea depende únicamente de EPP.</div>';
}
on(document.getElementById("soloEppListWrap"), "click", async (e) => {
  const btn = e.target.closest("button[data-matriz-editar]");
  if(!btn) return;
  startEditMatriz(btn.dataset.matrizEditar);
});

/* =========================================================
   ESTUDIO DE NECESIDAD DE EPP
   Determina qué EPP corresponde a cada cargo/puesto de trabajo,
   cruzando el área y el peligro con las líneas REALES de la
   matriz de riesgos (no se escriben a mano): al elegir un área
   se listan solo los peligros que efectivamente están
   registrados en esa área, y al elegir un peligro se autocompleta
   el riesgo asociado desde la matriz.
   ========================================================= */
function peligrosDeArea(areaId){
  const rows = areaId ? CACHE.matriz.filter(m=>m.areaId===areaId) : CACHE.matriz;
  const map = new Map();
  rows.forEach(m=>{
    const k = m.peligro || "(sin peligro)";
    if(!map.has(k)) map.set(k, m.riesgo || "");
  });
  return Array.from(map.entries()).map(([peligro,riesgo])=>({peligro,riesgo})).sort((a,b)=>a.peligro.localeCompare(b.peligro));
}
function renderEppEstPeligroOptions(){
  const areaId = document.getElementById("eppEstArea").value;
  const sel = document.getElementById("eppEstPeligro");
  const prev = sel.value;
  const opciones = peligrosDeArea(areaId);
  sel.innerHTML = '<option value="">Seleccione...</option>' + opciones.map(o=>`<option value="${o.peligro}" data-riesgo="${o.riesgo.replace(/"/g,'&quot;')}">${o.peligro}</option>`).join("");
  if(opciones.some(o=>o.peligro===prev)) sel.value = prev;
}
on(document.getElementById("eppEstArea"), "change", async () => { renderEppEstPeligroOptions(); document.getElementById("eppEstRiesgo").value = ""; });
on(document.getElementById("eppEstPeligro"), "change", async () => {
  const sel = document.getElementById("eppEstPeligro");
  const opt = sel.options[sel.selectedIndex];
  document.getElementById("eppEstRiesgo").value = opt ? (opt.dataset.riesgo || "") : "";
});

let eppEstEditingId = null;
const EPP_EST_FORM_FIELDS = ["eppEstCargo","eppEstArea","eppEstPeligro","eppEstRiesgo","eppEstEpp","eppEstCertificacion","eppEstVidaUtil"];
function resetEppEstForm(){
  eppEstEditingId = null;
  EPP_EST_FORM_FIELDS.forEach(id=>document.getElementById(id).value="");
