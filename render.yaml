      <div class="collapsible-body" id="bodyEquidadGenero">
      <div class="desc">N° de hombres y mujeres expuestos, según lo registrado por actividad en la matriz de riesgos. Un mismo proceso agrupa varias actividades que pueden compartir trabajadores entre sí, por lo que el total del proceso corresponde a la dotación más alta registrada entre sus actividades (no a la suma, que sobreestimaría el total al contar personas repetidas en más de una actividad). Puedes editar directamente los valores de Hombres/Mujeres/Otros de cada actividad; el cambio se aplica a todas las líneas de la matriz que compartan ese Proceso y Actividad.</div>
