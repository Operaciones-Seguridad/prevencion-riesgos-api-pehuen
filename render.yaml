<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sistema de Gestión Prevención de Riesgos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // Respaldo por si el CDN principal de html2canvas no responde: intenta una segunda fuente.
  window.addEventListener("DOMContentLoaded", function(){
    if(typeof window.html2canvas === "undefined"){
      var s = document.createElement("script");
      s.src = "https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js";
      document.head.appendChild(s);
    }
  });
</script>
<script>
  // pdf.js necesita indicarle dónde está su "worker"; se usa el mismo CDN.
  try{ if(typeof pdfjsLib !== "undefined") pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
</script>
<script>
  // Respaldo por si el CDN principal de PptxGenJS no responde: intenta una segunda fuente.
  window.addEventListener("DOMContentLoaded", function(){
    if(typeof window.PptxGenJS === "undefined"){
      var s = document.createElement("script");
      s.src = "https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";
      document.head.appendChild(s);
    }
  });
</script>
<style>
  :root{
    --surface-1:#fcfcfb; --page:#f4f4f2; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --muted:#898781; --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--text-primary);}
  /* Estructura general: menú lateral izquierdo (#sidebar) + columna de
     contenido (.app-main), en vez del menú superior horizontal de
     versiones anteriores (v1.63). */
  .app-shell{display:flex;align-items:stretch;min-height:100vh;}
  #sidebar{width:240px;flex:none;background:var(--surface-1);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:25;}
  .sidebar-brand{padding:16px 16px 10px;}
  .sidebar-brand h1{font-size:15.5px;margin:0;line-height:1.25;}
  .sidebar-brand .sub{color:var(--text-secondary);font-size:11px;margin-top:4px;}
  .sidebar-brand .company-badge{margin-top:10px;display:inline-block;}
  #closeSidebarBtn{display:none;}
  nav#mainNav{display:flex;flex-direction:column;gap:2px;padding:8px;flex:1;overflow-y:auto;}
  nav#mainNav button{border:none;background:transparent;padding:12px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;min-height:44px;text-align:left;width:100%;}
  nav#mainNav button.active{background:var(--s1);color:#fff;}
  nav#mainNav button:hover:not(.active){background:var(--grid);}
  .sidebar-footer{border-top:1px solid var(--border);padding:12px 14px;font-size:12px;}
  .sidebar-footer .sesion-nombre{font-weight:700;color:var(--text-primary);font-size:13px;}
  .sidebar-footer .sesion-cargo{color:var(--text-secondary);margin-bottom:8px;}
  .app-main{flex:1;min-width:0;}
  header{background:var(--surface-1);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:10px;}
  header h1{font-size:18px;margin:0;}
  header .sub{color:var(--text-secondary);font-size:12.5px;}
  .company-badge{background:var(--s1);color:#fff;padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;}
  #openSidebarBtn{display:none;border:1px solid var(--border);background:#fff;border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none;}
  #sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:24;}
  @media (max-width: 880px){
    #sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 12px rgba(0,0,0,.15);}
    #sidebar.open{transform:translateX(0);}
    #sidebar.open ~ #sidebarBackdrop, .app-shell.sidebar-open #sidebarBackdrop{display:block;}
    #closeSidebarBtn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer;margin-left:auto;}
    #openSidebarBtn{display:inline-flex;align-items:center;justify-content:center;}
  }
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .card h2{margin:0 0 4px;font-size:16px;}
  .card .desc{color:var(--text-secondary);font-size:13px;margin-bottom:14px;}
  .card-header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;}
  .card-header-row h2{flex:1;}
  .collapse-toggle{background:none;border:1px solid var(--border);border-radius:6px;width:28px;height:28px;font-size:13px;line-height:1;cursor:pointer;color:var(--text-secondary);flex-shrink:0;transition:transform .15s ease;}
  .collapse-toggle:hover{color:var(--text-primary);border-color:var(--text-secondary);}
  .collapsible-body.collapsed{display:none;}
  .grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
  .tile{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .tile .label{color:var(--text-secondary);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .tile .value{font-size:30px;font-weight:700;margin-top:4px;}
  .tile .foot{font-size:12px;color:var(--muted);margin-top:2px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .col{flex:1;min-width:280px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-secondary);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--grid);padding:8px 10px;}
  td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .pill.bajo{background:#e6f7e6;color:#0a6b0a;}
  .pill.medio{background:#fff4de;color:#8a5a00;}
  .pill.alto{background:#ffe6da;color:#a03d1a;}
  .pill.critico{background:#fbdada;color:#8f1f1f;}
  .pill.vigente{background:#e6f7e6;color:#0a6b0a;}
  .pill.proximo{background:#fff4de;color:#8a5a00;}
  .pill.vencido{background:#fbdada;color:#8f1f1f;}
  .pill.pendiente{background:#e8edf7;color:#1c4e91;}
  .pill.proceso{background:#fff4de;color:#8a5a00;}
  .pill.cerrada{background:#e6f7e6;color:#0a6b0a;}
  button.btn{background:var(--s1);color:#fff;border:none;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
  button.btn:hover{filter:brightness(1.08);}
  button.btn.secondary{background:var(--grid);color:var(--text-primary);}
  button.btn.small{padding:7px 12px;font-size:12.5px;min-height:34px;}
  button.btn.danger{background:var(--critical);}
  input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--baseline);border-radius:8px;background:#fff;color:var(--text-primary);width:100%;min-height:44px;}
  textarea{min-height:70px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;margin-top:10px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px;}
  .checklist-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--grid);}
  .checklist-item:last-child{border-bottom:none;}
  .seg{display:flex;gap:4px;}
  .seg button{border:1px solid var(--baseline);background:#fff;padding:8px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;font-weight:600;min-height:36px;}
  .seg button.on-ok{background:var(--good);color:#fff;border-color:var(--good);}
  .seg button.on-fail{background:var(--critical);color:#fff;border-color:var(--critical);}
  .seg button.on-na{background:var(--muted);color:#fff;border-color:var(--muted);}
  .finding{border:1px solid var(--grid);border-radius:8px;padding:12px;margin-top:10px;background:var(--page);}
  .thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px;}
  .toolbar .field{min-width:160px;}
  .bar-chart{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:grid;grid-template-columns:120px 1fr 50px;align-items:center;gap:10px;font-size:13px;}
  .bar-track{background:var(--grid);border-radius:4px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .donut-chart-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .donut-legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;flex:1;min-width:140px;}
  .donut-legend .item{display:flex;align-items:center;gap:8px;}
  .donut-legend .swatch{width:11px;height:11px;border-radius:3px;flex:none;}
  .line-chart-wrap{overflow-x:auto;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--text-secondary);}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;}
  .empty{color:var(--muted);font-size:13.5px;padding:16px 0;text-align:center;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface-1);border-radius:var(--radius);padding:22px;max-width:560px;width:100%;}
  .modal h3{margin-top:0;}
  .close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .badge-count{background:var(--critical);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:4px;}
  .subtle-btn{background:none;border:none;color:var(--s1);font-weight:600;font-size:13px;cursor:pointer;padding:6px 0;}
  .kv{font-size:13px;color:var(--text-secondary);margin-top:2px;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;}
  .print-only{display:none;}
  .vale-print{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0b0b0b;max-width:720px;margin:0 auto;padding:24px;}
  .vale-print h2{margin:0 0 2px;}
  .vale-print .folio-box{float:right;border:2px solid #0b0b0b;border-radius:8px;padding:8px 16px;text-align:center;}
  .vale-print .folio-box .num{font-size:22px;font-weight:800;}
  .vale-print table{width:100%;border-collapse:collapse;margin-top:16px;}
  .vale-print th, .vale-print td{border:1px solid #999;padding:8px 10px;font-size:13.5px;text-align:left;}
  .vale-print .firma-row{display:flex;justify-content:space-between;margin-top:60px;}
  .vale-print .firma-row div{width:45%;text-align:center;border-top:1px solid #333;padding-top:6px;font-size:12.5px;}
  @media print{
    body > *:not(#valePrintArea){display:none !important;}
    #valePrintArea{display:block !important;}
  }
  /* Inicio de sesión (v1.63) */
  .login-overlay{position:fixed;inset:0;background:var(--page);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-overlay.hidden{display:none;}
  .login-box{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:380px;width:100%;}
  .login-box h1{font-size:17px;margin:0 0 2px;}
  .login-box .desc{color:var(--text-secondary);font-size:13px;margin-bottom:16px;}
</style>
</head>
<body>

<!-- INICIO DE SESIÓN (v1.63) -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>Sistema de Gestión Prevención de Riesgos</h1>
    <div class="desc">Selecciona tu usuario e ingresa tu clave de acceso para continuar. El menú que verás depende del perfil asignado a tu usuario.</div>
    <label>Usuario</label>
    <select id="loginUsuarioSel"></select>
    <label>Clave de acceso</label>
    <input type="password" id="loginClave" placeholder="Clave de acceso">
    <div id="loginError" style="display:none;color:#8f1f1f;font-size:12.5px;margin-top:6px;">Clave incorrecta. Inténtalo nuevamente.</div>
    <button class="btn" id="loginBtn" style="margin-top:14px;width:100%;">Ingresar</button>
  </div>
</div>

<div class="app-shell" id="appShell">
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h1>Sistema de Gestión Prevención de Riesgos</h1>
        <button id="closeSidebarBtn" type="button" aria-label="Cerrar menú">✕</button>
      </div>
      <img id="companyLogo" src="" alt="Logo empresa" style="display:none;max-height:40px;max-width:140px;border-radius:6px;margin-top:8px;">
      <div class="company-badge" id="companyBadge">Empresa</div>
    </div>

    <nav id="mainNav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="realizar-inspecciones">Realizar inspecciones</button>
      <button data-view="inspecciones">Inspecciones</button>
      <button data-view="matriz">Matriz de riesgos</button>
      <button data-view="vigilancia">Vigilancia de salud</button>
      <button data-view="programa">Programa de seguridad</button>
      <button data-view="capacitacion">Capacitación</button>
      <button data-view="accidentabilidad">Accidentabilidad</button>
      <button data-view="seguridad">Infractores</button>
      <button data-view="epp">Entrega EPP</button>
      <button data-view="cumplimiento">Cumplimiento legal</button>
      <button data-view="riohys">RIOHyS</button>
      <button data-view="documentos">Control Documental</button>
      <button data-view="cphys">CPHyS</button>
      <button data-view="emergencia">Emergencia</button>
      <button data-view="compromisos">Control de compromisos</button>
      <button data-view="config">Configuración</button>
    </nav>

    <div class="sidebar-footer">
      <div class="sesion-nombre" id="sesionNombre">—</div>
      <div class="sesion-cargo" id="sesionCargo">—</div>
      <button class="btn small secondary" id="cerrarSesionBtn" style="width:100%;">Cerrar sesión</button>
    </div>
  </aside>
  <div id="sidebarBackdrop"></div>

  <div class="app-main">
  <header>
    <button id="openSidebarBtn" type="button" aria-label="Abrir menú">☰</button>
    <div>
      <div class="sub" style="font-size:13px;">Sistema de Gestión Prevención de Riesgos — Inspecciones · Matriz de riesgos · Vigilancia de salud</div>
    </div>
    <div></div>
  </header>

  <main>

  <!-- DASHBOARD -->
  <div class="view active" id="view-dashboard">
    <div class="card" style="text-align:center;background:linear-gradient(135deg,#0b2a4a,#1c4e91);color:#fff;margin-bottom:16px;">
      <div style="font-size:13px;letter-spacing:.05em;text-transform:uppercase;opacity:.85;">Días sin accidentes con tiempo perdido</div>
      <div style="font-size:44px;font-weight:800;line-height:1.1;margin:4px 0;" id="diasSinAccidentesDash">0</div>
      <div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="btn" id="dashboardGerenciaPdfBtn">Descargar PDF para gerencia</button>
        <button class="btn secondary" id="dashboardGerenciaPptBtn" style="background:#fff;color:#1c4e91;">Descargar PPT para gerencia</button>
      </div>
    </div>
    <div class="card toolbar" style="margin-bottom:16px;">
      <div class="field"><label>Ver información de</label><select id="dashboardPeriodoTipo">
        <option value="todo">Todo el histórico</option>
        <option value="mensual">Un mes</option>
        <option value="anual">Un año</option>
      </select></div>
      <div class="field" id="dashboardPeriodoMesWrap" style="display:none;"><label>Mes</label><select id="dashboardPeriodoMes"></select></div>
      <div class="field" id="dashboardPeriodoAnioWrap" style="display:none;"><label>Año</label><select id="dashboardPeriodoAnio"></select></div>
      <div class="desc" style="align-self:flex-end;margin-bottom:6px;">Filtra los indicadores y gráficos de Accidentabilidad, EPP, Infractores y Ranking de velocidad por el período elegido. Los indicadores de estado actual (matriz de riesgos, vigilancia de salud, programa de seguridad, capacitación e inspecciones) siempre muestran la situación vigente completa.</div>
    </div>
    <div class="grid-tiles" id="tiles"></div>
    <div class="row">
      <div class="col card">
        <h2>Riesgos de la matriz por nivel</h2>
        <div class="desc">Distribución de líneas de la matriz IPER según nivel de riesgo calculado.</div>
        <div id="chartRiskLevel" class="bar-chart"></div>
      </div>
      <div class="col card">
        <h2>Cumplimiento vigilancia de salud por protocolo</h2>
        <div class="desc">Estado de vigencia de cada protocolo que aplica según la matriz de riesgos, según su último registro "Cumplido" en la bitácora de cumplimiento.</div>
        <div id="chartHealth" class="bar-chart"></div>
      </div>
    </div>
    <div class="row">
      <div class="col card">
        <h2>Hallazgos de inspección</h2>
        <div class="desc">Estado de las observaciones/acciones correctivas registradas.</div>
        <div id="chartFindings" class="bar-chart"></div>
      </div>
      <div class="col card">
        <h2>Próximos vencimientos</h2>
        <div class="desc">Exámenes y acciones correctivas que vencen en los próximos 30 días.</div>
        <table><tbody id="upcomingTable"></tbody></table>
      </div>
    </div>
    <div class="row">
      <div class="col card">
        <h2>Programa de seguridad — actividades por estado</h2>
        <div class="desc">Cumplimiento del programa anual de seguridad (DS 44).</div>
        <div id="chartPrograma" class="bar-chart"></div>
      </div>
      <div class="col card">
        <h2>Plan de capacitación — asistencia</h2>
        <div class="desc">% de asistencia confirmada entre los trabajadores registrados, por capacitación.</div>
        <div id="chartCapacitacion" class="bar-chart"></div>
      </div>
    </div>
    <div class="row">
      <div class="col card">
        <h2>Accidentabilidad — accidentes e incidentes por tipo</h2>
        <div class="desc">Distribución del histórico completo de accidentes e incidentes, según tipo de evento.</div>
        <div id="chartAccTipoDonut" class="donut-chart-wrap"></div>
      </div>
      <div class="col card">
        <h2>Focos críticos con más accidentes</h2>
        <div class="desc">Accidentes e incidentes asociados a cada foco crítico definido en Configuración.</div>
        <div id="chartFocoCriticoDash" class="bar-chart"></div>
      </div>
    </div>
    <div class="row">
      <div class="col card">
        <h2>Cumplimiento legal DS 44 (FUF)</h2>
        <div class="desc">Nivel de cumplimiento del checklist legal (Ficha Única de Fiscalización) aplicado en Cumplimiento legal.</div>
        <div id="chartFufDonut" class="donut-chart-wrap"></div>
      </div>
      <div class="col card">
        <h2>EPP — elementos más entregados</h2>
        <div class="desc">Top de elementos de protección personal entregados según los vales registrados.</div>
        <div id="chartEppTop" class="bar-chart"></div>
      </div>
    </div>
    <div class="row">
      <div class="col card">
        <h2>Infractores — por motivo</h2>
        <div class="desc">Registros de infracciones/incumplimientos según motivo.</div>
        <div id="chartInfMotivoDash" class="bar-chart"></div>
      </div>
      <div class="col card">
        <h2>Ranking de velocidad — excesos por conductor</h2>
        <div class="desc">Eventos de exceso de velocidad acumulados, por conductor.</div>
        <div id="chartVelConductorDash" class="bar-chart"></div>
      </div>
    </div>
    <div class="row">
      <div class="col card" style="flex:1 1 100%;">
        <h2>Tendencia mensual de accidentes con tiempo perdido (últimos 12 meses)</h2>
        <div class="desc">Cantidad de accidentes con tiempo perdido (CTP) registrados mes a mes.</div>
        <div id="chartAccTendencia" class="line-chart-wrap"></div>
      </div>
    </div>
  </div>

  <!-- INSPECCIONES -->
  <!-- REALIZAR INSPECCIONES: pensada como pestaña propia y simple, para que
       los supervisores en terreno (tablet) solo necesiten esta pantalla
       para crear/editar una inspección u observación, sin tener que
       navegar por el resto del módulo de Inspecciones (formatos, historial,
       informes, estadística), pensado más bien para el encargado de
       prevención de riesgos. -->
  <div class="view" id="view-realizar-inspecciones">
    <div class="card">
      <h2 id="insFormTitle">Nueva inspección / observación en terreno</h2>
      <div class="desc">Pensado para completarse desde una tablet en el mismo lugar de la inspección.</div>
      <div class="form-grid">
        <div>
          <label>Tipo de registro</label>
          <select id="insTipoRegistro">
            <option value="inspeccion">Inspección</option>
            <option value="observacion">Observación</option>
          </select>
        </div>
        <div>
          <label>Formato / checklist</label>
          <select id="insTipo"></select>
        </div>
        <div>
          <label>Área</label>
          <select id="insArea"></select>
        </div>
        <div>
          <label>Inspector</label>
          <input id="insInspector" placeholder="Nombre del inspector">
        </div>
        <div>
          <label>Fecha</label>
          <input id="insFecha" type="date">
        </div>
      </div>
      <label>Descripción / motivo de la inspección u observación</label>
      <textarea id="insDescripcion" placeholder="Ej: Inspección programada mensual de terreno / Observación de conducta insegura reportada por..."></textarea>

      <label>Checklist</label>
      <div id="insChecklist"></div>

      <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;">
        <label style="margin:0;">Observaciones / hallazgos</label>
        <button class="btn small secondary" id="addFindingBtn">+ Agregar hallazgo</button>
      </div>
      <div id="findingsWrap"></div>

      <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;">
        <label style="margin:0;">Personas y/o vehículos inspeccionados</label>
        <button class="btn small secondary" id="addInspeccionadoBtn">+ Agregar</button>
      </div>
      <div class="desc" style="margin-bottom:6px;">Nombre, RUT o patente de vehículo, brigada y área de cada persona o vehículo incluido en esta inspección/observación.</div>
      <div id="inspeccionadosWrap"></div>

      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" id="saveInspeccionBtn">Guardar inspección</button>
        <button class="btn secondary" id="cancelEditInsBtn" style="display:none;">Cancelar edición</button>
      </div>
    </div>

    <div class="card" id="cardMisActividadesMensuales">
      <h2>Mis actividades mensuales</h2>
      <div class="desc">Resumen mensual de las actividades del Programa de seguridad (incluida la Capacitación) asignadas como responsable al usuario que inició sesión, indicando el tipo de cada actividad a desarrollar y el nivel de cumplimiento según su realización.</div>
      <table>
        <thead><tr><th>Mes</th><th>Actividades a desarrollar (tipo)</th><th>Programadas</th><th>Realizadas</th><th>% Cumplimiento</th></tr></thead>
        <tbody id="misActividadesMensualesTable"></tbody>
      </table>
    </div>

    <div class="card" id="cardMisHallazgos">
      <h2>Mis hallazgos asignados</h2>
      <div class="desc">Hallazgos de inspecciones y observaciones cuyo responsable coincide con el usuario que inició sesión, para que pueda cerrar sus propias acciones directamente desde aquí.</div>
      <label>Seleccionar hallazgo</label>
      <select id="misHallazgosSelect"></select>
      <div id="misHallazgosWrap"></div>
    </div>
  </div>

  <div class="view" id="view-inspecciones">
    <div class="card">
      <h2 id="fmtFormTitle">Formatos de inspección / observación</h2>
      <div class="desc">Crea o edita formatos (checklist) para usar en el formulario de arriba. Cada formato puede ser exclusivo para Inspección, para Observación, o servir para ambos.</div>
      <div class="form-grid">
        <div><label>Nombre del formato</label><input id="fmtNombre" placeholder="Ej: Inspección de extintores"></div>
        <div>
          <label>Se usa para</label>
          <select id="fmtCategoria">
            <option value="ambos">Inspección y Observación</option>
            <option value="inspeccion">Solo Inspección</option>
            <option value="observacion">Solo Observación</option>
          </select>
        </div>
      </div>
      <label>Ítems del checklist</label>
      <div class="desc">Para cada ítem, elige si se responde con el cuadro <strong>Cumple / No cumple / N/A</strong>, o si en su lugar se debe dejar un <strong>cuadro de texto para escribir en forma manual</strong> (por ejemplo, para anotar una observación, una medición o un dato libre).</div>
      <div class="toolbar">
        <div class="field" style="flex:3;min-width:220px;"><label>Texto del ítem</label><input id="fmtItemTexto" placeholder="Ej: Extintor con carga vigente"></div>
        <div class="field">
          <label>Tipo de respuesta</label>
          <select id="fmtItemTipo">
            <option value="check">Cumple / No cumple / N/A</option>
            <option value="texto">Cuadro de texto (escritura manual)</option>
          </select>
        </div>
        <div><button class="btn small secondary" id="addFmtItemBtn" style="margin-top:20px;">+ Agregar ítem</button></div>
      </div>
      <table>
        <thead><tr><th>#</th><th>Ítem</th><th>Tipo de respuesta</th><th></th></tr></thead>
        <tbody id="fmtItemsWrap"></tbody>
      </table>
      <div class="toolbar" style="margin-top:14px;">
        <button class="btn small" id="addFormatoBtn">+ Crear formato</button>
        <button class="btn small secondary" id="cancelEditFormatoBtn" style="display:none;">Cancelar edición</button>
      </div>

      <div class="desc" style="margin-top:18px;"><strong>Importar ítems desde Excel.</strong> El archivo debe tener una columna "Ítem" con el texto de cada ítem, y opcionalmente una columna "Tipo" ("Cumple/No cumple/N/A" o "Texto" / "Manual"); si la columna Tipo no viene o no se reconoce, el ítem se agrega como Cumple/No cumple/N/A. Los ítems importados se agregan a la tabla de arriba (no reemplazan los que ya estén agregados), para revisarlos antes de crear o guardar el formato. Si no tienes un archivo armado todavía, descarga el formato de ejemplo, complétalo con tus ítems y luego súbelo aquí.</div>
      <div class="toolbar">
        <div><button class="btn small secondary" id="downloadFmtPlantillaBtn">⬇ Descargar formato Excel de ejemplo</button></div>
        <div class="field"><label>Archivo Excel (.xlsx)</label><input type="file" id="importFmtFile" accept=".xlsx,.xls"></div>
        <div><button class="btn small secondary" id="importFmtBtn" style="margin-top:20px;">Importar ítems</button></div>
      </div>

      <h2 style="margin-top:22px;">Formatos ya creados</h2>
      <table>
        <thead><tr><th>Nombre</th><th>Se usa para</th><th>Ítems</th><th>Acciones</th></tr></thead>
        <tbody id="formatosTable"></tbody>
      </table>
    </div>

    <div class="card">
      <h2 id="astFormTitle">Confección de AST (Análisis de Seguridad del Trabajo)</h2>
      <div class="desc">Antes de iniciar una tarea, identifica el área y la actividad a realizar y trae automáticamente los riesgos y medidas de control ya registrados en la Matriz de riesgos para esa combinación. Luego puedes eliminar los que no apliquen a esta tarea puntual y agregar otros riesgos y medidas en forma manual.</div>
      <div class="form-grid">
        <div><label>Fecha</label><input id="astFecha" type="date"></div>
        <div><label>Área</label><select id="astArea"></select></div>
        <div>
          <label>Actividad / tarea a realizar</label>
          <input id="astActividad" list="dlActividadesAst" placeholder="Ej: Trepado de postes">
          <datalist id="dlActividadesAst"></datalist>
        </div>
        <div><label>Responsable de la AST</label><input id="astResponsable" placeholder="Nombre / cargo"></div>
      </div>
      <div style="margin-top:8px;">
        <button class="btn small secondary" id="astCargarMatrizBtn">Cargar riesgos desde la Matriz de riesgos</button>
      </div>

      <div style="margin-top:18px;">
        <label style="margin:0;">Riesgos identificados y medidas de control</label>
      </div>
      <div class="toolbar">
        <div class="field" style="flex:2;min-width:220px;"><label>Peligro / riesgo</label><input id="astRiesgoInput" placeholder="Ej: Caída de altura"></div>
        <div class="field" style="flex:2;min-width:220px;"><label>Medida de control</label><input id="astMedidaInput" placeholder="Ej: Uso de arnés de seguridad y línea de vida"></div>
        <div><button class="btn small secondary" id="addAstRiesgoBtn" style="margin-top:20px;">+ Agregar riesgo</button></div>
      </div>
      <table>
        <thead><tr><th>#</th><th>Peligro / riesgo</th><th>Medida de control</th><th>Origen</th><th></th></tr></thead>
        <tbody id="astRiesgosWrap"></tbody>
      </table>

      <div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;">
        <label style="margin:0;">Trabajadores participantes (firma de conformidad)</label>
      </div>
      <div class="toolbar">
        <div class="field"><label>Trabajador</label><select id="astTrabajadorSel"></select></div>
        <div><button class="btn small secondary" id="addAstTrabBtn" style="margin-top:20px;">+ Agregar</button></div>
      </div>
      <div id="astTrabajadoresWrap"></div>

      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" id="saveAstBtn">Guardar AST</button>
        <button class="btn secondary" id="astDescargarPdfBtn">Descargar PDF</button>
        <button class="btn secondary" id="cancelEditAstBtn" style="display:none;">Cancelar edición</button>
      </div>
    </div>

    <div class="card">
      <h2>AST registradas</h2>
      <div class="toolbar">
        <div class="field"><label>Filtrar por área</label><select id="filterAstArea"><option value="">Todas</option></select></div>
      </div>
      <table>
        <thead><tr><th>Fecha</th><th>Área</th><th>Actividad</th><th>Responsable</th><th>N° de riesgos</th><th>Participantes</th><th></th></tr></thead>
        <tbody id="astTable"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Historial de inspecciones y observaciones</h2>
      <div class="toolbar">
        <div class="field"><label>Filtrar por área</label><select id="filterInsArea"><option value="">Todas</option></select></div>
        <div class="field"><label>Filtrar por tipo</label><select id="filterInsTipoRegistro"><option value="">Todos</option><option value="inspeccion">Inspección</option><option value="observacion">Observación</option></select></div>
        <div class="field"><label>Filtrar por estado</label><select id="filterInsEstado"><option value="">Todos</option><option value="abierta">Abierta</option><option value="cerrada">Cerrada</option></select></div>
        <div class="field"><label>Filtrar por mes</label>
          <select id="filterInsMes">
            <option value="">Todos</option>
            <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option><option value="04">Abril</option>
            <option value="05">Mayo</option><option value="06">Junio</option><option value="07">Julio</option><option value="08">Agosto</option>
            <option value="09">Septiembre</option><option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
          </select>
        </div>
      </div>
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Formato</th><th>Área</th><th>Inspector</th><th>Hallazgos</th><th>Acciones abiertas</th><th>Estado</th><th></th></tr></thead>
        <tbody id="inspeccionesTable"></tbody>
      </table>
    </div>


    <div class="card">
      <h2>Descargar resúmenes en PDF</h2>
      <div class="desc">Genera un resumen en PDF de todas las inspecciones/observaciones de un mes o un año, con estadísticas y top 10 de hallazgos repetitivos del período.</div>
      <div class="toolbar">
        <div class="field"><label>Período</label>
          <select id="resPeriodo">
            <option value="mensual">Mensual</option>
            <option value="anual">Anual</option>
          </select>
        </div>
        <div class="field" id="resMesWrap"><label>Mes</label>
          <select id="resMes">
            <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option><option value="3">Abril</option>
            <option value="4">Mayo</option><option value="5">Junio</option><option value="6">Julio</option><option value="7">Agosto</option>
            <option value="8">Septiembre</option><option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
          </select>
        </div>
        <div class="field"><label>Año</label><input id="resAnio" type="number" style="width:110px;"></div>
        <div><button class="btn small" id="downloadResumenPdfBtn" style="margin-top:20px;">Descargar resumen PDF</button></div>
      </div>
    </div>

    <div class="card">
      <h2>Top 10 hallazgos repetitivos</h2>
      <div class="desc">Descripciones de hallazgos que más se repiten entre todas las inspecciones y observaciones registradas.</div>
      <table>
        <thead><tr><th>#</th><th>Hallazgo</th><th>N° de veces registrado</th></tr></thead>
        <tbody id="top10HallazgosTable"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Estadística mensual y anual por clasificación</h2>
      <div class="desc">N° de inspecciones y observaciones registradas por mes (año en curso) y resumen anual acumulado.</div>
      <div id="chartInsMensualWrap"></div>
      <table style="margin-top:14px;">
        <thead><tr><th>Año</th><th>Inspecciones</th><th>Observaciones</th><th>Hallazgos totales</th><th>Hallazgos alto/crítico</th></tr></thead>
        <tbody id="statsAnualTable"></tbody>
      </table>
    </div>
  </div>

  <!-- MATRIZ DE RIESGOS -->
  <div class="view" id="view-matriz">
    <div class="card">
      <h2 id="matrizFormTitle">Nueva línea de matriz de riesgos (IPER)</h2>
      <div class="form-grid">
        <div>
          <label>Área</label>
          <select id="mArea"></select>
        </div>
        <div>
          <label>Proceso</label>
          <input id="mProceso" list="dlProcesos" placeholder="Ej: OBRAS Y OPERACIONES">
          <datalist id="dlProcesos"></datalist>
        </div>
        <div>
          <label>Actividad</label>
          <input id="mActividad" list="dlActividades" placeholder="Ej: Trepado de postes">
          <datalist id="dlActividades"></datalist>
        </div>
        <div>
          <label>Categoría</label>
          <select id="mCategoria"></select>
        </div>
        <div>
          <label>Peligro</label>
          <input id="mPeligro" list="dlPeligros" placeholder="Ej: Manipulación manual de carga">
          <datalist id="dlPeligros"></datalist>
        </div>
        <div>
          <label>N° hombres expuestos</label>
          <input id="mHombres" type="number" min="0" step="1" placeholder="0">
        </div>
        <div>
          <label>N° mujeres expuestas</label>
          <input id="mMujeres" type="number" min="0" step="1" placeholder="0">
        </div>
        <div>
          <label>N° otros expuestos</label>
          <input id="mOtros" type="number" min="0" step="1" placeholder="0">
        </div>
        <div>
          <label>Riesgo asociado</label>
          <input id="mRiesgo" list="dlPeligros" placeholder="Ej: Lesión lumbar">
        </div>
        <div>
          <label>Probabilidad (1-5)</label>
          <select id="mProb"><option value="1">1 - Muy improbable</option><option value="2">2 - Improbable</option><option value="3" selected>3 - Posible</option><option value="4">4 - Probable</option><option value="5">5 - Muy probable</option></select>
        </div>
        <div>
          <label>Consecuencia (1-5)</label>
          <select id="mCons"><option value="1">1 - Leve</option><option value="2">2 - Menor</option><option value="3" selected>3 - Moderada</option><option value="4">4 - Mayor</option><option value="5">5 - Catastrófica</option></select>
        </div>
      </div>
      <label>Efecto / descripción del riesgo (opcional)</label>
      <textarea id="mEfecto" placeholder="Descripción del evento más probable y su efecto sobre la persona expuesta..."></textarea>

      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:14px;">
        <input type="checkbox" id="mSensible" style="width:auto;min-height:auto;"> ¿Este riesgo expone a trabajadores/as especialmente sensibles?
      </label>
      <div class="desc">Trabajadores/as especialmente sensibles: mujeres embarazadas o en período de lactancia, adolescentes (menores de 18 años), personas en situación de discapacidad, personas migrantes, adultos mayores o quienes realizan trabajo nocturno, entre otros grupos que requieren medidas de protección reforzadas o adaptadas (DS N°44).</div>
      <div id="mSensibleGruposWrap" style="display:none;margin-top:8px;">
        <label>Grupo(s) especialmente sensible(s) que aplica(n)</label>
        <div class="toolbar" style="gap:14px;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;min-width:auto;"><input type="checkbox" class="mSensibleGrupo" value="Embarazada o en período de lactancia" style="width:auto;min-height:auto;"> Embarazada o en período de lactancia</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;min-width:auto;"><input type="checkbox" class="mSensibleGrupo" value="Adolescente (menor de 18 años)" style="width:auto;min-height:auto;"> Adolescente (menor de 18 años)</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;min-width:auto;"><input type="checkbox" class="mSensibleGrupo" value="Persona en situación de discapacidad" style="width:auto;min-height:auto;"> Persona en situación de discapacidad</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;min-width:auto;"><input type="checkbox" class="mSensibleGrupo" value="Persona migrante" style="width:auto;min-height:auto;"> Persona migrante</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;min-width:auto;"><input type="checkbox" class="mSensibleGrupo" value="Adulto mayor" style="width:auto;min-height:auto;"> Adulto mayor</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;min-width:auto;"><input type="checkbox" class="mSensibleGrupo" value="Trabajo nocturno / turno de noche" style="width:auto;min-height:auto;"> Trabajo nocturno / turno de noche</label>
        </div>
        <div class="field" style="margin-top:8px;max-width:360px;">
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;"><input type="checkbox" id="mSensibleOtroChk" style="width:auto;min-height:auto;"> Otro:</label>
          <input id="mSensibleOtroTexto" placeholder="Especifique otro grupo" style="margin-top:4px;">
        </div>
      </div>

      <label style="margin-top:16px;">Medidas de control (jerarquizadas según DS N°44)</label>
      <div class="desc">El DS 44 exige aplicar las medidas de control en este orden de prioridad: <strong>A) Eliminación → B) Sustitución → C) Control de ingeniería → D) Control administrativo → E) Elementos de Protección Personal (EPP)</strong>. El EPP debe ser la última barrera, no la primera ni la única.</div>
      <div class="toolbar">
        <div class="field"><label>Jerarquía</label>
          <select id="mcJerarquia">
            <option value="A">A · Eliminación</option>
            <option value="B">B · Sustitución</option>
            <option value="C">C · Control de ingeniería</option>
            <option value="D" selected>D · Control administrativo</option>
            <option value="E">E · Elementos de protección personal (EPP)</option>
          </select>
        </div>
        <div class="field" style="flex:2;min-width:240px;"><label>Medida de control</label><input id="mcTexto" placeholder="Ej: Instalación de barandas perimetrales"></div>
        <div class="field"><label>Responsable</label><input id="mcResp" placeholder="Nombre / cargo"></div>
        <div class="field"><label>Fecha de implementación</label><input id="mcFecha" type="date"></div>
        <div><button class="btn small secondary" id="addControlBtn" style="margin-top:20px;">+ Agregar medida</button></div>
      </div>
      <div id="controlesWrap"></div>
      <div id="soloEppWarning" style="display:none;margin-top:10px;"></div>

      <div style="margin-top:14px;">
        <span>Nivel de riesgo estimado: </span><span id="mNivelPreview" class="pill bajo">bajo</span>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" id="saveMatrizBtn">Agregar a la matriz</button>
        <button class="btn secondary" id="cancelEditMatrizBtn" style="display:none;">Cancelar edición</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header-row" id="hdrLevantamiento"><h2>Levantamiento de riesgos (IPER) por área de trabajo</h2><button class="collapse-toggle" id="toggleLevantamiento" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyLevantamiento">
      <div class="desc">Formato de levantamiento de procesos y riesgos, según la planilla "Levantamiento de procesos IPER por área de trabajo": se identifican los procesos, tareas y actividades de un área, y se marca a qué riesgos, protocolos de salud y riesgos de higiene está expuesta cada actividad. Al guardar, puede generar automáticamente las líneas correspondientes en la <strong>Matriz de riesgos</strong> de arriba, quedando asociadas a este levantamiento.</div>
      <div class="form-grid">
        <div><label>Realizado por</label><input id="lvRealizadoPor" placeholder="Nombre de quien levanta la información"></div>
        <div><label>Área</label><select id="lvArea"></select></div>
        <div><label>Fecha</label><input id="lvFecha" type="date"></div>
      </div>
      <h2 style="margin-top:18px;font-size:14px;">Actividades del área</h2>
      <div class="toolbar">
        <div class="field"><label>Proceso</label><input id="lvProceso" list="dlProcesos" placeholder="Ej: OBRAS Y OPERACIONES"></div>
        <div class="field"><label>Tarea</label><input id="lvTarea" placeholder="Ej: Trepado de postes"></div>
        <div class="field"><label>Actividad</label><input id="lvActividad" list="dlActividades" placeholder="Ej: Instalación de conductor"></div>
      </div>
      <label style="margin-top:10px;">Exposición a riesgos (marque los que correspondan)</label>
      <div class="toolbar" style="flex-wrap:wrap;gap:6px 16px;" id="lvRiesgosCheckWrap"></div>
      <label style="margin-top:10px;">Exposición a protocolo de salud</label>
      <div class="toolbar" style="flex-wrap:wrap;gap:6px 16px;" id="lvProtocolosCheckWrap"></div>
      <label style="margin-top:10px;">Expuesto a riesgos de higiene</label>
      <div class="toolbar" style="flex-wrap:wrap;gap:6px 16px;" id="lvHigieneCheckWrap"></div>
      <div style="margin-top:10px;"><button class="btn small secondary" id="addLvFilaBtn">+ Agregar actividad a este levantamiento</button></div>

      <div id="lvFilasWrap" style="margin-top:14px;"></div>

      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
