/* =========================================================
   EMERGENCIA — GESTIÓN DEL RIESGO DE DESASTRES (GRD) (v1.61)
   Basado en la metodología de Mutual de Seguridad (Ficha de Apoyo
   Preventivo "Plan de Gestión del Riesgo de Desastres") y en la Guía
   para la Implementación del Plan para la Reducción del Riesgo de
   Desastres (PRRD) de la Superintendencia de Seguridad Social, con
   base legal en el Código del Trabajo (art. 184, 184 bis) y el DS 44.
   3 etapas:
     Etapa 1 — Diagnóstico (metodología AIDEP: Análisis histórico,
       Investigación de amenazas, Definición de prioridades,
       Elaboración de mapas, Planificación).
     Etapa 2 — Planificación de la respuesta ante el riesgo residual
       (metodología ACCEDER: Alerta/alarma, Comunicación,
       Coordinación, Evaluación preliminar, Decisiones, Evaluación
       secundaria, Readecuación), más el Comité de Gestión del Riesgo
       de Desastres (CGRD).
     Etapa 3 — Implementación, ejercitación (simulacros/simulaciones)
       y mejora continua.
   Stores: "grdAmenazas", "grdComite", "grdPlanRespuesta",
   "grdSimulacros", "grdPlanAccion".
   ========================================================= */
const GRD_AMENAZA_LABEL = { sismo:"Sismo", corteAgua:"Corte de agua potable", incendio:"Incendio estructural", corteElectrico:"Corte de energía eléctrica", asaltoRobo:"Asalto / robo", otra:"Otra amenaza" };
const GRD_AMENAZAS_OBLIGATORIAS = ["sismo","corteAgua","incendio","corteElectrico","asaltoRobo"];
const GRD_PRIORIDAD_LABEL = { alta:"Alta", media:"Media", baja:"Baja" };
const GRD_ETAPA_LABEL = { diagnostico:"Etapa 1 — Diagnóstico", respuesta:"Etapa 2 — Respuesta", implementacion:"Etapa 3 — Implementación" };
const GRD_ACCION_ESTADO_LABEL = { pendiente:"Pendiente", realizada:"Realizada", atrasada:"Atrasada" };
const GRD_ACCEDER_CAMPOS = ["alertaAlarma","comunicacion","coordinacion","evaluacionPreliminar","decisiones","evaluacionSecundaria","readecuacion"];
function grdAmenazaNombre(a){ return a.amenaza==="otra" ? (a.amenazaOtro||"Otra amenaza") : (GRD_AMENAZA_LABEL[a.amenaza]||a.amenaza); }
function grdAmenazaDiagnosticoCompleto(a){
  return !!((a.analisisHistorico||"").trim() && (a.vulnerabilidad||"").trim() && (a.recursosBasicos||"").trim() && (a.medidasControl||"").trim());
}
function grdPlanRespuestaPasosCompletos(p){
  return GRD_ACCEDER_CAMPOS.filter(k=>(p[k]||"").trim()).length;
}
/* % de cumplimiento por etapa. Fórmula documentada en la especificación:
   Etapa 1 = % de amenazas diagnosticadas (con los 4 campos completos)
   sobre el total de amenazas registradas. Etapa 2 = 70% según el % de
   amenazas "identificadas" que ya tienen un plan de respuesta ACCEDER
   con sus 7 pasos completos, + 30% si el Comité GRD tiene al menos un
   miembro vigente. Etapa 3 = 100% si hubo un simulacro/simulación en
   los últimos 6 meses, 50% si fue hace 6 a 12 meses, 20% si fue hace
   más de 12 meses, 0% si nunca se ha registrado uno. */
function grdEtapa1Pct(){
  const amenazas = CACHE.grdAmenazas||[];
  if(!amenazas.length) return 0;
  return Math.round(amenazas.filter(grdAmenazaDiagnosticoCompleto).length / amenazas.length * 100);
}
function grdComiteVigente(){
  return (CACHE.grdComite||[]).some(m=>!m.vigenciaHasta || daysUntil(m.vigenciaHasta)>=0);
}
function grdEtapa2Pct(){
  const presentes = (CACHE.grdAmenazas||[]).filter(a=>a.presente!==false);
  const comiteOk = grdComiteVigente();
  if(!presentes.length) return comiteOk ? 100 : 0;
  const conPlan = presentes.filter(a=>{
    const p = (CACHE.grdPlanRespuesta||[]).find(pr=>pr.amenazaId===a.id);
    return p && grdPlanRespuestaPasosCompletos(p)===GRD_ACCEDER_CAMPOS.length;
  }).length;
  const pctPlanes = Math.round(conPlan/presentes.length*100);
  return Math.round(pctPlanes*0.7 + (comiteOk?100:0)*0.3);
}
function grdUltimoSimulacro(){
  const rows = (CACHE.grdSimulacros||[]).slice().sort((a,b)=> new Date(b.fecha||0)-new Date(a.fecha||0));
  return rows[0]||null;
}
function grdEtapa3Pct(){
  const ultimo = grdUltimoSimulacro();
  if(!ultimo || !ultimo.fecha) return 0;
  const diasDesde = Math.round((new Date(new Date().toDateString()) - new Date(ultimo.fecha))/86400000);
  if(diasDesde<=180) return 100;
  if(diasDesde<=365) return 50;
  return 20;
}
function grdCumplimientoGlobal(){
  return Math.round(grdEtapa1Pct()*0.4 + grdEtapa2Pct()*0.35 + grdEtapa3Pct()*0.25);
}
function grdEtapaEstadoLabel(pct){ return pct>=100 ? "Completa" : (pct>0 ? "En desarrollo" : "Pendiente"); }
function grdEtapaSemaforo(pct){ return pct>=80 ? "bajo" : (pct>=40 ? "medio" : "alto"); }

function renderGrdResumen(){
  const e1 = grdEtapa1Pct(), e2 = grdEtapa2Pct(), e3 = grdEtapa3Pct(), global = grdCumplimientoGlobal();
  const ultimo = grdUltimoSimulacro();
  document.getElementById("grdResumenTiles").innerHTML = [
    tile("% de cumplimiento GRD (global)", global+"%", "Etapa 1: 40% · Etapa 2: 35% · Etapa 3: 25%", grdEtapaSemaforo(global)),
    tile("Etapa 1 — Diagnóstico", e1+"%", grdEtapaEstadoLabel(e1), grdEtapaSemaforo(e1)),
    tile("Etapa 2 — Respuesta", e2+"%", grdEtapaEstadoLabel(e2), grdEtapaSemaforo(e2)),
    tile("Etapa 3 — Implementación", e3+"%", grdEtapaEstadoLabel(e3), grdEtapaSemaforo(e3)),
    tile("Comité GRD constituido", grdComiteVigente()?"Sí":"No", (CACHE.grdComite||[]).length+" miembro(s) registrado(s)", grdComiteVigente()?"bajo":"alto"),
    tile("Último simulacro/simulación", ultimo?fmtDate(ultimo.fecha):"Sin registrar", ultimo?(ultimo.tipo==="simulacro"?"Simulacro":"Simulación"):"Registra el primer ejercicio en la Etapa 3"),
  ].join("");
}

