/* Puebla un <select> de "Responsable de..." de Control Documental con los
   nombres registrados en Configuración → Responsables de cierre de hallazgos
   (la misma nómina reutilizada en toda la app para evitar catálogos
   duplicados), como lista desplegable en vez de texto libre. Si el valor
   actual (por ejemplo, de un documento antiguo) no está en la nómina, se
   agrega como opción adicional para no perder el dato ya guardado. */
function fillDocResponsableSelect(sel, valorActual){
  const nombres = (CACHE.correosResponsables||[]).map(c=>c.nombre);
  const opciones = ['<option value="">Seleccione...</option>'];
  nombres.forEach(n=> opciones.push(`<option value="${n}" ${valorActual===n?"selected":""}>${n}</option>`));
  if(valorActual && !nombres.includes(valorActual)){
    opciones.push(`<option value="${valorActual}" selected>${valorActual} (no está en la nómina)</option>`);
  }
  sel.innerHTML = opciones.join("");
}
function resetDocumentoForm(prefill){
