    contenido: `1. Compromiso de la Dirección
ANGOLEC SPA, dedicada al montaje y mantención de líneas eléctricas, declara su compromiso irrestricto con la protección de la vida y la salud física y mental de todos los trabajadores y trabajadoras, contratistas y visitas, por sobre cualquier otra consideración productiva o económica. La Gerencia General asume el liderazgo visible de esta política y provee los recursos humanos, técnicos y financieros necesarios para su cumplimiento.

2. Alcance
Esta política aplica a todos los procesos, áreas y trabajadores de ANGOLEC SPA (Obra/Terreno, Bodega, Oficina técnica, Taller mecánico y Limpieza y Aseo), así como a los contratistas y subcontratistas que presten servicios para la empresa.

3. Marco normativo
Esta política se enmarca en la Ley N°16.744 sobre accidentes del trabajo y enfermedades profesionales, el Decreto Supremo N°44/2024 del Ministerio del Trabajo y Previsión Social sobre gestión preventiva de riesgos laborales, el Decreto Supremo N°594 sobre condiciones sanitarias y ambientales básicas en los lugares de trabajo, y los convenios de la OIT ratificados por Chile en materia de seguridad y salud en el trabajo (C155, C161, C187 y C190).

4. Objetivos
- Identificar, evaluar y controlar sistemáticamente los riesgos laborales de las actividades de montaje y mantención de líneas eléctricas, con especial atención al riesgo eléctrico y al trabajo en altura.
- Prevenir accidentes del trabajo, enfermedades profesionales y todo daño a la salud de los trabajadores.
- Cumplir y superar los requisitos legales y reglamentarios aplicables.
- Promover la mejora continua del sistema de gestión de seguridad y salud en el trabajo (SGSST).
