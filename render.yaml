/* Importación masiva de trabajadores desde Excel (columnas Nombre, RUT, Cargo y opcionalmente Área) */
on(document.getElementById("importTrabBtn"), "click", async () => {
  const fileInput = document.getElementById("importTrabFile");
  const file = fileInput.files[0];
  if(!file){ alert("Selecciona un archivo Excel (.xlsx) para importar."); return; }
  if(typeof XLSX === "undefined"){ alert("No se pudo cargar el lector de Excel (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, {type:"array"});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
  if(!rows.length){ alert("El archivo no tiene filas de datos."); return; }
  const norm = s => String(s||"").trim().toLowerCase();
  let importados = 0, omitidos = 0, sinArea = 0;
  for(const row of rows){
    const keys = Object.keys(row);
    const kNombre = keys.find(k=>["nombre","nombre completo","trabajador"].includes(norm(k)));
    const kRut = keys.find(k=>norm(k)==="rut");
    const kCargo = keys.find(k=>norm(k)==="cargo");
    const kArea = keys.find(k=>norm(k)==="área"||norm(k)==="area");
    const nombre = kNombre? String(row[kNombre]).trim() : "";
    if(!nombre){ omitidos++; continue; }
    const rut = kRut? String(row[kRut]).trim() : "";
    const cargo = kCargo? String(row[kCargo]).trim() : "";
    let areaId = "";
    if(kArea){
      const areaNombre = String(row[kArea]).trim();
      const match = CACHE.areas.find(a=>norm(a.nombre)===norm(areaNombre));
      if(match) areaId = match.id;
    }
    if(!areaId) sinArea++;
    await put("trabajadores", {id:uid(), nombre, rut, cargo, areaId});
    importados++;
  }
  await loadCache();
  fileInput.value = "";
  renderCommonSelects(); renderTrabajadoresTable();
  alert(`Importación completa: ${importados} trabajador(es) agregado(s)${omitidos? `, ${omitidos} fila(s) omitida(s) por no tener Nombre`:""}${sinArea? `, ${sinArea} sin área asignada (por no traer columna Área o no coincidir con ninguna área ya creada)`:""}.`);
});

/* Carga general de trabajadores pegando texto (uno por línea, Nombre,
   RUT, Cargo, Área separados por coma o tabulador — mismo formato que la
   importación desde Excel; RUT, Cargo y Área son opcionales). */
on(document.getElementById("bulkTrabBtn"), "click", async () => {
  const texto = document.getElementById("bulkTrabTexto").value;
  const norm = s => String(s||"").trim().toLowerCase();
  const lineas = texto.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(!lineas.length){ alert("Pegue al menos una línea con el nombre de un trabajador."); return; }
  let importados = 0, sinArea = 0;
  for(const linea of lineas){
    const partes = linea.split(/\t|,/).map(p=>p.trim()).filter(p=>p.length || p==="");
    const nombre = (partes[0]||"").trim();
    if(!nombre) continue;
    const rut = (partes[1]||"").trim();
    const cargo = (partes[2]||"").trim();
    const areaTexto = (partes[3]||"").trim();
    let areaId = "";
    if(areaTexto){
      const match = CACHE.areas.find(a=>norm(a.nombre)===norm(areaTexto));
      if(match) areaId = match.id;
    }
    if(!areaId) sinArea++;
    await put("trabajadores", {id:uid(), nombre, rut, cargo, areaId});
    importados++;
  }
  await loadCache();
  document.getElementById("bulkTrabTexto").value = "";
  renderCommonSelects(); renderTrabajadoresTable();
  alert(`Carga completa: ${importados} trabajador(es) agregado(s)${sinArea? `, ${sinArea} sin área asignada`:""}.`);
});

/* Eliminar todos los trabajadores de una sola vez (por ejemplo, antes de
   volver a cargar la nómina completa desde cero). No borra el historial
   de capacitaciones/IAP ya registrado, solo la lista de trabajadores. */
on(document.getElementById("deleteAllTrabBtn"), "click", async () => {
  if(!CACHE.trabajadores.length){ alert("No hay trabajadores registrados."); return; }
  if(!confirm(`¿Eliminar TODOS los ${CACHE.trabajadores.length} trabajadores registrados? Esta acción no se puede deshacer. El historial ya registrado (capacitaciones, difusión de IAP, etc.) no se borra, pero esos trabajadores dejarán de aparecer en los listados.`)) return;
  for(const t of CACHE.trabajadores.slice()) await deleteRecord("trabajadores", t.id);
  await loadCache();
  renderCommonSelects(); renderTrabajadoresTable();
  alert("Se eliminaron todos los trabajadores.");
});

/* =========================================================
   IMPORTACIÓN DE LA MATRIZ DE RIESGOS DESDE EXCEL
   Reconoce dos formatos:
   1) "Plano": una fila de encabezados con columnas tipo
      Área/Proceso/Actividad/Categoría/Peligro/... (el mismo
      formato que genera "Descargar Excel" en Matriz de riesgos).
   2) "Corporativo IPER": encabezado en dos filas (AREA /
      PROTOCOLO / PROCESO / ACTIVIDAD / CATEGORIA / PELIGRO /
      EFECTO / NUMERO DE TRABAJADORES / ... / Magnitud del
      Riesgo puro y residual / MEDIDAS DE CONTROL / ...), igual
      al usado para la matriz real de ANGOLEC SPA. Las columnas
      PROCESO y ACTIVIDAD suelen venir con celdas combinadas
      verticalmente en este formato; se "rellenan hacia abajo".
   ========================================================= */
function quitarAcentos(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,""); }
function normHdr(s){ return quitarAcentos(s).trim().toUpperCase(); }

const PROCESO_TO_AREA_IMPORT = {
  "ADMINISTRATIVO": "area-oficina",
  "ALMACEN": "area-bodega",
  "LIMPIEZA Y ASEO": "area-limpieza",
  "OBRAS Y OPERACIONES": "area-obra",
};
function mrTextoAPC(mr){
  const m = { "BAJO":[1,2], "MEDIO":[2,3], "ALTO":[3,4], "MUY ALTO":[4,5], "CRITICO":[4,5], "CRÍTICO":[4,5] }[normHdr(mr)];
  return m || [2,3];
}

/* Formato "plano": una fila de encabezados, similar al Excel exportado por la propia app. */
function parseMatrizPlana(sheet, defaultAreaId){
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
  if(!rows.length) return null;
  const keys = Object.keys(rows[0]);
  const find = (...alts) => keys.find(k => alts.some(a => normHdr(k)===normHdr(a)));
  const kArea = find("Área","Area");
  const kProceso = find("Proceso");
  const kActividad = find("Actividad");
  const kCategoria = find("Categoría","Categoria");
  const kPeligro = find("Peligro");
  const kRiesgo = find("Riesgo asociado","Riesgo");
  const kEfecto = find("Efecto / descripción","Efecto","Descripción","Descripcion");
  const kProb = find("Probabilidad");
  const kCons = find("Consecuencia");
  const kControles = find("Controles","Medidas de control");
  const kResp = find("Responsable");
  const kPlazo = find("Plazo","Fecha de implementación","Fecha de implementacion");
  const kEstado = find("Estado");
  const kHombres = find("N° hombres","N hombres","Hombres");
  const kMujeres = find("N° mujeres","N mujeres","Mujeres");
  const kOtros = find("N° otros","N otros","Otros");
  if(!kPeligro) return null; // no parece este formato

  const estadoInverso = {"pendiente":"pendiente","en proceso":"proceso","cerrada":"cerrada"};
  const out = [];
  for(const row of rows){
    const peligro = kPeligro? String(row[kPeligro]||"").trim() : "";
    if(!peligro) continue;
    let areaId = defaultAreaId;
    if(kArea){
      const areaTxt = String(row[kArea]||"").trim();
      const match = CACHE.areas.find(a=>normHdr(a.nombre)===normHdr(areaTxt));
      if(match) areaId = match.id;
    }
    out.push({
      areaId,
      proceso: kProceso? String(row[kProceso]||"").trim() : "",
      actividad: kActividad? String(row[kActividad]||"").trim() : "",
      categoria: kCategoria? String(row[kCategoria]||"").trim() : "",
      peligro,
      riesgo: kRiesgo? String(row[kRiesgo]||"").trim() || peligro : peligro,
      efecto: kEfecto? String(row[kEfecto]||"").trim() : "",
      hombres: kHombres? (+row[kHombres]||0) : 0,
      mujeres: kMujeres? (+row[kMujeres]||0) : 0,
      otros: kOtros? (+row[kOtros]||0) : 0,
      probabilidad: kProb && +row[kProb] ? Math.min(5,Math.max(1,+row[kProb])) : 3,
      consecuencia: kCons && +row[kCons] ? Math.min(5,Math.max(1,+row[kCons])) : 3,
      controles: kControles? String(row[kControles]||"").trim() : "",
      responsable: kResp? String(row[kResp]||"").trim() : "",
      plazo: kPlazo? String(row[kPlazo]||"").trim() : "",
      estado: kEstado? (estadoInverso[normHdr(row[kEstado]).toLowerCase()] || "pendiente") : "pendiente",
    });
  }
  return out.length? out : null;
}

/* Formato "corporativo IPER": encabezado en dos filas, con celdas combinadas
   en PROCESO/ACTIVIDAD y dos bloques de evaluación (puro y residual). */
function parseMatrizIperCorporativa(sheet, defaultAreaId){
  const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
  let headerRow = -1;
  for(let i=0;i<Math.min(aoa.length,30);i++){
    const rowNorm = (aoa[i]||[]).map(c=>normHdr(c));
    if(rowNorm.some(c=>c.includes("PELIGRO")) && rowNorm.some(c=>c.includes("PROCESO"))){ headerRow = i; break; }
  }
  if(headerRow === -1) return null;
  // h0 = fila de encabezados de GRUPO (una fila arriba de headerRow, ej. "MEDIDAS DE CONTROL",
  // "EVALUACIÓN DE RIESGO PURO/RESIDUAL"); se trata aparte porque "IDENTIFICACIÓN DE PELIGROS"
  // en esa misma fila contiene la palabra "PELIGRO" y no debe confundirse con la columna Peligro.
  const h0 = (aoa[headerRow-1]||[]).map(c=>normHdr(c));
  const h1 = (aoa[headerRow]||[]).map(c=>normHdr(c));
  const h2 = (aoa[headerRow+1]||[]).map(c=>normHdr(c));
  const ncols = Math.max(h1.length, h2.length);
  const combo = Array.from({length:ncols}, (_,i)=> (h1[i]||"") + " " + (h2[i]||""));

  const findFirst = (pred) => combo.findIndex(pred);
  const findAll = (pred) => combo.reduce((acc,c,i)=>{ if(pred(c)) acc.push(i); return acc; }, []);

  const colProceso = findFirst(c=>c.includes("PROCESO"));
  const colActividad = h1.findIndex(c=>c.startsWith("ACTIVIDAD"));
  const colCategoria = findFirst(c=>c.includes("CATEGORIA"));
  const colPeligro = findFirst(c=>c.includes("PELIGRO"));
  const colEfecto = findFirst(c=>c.includes("EFECTO"));
  const colHombres = findFirst(c=>c.includes("HOMBRES"));
  const colMujeres = findFirst(c=>c.includes("MUJERES"));
  const colOtros = combo.findIndex(c=>c.trim()==="OTROS");
  const colsProb = findAll(c=>c.includes("PROBABILIDAD"));
  const colsCons = findAll(c=>c.includes("CONSECUENCIA"));
  const colsMR = findAll(c=>c.trim()==="M.R.");
  // "MEDIDAS DE CONTROL" es un encabezado de grupo que vive en h0, no en h1/h2.
  let colControles = h0.findIndex(c=>c.includes("MEDIDAS DE CONTROL"));
  if(colControles===-1) colControles = findFirst(c=>c.includes("MEDIDAS DE CONTROL"));
  const colResponsableReal = h2.findIndex(c=>c.trim()==="RESPONSABLE");
  const colFecha = findFirst(c=>c.includes("FECHA DE IMPLEMENTACION"));
  const colArea = h1.findIndex(c=>c.trim()==="AREA");

  if(colPeligro===-1) return null;
  // Prefiere la evaluación RESIDUAL (la última de cada tipo); si no existe, usa la "pura" (la primera).
  const colProbResidual = colsProb.length? colsProb[colsProb.length-1] : -1;
  const colConsResidual = colsCons.length? colsCons[colsCons.length-1] : -1;
  const colProbPuro = colsProb.length? colsProb[0] : -1;
  const colConsPuro = colsCons.length? colsCons[0] : -1;
  const colMRResidual = colsMR.length? colsMR[colsMR.length-1] : -1;
  const colMRPuro = colsMR.length? colsMR[0] : -1;

  const dataStart = headerRow + 2;
  let lastProceso = "", lastActividad = "";
  let consecutivasVacias = 0;
  const out = [];
  for(let r=dataStart; r<aoa.length; r++){
    const row = aoa[r] || [];
    const procesoCell = colProceso>=0 && row[colProceso]!=null ? String(row[colProceso]).trim() : "";
    const actividadCell = colActividad>=0 && row[colActividad]!=null ? String(row[colActividad]).trim() : "";
    if(procesoCell) lastProceso = procesoCell;
    if(actividadCell) lastActividad = actividadCell;
    const peligro = colPeligro>=0 && row[colPeligro]!=null ? String(row[colPeligro]).trim() : "";
    if(!peligro){
      consecutivasVacias++;
      if(consecutivasVacias>=2 && out.length) break; // fin de la tabla de datos
      continue;
    }
    consecutivasVacias = 0;

    let p, c;
    const pRes = colProbResidual>=0? row[colProbResidual] : null;
    const cRes = colConsResidual>=0? row[colConsResidual] : null;
    const pPuro = colProbPuro>=0? row[colProbPuro] : null;
    const cPuro = colConsPuro>=0? row[colConsPuro] : null;
    if(typeof pRes==="number" && typeof cRes==="number"){ p=pRes; c=cRes; }
    else if(typeof pPuro==="number" && typeof cPuro==="number"){ p=pPuro; c=cPuro; }
    else {
      const mrTxt = (colMRResidual>=0 && row[colMRResidual]) ? row[colMRResidual] : (colMRPuro>=0? row[colMRPuro] : "");
      [p,c] = mrTextoAPC(mrTxt);
    }

    let areaId = defaultAreaId;
    const areaTxt = colArea>=0 && row[colArea]!=null ? String(row[colArea]).trim() : "";
    if(areaTxt){
      const match = CACHE.areas.find(a=>normHdr(a.nombre)===normHdr(areaTxt));
      if(match) areaId = match.id;
    } else if(PROCESO_TO_AREA_IMPORT[normHdr(lastProceso).replace(/\s+/g," ")]){
      areaId = PROCESO_TO_AREA_IMPORT[lastProceso.trim().toUpperCase()] || defaultAreaId;
    }

    let plazo = "";
    const fechaVal = colFecha>=0? row[colFecha] : null;
    if(fechaVal instanceof Date && !isNaN(fechaVal)) plazo = fechaVal.toISOString().slice(0,10);

    const controles = colControles>=0 && row[colControles]!=null ? String(row[colControles]).trim() : "";
    out.push({
      areaId,
      proceso: lastProceso,
      actividad: lastActividad,
      categoria: colCategoria>=0 && row[colCategoria]!=null ? String(row[colCategoria]).trim() : "",
      peligro,
      riesgo: peligro,
      efecto: colEfecto>=0 && row[colEfecto]!=null ? String(row[colEfecto]).trim() : "",
      hombres: colHombres>=0 && typeof row[colHombres]==="number" ? row[colHombres] : 0,
      mujeres: colMujeres>=0 && typeof row[colMujeres]==="number" ? row[colMujeres] : 0,
      otros: colOtros>=0 && typeof row[colOtros]==="number" ? row[colOtros] : 0,
      probabilidad: Math.min(5,Math.max(1, Math.round(p))),
      consecuencia: Math.min(5,Math.max(1, Math.round(c))),
      controles,
      responsable: colResponsableReal>=0 && row[colResponsableReal]!=null ? String(row[colResponsableReal]).trim() : "",
      plazo,
      estado: controles? "cerrada" : "pendiente",
    });
  }
  return out.length? out : null;
}

on(document.getElementById("importMatrizBtn"), "click", async () => {
  const fileInput = document.getElementById("importMatrizFile");
  const file = fileInput.files[0];
  if(!file){ alert("Selecciona un archivo Excel (.xlsx) para importar."); return; }
  if(typeof XLSX === "undefined"){ alert("No se pudo cargar el lector de Excel (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const defaultAreaId = document.getElementById("importMatrizArea").value || (CACHE.areas[0] && CACHE.areas[0].id) || "";
  const reemplazar = document.getElementById("importMatrizReplace").checked;

  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, {type:"array", cellDates:true});
  const sheetName = wb.SheetNames.find(n=>normHdr(n).includes("MATRIZ")) || wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];

  let lineas = parseMatrizPlana(sheet, defaultAreaId);
  let formato = "plano";
  if(!lineas){ lineas = parseMatrizIperCorporativa(sheet, defaultAreaId); formato = "corporativo IPER"; }
  if(!lineas || !lineas.length){
    alert("No se reconoció el formato del archivo. Se esperaba una planilla con una columna \"Peligro\" (formato simple, igual al de \"Descargar Excel\") o la planilla corporativa de Matriz IPER con encabezados AREA/PROCESO/ACTIVIDAD/PELIGRO. Revisa el archivo e intenta nuevamente.");
    return;
  }

  if(reemplazar){
    if(!confirm(`Esto eliminará las ${CACHE.matriz.length} línea(s) actuales de la matriz antes de importar ${lineas.length} línea(s) nueva(s). ¿Continuar?`)) return;
    await clearStore("matriz");
  }

  for(const l of lineas){
    if(l.proceso) await addCatalogValue("proceso", l.proceso);
    if(l.actividad) await addCatalogValue("actividad", l.actividad);
    if(l.categoria) await addCatalogValue("categoria", l.categoria);
    if(l.peligro) await addCatalogValue("peligro", l.peligro);
  }
  await loadCache();

  let importadas = 0;
  for(const l of lineas){
    const controlesJerarquizados = parseControlesBullets(l.controles, l.responsable);
    const rec = {
      id: uid(),
      areaId: l.areaId || defaultAreaId,
      proceso: l.proceso, actividad: l.actividad, categoria: l.categoria,
      peligro: l.peligro, riesgo: l.riesgo, efecto: l.efecto,
      hombres: l.hombres||0, mujeres: l.mujeres||0, otros: l.otros||0,
      probabilidad: l.probabilidad, consecuencia: l.consecuencia,
      controlesJerarquizados, controles: l.controles, responsable: l.responsable, plazo: l.plazo||"",
      estado: l.estado || "pendiente",
      fechaCreacion: new Date().toISOString(),
    };
    await put("matriz", rec);
    await logHistorial(rec.id, matrizLineLabel(rec), "Línea creada", "", `Importada desde Excel (formato ${formato})`);
    importadas++;
  }
  await loadCache();
  fileInput.value = "";
  document.getElementById("importMatrizReplace").checked = false;
  renderMatrizTable(); renderEquidadGenero(); renderMatrizCharts(); renderJerarquiaControles(); renderEppEstudioCobertura(); renderEppEstPeligroOptions(); renderMapaRiesgos(); renderPlanoRiesgos(); renderMatrizHistorialTable(); renderCommonSelects(); renderCatList();
  alert(`Importación completa (formato ${formato}): ${importadas} línea(s) ${reemplazar? "cargadas":"agregadas"} en la Matriz de riesgos.`);
});

