  return CACHE.capacitaciones
    .filter(c=> !fMes || (c.fechaProgramada||"").slice(0,7)===fMes)
    .filter(c=> !fResp || (c.relator||"").trim()===fResp);
}

function renderCapacitacionesList(){
  const fTipo = document.getElementById("filterCapTipo").value;
  const list = capacitacionesFiltradas().filter(c=> !fTipo || c.tipo===fTipo);
  const trabOpts = CACHE.trabajadores.map(t=>({id:t.id,label:`${t.nombre}${t.cargo?" — "+t.cargo:""}`}));
  document.getElementById("capacitacionesList").innerHTML = list.map(c=>{
    const stats = capacitacionCumplimiento(c);
    const yaAgregados = new Set((c.participantes||[]).map(p=>p.trabajadorId));
    const disponibles = trabOpts.filter(t=>!yaAgregados.has(t.id));
    const filaParticipantes = (c.participantes||[]).map(p=>`
      <tr>
        <td>${trabName(p.trabajadorId)}</td>
        <td>
          <label style="display:inline-flex;align-items:center;gap:6px;font-weight:400;margin:0;">
            <input type="checkbox" data-cap-asis="${c.id}|${p.trabajadorId}" ${p.asistio?"checked":""} style="width:auto;min-height:auto;">Asistió
          </label>
        </td>
        <td>
          <label style="display:inline-flex;align-items:center;gap:6px;font-weight:400;margin:0;">
            <input type="checkbox" data-cap-apr="${c.id}|${p.trabajadorId}" ${p.aprobado?"checked":""} style="width:auto;min-height:auto;">Aprobó
          </label>
        </td>
        <td><button class="subtle-btn" data-cap-quitar="${c.id}|${p.trabajadorId}">Quitar</button></td>
      </tr>`).join("");
    return `<div class="finding" style="background:var(--surface-1);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
        <div>
          <strong>${c.nombre}</strong>
          <div class="kv">${CAP_TIPO_LABEL[c.tipo]||c.tipo} · Programada: ${fmtDate(c.fechaProgramada)} · ${c.horas||0} hrs · ${c.relator||"—"}</div>
        </div>
        <div style="text-align:right;">
          <span class="pill ${stats.pct>=80?'bajo':stats.pct>=50?'medio':'critico'}">${stats.asistieron}/${stats.convocados} asistencia confirmada (${stats.pct}%)</span>
          <div class="kv">${c.fechaRealizada? "Realizada: "+fmtDate(c.fechaRealizada) : `<button class="subtle-btn" data-cap-done="${c.id}">Marcar realizada</button>`}</div>
        </div>
      </div>
      <label style="margin-top:10px;">Trabajadores que asistieron</label>
      <table><thead><tr><th>Trabajador</th><th>Asistencia</th><th>Aprobación</th><th></th></tr></thead><tbody>${filaParticipantes || '<tr><td class="empty" colspan="4">Aún no se ha agregado ningún asistente</td></tr>'}</tbody></table>
      <div class="toolbar" style="margin-top:8px;">
        <div class="field"><label>Agregar trabajador que asistió</label>
          <select data-cap-select-trab="${c.id}">
            <option value="">Seleccione...</option>
            ${disponibles.map(t=>`<option value="${t.id}">${t.label}</option>`).join("")}
          </select>
        </div>
        <div><button class="btn small secondary" data-cap-agregar="${c.id}" style="margin-top:20px;">+ Agregar</button></div>
      </div>
      <label style="margin-top:10px;">Documento probatorio de asistencia (lista de asistencia firmada, certificado, foto, etc.)</label>
      <div class="toolbar" style="margin:4px 0;">
        <div class="field"><input type="file" data-cap-doc="${c.id}" accept="image/*,.pdf,.doc,.docx,.txt,.csv"></div>
        <div><button class="btn small secondary" data-cap-detectar="${c.id}" style="margin-top:0;" ${c.documento?"":"disabled"}>Detectar asistencia automáticamente en el documento</button></div>
      </div>
      ${c.documento? `<div class="kv" style="margin-top:4px;">Documento actual: <a href="${c.documento}" download="${c.documentoNombre||'documento'}">${c.documentoNombre||"Descargar"}</a></div>` : ""}
      <div class="desc" style="margin-top:4px;">Esta detección funciona bien con documentos de texto (PDF generado digitalmente, o listas en .txt/.csv); <strong>no reconoce nombres manuscritos</strong> en actas escaneadas o fotografiadas a mano (como firmas de puño y letra). Siempre revise y ajuste la lista de asistentes manualmente.</div>
    </div>`;
  }).join("") || '<div class="empty">Sin capacitaciones registradas para el filtro seleccionado</div>';
}

/* Descarga en PDF del Plan de capacitación, respetando los filtros de
   tipo/mes/responsable (relator) actualmente aplicados en el listado. */
function descargarCapacitacionPdf(){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const fTipo = document.getElementById("filterCapTipo").value;
  const list = capacitacionesFiltradas().filter(c=> !fTipo || c.tipo===fTipo).sort((a,b)=> new Date(a.fechaProgramada)-new Date(b.fechaProgramada));
  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(15);
  doc.text("Plan de capacitación — cumplimiento", 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatos = datosEmpresaLineaPdf();
  if(lineaDatos){ doc.text(lineaDatos, 14, y); y += 6; }
  doc.text(`Generado el ${fmtDate(new Date().toISOString().slice(0,10))}`, 14, y); y += 8;
  doc.autoTable({ startY:y, head:[["Capacitación","Tipo","Fecha prog.","Horas","Relator","Realizada","Asistencia"]],
    body: list.length ? list.map(c=>{
      const stats = capacitacionCumplimiento(c);
      return [c.nombre, CAP_TIPO_LABEL[c.tipo]||c.tipo, fmtDate(c.fechaProgramada), c.horas||0, c.relator||"—", c.fechaRealizada?fmtDate(c.fechaRealizada):"—", `${stats.asistieron}/${stats.convocados} (${stats.pct}%)`];
    }) : [["Sin capacitaciones para el filtro seleccionado","","","","","",""]],
    styles:{fontSize:8.5}, headStyles:{fillColor:[42,120,214]} });
  doc.save(`Plan_Capacitacion_${(CACHE.empresa&&CACHE.empresa.razonSocial||"Empresa").replace(/[^a-zA-Z0-9]+/g,"_")}_${new Date().toISOString().slice(0,10)}.pdf`);
}
on(document.getElementById("descargarCapacitacionPdfBtn"), "click", () => descargarCapacitacionPdf());

on(document.getElementById("capacitacionesList"), "change", async (e) => {
  const asisCb = e.target.closest("input[data-cap-asis]");
  const aprCb = e.target.closest("input[data-cap-apr]");
  const docInput = e.target.closest("input[data-cap-doc]");
  if(docInput){
    const file = docInput.files[0];
    if(!file) return;
    CAP_ARCHIVO_CACHE[docInput.dataset.capDoc] = file;
    const reader = new FileReader();
    reader.onload = async ()=>{
      const rec = CACHE.capacitaciones.find(c=>c.id===docInput.dataset.capDoc);
      rec.documento = reader.result; rec.documentoNombre = file.name;
      await put("capacitaciones", rec);
      await loadCache();
      renderCapacitacionesList();
    };
    reader.readAsDataURL(file);
    return;
  }
  const cb = asisCb || aprCb;
  if(!cb) return;
  const [capId, trabId] = (cb.dataset.capAsis || cb.dataset.capApr).split("|");
  const rec = CACHE.capacitaciones.find(c=>c.id===capId);
  const part = rec.participantes.find(p=>p.trabajadorId===trabId);
  if(asisCb) part.asistio = cb.checked; else part.aprobado = cb.checked;
  await put("capacitaciones", rec);
  await loadCache();
  renderCapacitacionesList();
  renderCapStats();
});
on(document.getElementById("capacitacionesList"), "click", async (e) => {
  const doneBtn = e.target.closest("button[data-cap-done]");
  const quitarBtn = e.target.closest("button[data-cap-quitar]");
  const agregarBtn = e.target.closest("button[data-cap-agregar]");
  if(doneBtn){
    const rec = CACHE.capacitaciones.find(c=>c.id===doneBtn.dataset.capDone);
    rec.fechaRealizada = new Date().toISOString().slice(0,10);
    await put("capacitaciones", rec);
    await loadCache();
    renderCapacitacionesList();
    renderCapStats();
    renderCapCumplimientoPorResponsable();
    if(typeof renderMisActividadesMensuales === "function") renderMisActividadesMensuales();
    return;
  }
  if(quitarBtn){
    const [capId, trabId] = quitarBtn.dataset.capQuitar.split("|");
    const rec = CACHE.capacitaciones.find(c=>c.id===capId);
    rec.participantes = (rec.participantes||[]).filter(p=>p.trabajadorId!==trabId);
    await put("capacitaciones", rec);
    await loadCache();
    renderCapacitacionesList();
    renderCapStats();
    return;
  }
  if(agregarBtn){
    const capId = agregarBtn.dataset.capAgregar;
    const sel = document.querySelector(`select[data-cap-select-trab="${capId}"]`);
    const trabId = sel.value;
    if(!trabId){ alert("Selecciona un trabajador para agregar."); return; }
    const rec = CACHE.capacitaciones.find(c=>c.id===capId);
    rec.participantes = rec.participantes || [];
    if(!rec.participantes.find(p=>p.trabajadorId===trabId)){
      rec.participantes.push({trabajadorId:trabId, asistio:true, aprobado:false});
    }
    await put("capacitaciones", rec);
    await loadCache();
    renderCapacitacionesList();
    renderCapStats();
    return;
  }
  const detectarBtn = e.target.closest("button[data-cap-detectar]");
  if(detectarBtn){
    const capId = detectarBtn.dataset.capDetectar;
    const rec = CACHE.capacitaciones.find(c=>c.id===capId);
    if(!rec || !rec.documento) return;
    const fileInput = document.querySelector(`input[data-cap-doc="${capId}"]`);
    const file = CAP_ARCHIVO_CACHE[capId] || (fileInput && fileInput.files[0]);
    if(!file){ alert("Vuelva a seleccionar el archivo en el campo de documento para poder analizarlo (el navegador no retiene el archivo original tras guardarlo)."); return; }
    detectarBtn.disabled = true; detectarBtn.textContent = "Analizando documento...";
    const resultado = await intentarDetectarNombresEnArchivo(file, CACHE.trabajadores);
    detectarBtn.disabled = false; detectarBtn.textContent = "Detectar asistencia automáticamente en el documento";
    if(!resultado.ok){ alert(resultado.motivo); return; }
    if(!resultado.coincidencias.length){ alert("No se encontraron nombres de trabajadores registrados dentro del texto del documento. Marque la asistencia manualmente."); return; }
    rec.participantes = rec.participantes || [];
    let nuevos = 0;
    resultado.coincidencias.forEach(t=>{
      const existente = rec.participantes.find(p=>p.trabajadorId===t.id);
      if(existente){ existente.asistio = true; }
      else { rec.participantes.push({trabajadorId:t.id, asistio:true, aprobado:false}); nuevos++; }
    });
    await put("capacitaciones", rec);
    await loadCache();
    renderCapacitacionesList();
    renderCapStats();
    alert(`Se detectaron ${resultado.coincidencias.length} nombre(s) en el documento y se marcaron como asistentes (${nuevos} agregado(s) de nuevo). Revise la lista y corrija si algo no corresponde.`);
  }
});
document.getElementById("filterCapTipo").addEventListener("change", renderCapacitacionesList);
document.getElementById("filterCapMes").addEventListener("change", () => { renderCapacitacionesList(); renderCapStats(); renderCapCumplimientoPorResponsable(); });
document.getElementById("filterCapResponsable").addEventListener("change", () => { renderCapacitacionesList(); renderCapStats(); renderCapCumplimientoPorResponsable(); });

/* Estadísticas del plan: cumplimiento de programa, cumplimiento de asistencia,
   y HH capacitadas (horas x asistentes de capacitaciones realizadas) vs HH
   trabajadas (tomadas del registro de horas-hombre usado en Accidentabilidad). */
function renderCapStats(){
  const filtradas = capacitacionesFiltradas();
  const total = filtradas.length;
  const realizadas = filtradas.filter(c=>c.fechaRealizada).length;
  const pctPrograma = total? Math.round(realizadas/total*100) : 0;
  document.getElementById("capStatPrograma").textContent = pctPrograma+"%";
  document.getElementById("capStatProgramaFoot").textContent = `${realizadas} de ${total} realizadas`;

  const todosParticipantes = filtradas.flatMap(c=>c.participantes||[]);
  const totalRegistrados = todosParticipantes.length;
  const totalAsistieron = todosParticipantes.filter(p=>p.asistio).length;
  const pctAsistencia = totalRegistrados? Math.round(totalAsistieron/totalRegistrados*100) : 0;
  document.getElementById("capStatAsistencia").textContent = pctAsistencia+"%";
  document.getElementById("capStatAsistenciaFoot").textContent = `${totalAsistieron} de ${totalRegistrados} asistentes registrados`;

  const hhCapacitadas = filtradas
    .filter(c=>c.fechaRealizada)
    .reduce((sum,c)=> sum + (+c.horas||0) * (c.participantes||[]).filter(p=>p.asistio).length, 0);
  const fMes = document.getElementById("filterCapMes").value;
  const hhTrabajadas = CACHE.horasHombre
    .filter(h=> !fMes || h.periodo===fMes)
    .reduce((sum,h)=>sum+(+h.horasHombre||0),0);
  const pctHH = hhTrabajadas? Math.round(hhCapacitadas/hhTrabajadas*10000)/100 : 0;
  document.getElementById("capStatHH").textContent = pctHH+"%";
  document.getElementById("capStatHHFoot").textContent = `${hhCapacitadas} de ${hhTrabajadas} HH`;
}

/* Estadística de cumplimiento por responsable (relator), análoga a la de
   Programa de seguridad — se ajusta con los mismos filtros de mes y
   responsable de la lista de capacitaciones. */
function renderCapCumplimientoPorResponsable(){
  const filtradas = capacitacionesFiltradas();
  const porResp = new Map();
  filtradas.forEach(c=>{
    const resp = (c.relator||"").trim() || "(sin relator asignado)";
    if(!porResp.has(resp)) porResp.set(resp, {programadas:0, realizadas:0});
    const st = porResp.get(resp);
    st.programadas++;
    if(c.fechaRealizada) st.realizadas++;
  });
  const entries = Array.from(porResp.entries()).sort((a,b)=>b[1].programadas-a[1].programadas);
  document.getElementById("chartCapResponsableWrap").innerHTML = entries.length
    ? chartPercentBarsHtml(entries.map(([resp,st])=>[resp, st.programadas? Math.round(st.realizadas/st.programadas*100):0]), (label,i)=> AREA_CHART_PALETTE[i % AREA_CHART_PALETTE.length])
    : '<div class="empty">Sin capacitaciones registradas</div>';
  document.getElementById("statsCapResponsableTable").innerHTML = entries.map(([resp,st])=>{
    const pct = st.programadas? Math.round(st.realizadas/st.programadas*100) : 0;
    return `<tr><td>${resp}</td><td>${st.programadas}</td><td>${st.realizadas}</td><td><span class="pill ${pct>=80?'bajo':pct>=50?'medio':'alto'}">${pct}%</span></td></tr>`;
  }).join("") || `<tr><td class="empty" colspan="4">Sin capacitaciones registradas</td></tr>`;
}

/* =========================================================
   INCIDENTES DE ALTO POTENCIAL (IAP) DE OTRAS EMPRESAS (v1.62)
   Registra alertas de incidentes de alto potencial ocurridos en OTRAS
   empresas (mandante, mutualidad, rubro, otras faenas), y lleva
   control de la difusión de la lección aprendida hacia el 100% de
   nuestro propio personal. `difusion` guarda solo las confirmaciones
   (trabajadorId + fecha en que tomó conocimiento); el resto del
   personal vigente (CACHE.trabajadores) se considera automáticamente
   "pendiente" — así, un trabajador nuevo que ingresa después de
   publicada la alerta aparece como pendiente sin necesidad de
   agregarlo a mano. Store: "iapRegistros".
   ========================================================= */
const IAP_TIPO_LABEL = { electrico:"Contacto con energía eléctrica", altura:"Caída de altura", atrapamiento:"Atrapamiento / aplastamiento", golpeado:"Golpeado por / contra", vehiculo:"Volcamiento / choque de vehículo o equipo", izaje:"Izaje de cargas / grúas", incendio:"Incendio / explosión", confinado:"Espacio confinado", quimico:"Contacto con sustancia peligrosa", otro:"Otro" };
const IAP_POTENCIAL_LABEL = { fatal:"Fatal", grave:"Grave / incapacitante" };
function iapTrabajadoresVigentes(){ return CACHE.trabajadores||[]; }
function iapMarcados(rec){
  const vigentesIds = new Set(iapTrabajadoresVigentes().map(t=>t.id));
  return (rec.difusion||[]).filter(d=>vigentesIds.has(d.trabajadorId));
}
function iapPctDifusion(rec){
  const total = iapTrabajadoresVigentes().length;
  if(!total) return 0;
  return Math.round(iapMarcados(rec).length/total*100);
}
let iapEditingId = null;
function resetIapForm(){
  iapEditingId = null;
  document.getElementById("iapFecha").value = "";
  document.getElementById("iapEmpresaOrigen").value = "";
  document.getElementById("iapFuente").value = "";
  document.getElementById("iapTipo").value = "electrico";
  document.getElementById("iapPotencial").value = "fatal";
  document.getElementById("iapResultadoReal").value = "";
  document.getElementById("iapResponsable").value = "";
  document.getElementById("iapFechaLimite").value = "";
  document.getElementById("iapDescripcion").value = "";
  document.getElementById("iapCausas").value = "";
  document.getElementById("iapLecciones").value = "";
  document.getElementById("iapFormTitle").textContent = "Incidentes de Alto Potencial (IAP) de otras empresas";
  document.getElementById("saveIapBtn").textContent = "Registrar IAP";
  document.getElementById("cancelEditIapBtn").style.display = "none";
}
on(document.getElementById("cancelEditIapBtn"), "click", ()=> resetIapForm());
function startEditIap(id){
  const rec = CACHE.iapRegistros.find(r=>r.id===id);
  if(!rec) return;
  iapEditingId = id;
  document.getElementById("iapFecha").value = rec.fecha || "";
  document.getElementById("iapEmpresaOrigen").value = rec.empresaOrigen || "";
  document.getElementById("iapFuente").value = rec.fuente || "";
  document.getElementById("iapTipo").value = rec.tipo || "electrico";
  document.getElementById("iapPotencial").value = rec.potencial || "fatal";
  document.getElementById("iapResultadoReal").value = rec.resultadoReal || "";
  document.getElementById("iapResponsable").value = rec.responsable || "";
  document.getElementById("iapFechaLimite").value = rec.fechaLimite || "";
  document.getElementById("iapDescripcion").value = rec.descripcion || "";
  document.getElementById("iapCausas").value = rec.causas || "";
  document.getElementById("iapLecciones").value = rec.lecciones || "";
  document.getElementById("iapFormTitle").textContent = 'Editando IAP — '+(rec.empresaOrigen||"");
  document.getElementById("saveIapBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditIapBtn").style.display = "";
  document.getElementById("hdrIap").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("saveIapBtn"), "click", async () => {
  const fecha = document.getElementById("iapFecha").value;
  const empresaOrigen = document.getElementById("iapEmpresaOrigen").value.trim();
  const descripcion = document.getElementById("iapDescripcion").value.trim();
  if(!fecha || !empresaOrigen || !descripcion){ alert("Completa al menos la fecha, la empresa donde ocurrió y la descripción del incidente."); return; }
  const anterior = iapEditingId ? CACHE.iapRegistros.find(r=>r.id===iapEditingId) : null;
  const rec = {
    id: iapEditingId || uid(),
    fecha, empresaOrigen,
    fuente: document.getElementById("iapFuente").value.trim(),
    tipo: document.getElementById("iapTipo").value,
    potencial: document.getElementById("iapPotencial").value,
    resultadoReal: document.getElementById("iapResultadoReal").value.trim(),
    responsable: document.getElementById("iapResponsable").value.trim(),
    fechaLimite: document.getElementById("iapFechaLimite").value || "",
    descripcion,
    causas: document.getElementById("iapCausas").value.trim(),
    lecciones: document.getElementById("iapLecciones").value.trim(),
    difusion: anterior ? anterior.difusion : [],
  };
  await put("iapRegistros", rec);
  await loadCache();
  resetIapForm();
  renderIap();
  alert(iapEditingId ? "IAP actualizado." : "IAP registrado. Ahora marca la difusión a medida que cada trabajador tome conocimiento, más abajo.");
});
function renderIapStatsTiles(){
  const rows = CACHE.iapRegistros||[];
  const total = iapTrabajadoresVigentes().length;
  const promedio = rows.length ? Math.round(rows.reduce((s,r)=>s+iapPctDifusion(r),0)/rows.length) : 0;
  const pendientesVencidos = rows.filter(r=> iapPctDifusion(r)<100 && r.fechaLimite && daysUntil(r.fechaLimite)<0).length;
  const completos = rows.filter(r=>iapPctDifusion(r)>=100).length;
  document.getElementById("iapStatsTiles").innerHTML = [
    tile("IAP registrados", rows.length, "de otras empresas"),
    tile("Difusión al 100% de nuestro personal", completos+" de "+rows.length, "IAP con la lección aprendida difundida a todo el personal ("+total+" trabajador(es) vigente(s))", rows.length && completos===rows.length ? "bajo" : (rows.length?"medio":undefined)),
    tile("% de difusión promedio", promedio+"%", "Promedio entre todos los IAP registrados", promedio>=80?"bajo":(promedio>=40?"medio":"alto")),
    tile("IAP con difusión atrasada", pendientesVencidos, "Fecha límite de difusión vencida y aún no llega al 100%", pendientesVencidos>0?"alto":"bajo"),
  ].join("");
}
function renderIap(){
  renderIapStatsTiles();
  const rows = (CACHE.iapRegistros||[]).slice().sort((a,b)=> new Date(b.fecha||0)-new Date(a.fecha||0));
  const trabajadores = iapTrabajadoresVigentes();
  document.getElementById("iapListWrap").innerHTML = rows.length ? rows.map(r=>{
    const pct = iapPctDifusion(r);
    const marcadosIds = new Set(iapMarcados(r).map(d=>d.trabajadorId));
    const difusionMap = new Map((r.difusion||[]).map(d=>[d.trabajadorId,d]));
    const filas = trabajadores.map(t=>{
      const d = difusionMap.get(t.id);
      return `<tr>
        <td>${t.nombre}${t.cargo?" — "+t.cargo:""}</td>
        <td><label style="display:inline-flex;align-items:center;gap:6px;font-weight:400;margin:0;"><input type="checkbox" data-iap-marca="${r.id}|${t.id}" ${marcadosIds.has(t.id)?"checked":""} style="width:auto;min-height:auto;">Tomó conocimiento</label></td>
        <td>${d&&d.fecha?fmtDate(d.fecha):"—"}</td>
      </tr>`;
    }).join("");
    return `<div class="finding" style="background:var(--surface-1);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
        <div>
          <strong>${r.empresaOrigen}</strong> — ${IAP_TIPO_LABEL[r.tipo]||r.tipo}
          <div class="kv">Fecha del incidente: ${fmtDate(r.fecha)} · Potencial: <span class="pill ${r.potencial==='fatal'?'critico':'alto'}">${IAP_POTENCIAL_LABEL[r.potencial]||r.potencial}</span> · Fuente: ${r.fuente||"—"}</div>
          <div class="kv">Resultado real: ${r.resultadoReal||"—"} · Responsable de difusión: ${r.responsable||"—"} · Límite: ${r.fechaLimite?fmtDate(r.fechaLimite):"—"}</div>
        </div>
        <div style="text-align:right;">
          <span class="pill ${pct>=100?'bajo':(pct>=50?'medio':'alto')}">${marcadosIds.size}/${trabajadores.length} tomó conocimiento (${pct}%)</span>
        </div>
      </div>
      <div class="kv" style="margin-top:8px;"><strong>Descripción:</strong> ${r.descripcion}</div>
      ${r.causas?`<div class="kv"><strong>Causas identificadas:</strong> ${r.causas}</div>`:""}
      ${r.lecciones?`<div class="kv"><strong>Lecciones aprendidas / medidas para nuestra empresa:</strong> ${r.lecciones}</div>`:""}
      <label style="margin-top:10px;">Documento de respaldo de la difusión (lista de asistencia/firma de la charla, correo, etc.)</label>
      <div class="toolbar" style="margin:4px 0;">
        <div class="field"><input type="file" data-iap-doc="${r.id}" accept="image/*,.pdf,.txt,.csv,.doc,.docx"></div>
        <div><button class="btn small secondary" data-iap-detectar="${r.id}" style="margin-top:0;" ${r.documento?"":"disabled"}>Detectar nombres automáticamente en el documento</button></div>
      </div>
      ${r.documento? `<div class="kv" style="margin-bottom:8px;">Documento actual: <a href="${r.documento}" download="${r.documentoNombre||'documento'}">${r.documentoNombre||"Descargar"}</a></div>` : ""}
      <div class="desc" style="margin-top:0;">Esta detección funciona bien con documentos de texto (PDF generado digitalmente, o listas en .txt/.csv); <strong>no reconoce nombres manuscritos</strong> en actas escaneadas o fotografiadas a mano. Siempre revise y ajuste la lista manualmente.</div>
      <label style="margin-top:10px;">Control de difusión al personal (${trabajadores.length} trabajador(es) vigente(s))</label>
      <div class="toolbar" style="margin:4px 0 8px;">
        <button class="btn small secondary" data-iap-marcartodos="${r.id}">Marcar difusión al 100% (todos tomaron conocimiento hoy)</button>
        <button class="subtle-btn" data-iap-desmarcartodos="${r.id}">Desmarcar todos</button>
      </div>
      <table><thead><tr><th>Trabajador</th><th>Difusión</th><th>Fecha</th></tr></thead><tbody>${filas || '<tr><td class="empty" colspan="3">No hay trabajadores registrados en Configuración</td></tr>'}</tbody></table>
      <div class="toolbar" style="margin-top:10px;">
        <button class="btn secondary small" data-iap-editar="${r.id}">Editar</button>
        <button class="subtle-btn" data-iap-eliminar="${r.id}">Eliminar</button>
      </div>
    </div>`;
  }).join("") : '<div class="empty">Aún no hay Incidentes de Alto Potencial (IAP) de otras empresas registrados</div>';
}
on(document.getElementById("iapListWrap"), "change", async (e) => {
  const docInput = e.target.closest("input[data-iap-doc]");
  if(docInput){
    const file = docInput.files[0];
    if(!file) return;
    const rec = CACHE.iapRegistros.find(r=>r.id===docInput.dataset.iapDoc);
    if(!rec) return;
    IAP_ARCHIVO_CACHE[rec.id] = file;
    rec.documento = await readFileAsDataUrl(file);
    rec.documentoNombre = file.name;
    await put("iapRegistros", rec);
    await loadCache();
    renderIap();
    return;
  }
  const cb = e.target.closest("input[data-iap-marca]");
  if(!cb) return;
  const [iapId, trabId] = cb.dataset.iapMarca.split("|");
  const rec = CACHE.iapRegistros.find(r=>r.id===iapId);
  if(!rec) return;
  rec.difusion = rec.difusion || [];
  const existente = rec.difusion.find(d=>d.trabajadorId===trabId);
  if(cb.checked){
    if(existente) existente.fecha = existente.fecha || new Date().toISOString().slice(0,10);
    else rec.difusion.push({trabajadorId:trabId, fecha:new Date().toISOString().slice(0,10)});
  } else {
    rec.difusion = rec.difusion.filter(d=>d.trabajadorId!==trabId);
  }
  await put("iapRegistros", rec);
  await loadCache();
  renderIap();
});
on(document.getElementById("iapListWrap"), "click", async (e) => {
  const editBtn = e.target.closest("button[data-iap-editar]");
  if(editBtn){ startEditIap(editBtn.dataset.iapEditar); return; }
  const delBtn = e.target.closest("button[data-iap-eliminar]");
  if(delBtn){
    if(!confirm("¿Eliminar este registro de IAP? Se perderá también el control de difusión asociado.")) return;
    await deleteRecord("iapRegistros", delBtn.dataset.iapEliminar);
    await loadCache();
    if(iapEditingId === delBtn.dataset.iapEliminar) resetIapForm();
    renderIap();
    return;
  }
  const marcarTodosBtn = e.target.closest("button[data-iap-marcartodos]");
  if(marcarTodosBtn){
    const rec = CACHE.iapRegistros.find(r=>r.id===marcarTodosBtn.dataset.iapMarcartodos);
    if(!rec) return;
    const hoy = new Date().toISOString().slice(0,10);
    rec.difusion = rec.difusion || [];
    iapTrabajadoresVigentes().forEach(t=>{
      if(!rec.difusion.find(d=>d.trabajadorId===t.id)) rec.difusion.push({trabajadorId:t.id, fecha:hoy});
    });
    await put("iapRegistros", rec);
    await loadCache();
    renderIap();
    return;
  }
  const desmarcarTodosBtn = e.target.closest("button[data-iap-desmarcartodos]");
  if(desmarcarTodosBtn){
    const rec = CACHE.iapRegistros.find(r=>r.id===desmarcarTodosBtn.dataset.iapDesmarcartodos);
    if(!rec) return;
    if(!confirm("¿Quitar la marca de difusión de todos los trabajadores para este IAP?")) return;
    rec.difusion = [];
    await put("iapRegistros", rec);
    await loadCache();
    renderIap();
    return;
  }
  const detectarBtn = e.target.closest("button[data-iap-detectar]");
  if(detectarBtn){
    const rec = CACHE.iapRegistros.find(r=>r.id===detectarBtn.dataset.iapDetectar);
    if(!rec || !rec.documento) return;
    const fileInput = document.querySelector(`input[data-iap-doc="${rec.id}"]`);
    const file = IAP_ARCHIVO_CACHE[rec.id] || (fileInput && fileInput.files[0]);
    if(!file){ alert("Vuelva a seleccionar el archivo en el campo de documento para poder analizarlo (el navegador no retiene el archivo original tras guardarlo)."); return; }
    detectarBtn.disabled = true; detectarBtn.textContent = "Analizando documento...";
    const resultado = await intentarDetectarNombresEnArchivo(file, iapTrabajadoresVigentes());
    detectarBtn.disabled = false; detectarBtn.textContent = "Detectar nombres automáticamente en el documento";
    if(!resultado.ok){ alert(resultado.motivo); return; }
    if(!resultado.coincidencias.length){ alert("No se encontraron nombres de trabajadores registrados dentro del texto del documento. Marque la difusión manualmente."); return; }
    const hoy = new Date().toISOString().slice(0,10);
    rec.difusion = rec.difusion || [];
    let nuevos = 0;
    resultado.coincidencias.forEach(t=>{
      if(!rec.difusion.find(d=>d.trabajadorId===t.id)){ rec.difusion.push({trabajadorId:t.id, fecha:hoy}); nuevos++; }
    });
    await put("iapRegistros", rec);
    await loadCache();
    renderIap();
    alert(`Se detectaron ${resultado.coincidencias.length} nombre(s) en el documento y se marcaron ${nuevos} trabajador(es) nuevo(s) como "tomó conocimiento". Revise la lista y corrija si algo no corresponde.`);
  }
});

/* =========================================================
   ACCIDENTABILIDAD — frecuencia, gravedad y DS 67
   ========================================================= */
const ACC_TIPOS_RACHA = ["ctp","stp","trayecto"]; // tipos que cortan la racha de "días sin accidentes"
const ACC_TIPO_LABEL = {ctp:"Con tiempo perdido", stp:"Sin tiempo perdido", trayecto:"Trayecto", incidente:"Incidente / cuasi accidente", enfermedad:"Enfermedad profesional"};

function computeRachas(){
  const list = CACHE.accidentes.filter(a=>ACC_TIPOS_RACHA.includes(a.tipo)).map(a=>a.fecha).sort();
  if(list.length===0) return {actual:null, mejor:null};
  const gaps = [];
  for(let i=1;i<list.length;i++){
    gaps.push(Math.round((new Date(list[i]) - new Date(list[i-1]))/86400000));
  }
  const actual = Math.max(0, -daysUntil(list[list.length-1]));
  const mejor = gaps.length ? Math.max(...gaps, actual) : actual;
  return {actual, mejor};
}

/* Tipos cuyos días perdidos SÍ alteran la tasa de gravedad: solo accidentes
   DEL TRABAJO (con y sin tiempo perdido). Los accidentes de trayecto y las
   enfermedades profesionales se excluyen de este cálculo a pedido explícito
   del usuario: se registran y reportan por separado ante el organismo
   administrador, y no deben distorsionar la tasa de gravedad interna. */
const ACC_TIPOS_GRAVEDAD = ["ctp","stp"];

/* calcIndicadores() es la versión genérica que recibe listas de accidentes
   y de horas-hombre ya filtradas por el período que se quiera analizar
   (todo el histórico, un mes puntual o un año puntual). Además de las
   tasas DS 67 (frecuencia/gravedad/índice de accidentabilidad), calcula:
   - el desglose por sexo del accidentado (CTP/STP/trayecto), a pedido
     explícito del usuario;
   - RIRDA (índice de frecuencia, método canadiense) y LDR / Lost Day Rate
     (índice de gravedad, método canadiense), ambos sobre base 200.000 HH
     (equivalente a 100 trabajadores x 40 hrs/semana x 50 semanas/año),
     que es la base estándar usada en ese método. Se muestran solo si la
     empresa activó el switch "Usar indicadores RIRDA/LDR" en Configuración,
     ya que no todas las empresas asesoradas los usan. */
function calcIndicadores(accidentesLista, horasHombreLista){
  const totalHH = horasHombreLista.reduce((a,h)=>a+(+h.horasHombre||0),0);
  const totalDiasPerdidosGravedad = accidentesLista
    .filter(a=>ACC_TIPOS_GRAVEDAD.includes(a.tipo))
    .reduce((a,x)=>a+(+x.diasPerdidos||0),0);
  const totalCTP = accidentesLista.filter(a=>a.tipo==="ctp").length;
  const totalSTP = accidentesLista.filter(a=>a.tipo==="stp").length;
  const totalTrayecto = accidentesLista.filter(a=>a.tipo==="trayecto").length;
  const totalIncidentes = accidentesLista.filter(a=>a.tipo==="incidente").length;
  const totalEnfermedad = accidentesLista.filter(a=>a.tipo==="enfermedad").length;
  const promTrabajadores = horasHombreLista.length
    ? horasHombreLista.reduce((a,h)=>a+(+h.promedioTrabajadores||0),0)/horasHombreLista.length
    : (CACHE.trabajadores.length || 0);
  const tf = totalHH ? Math.round((totalCTP/totalHH)*1000000) : 0;
  const tg = totalHH ? Math.round((totalDiasPerdidosGravedad/totalHH)*1000000) : 0;
  const indiceAcc = promTrabajadores ? Math.round((totalCTP/promTrabajadores)*1000)/10 : 0;
  const rirda = totalHH ? Math.round((totalCTP/totalHH)*200000*100)/100 : 0;
  const ldr = totalHH ? Math.round((totalDiasPerdidosGravedad/totalHH)*200000*100)/100 : 0;
  const accidentados = accidentesLista.filter(a=>ACC_TIPOS_RACHA.includes(a.tipo));
  const hombres = accidentados.filter(a=>a.sexo==="M").length;
  const mujeres = accidentados.filter(a=>a.sexo==="F").length;
  const sinDatoSexo = accidentados.length - hombres - mujeres;
  return {totalHH, totalDiasPerdidosGravedad, totalCTP, totalSTP, totalTrayecto, totalIncidentes, totalEnfermedad, tf, tg, indiceAcc, rirda, ldr, hombres, mujeres, sinDatoSexo};
}
function accidentabilidadIndicadores(){ return calcIndicadores(CACHE.accidentes, CACHE.horasHombre); }

/* Períodos disponibles (a partir de horas-hombre y/o fechas de accidentes
   registradas) y filtro de accidentes/horas-hombre por mes o por año, para
   el control estadístico mensual/anual y el informe para gerencia. */
function accPeriodosDisponibles(){
  const mesesSet = new Set();
  CACHE.horasHombre.forEach(h=>{ if(h.periodo) mesesSet.add(h.periodo); });
  CACHE.accidentes.forEach(a=>{ if(a.fecha) mesesSet.add((a.fecha||"").slice(0,7)); });
  const meses = Array.from(mesesSet).filter(Boolean).sort();
  const anios = Array.from(new Set(meses.map(m=>m.slice(0,4)))).sort();
  return {meses, anios};
}
function accFiltrarPorPeriodo(tipoPeriodo, valor){
  const accs = CACHE.accidentes.filter(a=> a.fecha && (tipoPeriodo==="mensual" ? a.fecha.slice(0,7)===valor : a.fecha.slice(0,4)===valor));
  const hh = CACHE.horasHombre.filter(h=> h.periodo && (tipoPeriodo==="mensual" ? h.periodo===valor : h.periodo.slice(0,4)===valor));
  return {accs, hh};
}

/* Tiles principales (arriba del todo, bajo el banner de "días sin
   accidentes"): a pedido del usuario, admiten ver el histórico acumulado,
   un mes puntual o un año puntual, e incluyen RIRDA/LDR si están
   activados en Configuración — igual que el control estadístico
   mensual/anual de más abajo, pero visibles de inmediato al entrar a
   Accidentabilidad. */
function renderAccTilesPrincipales(){
  const {meses, anios} = accPeriodosDisponibles();
  const selMes = document.getElementById("accTilesMes");
  const selAnio = document.getElementById("accTilesAnio");
  const curMes = selMes.value, curAnio = selAnio.value;
  selMes.innerHTML = meses.map(m=>`<option value="${m}">${m}</option>`).join("") || '<option value="">Sin datos</option>';
  selAnio.innerHTML = anios.map(a=>`<option value="${a}">${a}</option>`).join("") || '<option value="">Sin datos</option>';
  selMes.value = meses.includes(curMes) ? curMes : (meses[meses.length-1] || "");
  selAnio.value = anios.includes(curAnio) ? curAnio : (anios[anios.length-1] || "");

  const tipo = document.getElementById("accTilesPeriodoTipo").value;
  document.getElementById("accTilesMesWrap").style.display = tipo==="mensual" ? "" : "none";
  document.getElementById("accTilesAnioWrap").style.display = tipo==="anual" ? "" : "none";

  let ind, periodoTxt;
  if(tipo==="mensual"){
    const v = selMes.value;
    const f = accFiltrarPorPeriodo("mensual", v);
    ind = calcIndicadores(f.accs, f.hh);
    periodoTxt = v ? `mes ${v}` : "sin datos de mes";
  } else if(tipo==="anual"){
    const v = selAnio.value;
    const f = accFiltrarPorPeriodo("anual", v);
    ind = calcIndicadores(f.accs, f.hh);
    periodoTxt = v ? `año ${v}` : "sin datos de año";
  } else {
    ind = accidentabilidadIndicadores();
    periodoTxt = "acumulado histórico";
  }

  const usaRirda = !!(CACHE.empresa && CACHE.empresa.usarRirdaLdr);
  const metas = CACHE.empresa || {};
  const tilesArr = [
    tile("Tasa de frecuencia", ind.tf, `accidentes CTP x 1.000.000 / horas-hombre — ${periodoTxt}`, semaforoMeta(ind.tf, metas.metaFrecuencia)),
    tile("Tasa de gravedad", ind.tg, `días perdidos (solo CTP/STP) x 1.000.000 / horas-hombre — ${periodoTxt}`, semaforoMeta(ind.tg, metas.metaGravedad)),
    tile("Índice de accidentabilidad", ind.indiceAcc+"%", `accidentes CTP / promedio trabajadores x 100 — ${periodoTxt}`, semaforoMeta(ind.indiceAcc, metas.metaAccidentabilidad)),
    tile("Accidentes con tiempo perdido", ind.totalCTP, periodoTxt),
    tile("Accidentes sin tiempo perdido", ind.totalSTP, periodoTxt),
    tile("Incidentes / cuasi accidentes", ind.totalIncidentes, periodoTxt),
  ];
  if(usaRirda){
    tilesArr.push(tile("RIRDA", ind.rirda, `CTP x 200.000 / HH — ${periodoTxt}`, semaforoMeta(ind.rirda, metas.metaRirda)));
    tilesArr.push(tile("LDR", ind.ldr, `días perdidos x 200.000 / HH — ${periodoTxt}`, semaforoMeta(ind.ldr, metas.metaLdr)));
  }
  document.getElementById("accTiles").innerHTML = tilesArr.join("");
}
on(document.getElementById("accTilesPeriodoTipo"), "change", renderAccTilesPrincipales);
on(document.getElementById("accTilesMes"), "change", renderAccTilesPrincipales);
on(document.getElementById("accTilesAnio"), "change", renderAccTilesPrincipales);
function tilesIndicadoresHtml(ind, usaRirda){
  const metas = CACHE.empresa || {};
  const base = [
    tile("Tasa de frecuencia", ind.tf, "CTP x 1.000.000 / HH", semaforoMeta(ind.tf, metas.metaFrecuencia)),
    tile("Tasa de gravedad", ind.tg, "días perdidos (CTP/STP) x 1.000.000 / HH", semaforoMeta(ind.tg, metas.metaGravedad)),
    tile("Índice de accidentabilidad", ind.indiceAcc+"%", "CTP / promedio trabajadores x 100", semaforoMeta(ind.indiceAcc, metas.metaAccidentabilidad)),
    tile("Con tiempo perdido", ind.totalCTP, ""),
    tile("Sin tiempo perdido", ind.totalSTP, ""),
    tile("Trayecto", ind.totalTrayecto, ""),
    tile("Incidentes", ind.totalIncidentes, ""),
    tile("Enfermedad profesional", ind.totalEnfermedad, ""),
    tile("Accidentados — hombres", ind.hombres, ""),
    tile("Accidentadas — mujeres", ind.mujeres, ""),
  ];
  if(usaRirda){
    base.push(tile("RIRDA", ind.rirda, "CTP x 200.000 / HH", semaforoMeta(ind.rirda, metas.metaRirda)));
    base.push(tile("LDR", ind.ldr, "días perdidos x 200.000 / HH", semaforoMeta(ind.ldr, metas.metaLdr)));
  }
  return base.join("");
}
function renderAccMensualAnual(){
  const {meses, anios} = accPeriodosDisponibles();
  const selMes = document.getElementById("accPeriodoMes");
  const selAnio = document.getElementById("accPeriodoAnio");
  const curMes = selMes.value, curAnio = selAnio.value;
  selMes.innerHTML = meses.map(m=>`<option value="${m}">${m}</option>`).join("") || '<option value="">Sin datos</option>';
  selAnio.innerHTML = anios.map(a=>`<option value="${a}">${a}</option>`).join("") || '<option value="">Sin datos</option>';
  selMes.value = meses.includes(curMes) ? curMes : (meses[meses.length-1] || "");
  selAnio.value = anios.includes(curAnio) ? curAnio : (anios[anios.length-1] || "");

  const usaRirda = !!(CACHE.empresa && CACHE.empresa.usarRirdaLdr);
  document.querySelectorAll(".rirda-ldr-col").forEach(el=>{ el.style.display = usaRirda ? "" : "none"; });

  const mesVal = selMes.value, anioVal = selAnio.value;
  document.getElementById("accMesTiles").innerHTML = mesVal
    ? tilesIndicadoresHtml(calcIndicadores(accFiltrarPorPeriodo("mensual",mesVal).accs, accFiltrarPorPeriodo("mensual",mesVal).hh), usaRirda)
    : '<div class="empty">Sin datos de horas-hombre o accidentes para calcular un mes</div>';

  if(anioVal){
    const {accs, hh} = accFiltrarPorPeriodo("anual", anioVal);
    document.getElementById("accAnioTiles").innerHTML = tilesIndicadoresHtml(calcIndicadores(accs, hh), usaRirda);
    const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    document.getElementById("accAnioMesTable").innerHTML = MESES.map((nombre,i)=>{
      const periodo = `${anioVal}-${String(i+1).padStart(2,"0")}`;
      const f = accFiltrarPorPeriodo("mensual", periodo);
      const ind2 = calcIndicadores(f.accs, f.hh);
      return `<tr><td>${nombre}</td><td>${ind2.tf}</td><td>${ind2.tg}</td><td>${ind2.indiceAcc}%</td><td>${ind2.totalCTP}</td><td>${ind2.totalSTP}</td>${usaRirda?`<td>${ind2.rirda}</td><td>${ind2.ldr}</td>`:""}</tr>`;
    }).join("");
  } else {
    document.getElementById("accAnioTiles").innerHTML = '<div class="empty">Sin datos para calcular un año</div>';
    document.getElementById("accAnioMesTable").innerHTML = "";
  }
}
on(document.getElementById("accPeriodoMes"), "change", renderAccMensualAnual);
on(document.getElementById("accPeriodoAnio"), "change", renderAccMensualAnual);

function renderAccidentabilidad(){
  const {actual, mejor} = computeRachas();
  document.getElementById("diasSinAccidentesBig").textContent = actual===null ? "—" : actual;
  document.getElementById("mejorRachaText").textContent = actual===null
    ? "Sin accidentes con tiempo perdido registrados aún"
    : "Mejor racha histórica: " + mejor + " días";

  renderAccTilesPrincipales();

  // chart: accidentes por mes (últimos 12 meses con datos)
  const byMonth = {};
  CACHE.accidentes.filter(a=>ACC_TIPOS_RACHA.includes(a.tipo)).forEach(a=>{
    const m = (a.fecha||"").slice(0,7);
    if(!m) return;
    byMonth[m] = (byMonth[m]||0) + 1;
  });
  const months = Object.keys(byMonth).sort();
  const mesRows = months.map(m=>({label:m, value:byMonth[m]}));
  renderBarChart(document.getElementById("chartAccMes"), mesRows, ()=>"#e34948");

  // chart: accidentes por área
  const byArea = {};
  CACHE.accidentes.forEach(a=>{ const n = areaName(a.areaId); byArea[n] = (byArea[n]||0)+1; });
  const areaRows = Object.keys(byArea).map(n=>({label:n, value:byArea[n]}));
  renderBarChart(document.getElementById("chartAccArea"), areaRows, (r)=>PALETTE[areaRows.indexOf(r)%PALETTE.length]);

  renderAccMensualAnual();

  renderAccClasificacion();
}

/* Clasificación de TODOS los registros (accidentes, incidentes, enfermedades)
   por mes del año en curso, por año, por área y por tipo. */
function renderAccClasificacion(){
  const anioActual = new Date().getFullYear();
  const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const porMes = Array.from({length:12}, ()=>0);
  const porAnio = new Map();
  const porArea = new Map();
  const porTipo = new Map();
  const porFoco = new Map();
  CACHE.accidentes.forEach(a=>{
    if(a.fecha){
      const d = new Date(a.fecha+"T00:00:00");
      if(!isNaN(d)){
        if(d.getFullYear()===anioActual) porMes[d.getMonth()]++;
        const anio = d.getFullYear();
        porAnio.set(anio, (porAnio.get(anio)||0)+1);
      }
    }
    const areaN = areaName(a.areaId);
    porArea.set(areaN, (porArea.get(areaN)||0)+1);
    const tipoN = ACC_TIPO_LABEL[a.tipo]||a.tipo;
    porTipo.set(tipoN, (porTipo.get(tipoN)||0)+1);
    if(a.focoCritico){ porFoco.set(a.focoCritico, (porFoco.get(a.focoCritico)||0)+1); }
  });

  document.getElementById("accClasifMesWrap").innerHTML = CACHE.accidentes.length
    ? chartBarsHtml(MESES.map((m,i)=>[m, porMes[i]]), ()=>"#e34948")
    : '<div class="empty">Sin registros</div>';

  const aniosOrdenados = Array.from(porAnio.keys()).sort((a,b)=>b-a);
  document.getElementById("accClasifAnioWrap").innerHTML = aniosOrdenados.length
    ? chartBarsHtml(aniosOrdenados.map(a=>[String(a), porAnio.get(a)]), (label,i)=>AREA_CHART_PALETTE[i % AREA_CHART_PALETTE.length])
    : '<div class="empty">Sin registros</div>';

  const areasOrdenadas = Array.from(porArea.entries()).sort((a,b)=>b[1]-a[1]);
  document.getElementById("accClasifAreaWrap").innerHTML = areasOrdenadas.length
    ? chartBarsHtml(areasOrdenadas, (label,i)=>AREA_CHART_PALETTE[i % AREA_CHART_PALETTE.length])
    : '<div class="empty">Sin registros</div>';

  const tiposOrdenados = Array.from(porTipo.entries()).sort((a,b)=>b[1]-a[1]);
  document.getElementById("accClasifTipoWrap").innerHTML = tiposOrdenados.length
    ? chartBarsHtml(tiposOrdenados, ()=>"#eb6834")
    : '<div class="empty">Sin registros</div>';

  const focosOrdenados = Array.from(porFoco.entries()).sort((a,b)=>b[1]-a[1]);
  document.getElementById("accClasifFocoWrap").innerHTML = focosOrdenados.length
    ? chartBarsHtml(focosOrdenados, (label,i)=>AREA_CHART_PALETTE[i % AREA_CHART_PALETTE.length])
    : '<div class="empty">Sin registros con foco crítico asociado</div>';
}

function renderHHTable(){
  const rows = CACHE.horasHombre.slice().sort((a,b)=> a.periodo.localeCompare(b.periodo));
  document.getElementById("hhTable").innerHTML = rows.map(h=>`
    <tr><td>${h.periodo}</td><td>${h.horasHombre}</td><td>${h.promedioTrabajadores}</td></tr>
  `).join("") || `<tr><td class="empty" colspan="3">Sin períodos registrados</td></tr>`;
}

on(document.getElementById("saveHHBtn"), "click", async ()=>{
  const periodo = document.getElementById("hhPeriodo").value;
  const horasHombre = +document.getElementById("hhHoras").value;
  const promedioTrabajadores = +document.getElementById("hhPromedio").value;
  if(!periodo || !horasHombre){ alert("Complete el período y las horas-hombre trabajadas."); return; }
  const existing = CACHE.horasHombre.find(h=>h.periodo===periodo);
  await put("horasHombre", {id: existing?existing.id:uid(), periodo, horasHombre, promedioTrabajadores});
  await loadCache();
  document.getElementById("hhHoras").value=""; document.getElementById("hhPromedio").value="";
  renderHHTable(); renderAccidentabilidad();
  alert("Período guardado.");
});

/* Trabajadores asociados al registro de accidente/incidente (puede haber
   más de uno: afectados y/o testigos), similar al listado de personas
   inspeccionadas del módulo de Inspecciones. */
let currentAccTrabajadores = [];
function drawAccTrabajadores(){
  document.getElementById("accTrabajadoresWrap").innerHTML = currentAccTrabajadores.map((tid,idx)=>`
    <div class="checklist-item">
      <div>${trabName(tid)}</div>
      <button class="subtle-btn" data-acc-trab-quitar="${idx}">Quitar</button>
    </div>
  `).join("") || '<div class="empty">Sin trabajadores asociados</div>';
}
document.getElementById("addAccTrabBtn").addEventListener("click", ()=>{
  const sel = document.getElementById("accTrabajadorSel");
  if(!sel.value) return;
  if(!currentAccTrabajadores.includes(sel.value)) currentAccTrabajadores.push(sel.value);
  sel.value = "";
  drawAccTrabajadores();
});
document.getElementById("accTrabajadoresWrap").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-acc-trab-quitar]");
  if(!btn) return;
  currentAccTrabajadores.splice(+btn.dataset.accTrabQuitar,1);
  drawAccTrabajadores();
});

let accInformePendiente = null;
let accFotoPendiente = null;
let accEditingId = null;
document.getElementById("accInformeInput").addEventListener("change",(e)=>{
  const file = e.target.files[0];
  if(!file){ accInformePendiente = null; return; }
  const reader = new FileReader();
  reader.onload = ()=>{ accInformePendiente = {data:reader.result, nombre:file.name}; };
  reader.readAsDataURL(file);
});
document.getElementById("accFotoInput").addEventListener("change",(e)=>{
  const file = e.target.files[0];
  if(!file){ accFotoPendiente = null; return; }
  const reader = new FileReader();
  reader.onload = ()=>{ accFotoPendiente = reader.result; };
  reader.readAsDataURL(file);
});

function resetAccForm(){
  accEditingId = null;
  document.getElementById("accTipo").value = "ctp";
  document.getElementById("accFecha").value = "";
  document.getElementById("accArea").value = "";
  document.getElementById("accGravedad").value = "leve";
  document.getElementById("accDiasPerdidos").value = "";
  document.getElementById("accSexo").value = "";
  document.getElementById("accFocoCritico").value = "";
  document.getElementById("accCausa").value = "";
  document.getElementById("accDescripcion").value = "";
  document.getElementById("accInformeInput").value = "";
  document.getElementById("accFotoInput").value = "";
  document.getElementById("accInformeActualWrap").innerHTML = "";
  document.getElementById("accFotoActualWrap").innerHTML = "";
  currentAccTrabajadores = []; accInformePendiente = null; accFotoPendiente = null;
  drawAccTrabajadores();
  document.getElementById("accFormTitle").textContent = "Registrar accidente / incidente";
  document.getElementById("saveAccBtn").textContent = "Registrar";
  document.getElementById("cancelEditAccBtn").style.display = "none";
}

function startEditAcc(id){
  const rec = CACHE.accidentes.find(a=>a.id===id);
  if(!rec) return;
  accEditingId = id;
  document.getElementById("accTipo").value = rec.tipo || "ctp";
  document.getElementById("accFecha").value = rec.fecha || "";
  document.getElementById("accArea").value = rec.areaId || "";
  document.getElementById("accGravedad").value = rec.gravedad || "leve";
  document.getElementById("accDiasPerdidos").value = rec.diasPerdidos || "";
  document.getElementById("accSexo").value = rec.sexo || "";
  document.getElementById("accFocoCritico").value = rec.focoCritico || "";
  document.getElementById("accCausa").value = rec.causa || "";
  document.getElementById("accDescripcion").value = rec.descripcion || "";
  document.getElementById("accInformeInput").value = "";
  document.getElementById("accFotoInput").value = "";
  document.getElementById("accInformeActualWrap").innerHTML = rec.informePreliminar
    ? `Archivo actual: <a href="${rec.informePreliminar}" download="${rec.informePreliminarNombre||'informe'}">${rec.informePreliminarNombre||'informe'}</a> (se mantiene si no subes uno nuevo)` : "Sin informe preliminar adjunto";
  document.getElementById("accFotoActualWrap").innerHTML = rec.fotografia
    ? `Fotografía actual adjunta (se mantiene si no subes una nueva)` : "Sin fotografía adjunta";
  currentAccTrabajadores = accTrabajadoresDe(rec).slice();
  accInformePendiente = null; accFotoPendiente = null;
  drawAccTrabajadores();
  document.getElementById("accFormTitle").textContent = `Editando registro del ${fmtDate(rec.fecha)}`;
  document.getElementById("saveAccBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditAccBtn").style.display = "";
  document.getElementById("view-accidentabilidad").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("cancelEditAccBtn"), "click", ()=>{ resetAccForm(); });

on(document.getElementById("saveAccBtn"), "click", async ()=>{
  const tipo = document.getElementById("accTipo").value;
  const fecha = document.getElementById("accFecha").value;
  const areaId = document.getElementById("accArea").value;
  if(!fecha || !areaId){ alert("Complete al menos la fecha y el área."); return; }

  if(accEditingId){
    const anterior = CACHE.accidentes.find(a=>a.id===accEditingId);
    if(!anterior){ alert("El registro que estabas editando ya no existe."); resetAccForm(); return; }
    const rec = {
      ...anterior, tipo, fecha, areaId,
      trabajadoresIds: currentAccTrabajadores.slice(),
      gravedad: document.getElementById("accGravedad").value,
      diasPerdidos: +document.getElementById("accDiasPerdidos").value || 0,
      sexo: document.getElementById("accSexo").value,
      focoCritico: document.getElementById("accFocoCritico").value,
      causa: document.getElementById("accCausa").value.trim(),
      descripcion: document.getElementById("accDescripcion").value.trim(),
      informePreliminar: accInformePendiente ? accInformePendiente.data : anterior.informePreliminar,
      informePreliminarNombre: accInformePendiente ? accInformePendiente.nombre : anterior.informePreliminarNombre,
      fotografia: accFotoPendiente || anterior.fotografia,
      fechaModificacion: new Date().toISOString(),
    };
    await put("accidentes", rec);
    await loadCache();
    resetAccForm();
    renderAccidentesTable(); renderAccidentabilidad();
    alert("Registro actualizado.");
    return;
  }

  const rec = {
    id: uid(), tipo, fecha, areaId,
    trabajadoresIds: currentAccTrabajadores.slice(),
    gravedad: document.getElementById("accGravedad").value,
    diasPerdidos: +document.getElementById("accDiasPerdidos").value || 0,
    sexo: document.getElementById("accSexo").value,
    focoCritico: document.getElementById("accFocoCritico").value,
    causa: document.getElementById("accCausa").value.trim(),
    descripcion: document.getElementById("accDescripcion").value.trim(),
    informePreliminar: accInformePendiente? accInformePendiente.data : null,
    informePreliminarNombre: accInformePendiente? accInformePendiente.nombre : null,
    fotografia: accFotoPendiente || null,
    investigado: false,
  };
  await put("accidentes", rec);
  await loadCache();
  resetAccForm();
  renderAccidentesTable(); renderAccidentabilidad();
  alert("Registro guardado.");
});

function accTrabajadoresDe(a){
  if(Array.isArray(a.trabajadoresIds) && a.trabajadoresIds.length) return a.trabajadoresIds;
  if(a.trabajadorId) return [a.trabajadorId]; // compatibilidad con registros antiguos (un solo trabajador)
  return [];
}

/* Opciones de los filtros de mes/año del registro histórico de
   Accidentabilidad: se arman a partir de las fechas de los propios
   registros de accidentes/incidentes (no de horas-hombre), preservando
   la selección vigente si sigue existiendo. */
function renderAccFiltrosHistorico(){
  const selMes = document.getElementById("filterAccMes");
  const selAnio = document.getElementById("filterAccAnio");
  const curMes = selMes.value, curAnio = selAnio.value;
  const meses = Array.from(new Set(CACHE.accidentes.map(a=>(a.fecha||"").slice(0,7)).filter(Boolean))).sort();
  const anios = Array.from(new Set(CACHE.accidentes.map(a=>(a.fecha||"").slice(0,4)).filter(Boolean))).sort();
  selMes.innerHTML = '<option value="">Todos</option>' + meses.map(m=>`<option value="${m}">${m}</option>`).join("");
  selAnio.innerHTML = '<option value="">Todos</option>' + anios.map(a=>`<option value="${a}">${a}</option>`).join("");
  if(meses.includes(curMes)) selMes.value = curMes;
  if(anios.includes(curAnio)) selAnio.value = curAnio;
}

function renderAccidentesTable(){
  renderAccFiltrosHistorico();
  const fTipo = document.getElementById("filterAccTipo").value;
  const fMes = document.getElementById("filterAccMes").value;
  const fAnio = document.getElementById("filterAccAnio").value;
  const fFoco = document.getElementById("filterAccFoco").value;
  const rows = CACHE.accidentes
    .filter(a=> !fTipo || a.tipo===fTipo)
    .filter(a=> !fMes || (a.fecha||"").slice(0,7)===fMes)
    .filter(a=> !fAnio || (a.fecha||"").slice(0,4)===fAnio)
    .filter(a=> !fFoco || a.focoCritico===fFoco)
    .sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  document.getElementById("accidentesTable").innerHTML = rows.map(a=>{
    const trabs = accTrabajadoresDe(a).map(id=>trabName(id)).join(", ") || "—";
    const docs = [
      a.informePreliminar? `<a href="${a.informePreliminar}" download="${a.informePreliminarNombre||'informe'}">Informe</a>` : "",
      a.fotografia? `<a href="${a.fotografia}" download="foto_${a.id}.jpg">Foto</a>` : "",
    ].filter(Boolean).join(" · ") || "—";
    return `<tr>
      <td>${fmtDate(a.fecha)}</td>
      <td><span class="pill ${a.tipo==='ctp'?'critico':a.tipo==='stp'?'alto':a.tipo==='enfermedad'?'medio':'pendiente'}">${ACC_TIPO_LABEL[a.tipo]||a.tipo}</span></td>
      <td>${a.sexo==="M"?"Hombre":a.sexo==="F"?"Mujer":"—"}</td>
      <td>${a.focoCritico || "—"}</td>
      <td>${trabs}</td>
      <td>${areaName(a.areaId)}</td>
      <td>${a.gravedad}</td>
      <td>${a.diasPerdidos||0}</td>
      <td>${a.causa||"—"}</td>
      <td>${docs}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-acc-editar="${a.id}">Editar</button>
        <button class="btn secondary small" data-acc-pdf="${a.id}">Informe PDF</button>
        <button class="subtle-btn" data-acc-eliminar="${a.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td class="empty" colspan="10">Sin registros para el filtro seleccionado</td></tr>`;
}
document.getElementById("filterAccTipo").addEventListener("change", renderAccidentesTable);
document.getElementById("filterAccMes").addEventListener("change", renderAccidentesTable);
document.getElementById("filterAccAnio").addEventListener("change", renderAccidentesTable);
document.getElementById("filterAccFoco").addEventListener("change", renderAccidentesTable);
on(document.getElementById("accidentesTable"), "click", async (e) => {
  const editBtn = e.target.closest("button[data-acc-editar]");
  if(editBtn){ startEditAcc(editBtn.dataset.accEditar); return; }
  const pdfBtn = e.target.closest("button[data-acc-pdf]");
  if(pdfBtn){
    const rec = CACHE.accidentes.find(a=>a.id===pdfBtn.dataset.accPdf);
    if(rec) await descargarInformeAccidentePdf(rec);
    return;
  }
  const delBtn = e.target.closest("button[data-acc-eliminar]");
  if(delBtn){
    const rec = CACHE.accidentes.find(a=>a.id===delBtn.dataset.accEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar el registro del ${fmtDate(rec.fecha)} (${ACC_TIPO_LABEL[rec.tipo]||rec.tipo})? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("accidentes", rec.id);
    await loadCache();
    if(accEditingId === rec.id) resetAccForm();
    renderAccidentesTable(); renderAccidentabilidad();
  }
});

/* Logo de la empresa (v1.35), si se cargó en Configuración, se agrega en
   la esquina superior derecha de cada informe PDF de Accidentabilidad. Si
   el formato de imagen no es compatible con jsPDF simplemente se omite,
   sin interrumpir la generación del resto del informe. */
function addLogoPdf(doc){
  if(!(CACHE.empresa && CACHE.empresa.logo)) return;
  try{
    const match = /^data:image\/(png|jpe?g);base64,/i.exec(CACHE.empresa.logo);
    const fmt = match ? (match[1].toLowerCase()==="jpg" ? "JPEG" : match[1].toUpperCase()) : "PNG";
    doc.addImage(CACHE.empresa.logo, fmt, 168, 8, 28, 18);
  }catch(e){ /* formato de imagen no soportado por jsPDF: se omite */ }
}
function datosEmpresaLineaPdf(){
  const e = CACHE.empresa || {};
  const partes = [
    e.direccion ? `Dirección: ${e.direccion}` : "",
    e.organismoAdministrador ? `Organismo administrador: ${e.organismoAdministrador}` : "",
    e.numAdherente ? `N° adherente: ${e.numAdherente}` : "",
  ].filter(Boolean);
  return partes.join("   ·   ");
}

on(document.getElementById("downloadAccPdfBtn"), "click", async () => {
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const ind = accidentabilidadIndicadores();
  const {actual, mejor} = computeRachas();
  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(15);
  doc.text("Informe de accidentabilidad", 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatos = datosEmpresaLineaPdf();
  if(lineaDatos){ doc.text(lineaDatos, 14, y); y += 6; }
  y += 2;
  doc.autoTable({ startY:y, head:[["Indicador","Valor"]], body:[
    ["Días sin accidentes con tiempo perdido", actual===null?"—":actual],
    ["Mejor racha histórica (días)", mejor===null?"—":mejor],
    ["Tasa de frecuencia", ind.tf],
    ["Tasa de gravedad (excluye trayecto y enfermedad profesional)", ind.tg],
    ["Índice de accidentabilidad", ind.indiceAcc+"%"],
    ["Accidentes con tiempo perdido", ind.totalCTP],
    ["Accidentes sin tiempo perdido", ind.totalSTP],
    ["Accidentes de trayecto", ind.totalTrayecto],
    ["Enfermedades profesionales", ind.totalEnfermedad],
    ["Incidentes / cuasi accidentes", ind.totalIncidentes],
    ["Total horas-hombre trabajadas", ind.totalHH],
  ], styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 8;

  doc.setFontSize(12); doc.text("Registro histórico de accidentes e incidentes", 14, y); y += 4;
  const rows = CACHE.accidentes.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  doc.autoTable({ startY:y, head:[["Fecha","Tipo","Sexo","Foco crítico","Trabajadores","Área","Gravedad","Días perdidos","Causa"]],
    body: rows.map(a=>[
      fmtDate(a.fecha), ACC_TIPO_LABEL[a.tipo]||a.tipo, a.sexo==="M"?"Hombre":a.sexo==="F"?"Mujer":"—", a.focoCritico||"—",
      accTrabajadoresDe(a).map(id=>trabName(id)).join(", ")||"—",
      areaName(a.areaId), a.gravedad||"—", a.diasPerdidos||0, a.causa||"—"
    ]), styles:{fontSize:7.5}, headStyles:{fillColor:[236,131,90]} });

  doc.save(`Informe_Accidentabilidad_${new Date().toISOString().slice(0,10)}.pdf`);
});

/* Informe mensual/anual "para gerencia": a diferencia del informe anterior
   (que es el histórico acumulado completo), este toma solo el período
   seleccionado en el control estadístico mensual/anual de arriba, e incluye
   el desglose por sexo y, si está activado, los indicadores RIRDA/LDR. */
function generarInformeGerenciaPDF(tipoPeriodo, valor){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const {accs, hh} = accFiltrarPorPeriodo(tipoPeriodo, valor);
  const ind = calcIndicadores(accs, hh);
  const usaRirda = !!(CACHE.empresa && CACHE.empresa.usarRirdaLdr);
  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(15);
  doc.text(`Informe de accidentabilidad para gerencia — ${tipoPeriodo==="mensual"?"mes":"año"} ${valor}`, 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatosGer = datosEmpresaLineaPdf();
  if(lineaDatosGer){ doc.text(lineaDatosGer, 14, y); y += 6; }
  y += 2;
  const body = [
    ["Tasa de frecuencia", ind.tf],
    ["Tasa de gravedad (excluye trayecto y enfermedad profesional)", ind.tg],
    ["Índice de accidentabilidad", ind.indiceAcc+"%"],
    ["Accidentes con tiempo perdido", ind.totalCTP],
    ["Accidentes sin tiempo perdido", ind.totalSTP],
    ["Accidentes de trayecto", ind.totalTrayecto],
    ["Enfermedades profesionales", ind.totalEnfermedad],
    ["Incidentes / cuasi accidentes", ind.totalIncidentes],
    ["Total horas-hombre del período", ind.totalHH],
    ["Accidentados — hombres", ind.hombres],
    ["Accidentadas — mujeres", ind.mujeres],
    ["Accidentados — sin dato de sexo", ind.sinDatoSexo],
  ];
  if(usaRirda){
    body.push(["RIRDA — índice de frecuencia (base 200.000 HH)", ind.rirda]);
    body.push(["LDR — índice de gravedad (base 200.000 HH)", ind.ldr]);
  }
  doc.autoTable({ startY:y, head:[["Indicador","Valor"]], body, styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 8;

  doc.setFontSize(12); doc.text("Registro de accidentes e incidentes del período", 14, y); y += 4;
  const rows = accs.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  doc.autoTable({ startY:y, head:[["Fecha","Tipo","Sexo","Foco crítico","Trabajadores","Área","Gravedad","Días perdidos","Causa"]],
    body: rows.map(a=>[
      fmtDate(a.fecha), ACC_TIPO_LABEL[a.tipo]||a.tipo, a.sexo==="M"?"Hombre":a.sexo==="F"?"Mujer":"—", a.focoCritico||"—",
      accTrabajadoresDe(a).map(id=>trabName(id)).join(", ")||"—",
      areaName(a.areaId), a.gravedad||"—", a.diasPerdidos||0, a.causa||"—"
    ]), styles:{fontSize:7.5}, headStyles:{fillColor:[236,131,90]} });
  y = doc.lastAutoTable.finalY + 10;
  if(y > 265){ doc.addPage(); y = 16; }
  doc.setFontSize(9);
  doc.text(`Generado el ${fmtDate(new Date().toISOString().slice(0,10))} — informe interno para presentación a gerencia.`, 14, y);

  doc.save(`Informe_Gerencia_Accidentabilidad_${tipoPeriodo}_${valor}_${new Date().toISOString().slice(0,10)}.pdf`);
}
on(document.getElementById("downloadAccGerenciaMesBtn"), "click", () => {
  const v = document.getElementById("accPeriodoMes").value;
  if(!v){ alert("No hay datos suficientes (horas-hombre o accidentes) para generar el informe de un mes."); return; }
  generarInformeGerenciaPDF("mensual", v);
});
on(document.getElementById("downloadAccGerenciaAnioBtn"), "click", () => {
  const v = document.getElementById("accPeriodoAnio").value;
  if(!v){ alert("No hay datos suficientes (horas-hombre o accidentes) para generar el informe de un año."); return; }
  generarInformeGerenciaPDF("anual", v);
});

/* =========================================================
   PDF PARA GERENCIA — RESUMEN EJECUTIVO DEL DASHBOARD (v1.43)
   A diferencia del informe de accidentabilidad anterior (que solo cubre
   ese módulo), este informe resume el estado de TODOS los módulos que se
   muestran en el Dashboard, pensado para entregar a gerencia en una sola
   revisión: matriz de riesgos, vigilancia de salud, inspecciones,
   programa de seguridad, capacitación, accidentabilidad, cumplimiento
   legal DS 44 (FUF), EPP, infractores, ranking de velocidad y próximos
   vencimientos.
   ========================================================= */
/* Reúne todos los datos calculados para el informe ejecutivo del Dashboard
   (indicadores, tablas por módulo), usados tanto por la descarga en PDF
   como por la descarga en PPT, para que ambos formatos muestren siempre
   exactamente la misma información. */
function datosInformeGerencia(){
  const racha = computeRachas();
  const findingsAll = CACHE.inspecciones.flatMap(i=>i.findings||[]);
  const accionesAbiertas = findingsAll.filter(f=>f.estado!=="cerrada").length;
  const riesgosCriticos = CACHE.matriz.filter(m=>nivelRiesgo(m.probabilidad,m.consecuencia)==="critico").length;
  const protAplicables = protocolosAplicables();
  const totalAsig = protAplicables.length;
  const vigentes = protAplicables.filter(p=>{ const v = protocoloVigenciaBitacora(p); return v && v.estado==="vigente"; }).length;
  const cumplPct = totalAsig? Math.round(vigentes/totalAsig*100) : 0;
  const pgTotal = CACHE.programa.length;
  const pgRealizadas = CACHE.programa.filter(p=>estadoPrograma(p)==="realizada").length;
  const pgPct = pgTotal? Math.round(pgRealizadas/pgTotal*100) : 0;
  const capStats = CACHE.capacitaciones.map(capacitacionCumplimiento);
  const capConvocados = capStats.reduce((a,c)=>a+c.convocados,0);
  const capAsistieron = capStats.reduce((a,c)=>a+c.asistieron,0);
  const capPct = capConvocados? Math.round(capAsistieron/capConvocados*100) : 0;
  // Se respeta el mismo período (todo el histórico / mes / año) elegido en
  // el selector del Dashboard, para Accidentabilidad, EPP, Infractores y
  // Ranking de velocidad (los demás indicadores son de estado vigente).
  const periodo = dashboardPeriodoActual();
  const indAcc = calcIndicadores(periodo.accs, periodo.hh);
  const fufCounts = {cumple:0, cumple_parcial:0, no_cumple:0, no_aplica:0, sin_evaluar:0};
  FUF_ITEMS.forEach(it=>{ const rec = CACHE.cumplimientoLegal.find(r=>r.numero===it.numero); const n = (rec && rec.nivel) || "sin_evaluar"; fufCounts[n]++; });
  const fufEvaluables = FUF_ITEMS.length - fufCounts.no_aplica;
  const fufPct = fufEvaluables? Math.round(fufCounts.cumple/fufEvaluables*100) : 0;
  const periodoTitulo = periodo.tipo==="mensual" ? `mes ${periodo.valor||"—"}` : periodo.tipo==="anual" ? `año ${periodo.valor||"—"}` : "todo el histórico";

  const usaRirda = !!(CACHE.empresa && CACHE.empresa.usarRirdaLdr);
  const indicadoresBody = [
    ["Días sin accidentes con tiempo perdido", racha.actual===null?"—":racha.actual],
    ["Riesgos críticos en matriz", riesgosCriticos+" de "+CACHE.matriz.length+" líneas"],
    ["Cumplimiento vigilancia de salud", cumplPct+"% ("+vigentes+" de "+totalAsig+" vigentes)"],
    ["Hallazgos de inspección con acción abierta", accionesAbiertas],
    ["Cumplimiento programa de seguridad", pgPct+"% ("+pgRealizadas+" de "+pgTotal+")"],
    ["Cumplimiento plan de capacitación", capPct+"% ("+capAsistieron+" de "+capConvocados+")"],
    ["Tasa de frecuencia", indAcc.tf],
    ["Tasa de gravedad", indAcc.tg],
    ["Índice de accidentabilidad", indAcc.indiceAcc+"%"],
  ];
  if(usaRirda){
    indicadoresBody.push(["RIRDA", indAcc.rirda]);
    indicadoresBody.push(["LDR", indAcc.ldr]);
  }
  indicadoresBody.push(
    ["Cumplimiento legal DS 44 (FUF)", fufPct+"% ("+fufCounts.cumple+" de "+fufEvaluables+" ítems evaluables)"],
    ["Vales de EPP entregados", periodo.eppRows.length],
    ["Infracciones registradas", periodo.infRows.length],
    ["Eventos de exceso de velocidad", periodo.velRows.reduce((s,v)=>s+(+v.eventos||0),0)],
    ["Registros AST", (CACHE.astRegistros||[]).length],
    ["Puestos evaluados TMERT", (CACHE.tmertRegistros||[]).length],
    ["Análisis de causa raíz realizados", (CACHE.arbolesCausales||[]).length],
  );

  const accTipos = ["ctp","stp","trayecto","incidente","enfermedad"];
  const accTipoBody = accTipos.map(t=>[ACC_TIPO_LABEL[t], periodo.accs.filter(a=>a.tipo===t).length]);

  const focos = getCatalog("focoCritico");
  const focoBody = focos.map(f=>[f, periodo.accs.filter(a=>a.focoCritico===f).length]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);

  const fufBody = ["cumple","cumple_parcial","no_cumple","no_aplica","sin_evaluar"].map(n=>[FUF_NIVEL_LABEL[n], fufCounts[n]||0]);

  const eppCounts = new Map();
  periodo.eppRows.forEach(v=> (v.items||[]).forEach(it=>{ eppCounts.set(it.epp, (eppCounts.get(it.epp)||0) + (+it.cantidad||0)); }));
  const eppBody = Array.from(eppCounts.entries()).sort((a,b)=>b[1]-a[1]).slice(0,10);

  const upcoming = [];
  CACHE.matriz.forEach(m=>{ if(m.plazo && m.estado!=="cerrada"){ const days=daysUntil(m.plazo); if(days<=30) upcoming.push(["Acción de control", `${m.peligro} (${areaName(m.areaId)})`, fmtDate(m.plazo), days]); }});
  protAplicables.forEach(p=>{ const v = protocoloVigenciaBitacora(p); if(v && v.vigenteHasta){ const days = daysUntil(v.vigenteHasta); if(days<=30) upcoming.push(["Vigencia protocolo "+p.nombre, "Próxima reevaluación", fmtDate(v.vigenteHasta), days]); } });
  CACHE.programa.forEach(p=>{ if(!p.fechaRealizada && p.fechaProgramada){ const days = daysUntil(p.fechaProgramada); if(days<=30) upcoming.push(["Programa: "+p.nombre, areaName(p.areaId), fmtDate(p.fechaProgramada), days]); }});
  CACHE.capacitaciones.forEach(c=>{ if(!c.fechaRealizada && c.fechaProgramada){ const days = daysUntil(c.fechaProgramada); if(days<=30) upcoming.push(["Capacitación: "+c.nombre, (c.participantes||[]).length+" convocados", fmtDate(c.fechaProgramada), days]); }});
  upcoming.sort((a,b)=>a[3]-b[3]);

  return { periodo, periodoTitulo, indicadoresBody, accTipoBody, focoBody, fufBody, eppBody, upcoming };
}

/* Dibuja un gráfico de barras horizontales simple directamente con las
   primitivas de dibujo de jsPDF (rectángulos), sin depender de ninguna
   librería de gráficos ni de capturar el DOM: rows es [[etiqueta,valor],...].
   Retorna la coordenada Y final (para seguir agregando contenido debajo). */
function dibujarBarraHorizontalPdf(doc, x, y, w, rows, colorRGB){
  if(!rows.length) return y;
  const maxVal = Math.max(1, ...rows.map(r=>+r[1]||0));
  const barH = 5, gap = 2.6, labelW = 60;
  doc.setFontSize(8);
  rows.forEach((r,i)=>{
    const yy = y + i*(barH+gap);
    doc.setTextColor(50,50,50);
    doc.text(String(r[0]).slice(0,42), x, yy+barH-1.2);
    const val = +r[1]||0;
    const barW = Math.max(0.6, (w-labelW-14) * (val/maxVal));
    doc.setFillColor(colorRGB[0], colorRGB[1], colorRGB[2]);
    doc.rect(x+labelW, yy, barW, barH, "F");
    doc.setTextColor(0,0,0);
    doc.text(String(val), x+labelW+barW+2, yy+barH-1.2);
  });
  doc.setTextColor(0,0,0);
  return y + rows.length*(barH+gap) + 4;
}
/* Informe ejecutivo del Dashboard en PDF (usa datosInformeGerencia()). */
function generarInformeDashboardGerenciaPDF(){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const datos = datosInformeGerencia();

  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(16);
  doc.text("Informe ejecutivo para gerencia — prevención de riesgos", 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatos = datosEmpresaLineaPdf();
  if(lineaDatos){ doc.text(lineaDatos, 14, y); y += 6; }
  doc.text(`Período de Accidentabilidad/EPP/Infractores/Velocidad: ${datos.periodoTitulo}`, 14, y); y += 6;
  doc.text(`Generado el ${fmtDate(new Date().toISOString().slice(0,10))}`, 14, y); y += 8;

  doc.autoTable({ startY:y, head:[["Indicador","Valor"]], body: datos.indicadoresBody, styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 8;

  if(y > 240){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text(`Accidentes e incidentes por tipo (${datos.periodoTitulo})`, 14, y); y += 4;
  doc.autoTable({ startY:y, head:[["Tipo","Cantidad"]], body: datos.accTipoBody, styles:{fontSize:9}, headStyles:{fillColor:[208,59,59]} });
  y = doc.lastAutoTable.finalY + 8;
  if(datos.accTipoBody.some(r=>r[1]>0)){
    const alturaChart = datos.accTipoBody.length*7.6 + 4;
    if(y + alturaChart > 275){ doc.addPage(); y = 16; }
    doc.setFontSize(9.5); doc.text("Gráfico — accidentes por tipo", 14, y); y += 5;
    y = dibujarBarraHorizontalPdf(doc, 14, y, 182, datos.accTipoBody, [208,59,59]);
  }

  if(y > 240){ doc.addPage(); y = 16; }
  if(datos.focoBody.length){
    doc.setFontSize(12); doc.text("Accidentes por foco crítico", 14, y); y += 4;
    doc.autoTable({ startY:y, head:[["Foco crítico","Cantidad"]], body: datos.focoBody, styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
    y = doc.lastAutoTable.finalY + 8;
    const alturaChart = datos.focoBody.length*7.6 + 4;
    if(y + alturaChart > 275){ doc.addPage(); y = 16; }
    doc.setFontSize(9.5); doc.text("Gráfico — accidentes por foco crítico", 14, y); y += 5;
    y = dibujarBarraHorizontalPdf(doc, 14, y, 182, datos.focoBody, [42,120,214]);
  }

  if(y > 230){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("Cumplimiento legal DS 44 (FUF) — por nivel", 14, y); y += 4;
  doc.autoTable({ startY:y, head:[["Nivel","Cantidad de ítems"]], body: datos.fufBody, styles:{fontSize:9}, headStyles:{fillColor:[12,163,12]} });
  y = doc.lastAutoTable.finalY + 8;
  {
    const alturaChart = datos.fufBody.length*7.6 + 4;
    if(y + alturaChart > 275){ doc.addPage(); y = 16; }
    doc.setFontSize(9.5); doc.text("Gráfico — cumplimiento legal DS 44 (FUF)", 14, y); y += 5;
    y = dibujarBarraHorizontalPdf(doc, 14, y, 182, datos.fufBody, [12,163,12]);
  }

  if(datos.eppBody.length){
    if(y > 240){ doc.addPage(); y = 16; }
    doc.setFontSize(12); doc.text("EPP más entregados", 14, y); y += 4;
    doc.autoTable({ startY:y, head:[["Elemento","Cantidad total entregada"]], body: datos.eppBody, styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
    y = doc.lastAutoTable.finalY + 8;
    const alturaChart = datos.eppBody.length*7.6 + 4;
    if(y + alturaChart > 275){ doc.addPage(); y = 16; }
    doc.setFontSize(9.5); doc.text("Gráfico — EPP más entregados", 14, y); y += 5;
    y = dibujarBarraHorizontalPdf(doc, 14, y, 182, datos.eppBody, [42,120,214]);
  }

  if(datos.upcoming.length){
    if(y > 230){ doc.addPage(); y = 16; }
    doc.setFontSize(12); doc.text("Próximos vencimientos (30 días)", 14, y); y += 4;
    doc.autoTable({ startY:y, head:[["Tipo","Detalle","Fecha","Días"]], body: datos.upcoming.map(u=>[u[0],u[1],u[2],u[3]<0?"Vencido":u[3]+" días"]), styles:{fontSize:8.5}, headStyles:{fillColor:[236,131,90]} });
    y = doc.lastAutoTable.finalY + 8;
  }

  if(y > 270){ doc.addPage(); y = 16; }
  doc.setFontSize(9);
  doc.text("Informe generado automáticamente desde el Dashboard, para presentación a gerencia.", 14, y);

  doc.save(`Informe_Dashboard_Gerencia_${new Date().toISOString().slice(0,10)}.pdf`);
}
on(document.getElementById("dashboardGerenciaPdfBtn"), "click", () => generarInformeDashboardGerenciaPDF());

/* =========================================================
   GENERACIÓN DE PPT (PptxGenJS, cargado desde CDN)
   Misma información que el PDF ejecutivo (datosInformeGerencia()),
   pero organizada como diapositivas: portada, indicadores, y una
   diapositiva por tabla (accidentes por tipo, foco crítico, FUF,
   EPP más entregados, próximos vencimientos), lista para presentar
   directamente a gerencia.
   ========================================================= */
function getPptxGen(){
  if(typeof window.PptxGenJS === "undefined") return null;
  return window.PptxGenJS;
}
function pptTablaSlide(pptx, titulo, head, body, opts){
  const slide = pptx.addSlide();
  slide.addText(titulo, { x:0.4, y:0.3, w:9.2, h:0.6, fontSize:20, bold:true, color:"1c4e91" });
  if(!body.length){
    slide.addText("Sin datos registrados para esta sección.", { x:0.4, y:1.2, w:9.2, h:0.5, fontSize:13, color:"898781", italic:true });
    return;
  }
  const rows = [ head.map(h=>({text:h, options:{bold:true, color:"FFFFFF", fill:{color:"1C4E91"}}})) ]
    .concat(body.map(r=> r.map(c=>({text:String(c)}))));
  slide.addTable(rows, Object.assign({ x:0.4, y:1.1, w:9.2, fontSize:11, autoPage:true, autoPageLineWeight:0.5 }, opts||{}));
}
/* Diapositiva con un gráfico de barras nativo de PptxGenJS (no requiere
   ninguna imagen ni librería adicional: pptxgenjs ya trae su propio
   motor de gráficos), a partir de rows=[[etiqueta,valor],...]. */
function pptChartSlide(pptx, titulo, rows, colorHex){
  const slide = pptx.addSlide();
  slide.addText(titulo, { x:0.4, y:0.3, w:9.2, h:0.6, fontSize:20, bold:true, color:"1c4e91" });
  if(!rows.length || !rows.some(r=>(+r[1]||0)>0)){
    slide.addText("Sin datos registrados para esta sección.", { x:0.4, y:1.2, w:9.2, h:0.5, fontSize:13, color:"898781", italic:true });
    return;
  }
  const chartData = [{ name: titulo, labels: rows.map(r=>String(r[0])), values: rows.map(r=>+r[1]||0) }];
  slide.addChart(pptx.ChartType.bar, chartData, {
    x:0.4, y:1.1, w:9.2, h:4.2,
    barDir:"bar", chartColors:[colorHex||"2A78D6"],
    showTitle:false, showLegend:false, showValue:true,
    catAxisLabelFontSize:10, valAxisLabelFontSize:10,
  });
}
function generarInformeDashboardGerenciaPPT(){
  const PptxGenJSClass = getPptxGen();
  if(!PptxGenJSClass){ alert("No se pudo cargar el generador de PPT (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const datos = datosInformeGerencia();
  const pptx = new PptxGenJSClass();
  pptx.defineLayout({ name:"WIDE", width:10, height:5.63 });
  pptx.layout = "WIDE";

  const portada = pptx.addSlide();
  portada.background = { color:"0B2A4A" };
  portada.addText("Informe ejecutivo para gerencia", { x:0.5, y:1.6, w:9, h:0.9, fontSize:32, bold:true, color:"FFFFFF" });
  portada.addText("Prevención de riesgos — DS 44 / DS 594 / DS 67", { x:0.5, y:2.35, w:9, h:0.5, fontSize:16, color:"BFD3EC" });
  portada.addText((CACHE.empresa&&CACHE.empresa.razonSocial)||"—", { x:0.5, y:3.1, w:9, h:0.5, fontSize:18, bold:true, color:"FFFFFF" });
  portada.addText(`Período de Accidentabilidad/EPP/Infractores/Velocidad: ${datos.periodoTitulo}`, { x:0.5, y:3.6, w:9, h:0.4, fontSize:13, color:"E4ECF7" });
  portada.addText(`Generado el ${fmtDate(new Date().toISOString().slice(0,10))}`, { x:0.5, y:4.0, w:9, h:0.4, fontSize:12, color:"E4ECF7" });

  pptTablaSlide(pptx, "Indicadores principales", ["Indicador","Valor"], datos.indicadoresBody, { colW:[6.6,2.6] });
  pptTablaSlide(pptx, `Accidentes e incidentes por tipo (${datos.periodoTitulo})`, ["Tipo","Cantidad"], datos.accTipoBody, { colW:[6.6,2.6] });
  pptChartSlide(pptx, `Gráfico — accidentes por tipo (${datos.periodoTitulo})`, datos.accTipoBody, "D03B3B");
  if(datos.focoBody.length){
    pptTablaSlide(pptx, "Accidentes por foco crítico", ["Foco crítico","Cantidad"], datos.focoBody, { colW:[6.6,2.6] });
    pptChartSlide(pptx, "Gráfico — accidentes por foco crítico", datos.focoBody, "2A78D6");
  }
  pptTablaSlide(pptx, "Cumplimiento legal DS 44 (FUF) — por nivel", ["Nivel","Cantidad de ítems"], datos.fufBody, { colW:[6.6,2.6] });
  pptChartSlide(pptx, "Gráfico — cumplimiento legal DS 44 (FUF)", datos.fufBody, "0CA30C");
  if(datos.eppBody.length){
    pptTablaSlide(pptx, "EPP más entregados", ["Elemento","Cantidad total entregada"], datos.eppBody, { colW:[6.6,2.6] });
    pptChartSlide(pptx, "Gráfico — EPP más entregados", datos.eppBody, "2A78D6");
  }
  if(datos.upcoming.length) pptTablaSlide(pptx, "Próximos vencimientos (30 días)", ["Tipo","Detalle","Fecha","Días"],
    datos.upcoming.map(u=>[u[0],u[1],u[2],u[3]<0?"Vencido":u[3]+" días"]), { colW:[3.2,3.0,1.8,1.2], fontSize:10 });

  pptx.writeFile({ fileName:`Informe_Dashboard_Gerencia_${new Date().toISOString().slice(0,10)}.pptx` });
}
on(document.getElementById("dashboardGerenciaPptBtn"), "click", () => generarInformeDashboardGerenciaPPT());

/* =========================================================
   ANÁLISIS DE CAUSA RAÍZ — ÁRBOL CAUSAL (v1.42; rediseñado v1.60
   siguiendo la Guía para la Investigación de Accidentes — Metodología
   Árbol de Causas).
   Cada hecho puede "anteceder a" uno o VARIOS hechos posteriores
   (array `precedeA`), lo que permite representar los 4 tipos de
   relación de la metodología:
     - Encadenamiento: un hecho antecede a un único hecho posterior.
     - Conjunción ("Y"): dos o más hechos distintos anteceden al MISMO
       hecho posterior (convergen sobre él en el árbol).
     - Disyunción: un mismo hecho antecede a VARIOS hechos posteriores
       distintos (diverge hacia varias consecuencias).
     - Hechos independientes: simplemente no se conectan entre sí.
   Un hecho sin nada que lo tenga como antecedente (nadie lo incluye en
   su precedeA) se considera automáticamente una causa raíz.
   ========================================================= */
const ARBOL_TIPO_LABEL = { individuo:"Individuo", tarea:"Tarea / método", material:"Material / equipo", entorno:"Medio (entorno)", gestion:"Gestión / organización" };
const ARBOL_TIPO_COLOR = { individuo:"medio", tarea:"pendiente", material:"alto", entorno:"vigente", gestion:"proceso" };
const ARBOL_TIPO_STROKE = { individuo:"#c9932a", tarea:"#b8860b", material:"#c0392b", entorno:"#2a9d5c", gestion:"#6a4fc0" };
const ARBOL_PLAZO_LABEL = { corto:"Corto plazo", mediano:"Mediano plazo", largo:"Largo plazo" };
/* Palabras que suelen delatar una interpretación o un juicio de valor
   en vez de un hecho verificable (regla central del método). Es solo
   una alerta orientativa, no bloquea el ingreso. */
const ARBOL_PALABRAS_JUICIO = /\b(negligente|negligencia|deficiente|deficiencia|insuficiente|insuficiencia|debía|deber[íi]a|imprudente|imprudencia|irresponsable|descuidado|descuido|mal\s+hecho|incompetente)\b/i;
let arbolEditingId = null;
let currentArbolHechos = []; // {id, texto, tipo, precedeA:[ids|"central"], medidaCorrectiva, medidaPreventiva, plazo}

/* Normaliza un hecho para leer siempre precedeA como arreglo, incluso
   si viene de un análisis guardado antes de la v1.60 (que usaba un
   único `parentId`). */
function hechoPrecedeA(h){
  if(Array.isArray(h.precedeA) && h.precedeA.length) return h.precedeA;
  return [h.parentId || "central"];
}

function textoHechoCentralDeAccidente(rec){
  if(!rec) return "";
  const partes = [
    `${ACC_TIPO_LABEL[rec.tipo]||rec.tipo} ocurrido el ${fmtDate(rec.fecha)} en ${areaName(rec.areaId)}.`,
    rec.causa ? `Causa registrada: ${rec.causa}.` : "",
    rec.descripcion ? rec.descripcion : "",
  ].filter(Boolean);
  return partes.join(" ");
}
on(document.getElementById("arbolAccidenteSel"), "change", () => {
  const rec = CACHE.accidentes.find(a=>a.id===document.getElementById("arbolAccidenteSel").value);
  document.getElementById("arbolHechoCentral").value = textoHechoCentralDeAccidente(rec);
});
on(document.getElementById("arbolHechoTexto"), "input", (e) => {
  const alerta = document.getElementById("arbolHechoJuicioAlerta");
  alerta.style.display = ARBOL_PALABRAS_JUICIO.test(e.target.value) ? "" : "none";
});

/* Mapa target(id de hecho o "central") -> lista de hechos que lo
   anteceden (que aparecen en su precedeA). */
function arbolHijosMap(hechos){
  const map = new Map();
  hechos.forEach(h=>{
    hechoPrecedeA(h).forEach(target=>{
      const key = target || "central";
      if(!map.has(key)) map.set(key, []);
      map.get(key).push(h);
    });
  });
  return map;
}
function esCausaRaiz(hecho, hechos){
  return !hechos.some(h=>hechoPrecedeA(h).includes(hecho.id));
}
/* Quita un hecho del árbol. Si, tras quitar la conexión, algún otro
   hecho queda sin ningún destino (no antecede a nada porque solo
   antecedía a este), también se elimina en cascada, ya que un hecho
   "colgando" sin consecuencia no tiene sentido en el árbol. */
function quitarHechoYDescendientes(id){
  currentArbolHechos = currentArbolHechos.filter(h=>h.id!==id);
  currentArbolHechos.forEach(h=>{ h.precedeA = hechoPrecedeA(h).filter(t=>t!==id); });
  const huerfanos = currentArbolHechos.filter(h=>hechoPrecedeA(h).length===0).map(h=>h.id);
  huerfanos.forEach(hid=>quitarHechoYDescendientes(hid));
}

/* Distancia (en cantidad de hechos) de cada hecho hasta el hecho
   central, siguiendo su(s) precedeA. El hecho central tiene distancia
   0; un hecho que antecede directamente al central tiene distancia 1;
   y así sucesivamente. Si un hecho antecede a varios destinos con
   distinta distancia (disyunción), se usa la mayor, para que el árbol
   quede alineado por columnas sin que ninguna línea "retroceda".
   Incluye una guarda simple contra ciclos accidentales. */
function calcArbolDistancias(hechos){
  const dist = new Map();
  dist.set("central", 0);
  const enCurso = new Set();
  function distanciaDe(id){
    if(dist.has(id)) return dist.get(id);
    if(enCurso.has(id)) return 0; // ciclo accidental: se corta aquí
    enCurso.add(id);
    const h = hechos.find(x=>x.id===id);
    if(!h){ dist.set(id, 0); enCurso.delete(id); return 0; }
    const targets = hechoPrecedeA(h);
    const d = 1 + Math.max(...targets.map(t=>distanciaDe(t)));
    dist.set(id, d);
    enCurso.delete(id);
    return d;
  }
  hechos.forEach(h=>distanciaDe(h.id));
  return dist;
}

/* Dibuja el árbol como un diagrama de izquierda a derecha (causas raíz
   a la izquierda, convergiendo hacia el hecho central a la derecha),
   igual que el esquema de la Guía de Investigación de Accidentes:
   cajas HTML posicionadas por columna/fila, con líneas SVG que las
   conectan (una línea por cada relación "antecede a"). */
const ARBOL_BOX_W = 190, ARBOL_BOX_H = 92, ARBOL_COL_GAP = 46, ARBOL_ROW_GAP = 16, ARBOL_MARGIN = 16;
/* Versión reutilizable del diagrama del árbol causal, parametrizada
   (no depende del formulario de edición en pantalla ni de sus
   variables globales), para poder generar el "mapa" de cualquier
   registro de árbol causal guardado -por ejemplo, al exportar el PDF
   de un accidente- y no solo el que está abierto para edición. */
function construirArbolMapaHtml(centralTexto, hechos){
  const central = centralTexto || "(hecho central sin descripción)";
  const dist = calcArbolDistancias(hechos);
  const maxDist = Math.max(0, ...hechos.map(h=>dist.get(h.id)||0));
  const porColumna = new Map();
  const idsOrdenados = hechos.slice().sort((a,b)=> (dist.get(b.id)||0)-(dist.get(a.id)||0) || a.texto.localeCompare(b.texto));
  idsOrdenados.forEach(h=>{
    const d = dist.get(h.id)||0;
    if(!porColumna.has(d)) porColumna.set(d, []);
    porColumna.get(d).push(h.id);
  });
  const pos = new Map();
  function xDeDistancia(d){ return ARBOL_MARGIN + (maxDist-d)*(ARBOL_BOX_W+ARBOL_COL_GAP); }
  porColumna.forEach((ids, d)=>{
    ids.forEach((id, i)=>{ pos.set(id, { x:xDeDistancia(d), y:ARBOL_MARGIN + i*(ARBOL_BOX_H+ARBOL_ROW_GAP) }); });
  });
  pos.set("central", { x:xDeDistancia(0), y: ARBOL_MARGIN + Math.max(0,((porColumna.get(0)||[]).length-1))*(ARBOL_BOX_H+ARBOL_ROW_GAP)/2 });
  const maxFilas = Math.max(1, ...Array.from(porColumna.values()).map(a=>a.length), (porColumna.get(0)||[]).length||1);
  const totalW = ARBOL_MARGIN*2 + (maxDist+1)*ARBOL_BOX_W + maxDist*ARBOL_COL_GAP;
  const totalH = ARBOL_MARGIN*2 + maxFilas*ARBOL_BOX_H + (maxFilas-1)*ARBOL_ROW_GAP;

  function cajaHtml(id, x, y){
    const esCentral = id==="central";
    const hecho = esCentral ? null : hechos.find(h=>h.id===id);
    const esRaiz = hecho && esCausaRaiz(hecho, hechos);
    const borde = esCentral ? "#2a78d6" : (esRaiz ? "#d03b3b" : (ARBOL_TIPO_STROKE[hecho.tipo]||"#9aa1ab"));
    const fondo = esCentral ? "#eef4fc" : "#fff";
    const texto = esCentral ? central : hecho.texto;
    return `<div style="position:absolute;left:${x}px;top:${y}px;width:${ARBOL_BOX_W}px;height:${ARBOL_BOX_H}px;border:2px solid ${borde};border-radius:10px;background:${fondo};padding:6px 8px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:4px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        ${esCentral ? '<span class="pill" style="background:#2a78d6;color:#fff;">Hecho central</span>' : `<span class="pill ${ARBOL_TIPO_COLOR[hecho.tipo]||'pendiente'}">${ARBOL_TIPO_LABEL[hecho.tipo]||hecho.tipo}</span>`}
        ${esRaiz ? '<span class="pill critico">Causa raíz</span>' : ''}
      </div>
      <div style="font-size:11.5px;line-height:1.25;overflow:hidden;flex:1;">${texto}</div>
    </div>`;
  }
  let boxesHtml = cajaHtml("central", pos.get("central").x, pos.get("central").y);
  hechos.forEach(h=>{ boxesHtml += cajaHtml(h.id, pos.get(h.id).x, pos.get(h.id).y); });

  let lineasHtml = "";
  hechos.forEach(h=>{
    const from = pos.get(h.id);
    hechoPrecedeA(h).forEach(targetId=>{
      const to = pos.get(targetId || "central");
      if(!to) return;
      const x1 = from.x + ARBOL_BOX_W, y1 = from.y + ARBOL_BOX_H/2;
      const x2 = to.x, y2 = to.y + ARBOL_BOX_H/2;
      const xm = x1 + (x2-x1)/2;
      lineasHtml += `<path d="M${x1},${y1} L${xm},${y1} L${xm},${y2} L${x2},${y2}" fill="none" stroke="#8b95a3" stroke-width="2" marker-end="url(#arbolArrowMapa)"/>`;
    });
  });

  return hechos.length
    ? { html: `<div style="position:relative;width:${totalW}px;height:${totalH}px;background:#fff;">
        <svg width="${totalW}" height="${totalH}" style="position:absolute;left:0;top:0;">
          <defs><marker id="arbolArrowMapa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b95a3"/></marker></defs>
          ${lineasHtml}
        </svg>
        ${boxesHtml}
      </div>`, w: totalW, h: totalH }
    : { html: `<div style="position:relative;width:${ARBOL_BOX_W+ARBOL_MARGIN*2}px;background:#fff;">${cajaHtml("central", ARBOL_MARGIN, ARBOL_MARGIN)}</div>`, w: ARBOL_BOX_W+ARBOL_MARGIN*2, h: ARBOL_BOX_H+ARBOL_MARGIN*2 };
}
/* Captura el mapa de un árbol causal como imagen PNG (dataURL), usando
   html2canvas sobre un contenedor temporal fuera de pantalla. Si
   html2canvas no está disponible (por ejemplo, sin conexión en este
   entorno), retorna null y quien llama debe seguir funcionando sin la
   imagen (degradación elegante, igual que con las demás librerías CDN
   de la aplicación). */
async function capturarArbolMapaImagen(centralTexto, hechos){
  if(typeof html2canvas === "undefined" || !hechos || !hechos.length) return null;
  const { html, w, h } = construirArbolMapaHtml(centralTexto, hechos);
  const cont = document.createElement("div");
  cont.style.cssText = `position:fixed;left:-10000px;top:0;width:${w}px;height:${h}px;`;
  cont.innerHTML = html;
  document.body.appendChild(cont);
  try{
    const canvas = await html2canvas(cont, { backgroundColor:"#ffffff", scale:2 });
    return { dataUrl: canvas.toDataURL("image/png"), w, h };
  }catch(e){
    return null;
  }finally{
    document.body.removeChild(cont);
  }
}
function drawArbolTree(){
  const wrap = document.getElementById("arbolTreeWrap");
  const central = document.getElementById("arbolHechoCentral").value.trim() || "(hecho central sin descripción todavía)";
  const hechos = currentArbolHechos;
  const dist = calcArbolDistancias(hechos);
  const maxDist = Math.max(0, ...hechos.map(h=>dist.get(h.id)||0));
  const porColumna = new Map(); // distancia -> [ids en orden]
  const idsOrdenados = hechos.slice().sort((a,b)=> (dist.get(b.id)||0)-(dist.get(a.id)||0) || a.texto.localeCompare(b.texto));
  idsOrdenados.forEach(h=>{
    const d = dist.get(h.id)||0;
    if(!porColumna.has(d)) porColumna.set(d, []);
    porColumna.get(d).push(h.id);
  });
  const pos = new Map(); // id|"central" -> {x,y}
  function xDeDistancia(d){ return ARBOL_MARGIN + (maxDist-d)*(ARBOL_BOX_W+ARBOL_COL_GAP); }
  porColumna.forEach((ids, d)=>{
    ids.forEach((id, i)=>{ pos.set(id, { x:xDeDistancia(d), y:ARBOL_MARGIN + i*(ARBOL_BOX_H+ARBOL_ROW_GAP) }); });
  });
  pos.set("central", { x:xDeDistancia(0), y: ARBOL_MARGIN + Math.max(0,((porColumna.get(0)||[]).length-1))*(ARBOL_BOX_H+ARBOL_ROW_GAP)/2 });
  const maxFilas = Math.max(1, ...Array.from(porColumna.values()).map(a=>a.length), (porColumna.get(0)||[]).length||1);
  const totalW = ARBOL_MARGIN*2 + (maxDist+1)*ARBOL_BOX_W + maxDist*ARBOL_COL_GAP;
  const totalH = ARBOL_MARGIN*2 + maxFilas*ARBOL_BOX_H + (maxFilas-1)*ARBOL_ROW_GAP;

  function cajaHtml(id, x, y, opts){
    const esCentral = id==="central";
    const hecho = esCentral ? null : hechos.find(h=>h.id===id);
    const esRaiz = hecho && esCausaRaiz(hecho, hechos);
    const borde = esCentral ? "#2a78d6" : (esRaiz ? "#d03b3b" : (ARBOL_TIPO_STROKE[hecho.tipo]||"#9aa1ab"));
    const fondo = esCentral ? "#eef4fc" : "#fff";
    const texto = esCentral ? central : hecho.texto;
    return `<div title="${texto.replace(/"/g,'&quot;')}" style="position:absolute;left:${x}px;top:${y}px;width:${ARBOL_BOX_W}px;height:${ARBOL_BOX_H}px;border:2px solid ${borde};border-radius:10px;background:${fondo};padding:6px 8px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:4px;">
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        ${esCentral ? '<span class="pill" style="background:#2a78d6;color:#fff;">Hecho central</span>' : `<span class="pill ${ARBOL_TIPO_COLOR[hecho.tipo]||'pendiente'}">${ARBOL_TIPO_LABEL[hecho.tipo]||hecho.tipo}</span>`}
        ${esRaiz ? '<span class="pill critico">Causa raíz</span>' : ''}
      </div>
      <div style="font-size:11.5px;line-height:1.25;overflow:hidden;flex:1;">${texto}</div>
      ${esCentral ? '' : `<button class="subtle-btn" style="align-self:flex-start;" data-arbol-quitar="${id}">Quitar</button>`}
    </div>`;
  }
  let boxesHtml = cajaHtml("central", pos.get("central").x, pos.get("central").y);
  hechos.forEach(h=>{ boxesHtml += cajaHtml(h.id, pos.get(h.id).x, pos.get(h.id).y); });

  let lineasHtml = "";
  hechos.forEach(h=>{
    const from = pos.get(h.id);
    hechoPrecedeA(h).forEach(targetId=>{
      const to = pos.get(targetId || "central");
      if(!to) return;
      const x1 = from.x + ARBOL_BOX_W, y1 = from.y + ARBOL_BOX_H/2;
      const x2 = to.x, y2 = to.y + ARBOL_BOX_H/2;
      const xm = x1 + (x2-x1)/2;
      lineasHtml += `<path d="M${x1},${y1} L${xm},${y1} L${xm},${y2} L${x2},${y2}" fill="none" stroke="#8b95a3" stroke-width="2" marker-end="url(#arbolArrow)"/>`;
    });
  });

  wrap.innerHTML = hechos.length
    ? `<div style="position:relative;width:${totalW}px;height:${totalH}px;">
        <svg width="${totalW}" height="${totalH}" style="position:absolute;left:0;top:0;">
          <defs><marker id="arbolArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b95a3"/></marker></defs>
          ${lineasHtml}
        </svg>
        ${boxesHtml}
      </div>`
    : `<div style="position:relative;width:${ARBOL_BOX_W+ARBOL_MARGIN*2}px;">${cajaHtml("central", ARBOL_MARGIN, ARBOL_MARGIN)}</div><div class="empty" style="margin-top:8px;">Aún no se han agregado hechos antecedentes.</div>`;

  const sel = document.getElementById("arbolAntecedeA");
  const curSel = Array.from(sel.selectedOptions).map(o=>o.value);
  sel.innerHTML = '<option value="central">Hecho central</option>' + currentArbolHechos.map(h=>`<option value="${h.id}">${h.texto.slice(0,60)}</option>`).join("");
  Array.from(sel.options).forEach(o=>{ o.selected = curSel.includes(o.value); });
  if(!Array.from(sel.options).some(o=>o.selected)) sel.options[0].selected = true;
  drawArbolMedidas();
}
function drawArbolMedidas(){
  const raices = currentArbolHechos.filter(h=>esCausaRaiz(h, currentArbolHechos));
  document.getElementById("arbolMedidasWrap").innerHTML = raices.length ? raices.map(h=>`
    <div style="margin-bottom:12px;border:1px solid #e3e6ea;border-radius:8px;padding:8px 10px;">
      <label style="margin-bottom:4px;">${h.texto}</label>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <div><label style="font-size:11.5px;">Medida correctiva (para esta causa)</label><input data-arbol-medida="${h.id}" value="${(h.medidaCorrectiva||"").replace(/"/g,'&quot;')}" placeholder="Medida correctiva para esta causa raíz"></div>
        <div><label style="font-size:11.5px;">Medida preventiva (para otras situaciones similares)</label><input data-arbol-preventiva="${h.id}" value="${(h.medidaPreventiva||"").replace(/"/g,'&quot;')}" placeholder="Medida preventiva aplicable a otras áreas/procesos"></div>
      </div>
      <label style="font-size:11.5px;margin-top:6px;">Plazo de ejecución</label>
      <select data-arbol-plazo="${h.id}">
        <option value="corto" ${h.plazo==="corto"?"selected":""}>Corto plazo</option>
        <option value="mediano" ${h.plazo==="mediano"?"selected":""}>Mediano plazo</option>
        <option value="largo" ${h.plazo==="largo"?"selected":""}>Largo plazo</option>
      </select>
    </div>
  `).join("") : '<div class="empty">Aún no hay causas raíz identificadas en el árbol (agrega hechos antecedentes más arriba).</div>';
}
on(document.getElementById("arbolMedidasWrap"), "input", (e)=>{
  const input = e.target.closest("input[data-arbol-medida]");
  if(input){ const hecho = currentArbolHechos.find(h=>h.id===input.dataset.arbolMedida); if(hecho) hecho.medidaCorrectiva = input.value; return; }
  const input2 = e.target.closest("input[data-arbol-preventiva]");
  if(input2){ const hecho = currentArbolHechos.find(h=>h.id===input2.dataset.arbolPreventiva); if(hecho) hecho.medidaPreventiva = input2.value; }
});
on(document.getElementById("arbolMedidasWrap"), "change", (e)=>{
  const sel = e.target.closest("select[data-arbol-plazo]");
  if(!sel) return;
  const hecho = currentArbolHechos.find(h=>h.id===sel.dataset.arbolPlazo);
  if(hecho) hecho.plazo = sel.value;
});
on(document.getElementById("arbolTreeWrap"), "click", (e)=>{
  const btn = e.target.closest("button[data-arbol-quitar]");
  if(!btn) return;
  quitarHechoYDescendientes(btn.dataset.arbolQuitar);
  drawArbolTree();
});
on(document.getElementById("addArbolHechoBtn"), "click", () => {
  const texto = document.getElementById("arbolHechoTexto").value.trim();
  if(!texto){ alert("Describe el hecho antes de agregarlo."); return; }
  const tipo = document.getElementById("arbolHechoTipo").value;
  const sel = document.getElementById("arbolAntecedeA");
  let precedeA = Array.from(sel.selectedOptions).map(o=>o.value);
  if(!precedeA.length) precedeA = ["central"];
  currentArbolHechos.push({id:uid(), texto, tipo, precedeA, medidaCorrectiva:"", medidaPreventiva:"", plazo:"corto"});
  document.getElementById("arbolHechoTexto").value = "";
  document.getElementById("arbolHechoJuicioAlerta").style.display = "none";
  drawArbolTree();
});

function resetArbolForm(){
  arbolEditingId = null;
  document.getElementById("arbolAccidenteSel").value = "";
  document.getElementById("arbolResponsable").value = "";
  document.getElementById("arbolFecha").value = new Date().toISOString().slice(0,10);
  document.getElementById("arbolRelato").value = "";
  document.getElementById("arbolHechoCentral").value = "";
  document.getElementById("arbolHechoTexto").value = "";
  document.getElementById("arbolHechoTipo").value = "individuo";
  document.getElementById("arbolHechoJuicioAlerta").style.display = "none";
  document.getElementById("arbolConclusion").value = "";
  currentArbolHechos = [];
  drawArbolTree();
  document.getElementById("arbolFormTitle").textContent = "Análisis de causa raíz — Árbol causal";
  document.getElementById("saveArbolBtn").textContent = "Guardar análisis";
  document.getElementById("cancelEditArbolBtn").style.display = "none";
}
on(document.getElementById("cancelEditArbolBtn"), "click", () => { resetArbolForm(); });

function startEditArbol(id){
  const rec = CACHE.arbolesCausales.find(a=>a.id===id);
  if(!rec) return;
  arbolEditingId = id;
  document.getElementById("arbolAccidenteSel").value = rec.accidenteId || "";
  document.getElementById("arbolResponsable").value = rec.responsable || "";
  document.getElementById("arbolFecha").value = rec.fechaAnalisis || "";
  document.getElementById("arbolRelato").value = rec.relato || "";
  document.getElementById("arbolHechoCentral").value = rec.hechoCentral || "";
  document.getElementById("arbolConclusion").value = rec.conclusion || "";
  currentArbolHechos = (rec.hechos||[]).map(h=>({...h, precedeA: hechoPrecedeA(h).slice()}));
  drawArbolTree();
  document.getElementById("arbolFormTitle").textContent = "Editando análisis de causa raíz";
  document.getElementById("saveArbolBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditArbolBtn").style.display = "";
  document.getElementById("hdrArbolCausal").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("saveArbolBtn"), "click", async () => {
  const accidenteId = document.getElementById("arbolAccidenteSel").value;
  const hechoCentral = document.getElementById("arbolHechoCentral").value.trim();
  if(!accidenteId || !hechoCentral){ alert("Selecciona el accidente/incidente y completa el hecho central."); return; }
  const datos = {
    accidenteId, hechoCentral,
    responsable: document.getElementById("arbolResponsable").value.trim(),
    fechaAnalisis: document.getElementById("arbolFecha").value || new Date().toISOString().slice(0,10),
    relato: document.getElementById("arbolRelato").value.trim(),
    hechos: currentArbolHechos.slice(),
    conclusion: document.getElementById("arbolConclusion").value.trim(),
  };
  if(arbolEditingId){
    const anterior = CACHE.arbolesCausales.find(a=>a.id===arbolEditingId);
    if(!anterior){ alert("El análisis que estabas editando ya no existe."); resetArbolForm(); return; }
    await put("arbolesCausales", { ...anterior, ...datos });
    await loadCache();
    resetArbolForm();
    renderArbolTable();
    alert("Análisis de causa raíz actualizado.");
    return;
  }
  await put("arbolesCausales", { id: uid(), ...datos });
  await loadCache();
  resetArbolForm();
  renderArbolTable();
  alert("Análisis de causa raíz guardado.");
});

function renderArbolTable(){
  const rows = (CACHE.arbolesCausales||[]).slice().sort((a,b)=> new Date(b.fechaAnalisis||0)-new Date(a.fechaAnalisis||0));
  document.getElementById("arbolTable").innerHTML = rows.map(r=>{
    const acc = CACHE.accidentes.find(a=>a.id===r.accidenteId);
    const raices = (r.hechos||[]).filter(h=>esCausaRaiz(h, r.hechos||[])).length;
    return `<tr>
      <td>${fmtDate(r.fechaAnalisis)}</td>
      <td>${acc ? `${fmtDate(acc.fecha)} — ${ACC_TIPO_LABEL[acc.tipo]||acc.tipo}` : "(accidente ya no existe)"}</td>
      <td>${acc ? areaName(acc.areaId) : "—"}</td>
      <td>${raices}</td>
      <td>${r.responsable || "—"}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-arbol-editar="${r.id}">Editar</button>
        <button class="btn small" data-arbol-pdf="${r.id}">Descargar PDF</button>
        <button class="subtle-btn" data-arbol-eliminar="${r.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td class="empty" colspan="6">Aún no hay análisis de causa raíz registrados</td></tr>`;
}
on(document.getElementById("arbolTable"), "click", async (e) => {
  const editBtn = e.target.closest("button[data-arbol-editar]");
  if(editBtn){ startEditArbol(editBtn.dataset.arbolEditar); return; }
  const delBtn = e.target.closest("button[data-arbol-eliminar]");
  if(delBtn){
    const rec = CACHE.arbolesCausales.find(r=>r.id===delBtn.dataset.arbolEliminar);
    if(!rec) return;
    if(!confirm("¿Eliminar este análisis de causa raíz? Esta acción no se puede deshacer.")) return;
    await deleteRecord("arbolesCausales", rec.id);
    await loadCache();
    if(arbolEditingId === rec.id) resetArbolForm();
    renderArbolTable();
    return;
  }
  const pdfBtn = e.target.closest("button[data-arbol-pdf]");
  if(pdfBtn){
    const rec = CACHE.arbolesCausales.find(r=>r.id===pdfBtn.dataset.arbolPdf);
    if(rec) descargarArbolPdf(rec);
  }
});
on(document.getElementById("arbolDescargarPdfBtn"), "click", () => {
  const accidenteId = document.getElementById("arbolAccidenteSel").value;
  const hechoCentral = document.getElementById("arbolHechoCentral").value.trim();
  if(!accidenteId || !hechoCentral){ alert("Selecciona el accidente/incidente y completa el hecho central antes de descargar el PDF."); return; }
  descargarArbolPdf({
    accidenteId, hechoCentral,
    responsable: document.getElementById("arbolResponsable").value.trim(),
    fechaAnalisis: document.getElementById("arbolFecha").value || new Date().toISOString().slice(0,10),
    relato: document.getElementById("arbolRelato").value.trim(),
    hechos: currentArbolHechos.slice(),
    conclusion: document.getElementById("arbolConclusion").value.trim(),
  });
});

/* Aplana el árbol (que ahora es un grafo, no necesariamente un árbol
   estricto, por la disyunción) en líneas ordenadas de mayor a menor
   distancia al hecho central (es decir, las causas raíz primero), ya
   que jsPDF no dibuja diagramas gráficos de forma nativa. Cada línea
   indica explícitamente a qué hecho(s) antecede, para no perder la
   forma de la relación al imprimirla como lista. */
function arbolAplanar(hechos){
  const dist = calcArbolDistancias(hechos);
  const lineas = hechos.slice()
    .sort((a,b)=> (dist.get(b.id)||0)-(dist.get(a.id)||0))
    .map(hecho=>{
      const destinos = hechoPrecedeA(hecho).map(t=> t==="central" ? "Hecho central" : ((hechos.find(h=>h.id===t)||{}).texto || "(hecho eliminado)"));
      return { hecho, depth: dist.get(hecho.id)||0, esRaiz: esCausaRaiz(hecho, hechos), destinos };
    });
  return lineas;
}
function descargarArbolPdf(rec){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(15);
  doc.text("Análisis de causa raíz — Árbol de causas", 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatos = datosEmpresaLineaPdf();
  if(lineaDatos){ doc.text(lineaDatos, 14, y); y += 6; }
  y += 2;
  const acc = CACHE.accidentes.find(a=>a.id===rec.accidenteId);
  doc.autoTable({ startY:y, head:[["Dato","Detalle"]], body:[
    ["Accidente / incidente analizado", acc ? `${fmtDate(acc.fecha)} — ${ACC_TIPO_LABEL[acc.tipo]||acc.tipo} — ${areaName(acc.areaId)}` : "—"],
    ["Responsable del análisis", rec.responsable || "—"],
    ["Fecha del análisis", rec.fechaAnalisis ? fmtDate(rec.fechaAnalisis) : "—"],
  ], styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 8;

  if(rec.relato){
    if(y > 240){ doc.addPage(); y = 16; }
    doc.setFontSize(12); doc.text("Relato del accidente", 14, y); y += 5;
    doc.setFontSize(9);
    const relatoLines = doc.splitTextToSize(rec.relato, 182);
    doc.text(relatoLines, 14, y); y += relatoLines.length*4.5 + 6;
  }

  if(y > 250){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("Hecho central", 14, y); y += 5;
  doc.setFontSize(9);
  const hechoCentralLines = doc.splitTextToSize(rec.hechoCentral || "—", 182);
  doc.text(hechoCentralLines, 14, y); y += hechoCentralLines.length*4.5 + 6;

  if(y > 240){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("Árbol de causas (de las causas raíz al hecho central)", 14, y); y += 6;
  doc.setFontSize(9);
  const lineas = arbolAplanar(rec.hechos||[]);
  if(!lineas.length){
    doc.text("No se registraron hechos antecedentes.", 14, y); y += 8;
  } else {
    lineas.forEach(l=>{
      if(y > 275){ doc.addPage(); y = 16; }
      const prefijo = l.esRaiz ? "● [CAUSA RAÍZ] " : "○ ";
      const texto = `${ARBOL_TIPO_LABEL[l.hecho.tipo]||l.hecho.tipo}: ${l.hecho.texto}`;
      const wrapped = doc.splitTextToSize(prefijo + texto, 182 - l.depth*6);
      doc.text(wrapped, 14 + l.depth*6, y);
      y += wrapped.length*4.5;
      const antecedeLine = doc.splitTextToSize(`   → antecede a: ${l.destinos.join(", ")}`, 176 - l.depth*6);
      doc.setTextColor(120); doc.text(antecedeLine, 16 + l.depth*6, y); doc.setTextColor(0);
      y += antecedeLine.length*4 + 3;
    });
    y += 4;
  }

  const raices = (rec.hechos||[]).filter(h=>esCausaRaiz(h, rec.hechos||[]));
  if(raices.length){
    if(y > 220){ doc.addPage(); y = 16; }
    doc.setFontSize(12); doc.text("Medidas correctivas y preventivas por causa raíz", 14, y); y += 4;
    doc.autoTable({ startY:y, head:[["Causa raíz","Medida correctiva","Medida preventiva","Plazo"]],
      body: raices.map(h=>[h.texto, h.medidaCorrectiva||"—", h.medidaPreventiva||"—", ARBOL_PLAZO_LABEL[h.plazo]||"—"]),
      styles:{fontSize:8}, headStyles:{fillColor:[236,131,90]} });
    y = doc.lastAutoTable.finalY + 8;
  }

  if(rec.conclusion){
    if(y > 250){ doc.addPage(); y = 16; }
    doc.setFontSize(12); doc.text("Conclusión general", 14, y); y += 5;
    doc.setFontSize(9);
    const conclusionLines = doc.splitTextToSize(rec.conclusion, 182);
    doc.text(conclusionLines, 14, y); y += conclusionLines.length*4.5;
  }

  doc.save(`Analisis_Causa_Raiz_${(rec.fechaAnalisis||"").replace(/[^0-9]/g,"")||new Date().toISOString().slice(0,10)}.pdf`);
}

/* Informe de accidente/incidente en PDF: combina los datos del registro de
   Accidentabilidad con el/los análisis de causa raíz (Árbol de causas) que
   estén vinculados a ese mismo accidente (investigacionDeAccidente), para
   tener un solo documento con el evento y su investigación. Si aún no hay
   ningún árbol causal asociado, el informe lo indica explícitamente en vez
   de omitir la sección. */
async function descargarInformeAccidentePdf(accRec){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(15);
  doc.text("Informe de accidente / incidente", 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatos = datosEmpresaLineaPdf();
  if(lineaDatos){ doc.text(lineaDatos, 14, y); y += 6; }
  doc.text(`Generado el ${fmtDate(new Date().toISOString().slice(0,10))}`, 14, y); y += 8;

  const trabs = accTrabajadoresDe(accRec).map(id=>trabName(id)).join(", ") || "—";
  doc.autoTable({ startY:y, head:[["Dato","Detalle"]], body:[
    ["Tipo", ACC_TIPO_LABEL[accRec.tipo]||accRec.tipo],
    ["Fecha", fmtDate(accRec.fecha)],
    ["Área", areaName(accRec.areaId)],
    ["Sexo", accRec.sexo==="M"?"Hombre":accRec.sexo==="F"?"Mujer":"—"],
    ["Foco crítico", accRec.focoCritico || "—"],
    ["Trabajador(es) involucrado(s)", trabs],
    ["Gravedad", accRec.gravedad || "—"],
    ["Días perdidos", accRec.diasPerdidos || 0],
    ["Causa registrada", accRec.causa || "—"],
  ], styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 8;

  if(accRec.descripcion){
    if(y > 240){ doc.addPage(); y = 16; }
    doc.setFontSize(12); doc.text("Descripción del evento", 14, y); y += 5;
    doc.setFontSize(9);
    const descLines = doc.splitTextToSize(accRec.descripcion, 182);
    doc.text(descLines, 14, y); y += descLines.length*4.5 + 6;
  }

  const arboles = (typeof investigacionDeAccidente === "function") ? investigacionDeAccidente(accRec.id) : (CACHE.arbolesCausales||[]).filter(a=>a.accidenteId===accRec.id);
  if(y > 250){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("Análisis de causa raíz (Árbol de causas)", 14, y); y += 6;
  doc.setFontSize(9);
  if(!arboles.length){
    doc.text("Aún no hay ningún análisis de causa raíz (Árbol de causas) registrado para este accidente/incidente.", 14, y); y += 8;
  } else {
    for(let idx=0; idx<arboles.length; idx++){
      const rec = arboles[idx];
      if(y > 250){ doc.addPage(); y = 16; }
      doc.setFontSize(11); doc.text(`Análisis N°${idx+1} — Responsable: ${rec.responsable||"—"} · Fecha: ${rec.fechaAnalisis?fmtDate(rec.fechaAnalisis):"—"}`, 14, y); y += 6;
      doc.setFontSize(9);

      if(rec.hechoCentral){
        doc.setFontSize(9.5); doc.text("Hecho central:", 14, y); y += 4.5;
        doc.setFontSize(9);
        const hechoCentralLines = doc.splitTextToSize(rec.hechoCentral, 182);
        doc.text(hechoCentralLines, 14, y); y += hechoCentralLines.length*4.5 + 4;
      }

      const mapaImg = (rec.hechos||[]).length ? await capturarArbolMapaImagen(rec.hechoCentral, rec.hechos||[]) : null;
      if(mapaImg){
        const maxImgW = 182, maxImgH = 150;
        let imgW = maxImgW, imgH = imgW * (mapaImg.h/mapaImg.w);
        if(imgH > maxImgH){ imgH = maxImgH; imgW = imgH * (mapaImg.w/mapaImg.h); }
        if(y + imgH > 280){ doc.addPage(); y = 16; }
        doc.setFontSize(9.5); doc.text("Mapa del árbol de causas:", 14, y); y += 4.5;
        doc.addImage(mapaImg.dataUrl, "PNG", 14, y, imgW, imgH);
        y += imgH + 8;
      }

      if(y > 245){ doc.addPage(); y = 16; }
      const lineas = arbolAplanar(rec.hechos||[]);
      if(!lineas.length){
        doc.text("No se registraron hechos antecedentes.", 14, y); y += 6;
      } else {
        lineas.forEach(l=>{
          if(y > 275){ doc.addPage(); y = 16; }
          const prefijo = l.esRaiz ? "● [CAUSA RAÍZ] " : "○ ";
          const texto = `${ARBOL_TIPO_LABEL[l.hecho.tipo]||l.hecho.tipo}: ${l.hecho.texto}`;
          const wrapped = doc.splitTextToSize(prefijo + texto, 182 - l.depth*6);
          doc.text(wrapped, 14 + l.depth*6, y);
          y += wrapped.length*4.5;
        });
        y += 4;
      }

      const raices = (rec.hechos||[]).filter(h=>esCausaRaiz(h, rec.hechos||[]));
      if(raices.length){
        if(y > 220){ doc.addPage(); y = 16; }
        doc.setFontSize(10); doc.text("Medidas correctivas y preventivas por causa raíz", 14, y); y += 4;
        doc.autoTable({ startY:y, head:[["Causa raíz","Medida correctiva","Medida preventiva","Plazo"]],
          body: raices.map(h=>[h.texto, h.medidaCorrectiva||"—", h.medidaPreventiva||"—", ARBOL_PLAZO_LABEL[h.plazo]||"—"]),
          styles:{fontSize:8}, headStyles:{fillColor:[236,131,90]} });
        y = doc.lastAutoTable.finalY + 8;
      }

      if(rec.conclusion){
        if(y > 250){ doc.addPage(); y = 16; }
        doc.setFontSize(10); doc.text("Conclusión general", 14, y); y += 5;
        doc.setFontSize(9);
        const conclusionLines = doc.splitTextToSize(rec.conclusion, 182);
        doc.text(conclusionLines, 14, y); y += conclusionLines.length*4.5 + 6;
      }
    }
  }

  doc.save(`Informe_Accidente_${(accRec.fecha||"").replace(/[^0-9]/g,"")||new Date().toISOString().slice(0,10)}.pdf`);
}

/* =========================================================
   SEGURIDAD — registro de infractores y ranking de infractores
   de velocidad (v1.32). Ambos registros son independientes: el
   registro de infractores cubre cualquier motivo (texto libre),
   y el ranking de velocidad es un registro manual específico por
   vehículo/conductor con número de eventos y velocidad máxima.
   ========================================================= */
function infractorNombreRut(i){ return `${i.nombre||"—"} (${i.rut||"sin RUT"})`; }
function renderInfFiltros(){
  const motivosUnicos = Array.from(new Set(CACHE.infractores.map(i=>i.motivo).filter(Boolean))).sort();
  const current = document.getElementById("filterInfMotivo").value;
  fillSelect(document.getElementById("filterInfMotivo"), motivosUnicos.map(m=>({id:m,label:m})), true);
  if(motivosUnicos.includes(current)) document.getElementById("filterInfMotivo").value = current;
}
function infractoresFiltrados(){
  const texto = quitarAcentos(document.getElementById("filterInfTexto").value||"").toLowerCase().trim();
  const motivo = document.getElementById("filterInfMotivo").value;
  return CACHE.infractores.filter(i=>{
    if(motivo && i.motivo!==motivo) return false;
    if(texto){
      const hay = quitarAcentos(`${i.nombre||""} ${i.rut||""}`).toLowerCase();
      if(!hay.includes(texto)) return false;
    }
    return true;
  });
}
let infEditingId = null;
function resetInfForm(){
  infEditingId = null;
  document.getElementById("infFecha").value = "";
  document.getElementById("infNombre").value = "";
  document.getElementById("infRut").value = "";
  document.getElementById("infMotivo").value = "";
  document.getElementById("infSancion").value = "";
  document.getElementById("infFormTitle").textContent = "Registrar infractor";
  document.getElementById("saveInfBtn").textContent = "Registrar";
  document.getElementById("cancelEditInfBtn").style.display = "none";
}
function startEditInf(id){
  const rec = CACHE.infractores.find(i=>i.id===id);
  if(!rec) return;
  infEditingId = id;
  document.getElementById("infFecha").value = rec.fecha || "";
  document.getElementById("infNombre").value = rec.nombre || "";
  document.getElementById("infRut").value = rec.rut || "";
  document.getElementById("infMotivo").value = rec.motivo || "";
  document.getElementById("infSancion").value = rec.sancion || "";
