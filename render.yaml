function renderTrabajadoresTable(){
  document.getElementById("trabajadoresTable").innerHTML = CACHE.trabajadores.map(t=>`
    <tr><td>${t.nombre}</td><td>${t.rut||"—"}</td><td>${t.cargo||"—"}</td><td>${areaName(t.areaId)}</td>
      <td><button class="subtle-btn" data-trab-del="${t.id}">Eliminar</button></td></tr>
  `).join("") || `<tr><td class="empty" colspan="5">Sin trabajadores</td></tr>`;
}
on(document.getElementById("trabajadoresTable"), "click", async (e) => {
  const btn = e.target.closest("button[data-trab-del]");
  if(!btn) return;
  const trab = CACHE.trabajadores.find(t=>t.id===btn.dataset.trabDel);
  if(!trab) return;
  if(!confirm(`¿Eliminar a "${trab.nombre}" de la lista de trabajadores? Esto no borra su historial en capacitaciones ya registradas, pero dejará de aparecer en los listados para agregar.`)) return;
  await deleteRecord("trabajadores", trab.id);
  await loadCache();
  renderCommonSelects(); renderTrabajadoresTable();
});

