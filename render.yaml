function vsPuestosExpuestos(areaId){
  const cargos = Array.from(new Set(CACHE.trabajadores.filter(t=>t.areaId===areaId).map(t=>t.cargo).filter(Boolean)));
  return cargos.length ? cargos.join(", ") : "—";
}
function medidaControlPrincipal(m){
  const items = jerarquiaDe(m);
  if(!items.length) return "—";
  const clasificadas = items.filter(it=>JERARQUIA_ORDER.includes(it.jerarquia));
  const top = clasificadas.length
    ? clasificadas.slice().sort((a,b)=> JERARQUIA_ORDER.indexOf(a.jerarquia)-JERARQUIA_ORDER.indexOf(b.jerarquia))[0]
    : items[0];
  return top.jerarquia ? `${top.jerarquia}) ${top.texto}` : top.texto;
}
