}
on(document.getElementById("cancelEditInfBtn"), "click", ()=>resetInfForm());
on(document.getElementById("saveInfBtn"), "click", async ()=>{
  const fecha = document.getElementById("infFecha").value;
  const nombre = document.getElementById("infNombre").value.trim();
  const rut = document.getElementById("infRut").value.trim();
  const motivo = document.getElementById("infMotivo").value.trim();
  const sancion = document.getElementById("infSancion").value.trim();
  if(!fecha || !nombre || !motivo){ alert("Complete al menos la fecha, el nombre y el motivo de la infracción."); return; }
  const rec = { id: infEditingId || uid(), fecha, nombre, rut, motivo, sancion };
  await put("infractores", rec);
  await loadCache();
  const wasEditing = !!infEditingId;
  resetInfForm();
  renderInfractores();
  alert(wasEditing ? "Registro actualizado." : "Infractor registrado.");
});
function renderInfractoresTable(){
  const rows = infractoresFiltrados().slice().sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
  document.getElementById("infractoresTable").innerHTML = rows.map(i=>`
    <tr>
      <td>${fmtDate(i.fecha)}</td>
      <td>${i.nombre||"–"}</td>
      <td>${i.rut||"–"}</td>
      <td>${i.motivo||"–"}</td>
      <td>${i.sancion||"–"}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-inf-editar="${i.id}">Editar</button>
        <button class="subtle-btn" data-inf-eliminar="${i.id}">Eliminar</button>
      </td>
    </tr>
  `).join("") || `<tr><td class="empty" colspan="6">Sin infractores registrados</td></tr>`;
}

