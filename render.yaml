/* =========================================================
   LISTAS DESPLEGABLES EDITABLES
   Las listas base (CAT_*) son de solo lectura en el código;
   las opciones que el usuario agrega quedan en el almacén
   "catalogosExtra" (un registro por tipo) y se combinan con la
   lista base al momento de mostrarse, sin duplicar valores.
   ========================================================= */
const CAT_TIPO_CAPACITACION = ["Inducción","Específica por riesgo del puesto","Obligatoria DS 44","Refuerzo / recapacitación"];
const CAT_EPP = ["Casco de seguridad","Casco dieléctrico clase E","Guantes de cuero","Guantes dieléctricos","Guantes anticorte","Zapatos de seguridad","Zapatos dieléctricos","Lentes de seguridad","Protector auditivo (tapones)","Protector auditivo (orejeras)","Arnés de seguridad","Ropa de trabajo (overol)","Chaleco reflectante","Careta facial","Respirador con filtro","Traje de agua","Protector solar","Rodilleras"];
const CATALOG_BASE = {
  proceso: CAT_PROCESOS,
  actividad: CAT_ACTIVIDADES,
  categoria: CAT_CATEGORIAS,
  peligro: CAT_PELIGROS,
  capTipo: CAT_TIPO_CAPACITACION,
  epp: CAT_EPP,
  focoCritico: [],
};
const CATALOG_LABELS = { proceso:"Proceso", actividad:"Actividad", categoria:"Categoría", peligro:"Peligro / Riesgo", capTipo:"Tipo de capacitación", epp:"Elemento de protección personal (EPP)", focoCritico:"Foco crítico (Accidentabilidad)" };
function getCatalog(tipo){
  const base = CATALOG_BASE[tipo] || [];
  const extraRec = (CACHE.catalogosExtra||[]).find(c=>c.id===tipo);
  const extra = (extraRec && extraRec.valores) || [];
  const extraNuevos = extra.filter(v=>!base.includes(v));
  return base.concat(extraNuevos);
}
async function addCatalogValue(tipo, value){
  value = (value||"").trim();
  if(!value) return false;
  if(getCatalog(tipo).some(v=>v.toLowerCase()===value.toLowerCase())) return false;
  let rec = (CACHE.catalogosExtra||[]).find(c=>c.id===tipo);
  if(!rec){ rec = { id: tipo, valores: [] }; }
  rec.valores = (rec.valores||[]).concat(value);
  await put("catalogosExtra", rec);
  await loadCache();
  return true;
}

/* =========================================================
   HISTÓRICO DE MODIFICACIONES DE LA MATRIZ DE RIESGOS
   Cada vez que se crea, edita o cambia el estado de una línea
   de la matriz queda una entrada aquí (campo, valor anterior,
   valor nuevo, fecha), para trazabilidad de cambios.
   ========================================================= */
async function logHistorial(registroId, descripcion, campo, anterior, nuevo){
  await put("matrizHistorial", {
    id: uid(),
    registroId,
    descripcion,
    campo,
    anterior: anterior===undefined||anterior===null||anterior===""? "—" : String(anterior),
    nuevo: nuevo===undefined||nuevo===null||nuevo===""? "—" : String(nuevo),
    fecha: new Date().toISOString()
  });
}

