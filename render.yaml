on(document.getElementById("cancelEditMatrizBtn"), "click", async () => { resetMatrizForm(); });

on(document.getElementById("saveMatrizBtn"), "click", async () => {
  const areaId = document.getElementById("mArea").value;
  const proceso = document.getElementById("mProceso").value.trim();
  const actividad = document.getElementById("mActividad").value.trim();
  const categoria = document.getElementById("mCategoria").value;
  const peligro = document.getElementById("mPeligro").value.trim();
  const riesgo = document.getElementById("mRiesgo").value.trim();
  const hombres = +document.getElementById("mHombres").value || 0;
  const mujeres = +document.getElementById("mMujeres").value || 0;
  const otros = +document.getElementById("mOtros").value || 0;
  const probabilidad = +document.getElementById("mProb").value;
  const consecuencia = +document.getElementById("mCons").value;
  if(!areaId || !actividad || !peligro || !riesgo){ alert("Complete área, actividad, peligro y riesgo."); return; }

  const sensible = document.getElementById("mSensible").checked;
  const gruposSensibles = sensible ? leerGruposSensibles() : [];
  if(sensible && !gruposSensibles.length){ alert("Marcaste que este riesgo expone a trabajadores/as especialmente sensibles: indica al menos un grupo."); return; }

  const controlesJerarquizados = currentControles.slice();
  const controlesTxt = controlesTextoPlano(controlesJerarquizados);
  const responsableTxt = responsableTextoPlano(controlesJerarquizados);
  const plazoTxt = plazoResumenControles(controlesJerarquizados);

  if(matrizEditingId){
    const anterior = CACHE.matriz.find(m=>m.id===matrizEditingId);
    if(!anterior){ alert("La línea que estabas editando ya no existe."); resetMatrizForm(); return; }
    const rec = {
      ...anterior, areaId, proceso, actividad, categoria, peligro, riesgo,
      hombres, mujeres, otros, probabilidad, consecuencia,
      efecto: document.getElementById("mEfecto").value.trim(),
      sensible, gruposSensibles,
      controlesJerarquizados, controles: controlesTxt, responsable: responsableTxt, plazo: plazoTxt,
    };
    // Registra en el histórico solo los campos que efectivamente cambiaron.
    const campos = [
      ["areaId","Área"], ["proceso","Proceso"], ["actividad","Actividad"], ["categoria","Categoría"],
      ["peligro","Peligro"], ["riesgo","Riesgo asociado"], ["probabilidad","Probabilidad"], ["consecuencia","Consecuencia"],
      ["hombres","N° hombres"], ["mujeres","N° mujeres"], ["otros","N° otros"],
    ];
    if(String(!!anterior.sensible) !== String(!!rec.sensible) || JSON.stringify(anterior.gruposSensibles||[]) !== JSON.stringify(rec.gruposSensibles||[])){
      await logHistorial(rec.id, matrizLineLabel(rec), "Especialmente sensible", (anterior.sensible?(anterior.gruposSensibles||[]).join(", "):"No"), (rec.sensible?(rec.gruposSensibles||[]).join(", "):"No"));
    }
    for(const [campo,label] of campos){
      if(String(anterior[campo]??"") !== String(rec[campo]??"")){
        await logHistorial(rec.id, matrizLineLabel(rec), label, anterior[campo], rec[campo]);
      }
    }
    if(JSON.stringify(jerarquiaDe(anterior)) !== JSON.stringify(controlesJerarquizados)){
      await logHistorial(rec.id, matrizLineLabel(rec), "Medidas de control (jerarquía DS 44)", "", "Modificadas");
    }
    await put("matriz", rec);
    await loadCache();
    resetMatrizForm();
    renderMatrizTable();
    renderEquidadGenero();
    renderMatrizCharts();
    renderJerarquiaControles();
    renderEppEstudioCobertura();
    renderEppEstPeligroOptions();
    renderMapaRiesgos();
    renderPlanoRiesgos();
    renderMatrizHistorialTable();
    alert("Línea de la matriz de riesgos actualizada.");
    return;
  }

  const rec = {
    id: uid(), areaId, proceso, actividad, categoria, peligro, riesgo,
    hombres, mujeres, otros,
    efecto: document.getElementById("mEfecto").value.trim(),
    sensible, gruposSensibles,
    probabilidad, consecuencia,
    controlesJerarquizados, controles: controlesTxt, responsable: responsableTxt, plazo: plazoTxt,
    estado: "pendiente",
    fechaCreacion: new Date().toISOString()
  };
  await put("matriz", rec);
  await loadCache();
  await logHistorial(rec.id, matrizLineLabel(rec), "Línea creada", "", "Creada");
  resetMatrizForm();
  renderMatrizTable();
  renderEquidadGenero();
  renderMatrizCharts();
  renderJerarquiaControles();
  renderEppEstudioCobertura();
  renderEppEstPeligroOptions();
  renderMapaRiesgos();
  renderPlanoRiesgos();
  renderMatrizHistorialTable();
  alert("Línea agregada a la matriz de riesgos.");
});

function renderMatrizTable(){
  const fArea = document.getElementById("filterMatrizArea").value;
  const fNivel = document.getElementById("filterMatrizNivel").value;
  const fCategoria = document.getElementById("filterMatrizCategoria").value;
  const fEstado = document.getElementById("filterMatrizEstado").value;
  const fSensible = document.getElementById("filterMatrizSensible").value;
  const rows = CACHE.matriz
    .map(m=>({...m, nivel: nivelRiesgo(m.probabilidad,m.consecuencia)}))
    .filter(m=> (!fArea || m.areaId===fArea) && (!fNivel || m.nivel===fNivel) && (!fCategoria || m.categoria===fCategoria) && (!fEstado || (m.estado||"pendiente")===fEstado) && (!fSensible || (fSensible==="si"?!!m.sensible:!m.sensible)))
    .sort((a,b)=> (b.probabilidad*b.consecuencia)-(a.probabilidad*a.consecuencia));
  document.getElementById("matrizTable").innerHTML = rows.map(m=>`
    <tr>
      <td>${areaName(m.areaId)}</td>
      <td>${m.proceso?`<div class="kv">${m.proceso}</div>`:""}${m.actividad||"—"}</td>
      <td>${m.categoria||"—"}</td>
      <td><strong>${m.peligro}</strong>${m.levantamientoId?` <span class="pill bajo" title="Generada desde un Levantamiento de riesgos">Levantamiento</span>`:""}<div class="kv">${m.riesgo}</div>${m.efecto?`<div class="kv">${m.efecto.length>140?m.efecto.slice(0,140)+"…":m.efecto}</div>`:""}</td>
      <td>${m.probabilidad} x ${m.consecuencia} = ${m.probabilidad*m.consecuencia}</td>
      <td><span class="pill ${m.nivel}">${nivelLabel(m.nivel)}</span></td>
      <td><div class="kv">${m.hombres||0} H · ${m.mujeres||0} M${m.otros?` · ${m.otros} otros`:""}</div></td>
      <td>${m.sensible && (m.gruposSensibles||[]).length ? `<span class="pill alto" title="${(m.gruposSensibles||[]).join(", ")}">Sí</span><div class="kv" style="margin-top:4px;">${(m.gruposSensibles||[]).join(", ")}</div>` : '<span class="pill bajo">No</span>'}</td>
      <td>${(() => {
        const items = jerarquiaDe(m);
        if(!items.length) return "—";
        const warn = soloEpp(m) ? `<div style="margin-bottom:5px;"><span class="pill critico">Solo EPP</span></div>` : "";
        return warn + items.map(c=>`<div style="margin-bottom:5px;">${jerarquiaChipHtml(c.jerarquia)} ${c.texto}${c.responsable?`<div class="kv">Resp.: ${c.responsable}${c.plazo?` · Plazo: ${fmtDate(c.plazo)}`:""}</div>`:""}</div>`).join("");
      })()}</td>
      <td>
        <select data-matriz-estado="${m.id}">
          <option value="pendiente" ${m.estado==='pendiente'?'selected':''}>Pendiente</option>
          <option value="proceso" ${m.estado==='proceso'?'selected':''}>En proceso</option>
          <option value="cerrada" ${m.estado==='cerrada'?'selected':''}>Cerrada</option>
        </select>
      </td>
      <td><button class="btn secondary small" data-matriz-editar="${m.id}">Editar</button></td>
    </tr>
  `).join("") || `<tr><td class="empty" colspan="11">Sin líneas registradas para el filtro seleccionado</td></tr>`;
}
on(document.getElementById("matrizTable"), "change", async (e) => {
