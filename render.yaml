  <!-- CONFIG -->
  <div class="view" id="view-config">
    <div class="card">
      <h2>Empresa</h2>
      <div class="form-grid">
        <div><label>Razón social</label><input id="cfgEmpresa"></div>
        <div><label>RUT</label><input id="cfgRut"></div>
        <div><label>Rubro</label><input id="cfgRubro"></div>
        <div><label>Dirección</label><input id="cfgDireccion" placeholder="Dirección de la empresa"></div>
        <div><label>Organismo administrador</label><input id="cfgOrganismoAdm" placeholder="Ej: Mutual de Seguridad, ACHS, IST, ISL..."></div>
        <div><label>N° de adherente</label><input id="cfgNumAdherente" placeholder="Número de adherente/afiliado"></div>
      </div>
      <label style="margin-top:12px;">Logo de la empresa</label>
      <input type="file" id="cfgLogoInput" accept="image/*">
      <div id="cfgLogoPreviewWrap" class="kv" style="margin-top:6px;"></div>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:14px;">
        <input type="checkbox" id="cfgUsarRirdaLdr" style="width:auto;min-height:auto;"> Usar indicadores RIRDA / LDR además de los indicadores DS 67 chilenos, en Accidentabilidad
      </label>
      <div style="margin-top:14px;"><button class="btn small" id="saveEmpresaBtn">Guardar</button></div>
    </div>
    <div class="card">
      <h2>Metas de indicadores de accidentabilidad</h2>
      <div class="desc">Define las metas internas de gestión para cada indicador. En Accidentabilidad, los cuadros de estos indicadores se colorean como semáforo según el cumplimiento de la meta correspondiente: verde si el valor está dentro de la meta, amarillo si la supera levemente (hasta un 15%), y rojo si la supera de forma importante. Deja un campo vacío si no quieres definir meta para ese indicador (el cuadro se muestra sin color).</div>
      <div class="form-grid">
        <div><label>Meta tasa de frecuencia</label><input id="cfgMetaFrecuencia" type="number" min="0" step="0.1" placeholder="Ej: 20"></div>
        <div><label>Meta tasa de gravedad</label><input id="cfgMetaGravedad" type="number" min="0" step="0.1" placeholder="Ej: 200"></div>
        <div><label>Meta índice de accidentabilidad (%)</label><input id="cfgMetaAccidentabilidad" type="number" min="0" step="0.1" placeholder="Ej: 2.5"></div>
        <div><label>Meta RIRDA</label><input id="cfgMetaRirda" type="number" min="0" step="0.1" placeholder="Ej: 4"></div>
        <div><label>Meta LDR</label><input id="cfgMetaLdr" type="number" min="0" step="0.1" placeholder="Ej: 40"></div>
      </div>
      <div style="margin-top:14px;"><button class="btn small" id="saveMetasBtn">Guardar metas</button></div>
    </div>
    <div class="card">
      <h2>Gestionar listas desplegables</h2>
      <div class="desc">Agrega nuevas situaciones a las listas de Proceso, Actividad, Categoría o Peligro/Riesgo (usadas en la Matriz de riesgos), al Tipo de capacitación (usado en el Plan de capacitación), o a los Focos críticos que maneja la empresa (usados al registrar un accidente/incidente, en Accidentabilidad). Los valores agregados aquí quedan disponibles de inmediato en los desplegables correspondientes (no se pueden eliminar valores del catálogo base, solo agregar nuevos).</div>
      <div class="toolbar">
        <div class="field"><label>Lista</label>
          <select id="catTipo">
            <option value="proceso">Proceso</option>
            <option value="actividad">Actividad</option>
            <option value="categoria">Categoría</option>
            <option value="peligro">Peligro / Riesgo</option>
            <option value="capTipo">Tipo de capacitación</option>
            <option value="epp">Elemento de protección personal (EPP)</option>
            <option value="focoCritico">Foco crítico (Accidentabilidad)</option>
          </select>
        </div>
        <div class="field"><label>Nueva opción</label><input id="catValor" placeholder="Ej: Nueva situación de riesgo"></div>
        <div><button class="btn small" id="addCatBtn" style="margin-top:20px;">+ Agregar a la lista</button></div>
      </div>
      <div id="catListWrap"></div>
    </div>
    <div class="card">
      <h2>Áreas / procesos</h2>
      <div class="toolbar">
        <div class="field"><label>Nueva área</label><input id="newAreaName" placeholder="Ej: Bodega"></div>
        <div><button class="btn small" id="addAreaBtn" style="margin-top:20px;">+ Agregar área</button></div>
      </div>
      <div class="desc">"Trabajadores registrados" cuenta a quienes ya están cargados en la lista de Trabajadores con esta área. "Dotación total" es un número editable manualmente, útil cuando aún no has cargado a todo el personal pero igual quieres registrar cuántas personas trabajan ahí.</div>
      <table><thead><tr><th>Área</th><th>Trabajadores registrados</th><th>Dotación total (editable)</th><th></th></tr></thead><tbody id="areasTable"></tbody></table>
    </div>
    <div class="card">
      <div class="card-header-row" id="hdrTrabajadores"><h2>Trabajadores</h2><button class="collapse-toggle" id="toggleTrabajadores" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyTrabajadores">
      <div class="toolbar">
        <div class="field"><label>Nombre</label><input id="newTrabName" placeholder="Nombre completo"></div>
        <div class="field"><label>RUT</label><input id="newTrabRut" placeholder="Ej: 12.345.678-9"></div>
        <div class="field"><label>Cargo</label><input id="newTrabCargo" placeholder="Cargo"></div>
        <div class="field"><label>Área</label><select id="newTrabArea"></select></div>
        <div><button class="btn small" id="addTrabBtn" style="margin-top:20px;">+ Agregar</button></div>
      </div>
      <div class="desc" style="margin-top:14px;">Importar varios trabajadores desde un Excel con columnas <strong>Nombre</strong>, <strong>RUT</strong>, <strong>Cargo</strong> y <strong>Área</strong> (el área de cada fila se asigna según el nombre de área que traiga esa columna; si una fila no trae área o no coincide con ninguna de las áreas ya creadas en "Áreas / procesos", ese trabajador queda "Sin asignar" y se puede corregir después editándolo).</div>
      <div class="toolbar">
        <div class="field"><label>Archivo Excel (.xlsx)</label><input type="file" id="importTrabFile" accept=".xlsx,.xls"></div>
        <div><button class="btn small secondary" id="importTrabBtn" style="margin-top:20px;">Importar desde Excel</button></div>
      </div>
      <div class="desc" style="margin-top:14px;">Carga general por texto: pega una lista de trabajadores, uno por línea, en formato <strong>Nombre, RUT, Cargo, Área</strong> (separados por coma o tabulador), igual que en la planilla Excel. El RUT, el Cargo y el Área son opcionales; si una línea trae solo el nombre, también se agrega (quedando "Sin asignar" si no trae área).</div>
      <div class="toolbar">
        <div class="field" style="flex:2;min-width:280px;"><label>Lista de trabajadores</label><textarea id="bulkTrabTexto" rows="5" placeholder="Juan Pérez, 12.345.678-9, Maestro albañil, Bodega&#10;María López, 9.876.543-2, Prevencionista de riesgos, Oficina técnica&#10;Pedro Soto"></textarea></div>
        <div><button class="btn small secondary" id="bulkTrabBtn" style="margin-top:20px;">Cargar lista</button></div>
      </div>
      <div class="toolbar" style="justify-content:flex-end;">
        <div><button class="btn small danger" id="deleteAllTrabBtn">🗑 Eliminar todos los trabajadores</button></div>
      </div>
      <table><thead><tr><th>Nombre</th><th>RUT</th><th>Cargo</th><th>Área</th><th></th></tr></thead><tbody id="trabajadoresTable"></tbody></table>
      </div>
    </div>
    <div class="card">
      <h2>Responsables de cierre de hallazgos</h2>
      <div class="desc">Registre aquí a todas las personas que pueden quedar como responsables de cerrar hallazgos/acciones correctivas de las inspecciones y observaciones. Esta nómina es la que alimenta la lista desplegable "Responsable acción correctiva" al registrar un hallazgo, para evitar errores de escritura al ingresar el nombre. El correo electrónico es opcional: si lo registra, además podrá abrir un correo prellenado dirigido a esa persona al ver el detalle de un hallazgo pendiente.</div>
      <div class="toolbar">
        <div class="field"><label>Nombre</label><input id="newCorreoRespNombre" placeholder="Nombre completo"></div>
        <div class="field"><label>Cargo / área</label><input id="newCorreoRespCargo" placeholder="Ej: Jefe de Terreno"></div>
        <div class="field"><label>Correo electrónico (opcional)</label><input type="email" id="newCorreoRespEmail" placeholder="nombre@empresa.cl"></div>
        <div><button class="btn small" id="addCorreoRespBtn" style="margin-top:20px;">+ Agregar</button></div>
      </div>
      <table><thead><tr><th>Nombre</th><th>Cargo / área</th><th>Correo</th><th></th></tr></thead><tbody id="correosResponsablesTable"></tbody></table>
    </div>
    <div class="card">
      <h2>Importar Matriz de riesgos desde Excel</h2>
      <div class="desc">Reconoce automáticamente dos formatos: (1) una planilla simple con columnas como Área, Proceso, Actividad, Categoría, Peligro, Riesgo asociado, Efecto, Probabilidad, Consecuencia, Controles, Responsable, Plazo, N° hombres/mujeres/otros — el mismo formato que genera el botón "Descargar Excel" de la Matriz de riesgos — o (2) la planilla corporativa de Matriz IPER con encabezado en dos filas (AREA/PROTOCOLO/PROCESO/ACTIVIDAD/CATEGORIA/PELIGRO/EFECTO... con evaluación de riesgo puro y residual), igual a la ya usada para cargar la matriz real de ANGOLEC SPA. En este segundo formato se prioriza la evaluación de riesgo <strong>residual</strong> (después de controles) sobre la de riesgo puro, y si una línea no trae Probabilidad/Consecuencia numérica se aproxima desde el nivel textual (Bajo/Medio/Alto/Muy Alto).</div>
      <div class="toolbar">
        <div class="field"><label>Área por defecto (si no se puede determinar el área de una línea)</label><select id="importMatrizArea"></select></div>
        <div class="field"><label>Archivo Excel (.xlsx)</label><input type="file" id="importMatrizFile" accept=".xlsx,.xls"></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:4px;">
        <input type="checkbox" id="importMatrizReplace" style="width:auto;min-height:auto;"> Reemplazar toda la matriz actual antes de importar (si no se marca, las líneas importadas se agregan a las existentes)
      </label>
      <div style="margin-top:14px;"><button class="btn small secondary" id="importMatrizBtn">Importar matriz desde Excel</button></div>
    </div>
    <div class="card" id="accesosAdminWrap">
      <div class="card-header-row" id="hdrAccesos"><h2>Gestión de accesos (solo Administrador)</h2><button class="collapse-toggle" id="toggleAccesos" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyAccesos">
      <div class="desc" style="background:#fff8e6;border:1px solid #e8d8a0;border-radius:8px;padding:8px 10px;">
        <strong>Importante:</strong> este inicio de sesión es solo un control de <strong>visibilidad del menú</strong> dentro del prototipo (para mostrar a cada cargo únicamente las pestañas que necesita), no una autenticación real: como toda la app funciona sin servidor, la clave queda guardada en el propio navegador y cualquier persona con acceso técnico al dispositivo podría revisarla. Para producción se recomienda un login real en un backend, con contraseñas cifradas.
      </div>

      <h2 style="margin-top:6px;">Perfiles por cargo</h2>
      <div class="desc">Cada perfil define qué pestañas puede ver un cargo. Un perfil "Administrador" además puede entrar a esta sección de Gestión de accesos.</div>
      <div class="form-grid">
        <div><label>Nombre del perfil</label><input id="perfilNombre" placeholder="Ej: Prevencionista de Riesgos, Bodeguero..."></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:22px;"><input type="checkbox" id="perfilEsAdmin" style="width:auto;"><label style="margin:0;">Es Administrador (puede gestionar accesos)</label></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:22px;"><input type="checkbox" id="perfilDescargaDashboard" style="width:auto;" checked><label style="margin:0;">Puede descargar el Dashboard en PDF o PPT</label></div>
      </div>
      <label>Pestañas visibles para este perfil</label>
      <div id="perfilVistasWrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 12px;margin-top:4px;"></div>
      <div class="toolbar" style="margin-top:12px;">
        <button class="btn" id="savePerfilBtn">Guardar perfil</button>
        <button class="btn secondary" id="cancelEditPerfilBtn" style="display:none;">Cancelar edición</button>
      </div>
      <table style="margin-top:14px;">
        <thead><tr><th>Perfil</th><th>Administrador</th><th>Descarga Dashboard</th><th>Pestañas visibles</th><th>Acciones</th></tr></thead>
        <tbody id="perfilesTable"></tbody>
      </table>

      <h2 style="margin-top:24px;">Usuarios y clave de acceso</h2>
      <div class="desc">Crea un usuario por cada persona que deba entrar a la app, con el perfil que corresponda a su cargo.</div>
      <div class="form-grid">
        <div><label>Nombre</label><input id="usuarioNombre"></div>
        <div><label>Cargo</label><input id="usuarioCargo" placeholder="Ej: Jefe de Obra, Bodeguero..."></div>
