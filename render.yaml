/* =========================================================
   MIS HALLAZGOS ASIGNADOS
   Lista, para el usuario actualmente autenticado, los hallazgos
   de TODAS las inspecciones/observaciones cuyo responsable (f.resp)
   coincide (por nombre normalizado) con el nombre del usuario en
   sesión, permitiéndole cerrar/reabrir sus propias acciones sin
   tener que abrir cada inspección una por una. Solo se muestran
   los hallazgos que le corresponden a ese usuario. */
/* Resumen mensual, para el usuario en sesión, de las actividades del
   Programa de seguridad en las que figura como responsable (comparación
   por nombre normalizado, igual que "Mis hallazgos asignados"), agrupadas
   por mes programado con su nivel de cumplimiento (realizadas/programadas). */
/* Estado de una capacitación (Plan de capacitación), con el mismo
   criterio que estadoPrograma() para las actividades del Programa de
   seguridad: realizada si tiene fecha de realización; atrasada si su
   fecha programada ya pasó y no se ha realizado; pendiente en otro caso. */
function estadoCapacitacion(c){
  if(c.fechaRealizada) return "realizada";
  if(c.fechaProgramada && daysUntil(c.fechaProgramada)<0) return "atrasada";
  return "pendiente";
}
function renderMisActividadesMensuales(){
  const tbody = document.getElementById("misActividadesMensualesTable");
  if(!tbody) return;
  const usuario = usuarioDeSesion();
  if(!usuario || !usuario.nombre){
    tbody.innerHTML = '<tr><td class="empty" colspan="5">Inicie sesión para ver sus actividades asignadas.</td></tr>';
    return;
  }
  const nombreUsuario = normalizarNombreTexto(usuario.nombre);
  // Se combinan las actividades del Programa de seguridad (que ya
  // incluyen un tipo "Capacitación" propio) con los registros del Plan
  // de capacitación (módulo aparte), para que "Mis actividades
  // mensuales" muestre también las capacitaciones donde el usuario
  // figura como relator/responsable, y no solo las del Programa.
  const actividades = [];
  (CACHE.programa||[]).forEach(p=>{
    if(p.responsable && normalizarNombreTexto(p.responsable)===nombreUsuario){
      actividades.push({ nombre:p.nombre, tipoLabel: PG_TIPO_LABEL[p.tipo]||p.tipo, fecha:p.fechaProgramada, estado: estadoPrograma(p) });
    }
  });
  (CACHE.capacitaciones||[]).forEach(c=>{
    if(c.relator && normalizarNombreTexto(c.relator)===nombreUsuario){
      actividades.push({ nombre:c.nombre, tipoLabel:"Capacitación", fecha:c.fechaProgramada, estado: estadoCapacitacion(c) });
    }
  });
  if(!actividades.length){
    tbody.innerHTML = `<tr><td class="empty" colspan="5">No hay actividades del Programa de seguridad ni de Capacitación asignadas a "${usuario.nombre}".</td></tr>`;
    return;
  }
  const porMes = new Map();
  actividades.forEach(a=>{
    const mes = (a.fecha||"").slice(0,7) || "(sin fecha)";
    if(!porMes.has(mes)) porMes.set(mes, {programadas:0, realizadas:0, items:[]});
    const st = porMes.get(mes);
    st.programadas++;
    if(a.estado==="realizada") st.realizadas++;
    st.items.push(a);
  });
  const ESTADO_ACT_LABEL = {realizada:"Realizada", atrasada:"Atrasada", pendiente:"Pendiente"};
  const meses = Array.from(porMes.keys()).sort();
  tbody.innerHTML = meses.map(mes=>{
    const st = porMes.get(mes);
    const pct = st.programadas ? Math.round(st.realizadas/st.programadas*100) : 0;
    const detalle = st.items.map(a=>{
      const pillClase = a.estado==="realizada"?"bajo":a.estado==="atrasada"?"alto":"medio";
      return `<div style="margin-bottom:3px;">${a.nombre} <span class="pill ${pillClase}" style="margin-left:4px;">${a.tipoLabel} · ${ESTADO_ACT_LABEL[a.estado]}</span></div>`;
    }).join("");
    return `<tr><td>${mes==="(sin fecha)"?mes:mesLabel(mes)}</td><td>${detalle}</td><td>${st.programadas}</td><td>${st.realizadas}</td><td><span class="pill ${pct>=80?'bajo':pct>=50?'medio':'alto'}">${pct}%</span></td></tr>`;
  }).join("");
}

const MIS_HALLAZGOS_EVIDENCIA = {};
let misHallazgosSeleccionKey = "";
function misHallazgosDelUsuario(){
  const usuario = usuarioDeSesion();
  if(!usuario || !usuario.nombre) return [];
  const nombreUsuario = normalizarNombreTexto(usuario.nombre);
  if(!nombreUsuario) return [];
  const items = [];
  CACHE.inspecciones.forEach(rec=>{
    (rec.findings||[]).forEach((f, fidx)=>{
      if(!f.resp) return;
      if(normalizarNombreTexto(f.resp) === nombreUsuario){
        items.push({ rec, f, fidx, key: rec.id+"|"+fidx });
      }
    });
  });
  items.sort((a,b)=> new Date(b.rec.fecha)-new Date(a.rec.fecha));
  return items;
}
function renderMisHallazgos(){
  const sel = document.getElementById("misHallazgosSelect");
  const wrap = document.getElementById("misHallazgosWrap");
  if(!sel || !wrap) return;
  const usuario = usuarioDeSesion();
  if(!usuario){
    sel.innerHTML = "";
    sel.style.display = "none";
    wrap.innerHTML = '<div class="empty">Inicie sesión para ver los hallazgos asignados a su nombre.</div>';
    return;
  }
  const items = misHallazgosDelUsuario();
  if(!items.length){
    sel.innerHTML = "";
    sel.style.display = "none";
    wrap.innerHTML = `<div class="empty">No hay hallazgos asignados al usuario "${usuario.nombre}".</div>`;
    return;
  }
  sel.style.display = "";
  if(!items.some(it=>it.key===misHallazgosSeleccionKey)) misHallazgosSeleccionKey = items[0].key;
  sel.innerHTML = items.map(({rec, f, key})=>{
    const tipoReg = rec.tipoRegistro||"inspeccion";
    const estadoTxt = f.estado==="cerrada" ? "Cerrada" : (f.estado==="proceso"?"En proceso":"Pendiente");
    const descCorta = (f.desc||"(sin descripción)").slice(0,60);
    return `<option value="${key}" ${key===misHallazgosSeleccionKey?"selected":""}>${fmtDate(rec.fecha)} · ${TIPO_REGISTRO_LABEL[tipoReg]} · ${descCorta} · ${estadoTxt}</option>`;
  }).join("");
  const actual = items.find(it=>it.key===misHallazgosSeleccionKey) || items[0];
  const { rec, f } = actual;
  const cerrada = f.estado === "cerrada";
  const tipoReg = rec.tipoRegistro||"inspeccion";
  wrap.innerHTML = `<div class="finding">
      <div class="kv">${fmtDate(rec.fecha)} · ${TIPO_REGISTRO_LABEL[tipoReg]} · Área: ${areaName(rec.areaId)} · Inspector: ${rec.inspector||"—"}</div>
      <div><strong>${f.desc||"(sin descripción)"}</strong> <span class="pill ${f.nivel||'bajo'}">${nivelLabel(f.nivel||'bajo')}</span></div>
      <div class="kv">Plazo: ${f.plazo?fmtDate(f.plazo):"—"} · Estado: ${f.estado||"pendiente"}</div>
      ${f.foto?`<img class="thumb" src="${f.foto}" style="margin-top:6px;">`:""}
      ${cerrada ? `
        <div class="kv" style="margin-top:8px;background:var(--surface-2,#f2f7f2);padding:8px;border-radius:6px;">
          <div><strong>Medida de control aplicada:</strong> ${f.medidaControl||"—"}</div>
          <div style="margin-top:4px;">Cerrada el ${f.fechaCierreAccion?fmtDate(f.fechaCierreAccion):"—"}</div>
          <div style="margin-top:6px;">${f.evidenciaCierre?`<a href="${f.evidenciaCierre}" target="_blank">Ver evidencia de cierre</a>`:'Sin evidencia adjunta'}</div>
        </div>
        <button class="btn secondary small" data-mh-reabrir style="margin-top:8px;">Reabrir acción</button>
      ` : `
        <div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;">
          <label style="font-size:12.5px;">Medida de control aplicada</label>
          <textarea data-mh-medida placeholder="Describa la medida de control implementada para cerrar esta acción"></textarea>
          <label style="font-size:12.5px;margin-top:6px;">Evidencia de cierre (foto o documento, opcional)</label>
          <input type="file" accept="image/*,.pdf" data-mh-evidencia>
          <div><button class="btn small" data-mh-cerrar style="margin-top:8px;">Cerrar acción</button></div>
        </div>
      `}
    </div>`;
}
document.getElementById("misHallazgosSelect").addEventListener("change", (e)=>{
  misHallazgosSeleccionKey = e.target.value;
  renderMisHallazgos();
});
document.getElementById("misHallazgosWrap").addEventListener("change", (e)=>{
  const inp = e.target.closest("input[data-mh-evidencia]");
  if(!inp) return;
  const key = misHallazgosSeleccionKey;
  const file = inp.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = ()=>{ MIS_HALLAZGOS_EVIDENCIA[key] = reader.result; };
    reader.readAsDataURL(file);
  }
});
document.getElementById("misHallazgosWrap").addEventListener("click", async (e)=>{
  const cerrarBtn = e.target.closest("button[data-mh-cerrar]");
  const reabrirBtn = e.target.closest("button[data-mh-reabrir]");
  if(!cerrarBtn && !reabrirBtn) return;
  const key = misHallazgosSeleccionKey;
  if(!key) return;
  const [recId, fidxStr] = key.split("|");
  const fidx = +fidxStr;
  const rec = CACHE.inspecciones.find(i=>i.id===recId);
  if(!rec) return;
  const f = (rec.findings||[])[fidx];
  if(!f) return;
  if(cerrarBtn){
    const medidaInput = document.querySelector("#misHallazgosWrap [data-mh-medida]");
    const medida = medidaInput ? medidaInput.value.trim() : "";
    if(!medida){ alert("Indique la medida de control aplicada para cerrar esta acción."); return; }
    f.estado = "cerrada";
    f.medidaControl = medida;
    f.fechaCierreAccion = new Date().toISOString().slice(0,10);
    if(MIS_HALLAZGOS_EVIDENCIA[key]) f.evidenciaCierre = MIS_HALLAZGOS_EVIDENCIA[key];
  } else if(reabrirBtn){
    if(!confirm("¿Reabrir esta acción? La medida de control y evidencia registradas se mantienen guardadas.")) return;
    f.estado = "proceso";
  }
  await put("inspecciones", rec);
  await loadCache();
  renderInspeccionesTable(); renderInsStats(); renderMisHallazgos();
});

/* Modal genérico */
function openModal(html){
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalBg").classList.add("open");
}
function closeModal(){
  document.getElementById("modalBg").classList.remove("open");
  document.getElementById("modalBody").innerHTML = "";
}
document.getElementById("modalBg").addEventListener("click", (e)=>{ if(e.target.id==="modalBg") closeModal(); });

/* Detalle de una inspección/observación: ver de qué se trata, cerrar, editar, descargar PDF */
function openInspeccionModal(id){
  const rec = CACHE.inspecciones.find(i=>i.id===id);
  if(!rec) return;
  const cl = CACHE.checklists.find(c=>c.id===rec.tipoId);
  const tipoReg = rec.tipoRegistro||"inspeccion";
  const estado = rec.estado||"abierta";
  const checklistHtml = (rec.checklist||[]).map(it=> it.tipo==="texto"
    ? `<div class="checklist-item"><div>${it.text}</div><span class="kv">${it.valorTexto ? it.valorTexto : "<span class=\"empty\">Sin completar</span>"}</span></div>`
    : `<div class="checklist-item"><div>${it.text}</div><span class="pill ${it.estado==='ok'?'bajo':it.estado==='fail'?'critico':'pendiente'}">${it.estado==='ok'?'Cumple':it.estado==='fail'?'No cumple':'N/A'}</span></div>`
  ).join("") || '<div class="empty">Sin checklist</div>';
  const findingsHtml = (rec.findings||[]).map((f, fidx)=>{
    const cerrada = f.estado === "cerrada";
    const linkCorreo = !cerrada ? mailtoHallazgo(rec, f) : null;
    return `<div class="finding">
      <div><strong>${f.desc||"(sin descripción)"}</strong> <span class="pill ${f.nivel||'bajo'}">${nivelLabel(f.nivel||'bajo')}</span></div>
      <div class="kv">Responsable: ${f.resp||"—"} · Plazo: ${f.plazo?fmtDate(f.plazo):"—"} · Estado: ${f.estado||"pendiente"}
        ${linkCorreo ? ` · <a href="${linkCorreo}" target="_blank">Enviar correo de cierre</a>` : (!cerrada && f.resp ? ` · <span class="empty">Para enviar correo, registre un correo electrónico para "${f.resp}" en Configuración → Responsables de cierre de hallazgos</span>` : "")}
      </div>
      ${f.foto?`<img class="thumb" src="${f.foto}" style="margin-top:6px;">`:""}
      ${cerrada ? `
        <div class="kv" style="margin-top:8px;background:var(--surface-2,#f2f7f2);padding:8px;border-radius:6px;">
          <div><strong>Medida de control aplicada:</strong> ${f.medidaControl||"—"}</div>
          <div style="margin-top:4px;">Cerrada el ${f.fechaCierreAccion?fmtDate(f.fechaCierreAccion):"—"}</div>
          <div style="margin-top:6px;">${f.evidenciaCierre?`<a href="${f.evidenciaCierre}" target="_blank">Ver evidencia de cierre</a>`:'Sin evidencia adjunta'}</div>
        </div>
        <button class="btn secondary small" data-reabrir-accion="${fidx}" style="margin-top:8px;">Reabrir acción</button>
      ` : `
        <div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;">
          <label style="font-size:12.5px;">Medida de control aplicada</label>
          <textarea data-cierre-medida="${fidx}" placeholder="Describa la medida de control implementada para cerrar esta acción"></textarea>
          <label style="font-size:12.5px;margin-top:6px;">Evidencia de cierre (foto o documento, opcional)</label>
          <input type="file" accept="image/*,.pdf" data-cierre-evidencia="${fidx}">
          <div><button class="btn small" data-cerrar-accion="${fidx}" style="margin-top:8px;">Cerrar acción</button></div>
        </div>
      `}
    </div>`;
  }).join("") || '<div class="empty">Sin hallazgos</div>';
  const inspeccionadosHtml = (rec.inspeccionados||[]).length
    ? `<table style="margin-top:8px;"><thead><tr><th>Nombre</th><th>RUT / Patente</th><th>Brigada</th><th>Área</th></tr></thead><tbody>${
        (rec.inspeccionados||[]).map(p=>`<tr><td>${p.nombre||"—"}</td><td>${p.rutPatente||"—"}</td><td>${p.brigada||"—"}</td><td>${areaName(p.areaId)}</td></tr>`).join("")
      }</tbody></table>`
    : '<div class="empty">Sin personas/vehículos registrados</div>';
  openModal(`
    <h3>${TIPO_REGISTRO_LABEL[tipoReg]} — ${fmtDate(rec.fecha)}</h3>
    <div class="kv" style="margin-bottom:10px;">Formato: ${cl?cl.nombre:"—"} · Área: ${areaName(rec.areaId)} · Inspector: ${rec.inspector} · Estado: <span class="pill ${estado==='abierta'?'proceso':'cerrada'}">${ESTADO_INS_LABEL[estado]}</span></div>
    <div style="margin-bottom:10px;"><strong>Descripción / motivo:</strong><div>${rec.descripcion? rec.descripcion : '<span class="empty">Sin descripción registrada</span>'}</div></div>
    <div style="margin-bottom:10px;"><strong>Checklist</strong>${checklistHtml}</div>
    <div style="margin-bottom:10px;"><strong>Hallazgos</strong>${findingsHtml}</div>
    <div style="margin-bottom:14px;"><strong>Personas / vehículos inspeccionados</strong>${inspeccionadosHtml}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      ${estado==='abierta' ? `<button class="btn" id="modalCerrarBtn">Cerrar inspección</button>` : `<button class="btn secondary" id="modalReabrirBtn">Reabrir</button>`}
      <button class="btn secondary" id="modalEditarBtn">Editar</button>
      <button class="btn secondary" id="modalPdfBtn">Descargar PDF</button>
      <button class="btn secondary" id="modalCerrarVentanaBtn">Cerrar ventana</button>
    </div>
  `);
  const cerrarBtn = document.getElementById("modalCerrarBtn");
  if(cerrarBtn) on(cerrarBtn, "click", async () => {
    rec.estado = "cerrada"; rec.fechaCierre = new Date().toISOString();
    await put("inspecciones", rec);
    await loadCache();
    renderInspeccionesTable(); renderInsStats();
    closeModal();
  });
  const reabrirBtn = document.getElementById("modalReabrirBtn");
  if(reabrirBtn) on(reabrirBtn, "click", async () => {
    rec.estado = "abierta"; rec.fechaCierre = "";
    await put("inspecciones", rec);
    await loadCache();
    renderInspeccionesTable(); renderInsStats();
    closeModal();
  });
  on(document.getElementById("modalEditarBtn"), "click", async () => { startEditInspeccion(id); });
  on(document.getElementById("modalPdfBtn"), "click", async () => { descargarInspeccionPdf(rec); });
  document.getElementById("modalCerrarVentanaBtn").addEventListener("click", closeModal);

  /* Cerrar / reabrir cada acción (hallazgo) individualmente, indicando
     la medida de control aplicada y, opcionalmente, la evidencia de cierre. */
  const evidenciaPendiente = {};
  document.querySelectorAll("input[data-cierre-evidencia]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const fidx = inp.dataset.cierreEvidencia;
      const file = inp.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = ()=>{ evidenciaPendiente[fidx] = reader.result; };
        reader.readAsDataURL(file);
      }
    });
  });
  document.querySelectorAll("button[data-cerrar-accion]").forEach(btn=>{
    on(btn, "click", async () => {
      const fidx = +btn.dataset.cerrarAccion;
      const f = (rec.findings||[])[fidx];
      if(!f) return;
      const medidaInput = document.querySelector(`[data-cierre-medida="${fidx}"]`);
      const medida = medidaInput ? medidaInput.value.trim() : "";
      if(!medida){ alert("Indique la medida de control aplicada para cerrar esta acción."); return; }
      f.estado = "cerrada";
      f.medidaControl = medida;
      f.fechaCierreAccion = new Date().toISOString().slice(0,10);
      if(evidenciaPendiente[fidx]) f.evidenciaCierre = evidenciaPendiente[fidx];
      await put("inspecciones", rec);
      await loadCache();
      renderInspeccionesTable(); renderInsStats();
      openInspeccionModal(id);
    });
  });
  document.querySelectorAll("button[data-reabrir-accion]").forEach(btn=>{
    on(btn, "click", async () => {
      const fidx = +btn.dataset.reabrirAccion;
      const f = (rec.findings||[])[fidx];
      if(!f) return;
      if(!confirm("¿Reabrir esta acción? La medida de control y evidencia registradas se mantienen guardadas.")) return;
      f.estado = "proceso";
      await put("inspecciones", rec);
      await loadCache();
      renderInspeccionesTable(); renderInsStats();
      openInspeccionModal(id);
    });
  });
}

/* =========================================================
   ESTADÍSTICAS DE INSPECCIONES Y OBSERVACIONES
   (top 10 hallazgos repetitivos + estadística mensual/anual)
   ========================================================= */
function normalizaHallazgo(desc){
  return (desc||"").trim().toLowerCase().replace(/\s+/g," ");
}
function top10Hallazgos(){
  const counts = new Map(); // normalizado -> {texto original, count}
  CACHE.inspecciones.forEach(i=>{
    (i.findings||[]).forEach(f=>{
      const norm = normalizaHallazgo(f.desc);
      if(!norm) return;
      if(!counts.has(norm)) counts.set(norm, {texto: (f.desc||"").trim(), count:0});
      counts.get(norm).count++;
    });
  });
  return Array.from(counts.values()).sort((a,b)=>b.count-a.count).slice(0,10);
}
function renderTop10Hallazgos(){
  const top = top10Hallazgos();
  document.getElementById("top10HallazgosTable").innerHTML = top.map((h,idx)=>`
    <tr><td>${idx+1}</td><td>${h.texto}</td><td>${h.count}</td></tr>
  `).join("") || `<tr><td class="empty" colspan="3">Aún no hay hallazgos registrados</td></tr>`;
}

function statsPorMesYAnio(){
  // Devuelve { porMes: [{mes, inspecciones, observaciones}]x12 del año en curso, porAnio: Map(año -> stats) }
  const anioActual = new Date().getFullYear();
  const porMes = Array.from({length:12}, (_,m)=>({mes:m, inspecciones:0, observaciones:0}));
  const porAnio = new Map();
  CACHE.inspecciones.forEach(i=>{
    if(!i.fecha) return;
    const d = new Date(i.fecha+"T00:00:00");
    if(isNaN(d)) return;
    const anio = d.getFullYear();
    const tipoReg = i.tipoRegistro||"inspeccion";
    if(anio===anioActual){
      const mes = d.getMonth();
      if(tipoReg==="observacion") porMes[mes].observaciones++; else porMes[mes].inspecciones++;
    }
    if(!porAnio.has(anio)) porAnio.set(anio, {inspecciones:0, observaciones:0, hallazgos:0, hallazgosGraves:0});
    const st = porAnio.get(anio);
    if(tipoReg==="observacion") st.observaciones++; else st.inspecciones++;
    (i.findings||[]).forEach(f=>{
      st.hallazgos++;
      if(f.nivel==="alto"||f.nivel==="critico") st.hallazgosGraves++;
    });
  });
  return {anioActual, porMes, porAnio};
}
function renderInsStats(){
  renderTop10Hallazgos();
  const {anioActual, porMes, porAnio} = statsPorMesYAnio();
  const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const total = porMes.reduce((s,m)=>s+m.inspecciones+m.observaciones,0);
  if(total===0){
    document.getElementById("chartInsMensualWrap").innerHTML = `<div class="empty">Sin registros en ${anioActual} todavía</div>`;
  } else {
    document.getElementById("chartInsMensualWrap").innerHTML = porMes.map(m=>{
      const t = m.inspecciones+m.observaciones;
      const maxDelMes = Math.max(...porMes.map(x=>x.inspecciones+x.observaciones), 1);
      const pctI = Math.round(m.inspecciones/maxDelMes*100);
      const pctO = Math.round(m.observaciones/maxDelMes*100);
      return `<div style="margin-bottom:9px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);margin-bottom:3px;">
          <span>${MESES[m.mes]}</span><span>${m.inspecciones} insp. · ${m.observaciones} obs.</span>
        </div>
        <div style="display:flex;gap:3px;">
          <div style="background:var(--grid);border-radius:6px;height:12px;flex:1;overflow:hidden;"><div style="width:${pctI}%;background:#2a78d6;height:100%;"></div></div>
          <div style="background:var(--grid);border-radius:6px;height:12px;flex:1;overflow:hidden;"><div style="width:${pctO}%;background:#eda100;height:100%;"></div></div>
        </div>
      </div>`;
    }).join("") + `<div class="legend"><span>🟦 Inspecciones</span><span>🟧 Observaciones</span></div>`;
  }
  const anios = Array.from(porAnio.keys()).sort((a,b)=>b-a);
  document.getElementById("statsAnualTable").innerHTML = anios.map(a=>{
    const s = porAnio.get(a);
    return `<tr><td>${a}</td><td>${s.inspecciones}</td><td>${s.observaciones}</td><td>${s.hallazgos}</td><td>${s.hallazgosGraves}</td></tr>`;
  }).join("") || `<tr><td class="empty" colspan="5">Sin registros todavía</td></tr>`;
}

/* Muestra u oculta el selector de mes según el período elegido para el resumen PDF */
