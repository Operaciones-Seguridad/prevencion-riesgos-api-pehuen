/* =========================================================
   CONTROL DOCUMENTAL
   Cruza la Matriz de riesgos (medidas de control administrativas,
   jerarquía D del DS N°44 — típicamente procedimientos de trabajo
   seguro) con un registro histórico de documentos con versión
   (Política de SST, Procedimientos, la Matriz de riesgos como
   documento formal, u otros), cada uno con su archivo adjunto.
   Store "documentos": {id, tipo, nombre, version, fechaConfeccion,
   fechaRevision, fechaActualizacion, descripcion, responsableElaboracion,
   responsableRevision, responsableAprobacion, observaciones, contenido,
   subtipo ("procedimiento"|"instructivo", solo si tipo==="procedimiento"),
   archivoNombre, archivoData}.
   ========================================================= */
const TIPO_DOC_LABEL = {politica:"Política de SST", procedimiento:"Procedimiento", manual:"Manual", matriz:"Matriz de riesgos", otro:"Otro documento"};
const SUBTIPO_DOC_LABEL = {procedimiento:"Procedimiento de trabajo seguro", instructivo:"Instructivo de trabajo"};
/* Devuelve la etiqueta a mostrar para el tipo de un documento, usando el subtipo
   (Procedimiento/Instructivo) cuando corresponde en vez del genérico "Procedimiento". */
function tipoDocumentoLabel(d){
  if(d.tipo==="procedimiento" && d.subtipo) return SUBTIPO_DOC_LABEL[d.subtipo] || TIPO_DOC_LABEL.procedimiento;
  return TIPO_DOC_LABEL[d.tipo] || d.tipo;
}

/* Deduplica las medidas de control administrativas (D) de toda la Matriz
   de riesgos, contando cuántas líneas y qué procesos las requieren. */
function procedimientosDesdeMatriz(){
  const map = new Map();
  (CACHE.matriz||[]).forEach(m=>{
    jerarquiaDe(m).filter(it=>it.jerarquia==="D").forEach(it=>{
      const texto = (it.texto||"").trim();
      if(!texto) return;
      const key = texto.toLowerCase().replace(/\s+/g," ");
      if(!map.has(key)) map.set(key, {texto, count:0, procesos:new Set()});
      const e = map.get(key);
      e.count++;
      if(m.proceso) e.procesos.add(m.proceso);
    });
  });
  return Array.from(map.values()).sort((a,b)=> b.count-a.count || a.texto.localeCompare(b.texto));
}
function documentoKey(d){ return (d.tipo||"")+"||"+(d.nombre||"").toLowerCase().replace(/\s+/g," ").trim(); }
/* Último documento de tipo Procedimiento cuyo nombre coincide exactamente
   (normalizado) con el texto de la medida de control D de la matriz. */
function documentoProcedimientoPara(texto){
  const key = "procedimiento||"+texto.toLowerCase().replace(/\s+/g," ").trim();
  const candidatos = (CACHE.documentos||[]).filter(d=> documentoKey(d)===key);
  if(!candidatos.length) return null;
  return candidatos.slice().sort((a,b)=> new Date(b.fechaActualizacion||b.fechaConfeccion||0) - new Date(a.fechaActualizacion||a.fechaConfeccion||0))[0];
}
/* Para cada combinación tipo+nombre, el documento vigente es el de fecha
   de actualización (o confección) más reciente; las demás versiones
   quedan marcadas como "Anterior" en el historial. */
function documentosVigentesMap(){
  const map = new Map();
  (CACHE.documentos||[]).forEach(d=>{
    const key = documentoKey(d);
    const cur = map.get(key);
    const fechaD = new Date(d.fechaActualizacion||d.fechaConfeccion||0);
    if(!cur || fechaD > new Date(cur.fechaActualizacion||cur.fechaConfeccion||0)) map.set(key, d);
  });
  return map;
}
function renderProcedimientosMatriz(){
  const items = procedimientosDesdeMatriz();
  document.getElementById("procedimientosMatrizTable").innerHTML = items.length ? items.map(it=>{
    const doc = documentoProcedimientoPara(it.texto);
    const estadoHtml = doc ? `<span class="pill vigente">Confeccionado (v.${doc.version||"—"})</span>` : `<span class="pill pendiente">Pendiente</span>`;
    const accionHtml = doc
      ? `<button class="subtle-btn" data-doc-ver="${doc.id}">Ver versión</button>`
      : `<button class="subtle-btn" data-doc-crear="${encodeURIComponent(it.texto)}">Registrar procedimiento</button>`;
    return `<tr>
      <td>${it.texto}</td>
      <td>${it.count} línea(s)${it.procesos.size? `<div class="kv">${Array.from(it.procesos).join(", ")}</div>`:""}</td>
      <td>${estadoHtml}</td>
      <td>${accionHtml}</td>
    </tr>`;
  }).join("") : `<tr><td class="empty" colspan="4">No hay medidas de control administrativas (D) cargadas en la Matriz de riesgos</td></tr>`;
  const pendientes = items.filter(it=>!documentoProcedimientoPara(it.texto)).length;
  document.getElementById("procedimientosMatrizTiles").innerHTML = [
    tile("Procedimientos identificados en la Matriz", items.length, "medidas de control administrativas (D) distintas"),
    tile("Confeccionados", items.length-pendientes, "con documento de tipo Procedimiento registrado"),
    tile("Pendientes de confeccionar", pendientes, "sin documento registrado todavía"),
  ].join("");
}
