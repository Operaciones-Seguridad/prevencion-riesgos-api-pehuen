    contenido: `1. Objetivo
Establecer la secuencia de pasos y los controles mínimos que deben cumplirse en toda actividad de montaje o mantención de líneas eléctricas que implique trabajo en altura (postes, estructuras, torres, andamios o plataformas elevadas), para prevenir caídas de distinto nivel, contacto con energía eléctrica y otros riesgos asociados.

2. Alcance
Aplica a todos los trabajadores y trabajadoras de ANGOLEC SPA, contratistas y subcontratistas que realicen tareas por sobre 1,8 metros de altura, criterio establecido por el DS N°594 y las guías técnicas de la Asociación Chilena de Seguridad (ACHS).

3. Definiciones
- Trabajo en altura: toda actividad que se realiza por sobre 1,8 metros de altura respecto de un plano inferior, incluyendo postes, estructuras, plataformas, andamios y fachadas.
- Anclaje certificado: punto de sujeción calculado y validado por un profesional competente, capaz de resistir la carga dinámica de una caída.
- Sistema de detención de caídas: arnés de seguridad de cuerpo entero, con estrobo/línea de vida independiente de la plataforma de trabajo.

4. Antes de iniciar el trabajo (permiso y verificación)
4.1 Emitir el permiso de trabajo en altura, firmado por el jefe de faena y el prevencionista de riesgos.
4.2 Verificar las condiciones ambientales (viento, lluvia, tormentas eléctricas); suspender el trabajo si las condiciones son adversas.
4.3 Verificar la distancia y el estado de energización de líneas eléctricas cercanas; solicitar el corte o la puesta a tierra cuando corresponda, conforme al procedimiento de bloqueo y tarjeteo (LOTO) de la empresa.
4.4 Inspeccionar visualmente el arnés, el estrobo, la línea de vida, los mosquetones y el anclaje antes de cada uso; retirar de servicio cualquier equipo dañado.
4.5 Verificar la estabilidad, nivelación y capacidad de carga de plataformas, andamios (con doble baranda y rodapié) y escalas.
4.6 Confirmar que el trabajador cuenta con examen de aptitud para trabajo en altura vigente y capacitación en trabajo en altura y uso de arnés.

5. Durante el trabajo
5.1 El 100% del tiempo en altura, el trabajador debe permanecer enganchado al sistema de detención de caídas, con el anclaje sobre el nivel de la cabeza cuando sea posible.
5.2 Delimitar y señalizar la zona de trabajo en el nivel inferior, para evitar el paso de personas bajo el área de trabajo.
5.3 Mantener comunicación permanente (visual o radial) entre el trabajador en altura y un ayudante o supervisor en el nivel inferior.
5.4 No transportar herramientas u objetos sueltos; utilizar bolsos porta-herramientas amarrados o cuerdas de sujeción para herramientas.
5.5 Detener la actividad de inmediato ante cualquier cambio de las condiciones ambientales o ante la proximidad no controlada de líneas energizadas.

6. Emergencia y rescate
6.1 Todo trabajo en altura debe contar con un plan de rescate específico, conocido por el equipo de trabajo, que permita descender a un trabajador suspendido en el menor tiempo posible.
6.2 Mantener en el lugar los medios de rescate definidos (kit de rescate, escalera o grúa auxiliar), según la evaluación de riesgos de la faena.

7. Capacitación
Todo trabajador que realice trabajo en altura debe acreditar capacitación específica en trabajo en altura y en el uso correcto del arnés de seguridad, con reforzamiento periódico según lo defina el Plan de Capacitación de la empresa.

