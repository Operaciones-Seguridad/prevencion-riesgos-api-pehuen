  document.getElementById("docTipo").value = rec.tipo || "procedimiento";
  document.getElementById("docSubtipo").value = rec.subtipo || "procedimiento";
  document.getElementById("docNombre").value = rec.nombre || "";
  document.getElementById("docVersion").value = rec.version || "";
  document.getElementById("docFechaConfeccion").value = rec.fechaConfeccion || "";
  document.getElementById("docFechaRevision").value = rec.fechaRevision || "";
  document.getElementById("docFechaActualizacion").value = rec.fechaActualizacion || "";
  document.getElementById("docDescripcion").value = rec.descripcion || "";
  fillDocResponsableSelect(document.getElementById("docResponsableElaboracion"), rec.responsableElaboracion || "");
  fillDocResponsableSelect(document.getElementById("docResponsableRevision"), rec.responsableRevision || "");
  fillDocResponsableSelect(document.getElementById("docResponsableAprobacion"), rec.responsableAprobacion || "");
  document.getElementById("docObservaciones").value = rec.observaciones || "";
  document.getElementById("docContenido").value = rec.contenido || "";
  document.getElementById("docArchivoInput").value = "";
  document.getElementById("docArchivoActual").textContent = rec.archivoNombre ? ("Archivo actual: "+rec.archivoNombre+" (se mantiene si no subes uno nuevo)") : "Sin archivo adjunto todavía";
  document.getElementById("docFormTitle").textContent = "Editando "+(rec.nombre||"documento")+" — v."+(rec.version||"");
  document.getElementById("cancelEditDocumentoBtn").style.display = "";
  actualizarVisibilidadSubtipoDoc();
  document.getElementById("hdrDocumento").scrollIntoView({behavior:"smooth", block:"start"});
}
