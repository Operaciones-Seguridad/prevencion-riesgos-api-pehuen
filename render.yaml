function showInitError(err){
  console.error(err);
  const banner = document.createElement("div");
  banner.style.cssText = "background:#fbdada;color:#8f1f1f;padding:14px 16px;text-align:center;font-size:13.5px;border-bottom:1px solid #d03b3b;";
  banner.innerHTML = "No se pudo cargar la aplicación correctamente (" + (err && err.message ? err.message : err) +
    "). Prueba recargando la página. Si el problema persiste, abre la consola del navegador (F12) y comparte el mensaje de error.";
  document.body.insertBefore(banner, document.body.firstChild);
}

(async function init(){
  try{
    await openDB();
    if(storageMode === "api"){
      /* Modo backend real: no se siembra nada desde el cliente (el
         servidor ya garantiza un usuario Administrador por defecto la
         primera vez que arranca con una base de datos vacía). Todo lo
         demás se carga recién después de iniciar sesión, porque los
         datos ahora están protegidos detrás de autenticación. */
      await iniciarSesionGuardada();
    } else {
      await seedData(false);
      await seedAccesosPorDefecto();
      await seedCompromisosPorDefecto();
      await refreshAll();
      renderChecklistFor(document.getElementById("insTipo").value);
      iniciarSesionGuardada();
    }
  } catch(err){
    showInitError(err);
  }
})();
