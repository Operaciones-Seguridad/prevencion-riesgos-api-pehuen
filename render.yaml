/* =========================================================
   GENERACIÓN DE PDF (jsPDF + jspdf-autotable, cargados desde CDN)
   ========================================================= */
function getJsPDF(){
  if(typeof window.jspdf === "undefined" || !window.jspdf.jsPDF) return null;
  return window.jspdf.jsPDF;
}
function descargarInspeccionPdf(rec){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const doc = new JsPDFClass();
  const cl = CACHE.checklists.find(c=>c.id===rec.tipoId);
  const tipoReg = rec.tipoRegistro||"inspeccion";
  const estado = rec.estado||"abierta";
  let y = 16;
  doc.setFontSize(15);
  doc.text(`${TIPO_REGISTRO_LABEL[tipoReg]} — ${fmtDate(rec.fecha)}`, 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  doc.text(`Formato: ${cl?cl.nombre:"—"}   Área: ${areaName(rec.areaId)}   Inspector: ${rec.inspector||"—"}   Estado: ${ESTADO_INS_LABEL[estado]}`, 14, y); y += 8;
  if(rec.descripcion){
    doc.setFont(undefined,"bold"); doc.text("Descripción / motivo:", 14, y); doc.setFont(undefined,"normal"); y += 5;
    const splitDesc = doc.splitTextToSize(rec.descripcion, 180);
    doc.text(splitDesc, 14, y); y += splitDesc.length*5 + 4;
  }
  if((rec.checklist||[]).length){
    doc.autoTable({ startY: y, head: [["Ítem del checklist","Resultado"]],
      body: rec.checklist.map(it=>[it.text, it.tipo==="texto" ? (it.valorTexto || "—") : (it.estado==='ok'?'Cumple':it.estado==='fail'?'No cumple':'N/A')]),
      styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
    y = doc.lastAutoTable.finalY + 8;
  }
  if((rec.findings||[]).length){
    doc.autoTable({ startY: y, head: [["Hallazgo","Nivel","Responsable","Plazo","Estado","Medida de control (cierre)"]],
      body: rec.findings.map(f=>[f.desc||"—", nivelLabel(f.nivel||"bajo"), f.resp||"—", f.plazo?fmtDate(f.plazo):"—", f.estado||"pendiente", f.estado==="cerrada"?(f.medidaControl||"—"):"—"]),
      styles:{fontSize:9}, headStyles:{fillColor:[236,131,90]} });
    y = doc.lastAutoTable.finalY + 8;
  }
  if((rec.inspeccionados||[]).length){
    doc.autoTable({ startY: y, head: [["Nombre","RUT / Patente","Brigada","Área"]],
      body: rec.inspeccionados.map(p=>[p.nombre||"—", p.rutPatente||"—", p.brigada||"—", areaName(p.areaId)]),
      styles:{fontSize:9}, headStyles:{fillColor:[27,175,122]} });
  }
  doc.save(`${TIPO_REGISTRO_LABEL[tipoReg]}_${rec.fecha}_${(rec.inspector||"").replace(/[^a-zA-Z0-9]+/g,"_")}.pdf`);
}

on(document.getElementById("downloadResumenPdfBtn"), "click", async () => {
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const periodo = document.getElementById("resPeriodo").value;
  const anio = +document.getElementById("resAnio").value || new Date().getFullYear();
  const mes = +document.getElementById("resMes").value;
  const enPeriodo = CACHE.inspecciones.filter(i=>{
    if(!i.fecha) return false;
    const d = new Date(i.fecha+"T00:00:00");
    if(isNaN(d)) return false;
    if(d.getFullYear()!==anio) return false;
    if(periodo==="mensual" && d.getMonth()!==mes) return false;
    return true;
  });
  if(!enPeriodo.length){ alert("No hay inspecciones ni observaciones registradas en el período seleccionado."); return; }

  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const tituloPeriodo = periodo==="mensual" ? `${MESES[mes]} ${anio}` : `Año ${anio}`;
  const doc = new JsPDFClass();
  let y = 16;
  doc.setFontSize(15);
  doc.text(`Resumen de inspecciones y observaciones — ${tituloPeriodo}`, 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 8;

  const nInsp = enPeriodo.filter(i=>(i.tipoRegistro||"inspeccion")==="inspeccion").length;
  const nObs = enPeriodo.filter(i=>i.tipoRegistro==="observacion").length;
  const hallazgos = enPeriodo.flatMap(i=>i.findings||[]);
  const hallazgosGraves = hallazgos.filter(f=>f.nivel==="alto"||f.nivel==="critico").length;
  const abiertas = enPeriodo.filter(i=>(i.estado||"abierta")==="abierta").length;
  doc.autoTable({ startY:y, head:[["Indicador","Valor"]], body:[
    ["N° Inspecciones", nInsp], ["N° Observaciones", nObs], ["N° total de registros", enPeriodo.length],
    ["N° hallazgos totales", hallazgos.length], ["N° hallazgos alto/crítico", hallazgosGraves],
    ["N° registros aún abiertos", abiertas],
  ], styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 8;

  // Top 10 hallazgos repetitivos DENTRO del período
  const counts = new Map();
  hallazgos.forEach(f=>{
    const norm = normalizaHallazgo(f.desc);
    if(!norm) return;
    if(!counts.has(norm)) counts.set(norm,{texto:(f.desc||"").trim(), count:0});
    counts.get(norm).count++;
  });
  const topPeriodo = Array.from(counts.values()).sort((a,b)=>b.count-a.count).slice(0,10);
  if(topPeriodo.length){
    doc.setFontSize(12); doc.text("Top 10 hallazgos repetitivos del período", 14, y); y += 4;
    doc.autoTable({ startY:y, head:[["#","Hallazgo","N° de veces"]],
      body: topPeriodo.map((h,idx)=>[idx+1, h.texto, h.count]),
      styles:{fontSize:9}, headStyles:{fillColor:[236,131,90]} });
    y = doc.lastAutoTable.finalY + 8;
  }

  doc.setFontSize(12); doc.text("Detalle de registros del período", 14, y); y += 4;
  doc.autoTable({ startY:y, head:[["Fecha","Tipo","Área","Inspector","Estado","Hallazgos"]],
    body: enPeriodo.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(i=>[
      fmtDate(i.fecha), TIPO_REGISTRO_LABEL[i.tipoRegistro||"inspeccion"], areaName(i.areaId), i.inspector||"—",
      ESTADO_INS_LABEL[i.estado||"abierta"], (i.findings||[]).length
    ]), styles:{fontSize:9}, headStyles:{fillColor:[27,175,122]} });

  doc.save(`Resumen_${periodo==="mensual"?MESES[mes]+"_":""}${anio}.pdf`);
});

/* =========================================================
   CONFECCIÓN DE AST (ANÁLISIS DE SEGURIDAD DEL TRABAJO)
   Trae los riesgos/medidas de control ya cargados en la Matriz de
   riesgos para el área (y, si se indica, la actividad) seleccionada;
   el usuario puede quitar los que no apliquen a la tarea puntual y
   agregar otros riesgos y medidas en forma manual. Registro
   independiente de Inspecciones/Observaciones (store "astRegistros"),
   aunque vive en la misma pestaña "Inspecciones" a pedido del usuario.
   ========================================================= */
let currentAstRiesgos = [];
let currentAstTrabajadores = [];
let astEditingId = null;

function drawAstRiesgos(){
  document.getElementById("astRiesgosWrap").innerHTML = currentAstRiesgos.length
    ? currentAstRiesgos.map((r,idx)=>`
        <tr>
          <td>${idx+1}</td>
          <td>${r.texto}</td>
          <td>${r.medida || "—"}</td>
          <td><span class="pill ${r.origen==='matriz'?'pendiente':'bajo'}">${r.origen==='matriz'?'Matriz de riesgos':'Manual'}</span></td>
          <td><button class="subtle-btn" data-ast-riesgo-quitar="${idx}">Quitar</button></td>
        </tr>
      `).join("")
    : `<tr><td class="empty" colspan="5">Sin riesgos agregados todavía</td></tr>`;
}
document.getElementById("astRiesgosWrap").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-ast-riesgo-quitar]");
  if(!btn) return;
  currentAstRiesgos.splice(+btn.dataset.astRiesgoQuitar,1);
  drawAstRiesgos();
});

on(document.getElementById("astCargarMatrizBtn"), "click", () => {
  const areaId = document.getElementById("astArea").value;
  if(!areaId){ alert("Selecciona primero el área de la tarea."); return; }
  const actividadTxt = document.getElementById("astActividad").value.trim().toLowerCase();
  const lineas = CACHE.matriz.filter(m => m.areaId===areaId && (!actividadTxt || (m.actividad||"").toLowerCase().includes(actividadTxt)));
  if(!lineas.length){ alert("No se encontraron líneas en la Matriz de riesgos para esa área/actividad."); return; }
  let agregados = 0;
  lineas.forEach(m=>{
    const texto = `${m.peligro||"—"}${m.riesgo? " — "+m.riesgo : ""}`;
    const medida = m.controles || "(sin medida de control registrada en la matriz)";
    const yaExiste = currentAstRiesgos.some(r=>r.texto===texto && r.origen==="matriz");
    if(!yaExiste){ currentAstRiesgos.push({id:uid(), texto, medida, origen:"matriz"}); agregados++; }
  });
  drawAstRiesgos();
  alert(agregados ? `${agregados} riesgo(s) cargados desde la Matriz de riesgos.` : "Los riesgos de esa área/actividad ya estaban cargados.");
});

on(document.getElementById("addAstRiesgoBtn"), "click", () => {
  const texto = document.getElementById("astRiesgoInput").value.trim();
  const medida = document.getElementById("astMedidaInput").value.trim();
  if(!texto){ alert("Indica el peligro/riesgo a agregar."); return; }
  currentAstRiesgos.push({id:uid(), texto, medida: medida || "(sin medida de control indicada)", origen:"manual"});
  document.getElementById("astRiesgoInput").value = "";
  document.getElementById("astMedidaInput").value = "";
  drawAstRiesgos();
});

function drawAstTrabajadores(){
  document.getElementById("astTrabajadoresWrap").innerHTML = currentAstTrabajadores.length
    ? currentAstTrabajadores.map((tid,idx)=>`
        <div class="checklist-item">
          <div>${trabName(tid)}</div>
          <button class="subtle-btn" data-ast-trab-quitar="${idx}">Quitar</button>
        </div>
      `).join("")
    : '<div class="empty">Sin participantes agregados</div>';
}
document.getElementById("addAstTrabBtn").addEventListener("click", ()=>{
  const sel = document.getElementById("astTrabajadorSel");
  if(!sel.value) return;
  if(!currentAstTrabajadores.includes(sel.value)) currentAstTrabajadores.push(sel.value);
  sel.value = "";
  drawAstTrabajadores();
});
document.getElementById("astTrabajadoresWrap").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-ast-trab-quitar]");
  if(!btn) return;
  currentAstTrabajadores.splice(+btn.dataset.astTrabQuitar,1);
  drawAstTrabajadores();
});

function resetAstForm(){
  astEditingId = null;
  document.getElementById("astFecha").value = "";
  document.getElementById("astArea").value = "";
  document.getElementById("astActividad").value = "";
  document.getElementById("astResponsable").value = "";
  currentAstRiesgos = []; currentAstTrabajadores = [];
  drawAstRiesgos(); drawAstTrabajadores();
  document.getElementById("astFormTitle").textContent = "Confección de AST (Análisis de Seguridad del Trabajo)";
  document.getElementById("saveAstBtn").textContent = "Guardar AST";
  document.getElementById("cancelEditAstBtn").style.display = "none";
}
on(document.getElementById("cancelEditAstBtn"), "click", () => { resetAstForm(); });

function startEditAst(id){
  const rec = CACHE.astRegistros.find(a=>a.id===id);
  if(!rec) return;
  astEditingId = id;
  document.getElementById("astFecha").value = rec.fecha || "";
  document.getElementById("astArea").value = rec.areaId || "";
  document.getElementById("astActividad").value = rec.actividad || "";
  document.getElementById("astResponsable").value = rec.responsable || "";
  currentAstRiesgos = (rec.riesgos||[]).slice();
  currentAstTrabajadores = (rec.participantesIds||[]).slice();
  drawAstRiesgos(); drawAstTrabajadores();
  document.getElementById("astFormTitle").textContent = `Editando AST del ${fmtDate(rec.fecha)}`;
  document.getElementById("saveAstBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditAstBtn").style.display = "";
  document.getElementById("astFormTitle").scrollIntoView({behavior:"smooth", block:"start"});
}

on(document.getElementById("astDescargarPdfBtn"), "click", () => {
  const fecha = document.getElementById("astFecha").value;
  const areaId = document.getElementById("astArea").value;
  const actividad = document.getElementById("astActividad").value.trim();
  const responsable = document.getElementById("astResponsable").value.trim();
  if(!fecha || !areaId || !actividad){ alert("Completa al menos la fecha, el área y la actividad antes de descargar el PDF."); return; }
  if(!currentAstRiesgos.length){ alert("Agrega al menos un riesgo (desde la Matriz de riesgos o en forma manual) antes de descargar el PDF."); return; }
  descargarAstPdf({ fecha, areaId, actividad, responsable, riesgos: currentAstRiesgos.slice(), participantesIds: currentAstTrabajadores.slice() });
});

on(document.getElementById("saveAstBtn"), "click", async () => {
  const fecha = document.getElementById("astFecha").value;
  const areaId = document.getElementById("astArea").value;
  const actividad = document.getElementById("astActividad").value.trim();
  const responsable = document.getElementById("astResponsable").value.trim();
  if(!fecha || !areaId || !actividad){ alert("Completa al menos la fecha, el área y la actividad."); return; }
  if(!currentAstRiesgos.length){ alert("Agrega al menos un riesgo (desde la Matriz de riesgos o en forma manual) antes de guardar."); return; }

  if(astEditingId){
    const anterior = CACHE.astRegistros.find(a=>a.id===astEditingId);
    if(!anterior){ alert("La AST que estabas editando ya no existe."); resetAstForm(); return; }
    const rec = { ...anterior, fecha, areaId, actividad, responsable, riesgos: currentAstRiesgos.slice(), participantesIds: currentAstTrabajadores.slice() };
    await put("astRegistros", rec);
    await loadCache();
    resetAstForm();
    renderAstTable();
    alert("AST actualizada.");
    return;
  }

  const rec = { id: uid(), fecha, areaId, actividad, responsable, riesgos: currentAstRiesgos.slice(), participantesIds: currentAstTrabajadores.slice() };
  await put("astRegistros", rec);
  await loadCache();
  resetAstForm();
  renderAstTable();
  alert("AST guardada.");
});

function renderAstFiltros(){
  const sel = document.getElementById("filterAstArea");
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todas</option>' + CACHE.areas.map(a=>`<option value="${a.id}">${a.nombre}</option>`).join("");
  sel.value = cur;
}
function renderAstTable(){
  renderAstFiltros();
  const fArea = document.getElementById("filterAstArea").value;
  const rows = (CACHE.astRegistros||[])
    .filter(a => !fArea || a.areaId===fArea)
    .sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  document.getElementById("astTable").innerHTML = rows.map(a=>{
    const participantes = (a.participantesIds||[]).map(id=>trabName(id)).join(", ") || "—";
    return `<tr>
      <td>${fmtDate(a.fecha)}</td>
      <td>${areaName(a.areaId)}</td>
      <td>${a.actividad}</td>
      <td>${a.responsable || "—"}</td>
      <td>${(a.riesgos||[]).length}</td>
      <td>${participantes}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-ast-editar="${a.id}">Editar</button>
        <button class="btn small" data-ast-imprimir="${a.id}">Descargar PDF</button>
        <button class="subtle-btn" data-ast-eliminar="${a.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td class="empty" colspan="7">Aún no hay AST registradas</td></tr>`;
}
document.getElementById("filterAstArea").addEventListener("change", renderAstTable);
on(document.getElementById("astTable"), "click", async (e) => {
  const editBtn = e.target.closest("button[data-ast-editar]");
  if(editBtn){ startEditAst(editBtn.dataset.astEditar); return; }
  const delBtn = e.target.closest("button[data-ast-eliminar]");
  if(delBtn){
    const rec = CACHE.astRegistros.find(a=>a.id===delBtn.dataset.astEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar la AST del ${fmtDate(rec.fecha)} (${rec.actividad})? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("astRegistros", rec.id);
    await loadCache();
    if(astEditingId === rec.id) resetAstForm();
    renderAstTable();
    return;
  }
  const printBtn = e.target.closest("button[data-ast-imprimir]");
  if(printBtn){
    const rec = CACHE.astRegistros.find(a=>a.id===printBtn.dataset.astImprimir);
    if(rec) descargarAstPdf(rec);
  }
});

/* Formato de la AST en PDF: encabezado con los datos de la tarea, tabla
   de riesgos/medidas de control (el cuerpo típico de una AST), y una
   sección de firma de conformidad con una línea en blanco por cada
   participante — pensado para completarse en terreno o imprimirse y
   firmar a mano. */
function descargarAstPdf(rec){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(16);
  doc.text("Análisis de Seguridad del Trabajo (AST)", 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatosAst = datosEmpresaLineaPdf();
  if(lineaDatosAst){ doc.text(lineaDatosAst, 14, y); y += 6; }
  y += 2;
  doc.autoTable({ startY:y, head:[["Dato","Detalle"]], body:[
    ["Fecha", fmtDate(rec.fecha)],
    ["Área", areaName(rec.areaId)],
    ["Actividad / tarea", rec.actividad || "—"],
    ["Responsable de la AST", rec.responsable || "—"],
  ], styles:{fontSize:9}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 8;

  doc.setFontSize(12); doc.text("Riesgos identificados y medidas de control", 14, y); y += 4;
  doc.autoTable({ startY:y, head:[["#","Peligro / riesgo","Medida de control"]],
    body: (rec.riesgos||[]).map((r,idx)=>[idx+1, r.texto, r.medida||"—"]),
    styles:{fontSize:9}, headStyles:{fillColor:[236,131,90]}, columnStyles:{0:{cellWidth:10}} });
  y = doc.lastAutoTable.finalY + 10;

  if(y > 240){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("Firma de conformidad de los participantes", 14, y); y += 6;
  doc.setFontSize(9);
  const participantes = (rec.participantesIds||[]).map(id=>trabName(id));
  if(!participantes.length){
    doc.text("Sin participantes registrados para esta AST.", 14, y); y += 8;
  } else {
    participantes.forEach(nombre=>{
      if(y > 275){ doc.addPage(); y = 16; }
      doc.text(nombre, 14, y);
      doc.line(90, y+1, 196, y+1);
      y += 12;
    });
  }
  doc.save(`AST_${(rec.actividad||"tarea").replace(/[^a-zA-Z0-9]+/g,"_")}_${rec.fecha||""}.pdf`);
}

/* =========================================================
   MATRIZ DE RIESGOS
   ========================================================= */
function updateMatrizPreview(){
  const p = +document.getElementById("mProb").value;
  const c = +document.getElementById("mCons").value;
  const n = nivelRiesgo(p,c);
  const el = document.getElementById("mNivelPreview");
  el.className = "pill "+n;
  el.textContent = nivelLabel(n);
}
document.getElementById("mProb").addEventListener("change", updateMatrizPreview);
document.getElementById("mCons").addEventListener("change", updateMatrizPreview);

const MATRIZ_FORM_FIELDS = ["mProceso","mActividad","mPeligro","mRiesgo","mHombres","mMujeres","mOtros","mEfecto"];
let matrizEditingId = null;
let currentControles = []; // medidas de control jerarquizadas de la línea en edición/carga

function matrizLineLabel(m){
  return `${m.proceso? m.proceso+" / ":""}${m.actividad||"—"} — ${m.peligro||""}`;
}

/* Dibuja la lista de medidas de control ya agregadas, siempre ordenadas por
   jerarquía (A primero, E al final) sin importar el orden en que se cargaron,
   para que la prioridad quede visualmente clara mientras se completa la línea. */
function drawControles(){
  const conIndice = currentControles.map((c,idx)=>({...c, idx}));
  const ordenados = conIndice.slice().sort((a,b)=> JERARQUIA_ORDER.indexOf(a.jerarquia) - JERARQUIA_ORDER.indexOf(b.jerarquia));
  document.getElementById("controlesWrap").innerHTML = ordenados.map(c=>`
    <div class="checklist-item">
      <div>
        ${jerarquiaBadgeHtml(c.jerarquia)}
        <div style="margin-top:4px;">${c.texto}</div>
        <div class="kv">${c.responsable?`Responsable: ${c.responsable}`:""}${c.plazo?` · Plazo: ${fmtDate(c.plazo)}`:""}</div>
      </div>
      <button class="subtle-btn" data-control-quitar="${c.idx}">Quitar</button>
    </div>
  `).join("") || '<div class="empty">Sin medidas de control agregadas todavía</div>';

  const warnEl = document.getElementById("soloEppWarning");
  if(currentControles.length && currentControles.every(c=>c.jerarquia==="E")){
    warnEl.style.display = "";
    warnEl.innerHTML = `<span class="pill critico">Solo EPP</span> <span class="kv">Según el DS 44 el EPP debe ser la última barrera. Evalúa si corresponde agregar antes una medida de eliminación, sustitución, control de ingeniería o administrativo.</span>`;
  } else {
    warnEl.style.display = "none";
  }
}
/* Trabajadores/as especialmente sensibles (DS N°44): el checkbox principal muestra/oculta
   el detalle de qué grupo(s) aplican a la línea de la matriz. */
document.getElementById("mSensible").addEventListener("change", (e)=>{
  document.getElementById("mSensibleGruposWrap").style.display = e.target.checked ? "" : "none";
});
document.getElementById("mSensibleOtroChk").addEventListener("change", (e)=>{
  document.getElementById("mSensibleOtroTexto").disabled = !e.target.checked;
});
function leerGruposSensibles(){
  const grupos = Array.from(document.querySelectorAll(".mSensibleGrupo:checked")).map(el=>el.value);
  if(document.getElementById("mSensibleOtroChk").checked){
    const otro = document.getElementById("mSensibleOtroTexto").value.trim();
    if(otro) grupos.push(otro);
  }
  return grupos;
}
function pintarGruposSensibles(sensible, grupos){
  document.getElementById("mSensible").checked = !!sensible;
  document.getElementById("mSensibleGruposWrap").style.display = sensible ? "" : "none";
  const lista = grupos||[];
  const fijos = new Set(Array.from(document.querySelectorAll(".mSensibleGrupo")).map(el=>el.value));
  document.querySelectorAll(".mSensibleGrupo").forEach(el=>{ el.checked = lista.includes(el.value); });
  const otro = lista.find(g=>!fijos.has(g));
  document.getElementById("mSensibleOtroChk").checked = !!otro;
  document.getElementById("mSensibleOtroTexto").value = otro||"";
  document.getElementById("mSensibleOtroTexto").disabled = !otro;
}
on(document.getElementById("addControlBtn"), "click", async ()=>{
  const texto = document.getElementById("mcTexto").value.trim();
  if(!texto){ alert("Describe la medida de control antes de agregarla."); return; }
  currentControles.push({
    jerarquia: document.getElementById("mcJerarquia").value,
    texto,
    responsable: document.getElementById("mcResp").value.trim(),
    plazo: document.getElementById("mcFecha").value,
  });
  document.getElementById("mcTexto").value = "";
  document.getElementById("mcResp").value = "";
  document.getElementById("mcFecha").value = "";
  drawControles();
});
on(document.getElementById("controlesWrap"), "click", async (e)=>{
  const btn = e.target.closest("button[data-control-quitar]");
  if(!btn) return;
  currentControles.splice(+btn.dataset.controlQuitar, 1);
  drawControles();
});

function startEditMatriz(id){
  const rec = CACHE.matriz.find(m=>m.id===id);
