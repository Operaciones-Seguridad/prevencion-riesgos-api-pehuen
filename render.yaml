let CACHE = {};
async function loadCache(){
  // Las 42 tablas se piden en paralelo (no una por una) para que, en
  // modo API, esto sea 1 viaje de ida y vuelta a la red en vez de 42
  // secuenciales — antes cada guardado tardaba varios segundos extra
  // por esto mismo.
  const resultados = await Promise.all(STORES.map((store) => getAll(store)));
  STORES.forEach((store, i) => {
    CACHE[store] = store === "empresa" ? resultados[i][0] : resultados[i];
  });
}
