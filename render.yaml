/* =========================================================
   DASHBOARD
   ========================================================= */
const PALETTE = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#4a3aa7"];
const NIVEL_COLOR = {bajo:"#0ca30c",medio:"#fab219",alto:"#ec835a",critico:"#d03b3b"};

/* semaforo (opcional, 4° parámetro): "bajo" (verde, cumple meta), "medio"
   (amarillo, la supera levemente) o "alto" (rojo, la supera de forma
   importante) — reutiliza los mismos colores de .pill que ya usa el
   resto de la app, para el semáforo de cumplimiento de metas de
   Accidentabilidad. Sin 4° parámetro, el tile se ve igual que siempre. */
function tile(label, value, foot, semaforo){
  const borderCss = semaforo ? `border-left:5px solid ${SEMAFORO_BORDER[semaforo]};` : "";
  const pillHtml = semaforo ? ` <span class="pill ${semaforo}" style="font-size:10.5px;padding:2px 8px;">${SEMAFORO_LABEL[semaforo]}</span>` : "";
  return `<div class="tile" style="${borderCss}"><div class="label">${label}${pillHtml}</div><div class="value">${value}</div><div class="foot">${foot||""}</div></div>`;
}
const SEMAFORO_BORDER = {bajo:"#0a6b0a", medio:"#8a5a00", alto:"#a03d1a"};
const SEMAFORO_LABEL = {bajo:"Cumple meta", medio:"Cerca del límite", alto:"Sobre la meta"};
/* Compara un valor de indicador (donde menor es mejor: frecuencia,
   gravedad, accidentabilidad, RIRDA, LDR) contra la meta definida por el
   usuario en Configuración. Devuelve null si no hay meta definida (el
   tile se muestra sin color, como antes). */
function semaforoMeta(valor, meta){
  if(meta===null || meta===undefined || meta==="" || isNaN(+meta) || +meta<=0) return null;
  const m = +meta;
  if(valor <= m) return "bajo";
  if(valor <= m*1.15) return "medio";
  return "alto";
}

function renderBarChart(container, rows, colorFn){
  const max = Math.max(1, ...rows.map(r=>r.value));
  container.innerHTML = rows.map(r=>{
    const pct = Math.round((r.value/max)*100);
    return `<div class="bar-row">
      <div>${r.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colorFn(r)}"></div></div>
      <div style="text-align:right;font-weight:600;">${r.display!==undefined?r.display:r.value}</div>
    </div>`;
  }).join("") || '<div class="empty">Sin datos aún</div>';
}

/* Donut chart (SVG, sin librerías externas): recibe rows=[{label,value}]
   y una función de color por índice. Dibuja los segmentos con
   stroke-dasharray sobre un círculo y agrega una leyenda con % al lado. */
function renderDonutChart(container, rows, colorFn){
  const total = rows.reduce((s,r)=>s+(+r.value||0), 0);
  if(!total){ container.innerHTML = '<div class="empty">Sin datos aún</div>'; return; }
  const R = 42, C = 2*Math.PI*R, cx=50, cy=50;
  let acc = 0;
  const segs = rows.filter(r=>r.value>0).map((r,i)=>{
    const frac = r.value/total;
    const dash = frac*C;
    const offset = acc*C;
    acc += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${colorFn(r,i)}" stroke-width="16" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
  }).join("");
  const svg = `<svg viewBox="0 0 100 100" width="150" height="150">${segs}
    <text x="50" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${total}</text>
    <text x="50" y="60" text-anchor="middle" font-size="7" fill="var(--muted)">total</text>
  </svg>`;
  const legend = `<div class="donut-legend">${rows.filter(r=>r.value>0).map((r,i)=>{
    const pct = Math.round(r.value/total*100);
    return `<div class="item"><span class="swatch" style="background:${colorFn(r,i)}"></span><span>${r.label}: <strong>${r.value}</strong> (${pct}%)</span></div>`;
  }).join("")}</div>`;
  container.innerHTML = svg + legend;
}

/* Line chart (SVG, sin librerías externas): recibe points=[{label,value}]
   y dibuja una polilínea simple con puntos y etiquetas debajo. */
function renderLineChart(container, points, color){
  if(!points.length || points.every(p=>!p.value)){ container.innerHTML = '<div class="empty">Sin datos aún</div>'; return; }
  const w = Math.max(360, points.length*60), h = 160, padL=30, padB=24, padT=14, padR=14;
  const max = Math.max(1, ...points.map(p=>p.value));
  const stepX = (w-padL-padR) / Math.max(1, points.length-1);
  const coords = points.map((p,i)=>{
    const x = padL + i*stepX;
    const y = padT + (h-padT-padB) * (1 - p.value/max);
    return {x,y,p};
  });
  const path = coords.map((c,i)=> (i===0?"M":"L")+c.x.toFixed(1)+","+c.y.toFixed(1)).join(" ");
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="${color}"></circle><text x="${c.x.toFixed(1)}" y="${(c.y-8).toFixed(1)}" font-size="9" text-anchor="middle" fill="var(--text)">${c.p.value}</text>`).join("");
  const labels = coords.map(c=>`<text x="${c.x.toFixed(1)}" y="${h-6}" font-size="9" text-anchor="middle" fill="var(--muted)">${c.p.label}</text>`).join("");
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="min-width:${w}px;">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--grid)"></line>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--grid)"></line>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"></path>
    ${dots}${labels}
  </svg>`;
}

/* Selector de período del Dashboard (v1.45): permite ver la información de
   Accidentabilidad, EPP, Infractores y Ranking de velocidad de todo el
   histórico, de un mes o de un año en particular, con el mismo criterio de
   "mensual"/"anual" ya usado en el control estadístico de Accidentabilidad. */
function dashboardPeriodosDisponibles(){
  const mesesSet = new Set();
  CACHE.horasHombre.forEach(h=>{ if(h.periodo) mesesSet.add(h.periodo); });
  CACHE.accidentes.forEach(a=>{ if(a.fecha) mesesSet.add((a.fecha||"").slice(0,7)); });
  (CACHE.epp||[]).forEach(v=>{ if(v.fecha) mesesSet.add((v.fecha||"").slice(0,7)); });
  (CACHE.infractores||[]).forEach(i=>{ if(i.fecha) mesesSet.add((i.fecha||"").slice(0,7)); });
  (CACHE.rankingVelocidad||[]).forEach(v=>{ if(v.fecha) mesesSet.add((v.fecha||"").slice(0,7)); });
  const meses = Array.from(mesesSet).filter(Boolean).sort();
  const anios = Array.from(new Set(meses.map(m=>m.slice(0,4)))).sort();
  return {meses, anios};
}
function dashboardFiltrarPorPeriodo(tipoPeriodo, valor){
  if(tipoPeriodo==="todo" || !valor){
    return { accs: CACHE.accidentes, hh: CACHE.horasHombre, eppRows: CACHE.epp||[], infRows: CACHE.infractores||[], velRows: CACHE.rankingVelocidad||[] };
  }
  const matchFecha = (f)=> !!f && (tipoPeriodo==="mensual" ? f.slice(0,7)===valor : f.slice(0,4)===valor);
  return {
    accs: CACHE.accidentes.filter(a=>matchFecha(a.fecha)),
    hh: CACHE.horasHombre.filter(h=> h.periodo && (tipoPeriodo==="mensual" ? h.periodo===valor : h.periodo.slice(0,4)===valor)),
    eppRows: (CACHE.epp||[]).filter(v=>matchFecha(v.fecha)),
    infRows: (CACHE.infractores||[]).filter(i=>matchFecha(i.fecha)),
    velRows: (CACHE.rankingVelocidad||[]).filter(v=>matchFecha(v.fecha)),
  };
}
function dashboardPeriodoActual(){
  const tipo = document.getElementById("dashboardPeriodoTipo").value;
  const valor = tipo==="mensual" ? document.getElementById("dashboardPeriodoMes").value
    : tipo==="anual" ? document.getElementById("dashboardPeriodoAnio").value : "";
  return { tipo, valor, ...dashboardFiltrarPorPeriodo(tipo, valor) };
}
function renderDashboardPeriodoSelectores(){
  const tipo = document.getElementById("dashboardPeriodoTipo").value;
  document.getElementById("dashboardPeriodoMesWrap").style.display = tipo==="mensual" ? "" : "none";
  document.getElementById("dashboardPeriodoAnioWrap").style.display = tipo==="anual" ? "" : "none";
  const {meses, anios} = dashboardPeriodosDisponibles();
  const selMes = document.getElementById("dashboardPeriodoMes");
  const selAnio = document.getElementById("dashboardPeriodoAnio");
  const curMes = selMes.value, curAnio = selAnio.value;
  selMes.innerHTML = meses.map(m=>`<option value="${m}">${m}</option>`).join("") || '<option value="">Sin datos</option>';
  selAnio.innerHTML = anios.map(a=>`<option value="${a}">${a}</option>`).join("") || '<option value="">Sin datos</option>';
  selMes.value = meses.includes(curMes) ? curMes : (meses[meses.length-1] || "");
  selAnio.value = anios.includes(curAnio) ? curAnio : (anios[anios.length-1] || "");
}
on(document.getElementById("dashboardPeriodoTipo"), "change", ()=>{ renderDashboardPeriodoSelectores(); renderDashboard(); });
on(document.getElementById("dashboardPeriodoMes"), "change", ()=> renderDashboard());
on(document.getElementById("dashboardPeriodoAnio"), "change", ()=> renderDashboard());

function renderDashboard(){
  renderDashboardPeriodoSelectores();
  const periodo = dashboardPeriodoActual();
  const racha = computeRachas();
  document.getElementById("diasSinAccidentesDash").textContent = racha.actual===null ? "—" : racha.actual;

  const findingsAll = CACHE.inspecciones.flatMap(i=>i.findings||[]);
  const accionesAbiertas = findingsAll.filter(f=>f.estado!=="cerrada").length;
  const riesgosCriticos = CACHE.matriz.filter(m=>nivelRiesgo(m.probabilidad,m.consecuencia)==="critico").length;

  // cumplimiento vigilancia — a partir de la bitácora de cumplimiento por protocolo
  // (protocolo "vigente" = su último registro de bitácora "cumplido" sigue dentro
  // de la periodicidad del protocolo; solo se consideran protocolos que aplican).
  const protAplicables = protocolosAplicables();
  const totalAsig = protAplicables.length;
  const vigentes = protAplicables.filter(p=>{
    const v = protocoloVigenciaBitacora(p);
    return v && v.estado==="vigente";
  }).length;
  const cumplPct = totalAsig? Math.round(vigentes/totalAsig*100) : 0;

  const pgTotal = CACHE.programa.length;
  const pgRealizadas = CACHE.programa.filter(p=>estadoPrograma(p)==="realizada").length;
  const pgPct = pgTotal? Math.round(pgRealizadas/pgTotal*100) : 0;

  const capStats = CACHE.capacitaciones.map(capacitacionCumplimiento);
  const capConvocados = capStats.reduce((a,c)=>a+c.convocados,0);
  const capAsistieron = capStats.reduce((a,c)=>a+c.asistieron,0);
  const capPct = capConvocados? Math.round(capAsistieron/capConvocados*100) : 0;

  // Indicadores de accidentabilidad (para tiles y para el PDF de gerencia),
  // ya filtrados por el período elegido arriba (todo el histórico / mes / año)
  const indAcc = calcIndicadores(periodo.accs, periodo.hh);

  // Cumplimiento legal DS 44 (FUF)
  const fufCounts = {cumple:0, cumple_parcial:0, no_cumple:0, no_aplica:0, sin_evaluar:0};
  FUF_ITEMS.forEach(it=>{
    const rec = CACHE.cumplimientoLegal.find(r=>r.numero===it.numero);
    const n = (rec && rec.nivel) || "sin_evaluar";
    if(fufCounts[n]===undefined) fufCounts[n]=0;
    fufCounts[n]++;
  });
  const fufEvaluables = FUF_ITEMS.length - fufCounts.no_aplica;
  const fufPct = fufEvaluables? Math.round(fufCounts.cumple/fufEvaluables*100) : 0;

  // EPP entregados (total de vales), ya filtrados por el período elegido
  const eppTotalVales = periodo.eppRows.length;
  const periodoTexto = periodo.tipo==="todo" ? "histórico acumulado" : (periodo.valor ? "en el período elegido ("+periodo.valor+")" : "sin datos para el período elegido");

  // Tiles de accidentabilidad (frecuencia, gravedad, accidentabilidad, y
  // RIRDA/LDR solo si la empresa los tiene habilitados en Configuración),
  // con el mismo semáforo de metas ya usado en la pestaña Accidentabilidad.
  const metasAcc = CACHE.empresa || {};
  const usaRirdaDash = !!(CACHE.empresa && CACHE.empresa.usarRirdaLdr);
  const tilesAccidentabilidad = [
    tile("Tasa de frecuencia", indAcc.tf, periodoTexto, semaforoMeta(indAcc.tf, metasAcc.metaFrecuencia)),
    tile("Tasa de gravedad", indAcc.tg, periodoTexto, semaforoMeta(indAcc.tg, metasAcc.metaGravedad)),
    tile("Índice de accidentabilidad", indAcc.indiceAcc+"%", periodoTexto, semaforoMeta(indAcc.indiceAcc, metasAcc.metaAccidentabilidad)),
  ];
  if(usaRirdaDash){
    tilesAccidentabilidad.push(tile("RIRDA", indAcc.rirda, periodoTexto, semaforoMeta(indAcc.rirda, metasAcc.metaRirda)));
    tilesAccidentabilidad.push(tile("LDR", indAcc.ldr, periodoTexto, semaforoMeta(indAcc.ldr, metasAcc.metaLdr)));
  }

  document.getElementById("tiles").innerHTML = [
    tile("Inspecciones registradas", CACHE.inspecciones.length, "histórico"),
    tile("Hallazgos con acción abierta", accionesAbiertas, "requieren seguimiento"),
    tile("Riesgos críticos en matriz", riesgosCriticos, "de "+CACHE.matriz.length+" líneas"),
    tile("Cumplimiento vigilancia de salud", cumplPct+"%", vigentes+" de "+totalAsig+" vigentes"),
    tile("Cumplimiento programa de seguridad", pgPct+"%", pgRealizadas+" de "+pgTotal+" actividades"),
    tile("Cumplimiento plan de capacitación", capPct+"%", capAsistieron+" de "+capConvocados+" asistencias"),
    ...tilesAccidentabilidad,
    tile("Cumplimiento legal DS 44 (FUF)", fufPct+"%", fufCounts.cumple+" de "+fufEvaluables+" ítems evaluables"),
    tile("Vales de EPP entregados", eppTotalVales, periodoTexto),
    tile("Infracciones registradas", periodo.infRows.length, periodoTexto),
    tile("Análisis de causa raíz realizados", (CACHE.arbolesCausales||[]).length, "árboles causales registrados"),
  ].join("");

  // chart 1: riesgos por nivel
  const niveles = ["bajo","medio","alto","critico"];
  const riskRows = niveles.map(n=>({label:nivelLabel(n), value: CACHE.matriz.filter(m=>nivelRiesgo(m.probabilidad,m.consecuencia)===n).length}));
  renderBarChart(document.getElementById("chartRiskLevel"), riskRows, r=>NIVEL_COLOR[r.label.toLowerCase()==="crítico"?"critico":r.label.toLowerCase()]);

  // chart 2: cumplimiento por protocolo (solo protocolos que aplican según la matriz)
  const healthRows = protAplicables.map(p=>{
    const v = protocoloVigenciaBitacora(p);
    const pct = v? (v.estado==="vigente"?100 : v.estado==="proximo"?50 : 0) : 0;
    return {label:p.nombre, value: pct, display: v? (v.estado==="vigente"?"Vigente":v.estado==="proximo"?"Próximo a vencer":"Vencido") : "Sin datos"};
  });
  renderBarChart(document.getElementById("chartHealth"), healthRows, (r,i)=>PALETTE[healthRows.indexOf(r)%PALETTE.length]);

  // chart 3: findings
  const estados = ["pendiente","proceso","cerrada"];
  const findRows = estados.map(e=>({label:e==="pendiente"?"Pendiente":e==="proceso"?"En proceso":"Cerrada", value: findingsAll.filter(f=>(f.estado||"pendiente")===e).length}));
  renderBarChart(document.getElementById("chartFindings"), findRows, r=> r.label==="Cerrada"?"#0ca30c": r.label==="En proceso"?"#fab219":"#898781");

  // upcoming
  const upcoming = [];
  CACHE.matriz.forEach(m=>{ if(m.plazo && m.estado!=="cerrada"){ const days=daysUntil(m.plazo); if(days<=30) upcoming.push({tipo:"Acción de control", desc:`${m.peligro} (${areaName(m.areaId)})`, fecha:m.plazo, days}); }});
  protAplicables.forEach(p=>{ const v = protocoloVigenciaBitacora(p); if(v && v.vigenteHasta){ const days = daysUntil(v.vigenteHasta); if(days<=30) upcoming.push({tipo:"Vigencia protocolo "+p.nombre, desc: "Próxima reevaluación", fecha:v.vigenteHasta, days}); } });
  CACHE.ganttProtocolo.forEach(g=>{ if(ganttEstadoDerivado(g)!=="cumplido" && g.fechaFin){ const days = daysUntil(g.fechaFin); if(days<=30) upcoming.push({tipo:"Actividad "+protoName(g.protocoloId), desc: g.actividad, fecha:g.fechaFin, days}); } });
  CACHE.programa.forEach(p=>{ if(!p.fechaRealizada && p.fechaProgramada){ const days = daysUntil(p.fechaProgramada); if(days<=30) upcoming.push({tipo:"Programa: "+p.nombre, desc: areaName(p.areaId), fecha:p.fechaProgramada, days}); }});
  CACHE.capacitaciones.forEach(c=>{ if(!c.fechaRealizada && c.fechaProgramada){ const days = daysUntil(c.fechaProgramada); if(days<=30) upcoming.push({tipo:"Capacitación: "+c.nombre, desc: (c.participantes||[]).length+" convocados", fecha:c.fechaProgramada, days}); }});
  upcoming.sort((a,b)=>a.days-b.days);
  document.getElementById("upcomingTable").innerHTML = upcoming.length ? upcoming.map(u=>`
    <tr><td>${u.tipo}</td><td>${u.desc}</td><td>${fmtDate(u.fecha)}</td><td>${u.days<0?`<span class="pill vencido">Vencido</span>`:`<span class="pill proximo">${u.days} días</span>`}</td></tr>
  `).join("") : `<tr><td class="empty">No hay vencimientos próximos</td></tr>`;

  // chart 4: programa de seguridad por estado
  const pgEstados = ["pendiente","realizada","atrasada"];
  const pgRows = pgEstados.map(e=>({label: e==="pendiente"?"Pendiente":e==="realizada"?"Realizada":"Atrasada", value: CACHE.programa.filter(p=>estadoPrograma(p)===e).length}));
  renderBarChart(document.getElementById("chartPrograma"), pgRows, r=> r.label==="Realizada"?"#0ca30c": r.label==="Atrasada"?"#d03b3b":"#898781");

  // chart 5: capacitaciones - asistencia %
  const capRows = capStats.map(c=>({label:c.nombre, value:c.pct, display:c.pct+"%"}));
  renderBarChart(document.getElementById("chartCapacitacion"), capRows, (r)=>PALETTE[capRows.indexOf(r)%PALETTE.length]);

  // chart 6 (donut): accidentes/incidentes por tipo, en el período elegido
  const accTipos = ["ctp","stp","trayecto","incidente","enfermedad"];
  const accTipoColor = {ctp:"#d03b3b", stp:"#ec835a", trayecto:"#eda100", incidente:"#2a78d6", enfermedad:"#4a3aa7"};
  const accTipoRows = accTipos.map(t=>({label:ACC_TIPO_LABEL[t], value: periodo.accs.filter(a=>a.tipo===t).length}));
  renderDonutChart(document.getElementById("chartAccTipoDonut"), accTipoRows, (r,i)=>accTipoColor[accTipos[i]]);

  // chart 7: accidentes por foco crítico, en el período elegido
  const focos = getCatalog("focoCritico");
  const focoRows = focos.map(f=>({label:f, value: periodo.accs.filter(a=>a.focoCritico===f).length})).filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
  renderBarChart(document.getElementById("chartFocoCriticoDash"), focoRows, (r)=>PALETTE[focoRows.indexOf(r)%PALETTE.length]);

  // chart 8 (donut): cumplimiento legal DS 44 (FUF) por nivel
  const fufNivelOrder = ["cumple","cumple_parcial","no_cumple","no_aplica","sin_evaluar"];
  const fufNivelColor = {cumple:"#0ca30c", cumple_parcial:"#fab219", no_cumple:"#d03b3b", no_aplica:"#898781", sin_evaluar:"#c9c5bd"};
  const fufRows = fufNivelOrder.map(n=>({label:FUF_NIVEL_LABEL[n], value: fufCounts[n]||0}));
  renderDonutChart(document.getElementById("chartFufDonut"), fufRows, (r,i)=>fufNivelColor[fufNivelOrder[i]]);

  // chart 9: EPP más entregados (top 6 por cantidad total), en el período elegido
  const eppCounts = new Map();
  periodo.eppRows.forEach(v=> (v.items||[]).forEach(it=>{ eppCounts.set(it.epp, (eppCounts.get(it.epp)||0) + (+it.cantidad||0)); }));
  const eppRows = Array.from(eppCounts.entries()).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,value])=>({label,value}));
  renderBarChart(document.getElementById("chartEppTop"), eppRows, (r)=>PALETTE[eppRows.indexOf(r)%PALETTE.length]);

  // chart 10: infractores por motivo, en el período elegido
  const infMotivoCounts = new Map();
  periodo.infRows.forEach(i=>{ const m = i.motivo||"Sin especificar"; infMotivoCounts.set(m, (infMotivoCounts.get(m)||0)+1); });
  const infMotivoRows = Array.from(infMotivoCounts.entries()).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,value])=>({label,value}));
  renderBarChart(document.getElementById("chartInfMotivoDash"), infMotivoRows, (r)=>PALETTE[infMotivoRows.indexOf(r)%PALETTE.length]);

  // chart 11: ranking de velocidad — eventos por conductor, en el período elegido
  const velConductorCounts = new Map();
  periodo.velRows.forEach(v=>{ velConductorCounts.set(v.conductor||"—", (velConductorCounts.get(v.conductor||"—")||0) + (+v.eventos||0)); });
  const velConductorRows = Array.from(velConductorCounts.entries()).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,value])=>({label,value}));
  renderBarChart(document.getElementById("chartVelConductorDash"), velConductorRows, ()=>"#e34948");

  // chart 12 (línea): tendencia mensual de accidentes CTP. Si se eligió un
  // período específico se muestran los 12 meses que terminan en ese
  // período (mes elegido, o diciembre del año elegido); si es "todo el
  // histórico" se muestran los últimos 12 meses respecto de hoy.
  const finTendencia = periodo.tipo==="mensual" && periodo.valor ? new Date(periodo.valor+"-01T00:00:00")
    : periodo.tipo==="anual" && periodo.valor ? new Date(periodo.valor+"-12-01T00:00:00")
    : new Date();
  const meses12 = [];
  for(let i=11; i>=0; i--){
    const d = new Date(finTendencia.getFullYear(), finTendencia.getMonth()-i, 1);
    meses12.push({key: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label: d.toLocaleDateString("es-CL",{month:"short",year:"2-digit"})});
  }
  const tendenciaRows = meses12.map(m=>({
    label: m.label,
    value: CACHE.accidentes.filter(a=> a.tipo==="ctp" && (a.fecha||"").slice(0,7)===m.key).length
  }));
  renderLineChart(document.getElementById("chartAccTendencia"), tendenciaRows, "#d03b3b");
}

function estadoPrograma(p){
  if(p.fechaRealizada) return "realizada";
  if(p.fechaProgramada && daysUntil(p.fechaProgramada) < 0) return "atrasada";
  return "pendiente";
}
function capacitacionCumplimiento(c){
  const participantes = c.participantes || [];
  const convocados = participantes.length;
  const asistieron = participantes.filter(p=>p.asistio).length;
  const pct = convocados? Math.round(asistieron/convocados*100) : 0;
  return {id:c.id, nombre:c.nombre, convocados, asistieron, pct};
}

/* =========================================================
   INSPECCIONES Y OBSERVACIONES
   ========================================================= */
const TIPO_REGISTRO_LABEL = { inspeccion:"Inspección", observacion:"Observación" };
const ESTADO_INS_LABEL = { abierta:"Abierta", cerrada:"Cerrada" };

function renderInsTipoOptions(){
  const tipoRegistro = document.getElementById("insTipoRegistro").value;
  const opts = CACHE.checklists.filter(c=> (c.categoria||"ambos")==="ambos" || c.categoria===tipoRegistro);
  fillSelect(document.getElementById("insTipo"), opts.map(c=>({id:c.id,label:c.nombre})), false);
}
document.getElementById("insTipoRegistro").addEventListener("change", ()=>{
  renderInsTipoOptions();
  renderChecklistFor(document.getElementById("insTipo").value);
});

/* Los ítems de un formato/checklist (store "checklists") admiten dos formas,
   por compatibilidad con los formatos creados antes de la v1.57: texto libre
   (convención heredada, siempre de tipo "check") u objeto {text, tipo},
   donde tipo es "check" (Cumple/No cumple/N/A) o "texto" (cuadro de texto
   de escritura manual). Estos dos helpers normalizan ambas formas. */
function checklistItemTexto(it){ return typeof it === "string" ? it : (it && it.text) || ""; }
function checklistItemTipo(it){ return (typeof it === "object" && it && it.tipo) || "check"; }

let currentChecklistItems = [];
function renderChecklistFor(clId){
  const cl = CACHE.checklists.find(c=>c.id===clId);
  currentChecklistItems = cl ? cl.items.map(it=>({text: checklistItemTexto(it), tipo: checklistItemTipo(it), estado:null, valorTexto:""})) : [];
  drawChecklist();
}
function drawChecklist(){
  const wrap = document.getElementById("insChecklist");
  wrap.innerHTML = currentChecklistItems.map((it,idx)=>{
    if(it.tipo==="texto"){
      const val = (it.valorTexto||"").replace(/"/g,"&quot;");
      return `
      <div class="checklist-item">
        <div>${it.text}</div>
        <input data-txtidx="${idx}" value="${val}" placeholder="Escribir..." style="max-width:280px;min-height:auto;">
      </div>`;
    }
    return `
    <div class="checklist-item">
      <div>${it.text}</div>
      <div class="seg" data-idx="${idx}">
        <button data-v="ok" class="${it.estado==='ok'?'on-ok':''}">Cumple</button>
        <button data-v="fail" class="${it.estado==='fail'?'on-fail':''}">No cumple</button>
        <button data-v="na" class="${it.estado==='na'?'on-na':''}">N/A</button>
      </div>
    </div>`;
  }).join("");
}
document.getElementById("insChecklist").addEventListener("input",(e)=>{
  const inp = e.target.closest("input[data-txtidx]");
  if(!inp) return;
  currentChecklistItems[+inp.dataset.txtidx].valorTexto = inp.value;
});
document.getElementById("insChecklist").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-v]");
  if(!btn) return;
  const idx = +btn.closest(".seg").dataset.idx;
  currentChecklistItems[idx].estado = btn.dataset.v;
  drawChecklist();
});
document.getElementById("insTipo").addEventListener("change", e=>renderChecklistFor(e.target.value));

let currentFindings = [];
function drawFindings(){
  document.getElementById("findingsWrap").innerHTML = currentFindings.map((f,idx)=>`
    <div class="finding">
      <div class="form-grid">
        <div><label>Descripción</label><textarea data-f="desc" data-idx="${idx}">${f.desc||""}</textarea></div>
        <div>
          <label>Nivel de riesgo</label>
          <select data-f="nivel" data-idx="${idx}">
            ${["bajo","medio","alto","critico"].map(n=>`<option value="${n}" ${f.nivel===n?"selected":""}>${nivelLabel(n)}</option>`).join("")}
          </select>
          <label>Foto (opcional)</label>
          <input type="file" accept="image/*" data-f="foto" data-idx="${idx}">
          ${f.foto?`<img class="thumb" src="${f.foto}" style="margin-top:6px;">`:""}
        </div>
        <div><label>Responsable acción correctiva</label>
          <select data-f="respId" data-idx="${idx}">
            <option value="">— Seleccionar responsable —</option>
            ${(CACHE.correosResponsables||[]).map(c=>`<option value="${c.id}" ${f.respId===c.id?"selected":""}>${c.nombre}${c.cargo?` (${c.cargo})`:""}${c.correo?` — ${c.correo}`:""}</option>`).join("")}
            ${f.resp && !f.respId && !(CACHE.correosResponsables||[]).some(c=>c.nombre===f.resp) ? `<option value="" selected disabled>${f.resp} (no está en la nómina — actualice la selección)</option>` : ""}
          </select>
          ${!(CACHE.correosResponsables||[]).length ? '<div class="desc" style="margin-top:4px;">Aún no hay responsables registrados (Configuración → Responsables de cierre de hallazgos).</div>' : '<div class="desc" style="margin-top:4px;">¿Falta alguien en la lista? Agréguelo en Configuración → Responsables de cierre de hallazgos.</div>'}
        </div>
        <div><label>Plazo</label><input type="date" data-f="plazo" data-idx="${idx}" value="${f.plazo||""}"></div>
        <div>
          <label>Estado</label>
          <select data-f="estado" data-idx="${idx}">
            <option value="pendiente" ${f.estado==='pendiente'?'selected':''}>Pendiente</option>
            <option value="proceso" ${f.estado==='proceso'?'selected':''}>En proceso</option>
            <option value="cerrada" ${f.estado==='cerrada'?'selected':''}>Cerrada</option>
          </select>
        </div>
        <div><label>Medida de control aplicada (al cerrar)</label><textarea data-f="medidaControl" data-idx="${idx}" placeholder="Describa la medida de control implementada">${f.medidaControl||""}</textarea></div>
        <div>
          <label>Evidencia de cierre (foto o documento)</label>
          <input type="file" accept="image/*,.pdf" data-f="evidenciaCierre" data-idx="${idx}">
          ${f.evidenciaCierre?`<div class="kv" style="margin-top:4px;"><a href="${f.evidenciaCierre}" target="_blank">Ver evidencia actual</a></div>`:""}
        </div>
      </div>
      <button class="subtle-btn" data-remove="${idx}">Quitar hallazgo</button>
    </div>
  `).join("") || '<div class="empty">Sin hallazgos agregados</div>';
}
document.getElementById("addFindingBtn").addEventListener("click", ()=>{ currentFindings.push({estado:"pendiente",nivel:"bajo"}); drawFindings(); });
on(document.getElementById("findingsWrap"), "input", async (e) => {
  const t = e.target;
  if(!t.dataset.f) return;
  const idx = +t.dataset.idx;
  if(t.dataset.f==="foto" || t.dataset.f==="evidenciaCierre"){
    const campo = t.dataset.f;
    const file = t.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = ()=>{ currentFindings[idx][campo] = reader.result; drawFindings(); };
      reader.readAsDataURL(file);
    }
  } else if(t.dataset.f==="respId"){
    currentFindings[idx].respId = t.value;
    const persona = (CACHE.correosResponsables||[]).find(c=>c.id===t.value);
    currentFindings[idx].resp = persona ? persona.nombre : "";
    drawFindings();
  } else {
    currentFindings[idx][t.dataset.f] = t.value;
  }
});
document.getElementById("findingsWrap").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-remove]");
  if(!btn) return;
  currentFindings.splice(+btn.dataset.remove,1);
  drawFindings();
});

/* La app no tiene backend/servidor de correo: "enviar correo" abre el cliente de correo
   del propio computador (mailto:) con el mensaje ya redactado, listo para que la persona
   solo tenga que presionar "Enviar". No hay envío automático real sin intervención del usuario. */
function renderRespNominaSelects(){
  if(document.getElementById("findingsWrap") && currentFindings.length) drawFindings();
  if(typeof fillDocResponsableSelect === "function"){
    ["docResponsableElaboracion","docResponsableRevision","docResponsableAprobacion"].forEach(id=>{
      const sel = document.getElementById(id);
      if(sel) fillDocResponsableSelect(sel, sel.value);
    });
  }
}
function correoResponsableParaFinding(f){
  if(!f) return null;
  const nomina = CACHE.correosResponsables||[];
  if(f.respId){
    const porId = nomina.find(c=>c.id===f.respId);
    if(porId) return porId;
  }
  if(f.resp){
    const norm = s => (s||"").toLowerCase().trim();
    const porNombre = nomina.find(c=>norm(c.nombre)===norm(f.resp));
    if(porNombre) return porNombre;
  }
  return null;
}
function mailtoHallazgo(rec, f){
  const persona = correoResponsableParaFinding(f);
  if(!persona) return null;
  const empresa = (CACHE.empresa && CACHE.empresa.razonSocial) || "la empresa";
  const asunto = `Cierre pendiente: hallazgo de inspección del ${fmtDate(rec.fecha)} — ${areaName(rec.areaId)}`;
  const cuerpo = [
    `Estimado/a ${persona.nombre},`,
    ``,
    `Se le asigna como responsable de cerrar el siguiente hallazgo detectado en una ${TIPO_REGISTRO_LABEL[rec.tipoRegistro||"inspeccion"].toLowerCase()} de ${empresa}:`,
    ``,
    `Fecha de la inspección: ${fmtDate(rec.fecha)}`,
    `Área: ${areaName(rec.areaId)}`,
    `Inspector: ${rec.inspector||"—"}`,
    `Nivel de riesgo: ${nivelLabel(f.nivel||"bajo")}`,
    `Descripción del hallazgo: ${f.desc||"—"}`,
    `Plazo de cierre: ${f.plazo?fmtDate(f.plazo):"Sin plazo definido"}`,
    ``,
    `Por favor registrar en la aplicación la medida de control aplicada y la evidencia de cierre correspondiente antes del plazo indicado.`,
    ``,
    `Saludos.`
  ].join("\n");
  return `mailto:${encodeURIComponent(persona.correo).replace(/%40/g,"@")}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
}
function hallazgosPendientesConCorreo(rec){
  return (rec.findings||[])
    .map((f,idx)=>({f, idx, persona: correoResponsableParaFinding(f)}))
    .filter(x => x.f.estado!=="cerrada" && x.persona);
}
function mostrarCorreosPendientes(rec){
  const pendientes = hallazgosPendientesConCorreo(rec);
  if(!pendientes.length) return;
  const filas = pendientes.map(({f, idx, persona})=>{
    const link = mailtoHallazgo(rec, f);
    return `<div class="finding" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <div><strong>${persona.nombre}</strong> (${persona.correo})<div class="kv">${f.desc||"(sin descripción)"} · Plazo: ${f.plazo?fmtDate(f.plazo):"—"}</div></div>
      <a class="btn small" href="${link}" target="_blank">Abrir correo</a>
    </div>`;
  }).join("");
  openModal(`
    <h3>Correo pendiente de enviar</h3>
    <div class="desc" style="margin-bottom:10px;">Hay hallazgos pendientes con un responsable de cierre que tiene correo electrónico registrado. Presiona "Abrir correo" para cada uno: se abrirá tu programa de correo con el mensaje redactado, listo para enviar.</div>
    ${filas}
    <div style="margin-top:14px;"><button class="btn secondary" id="modalCerrarVentanaBtn">Cerrar</button></div>
  `);
  document.getElementById("modalCerrarVentanaBtn").addEventListener("click", closeModal);
}

