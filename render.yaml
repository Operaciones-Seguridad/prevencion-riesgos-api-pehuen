      </div>
      <div class="form-grid" style="margin-top:6px;">
        <div>
          <label>Archivo del documento (esta versión)</label>
          <input type="file" id="docArchivoInput" accept=".pdf,.doc,.docx,.xls,.xlsx">
          <div class="kv" id="docArchivoActual" style="margin-top:4px;"></div>
        </div>
        <div style="grid-column:1/-1;"><label>Observaciones</label><textarea id="docObservaciones" rows="2" placeholder="Notas adicionales (opcional)"></textarea></div>
        <div style="grid-column:1/-1;" id="docContenidoWrap">
          <label>Contenido del documento (política, procedimiento, manual o instructivo)</label>
          <div class="desc">Este contenido se usa para generar automáticamente el PDF y/o el Word del documento, junto con la portada, control de versiones, riesgos principales asociados (cruzados con la Matriz de riesgos, cuando corresponde a un Procedimiento/Instructivo) y la hoja de firmas de aprobación.</div>
          <div id="docIaWrap" class="desc" style="background:#f5f8fc; border:1px solid #cfe0f5; border-radius:6px; padding:10px; margin-bottom:8px;">
            <label>Redactar con IA (opcional): contexto adicional para el borrador</label>
            <input id="docIaContexto" placeholder="Ej: enfocarlo en riesgo eléctrico y trabajo en altura, mencionar el uso de arnés certificado...">
            <div class="toolbar" style="margin-top:6px;">
              <button class="btn secondary" id="docIaRedactarBtn" type="button">Redactar borrador con IA</button>
              <span id="docIaEstado" class="kv"></span>
            </div>
            <div class="desc" style="margin-top:4px;">La IA usa como contexto el nombre del documento, el rubro y las áreas ya cargadas de la empresa. El borrador se coloca abajo, en "Contenido del documento", y siempre se puede revisar y editar antes de guardar — no reemplaza la revisión y aprobación de un profesional.</div>
          </div>
          <textarea id="docContenido" rows="6" placeholder="Ej: 1. Objetivo... 2. Alcance... 3. Desarrollo / pasos..."></textarea>
        </div>
      </div>
      <div class="toolbar" style="margin-top:10px;">
        <button class="btn" id="saveDocumentoBtn">Guardar versión</button>
        <button class="btn secondary" id="generarDocumentoPdfFormBtn">Generar PDF automático</button>
        <button class="btn secondary" id="generarDocumentoWordFormBtn">Generar Word automático</button>
        <button class="btn secondary" id="cancelEditDocumentoBtn" style="display:none;">Cancelar edición</button>
      </div>
      </div>
    </div>

