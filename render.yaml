function resetMatrizForm(){
  matrizEditingId = null;
  MATRIZ_FORM_FIELDS.forEach(id=>document.getElementById(id).value="");
  document.getElementById("mCategoria").value = "";
  pintarGruposSensibles(false, []);
  currentControles = [];
  drawControles();
  document.getElementById("mcTexto").value = ""; document.getElementById("mcResp").value = ""; document.getElementById("mcFecha").value = "";
  document.getElementById("matrizFormTitle").textContent = "Nueva línea de matriz de riesgos (IPER)";
  document.getElementById("saveMatrizBtn").textContent = "Agregar a la matriz";
