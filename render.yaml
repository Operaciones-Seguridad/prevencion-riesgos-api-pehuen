    <div class="card">
      <div class="card-header-row" id="hdrTmert"><h2 id="tmertFormTitle">Herramienta TMERT — Trastornos Musculoesqueléticos Relacionados al Trabajo</h2><button class="collapse-toggle" id="toggleTmert" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyTmert">
      <div class="desc">Formato basado en la Norma Técnica de Identificación y Evaluación de Factores de Riesgo de TMERT (MINSAL), replicado desde la herramienta Excel real: se caracteriza el puesto de trabajo, se aplica la identificación inicial de los 7 factores de riesgo y, si corresponde a trabajo repetitivo de miembros superiores, la identificación avanzada de condición aceptable/crítica, generando automáticamente el resultado y permitiendo registrar el plan de acción.</div>

      <h3 style="margin-top:4px;">1. Caracterización del puesto de trabajo</h3>
      <div class="form-grid">
        <div><label>Área</label><select id="tmertArea"></select></div>
        <div><label>Puesto de trabajo</label><input id="tmertPuesto" placeholder="Ej: Liniero"></div>
        <div><label>Tareas del puesto de trabajo</label><input id="tmertTareas" placeholder="Ej: Trepado de postes, tendido de conductores"></div>
        <div><label>Horario de funcionamiento</label><input id="tmertHorario" placeholder="Ej: Lunes a viernes 08:00-18:00"></div>
        <div><label>Horas extra por día</label><input id="tmertHorasExtraDia" type="number" min="0" step="0.5"></div>
        <div><label>Horas extra por semana</label><input id="tmertHorasExtraSemana" type="number" min="0" step="0.5"></div>
        <div><label>N° trabajadores expuestos — hombres</label><input id="tmertTrabHombres" type="number" min="0" step="1"></div>
        <div><label>N° trabajadores expuestos — mujeres</label><input id="tmertTrabMujeres" type="number" min="0" step="1"></div>
        <div><label>Tipo de contrato</label>
          <select id="tmertTipoContrato">
            <option value="Indefinido">Indefinido</option>
            <option value="Plazo fijo">Plazo fijo</option>
            <option value="Por obra o faena">Por obra o faena</option>
            <option value="Honorarios">Honorarios</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div><label>Tipo de remuneración</label>
          <select id="tmertTipoRemuneracion">
            <option value="Fijo">Fijo</option>
            <option value="Variable">Variable</option>
            <option value="Mixto">Mixto</option>
          </select>
        </div>
        <div><label>Duración de la tarea (min)</label><input id="tmertDuracionMin" type="number" min="0" step="1"></div>
        <div><label>Pausas de trabajo</label><input id="tmertPausas" placeholder="Ej: 2 pausas de 10 min además de colación"></div>
        <div><label>Rotación de tarea</label>
          <select id="tmertRotacion"><option value="No">No</option><option value="Sí">Sí</option></select>
        </div>
        <div><label>Equipos y herramientas</label><input id="tmertEquipos" placeholder="Ej: Escalera, correas de altura, atornillador neumático"></div>
      </div>
      <label>Descripción de la tarea</label>
      <textarea id="tmertDescripcionTarea" placeholder="Describe la tarea observada"></textarea>
      <label style="margin-top:10px;">Características de los ambientes y espacios de trabajo <span style="font-weight:400;">(espacios, barreras arquitectónicas, flujo de tránsito)</span></label>
      <textarea id="tmertAmbiente"></textarea>
      <label style="margin-top:10px;">Características y disposición espacial del puesto de trabajo <span style="font-weight:400;">(ubicación de los elementos de trabajo, disposición física del espacio)</span></label>
      <textarea id="tmertDisposicion"></textarea>
      <label style="margin-top:10px;">Características y herramientas utilizadas <span style="font-weight:400;">(equipos, herramientas vibrantes, uso de EPP)</span></label>
      <textarea id="tmertHerramientas"></textarea>

      <h3 style="margin-top:22px;">2. Identificación inicial</h3>
      <div class="desc">Responde Sí/No para cada factor de riesgo, según lo observado en la tarea.</div>
      <div id="tmertIniWrap"></div>
      <div style="margin-top:10px;">Resultado identificación inicial: <span id="tmertResultadoInicial" class="pill">—</span></div>

      <h3 style="margin-top:22px;">3. Identificación avanzada — Trabajo repetitivo de miembros superiores</h3>
      <div class="desc">Corresponde aplicar esta tabla cuando en la identificación inicial "Trabajo repetitivo de miembros superiores" = Sí. Por ahora la app solo implementa la tabla avanzada de este factor de riesgo (es el único con fórmula de aceptación/criticidad incluido en la planilla TMERT original); los demás factores identificados como "Sí" deben evaluarse por fuera de la app con la mutualidad hasta que se incorporen sus propias tablas.</div>
      <div id="tmertAvanzadaWrap">
        <table>
          <thead><tr><th colspan="2">Tabla II — Condición aceptable</th></tr></thead>
          <tbody id="tmertAvAceptableWrap"></tbody>
        </table>
        <div style="margin:10px 0;">Condición aceptable: <span id="tmertResultadoAceptable" class="pill">—</span></div>
        <table style="margin-top:14px;">
          <thead><tr><th colspan="2">Tabla VI — Condición crítica</th></tr></thead>
          <tbody id="tmertAvCriticaWrap"></tbody>
        </table>
        <div style="margin:10px 0;">Condición crítica: <span id="tmertResultadoCritica" class="pill">—</span></div>
      </div>

      <h3 style="margin-top:22px;">4. Plan de acción</h3>
      <div class="desc">A completar cuando la condición aceptable sea "No aceptable" y/o la condición crítica sea "Crítico".</div>
      <div class="form-grid">
        <div><label>Responsable de aplicación</label><input id="tmertPlanResponsable" placeholder="Nombre / cargo"></div>
        <div><label>Fecha de aplicación</label><input id="tmertPlanFecha" type="date"></div>
        <div><label>Evidencia</label><input id="tmertPlanEvidencia" placeholder="Ej: Registro fotográfico, capacitación firmada"></div>
        <div><label>Fecha de registro</label><input id="tmertFechaRegistro" type="date"></div>
      </div>
