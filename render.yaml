/* Redacción automática de documentos con IA (v1.74, solo disponible en modo
   API porque requiere el backend real con la clave de Anthropic configurada).
   El borrador que devuelve la IA se coloca en "Contenido del documento" para
   que el usuario lo revise y edite antes de guardar; nunca se guarda solo. */
on(document.getElementById("docIaRedactarBtn"), "click", async ()=>{
  const tipo = document.getElementById("docTipo").value;
  const nombre = document.getElementById("docNombre").value.trim();
  const contextoAdicional = document.getElementById("docIaContexto").value.trim();
  const estadoEl = document.getElementById("docIaEstado");
  if(!nombre){ alert('Indica el "Nombre del documento" antes de redactar con IA, para que el borrador tenga un título claro sobre qué tratar.'); return; }
  if(storageMode !== "api"){ alert("La redacción con IA solo está disponible cuando la app está conectada al backend real."); return; }
  estadoEl.textContent = "Redactando con IA… puede tardar unos segundos.";
  try{
    const respuesta = await apiFetch("POST", "/api/ia/redactar-documento", {tipo, nombre, contextoAdicional});
    document.getElementById("docContenido").value = respuesta.contenido;
    estadoEl.textContent = "Borrador generado. Revísalo y edítalo antes de guardar.";
  }catch(err){
    estadoEl.textContent = "";
    alert("No se pudo redactar el documento con IA: " + err.message);
  }
});
function renderDocumentosTable(){
  const filtroTipo = document.getElementById("filterDocTipo").value;
  const vigentesMap = documentosVigentesMap();
  const rows = (CACHE.documentos||[]).filter(d=> !filtroTipo || d.tipo===filtroTipo)
    .slice().sort((a,b)=> new Date(b.fechaActualizacion||b.fechaConfeccion||0) - new Date(a.fechaActualizacion||a.fechaConfeccion||0));
  document.getElementById("documentosTable").innerHTML = rows.length ? rows.map(d=>{
    const esVigente = vigentesMap.get(documentoKey(d)) === d;
    return `<tr>
      <td>${tipoDocumentoLabel(d)}</td>
      <td>${d.nombre}</td>
      <td>${d.version} ${esVigente? '<span class="pill vigente">Vigente</span>' : '<span class="pill" style="opacity:.6;">Anterior</span>'}</td>
      <td>${d.fechaActualizacion? fmtDate(d.fechaActualizacion) : (d.fechaConfeccion? fmtDate(d.fechaConfeccion) : "—")}</td>
      <td>${d.descripcion || "—"}</td>
      <td>${d.archivoData? `<a href="${d.archivoData}" download="${d.archivoNombre||('Documento_v'+d.version)}" class="subtle-btn">Descargar</a>` : '<span class="empty">Sin archivo</span>'}</td>
      <td>
        <button class="subtle-btn" data-documento-editar="${d.id}">Editar</button>
        <button class="subtle-btn" data-documento-pdf="${d.id}">Generar PDF</button>
        ${(d.tipo==="politica"||d.tipo==="procedimiento"||d.tipo==="manual") ? `<button class="subtle-btn" data-documento-word="${d.id}">Generar Word</button>` : ""}
        <button class="subtle-btn" data-documento-eliminar="${d.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join("") : `<tr><td class="empty" colspan="7">Sin documentos registrados todavía</td></tr>`;
}
on(document.getElementById("documentosTable"), "click", async (e) => {
  const editBtn = e.target.closest("[data-documento-editar]");
  if(editBtn){ startEditDocumento(editBtn.dataset.documentoEditar); return; }
  const pdfBtn = e.target.closest("[data-documento-pdf]");
