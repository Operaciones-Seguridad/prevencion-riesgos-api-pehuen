function renderCphysReunionesTiles(){
  const rows = CACHE.cphysReuniones || [];
  const ordinarias = rows.filter(r=>r.tipo==="ordinaria");
  const anioActual = new Date().getFullYear();
  const ordinariasEsteAnio = ordinarias.filter(r=> r.fecha && new Date(r.fecha).getFullYear()===anioActual).length;
  const ultima = rows.slice().sort((a,b)=> new Date(b.fecha)-new Date(a.fecha))[0];
  const ultimaOrdinaria = ordinarias.slice().sort((a,b)=> new Date(b.fecha)-new Date(a.fecha))[0];
  let diasDesdeOrdinaria = null;
  if(ultimaOrdinaria) diasDesdeOrdinaria = Math.round((new Date(new Date().toDateString()) - new Date(ultimaOrdinaria.fecha)) / (1000*60*60*24));
  const semaforoReunion = diasDesdeOrdinaria===null ? "alto" : (diasDesdeOrdinaria<=31 ? "bajo" : "alto");
  document.getElementById("cphysReunionesTiles").innerHTML = [
    tile("Reuniones registradas", rows.length, "ordinarias y extraordinarias"),
    tile("Última reunión", ultima? fmtDate(ultima.fecha) : "—", ultima? (ultima.tipo==="extraordinaria"?"Extraordinaria":"Ordinaria") : "sin reuniones registradas"),
    tile("Reuniones ordinarias en "+anioActual, ordinariasEsteAnio, "el DS 44 exige periodicidad mensual (art. 39)"),
    tile("Días desde la última reunión ordinaria", diasDesdeOrdinaria===null? "—" : diasDesdeOrdinaria, diasDesdeOrdinaria===null? "sin reuniones ordinarias registradas" : (diasDesdeOrdinaria<=31? "dentro del plazo mensual" : "sobre el plazo mensual"), semaforoReunion==="bajo"?"bajo":"alto"),
  ].join("");
}

