La empresa implementa los protocolos de vigilancia de la salud del DS N°594 y del MINSAL que correspondan a los riesgos identificados (PREXOR, PLANESI, TMERT, riesgos psicosociales, radiación UV, entre otros).

8. Revisión y actualización
Esta política será revisada al menos una vez al año, o cada vez que existan cambios significativos en los procesos, la normativa vigente o los resultados de la gestión preventiva, y será difundida a todos los trabajadores.`,
