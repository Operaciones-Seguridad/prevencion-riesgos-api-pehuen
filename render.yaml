on(document.getElementById("cancelEditGanttBtn"), "click", ()=>resetGanttForm());
on(document.getElementById("saveGanttBtn"), "click", async ()=>{
  const protocoloId = document.getElementById("ganttProtocolo").value;
  const fechaInicio = document.getElementById("ganttInicio").value;
  const fechaFin = document.getElementById("ganttFin").value;
  const actividad = document.getElementById("ganttActividad").value.trim();
  if(!protocoloId || !fechaInicio || !fechaFin || !actividad){ alert("Complete protocolo, actividad, fecha de inicio y de término."); return; }
  if(new Date(fechaFin) < new Date(fechaInicio)){ alert("La fecha de término no puede ser anterior a la fecha de inicio."); return; }
  const existing = ganttEditingId ? CACHE.ganttProtocolo.find(g=>g.id===ganttEditingId) : null;
  const rec = {
    id: ganttEditingId || uid(),
    protocoloId, actividad, fechaInicio, fechaFin,
    etapa: document.getElementById("ganttEtapa").value.trim(),
    grupo: document.getElementById("ganttGrupo").value.trim(),
    responsable: document.getElementById("ganttResponsable").value.trim(),
    respaldo: document.getElementById("ganttRespaldo").value.trim(),
    avance: parseInt(document.getElementById("ganttAvance").value, 10) || 0,
    orden: (existing && existing.orden!=null) ? existing.orden : CACHE.ganttProtocolo.length,
  };
  await put("ganttProtocolo", rec);
  await loadCache();
  const wasEditing = !!ganttEditingId;
  resetGanttForm();
  renderGanttFiltros(); renderGanttTable(); renderGanttChart(); renderGanttResumen();
  alert(wasEditing ? "Actividad actualizada." : "Actividad agregada a la carta Gantt.");
});
function ganttFiltrado(){
  const protocoloId = document.getElementById("filterGanttProtocolo").value;
  const estado = document.getElementById("filterGanttEstado").value;
  return CACHE.ganttProtocolo.filter(g=>{
    if(protocoloId && g.protocoloId!==protocoloId) return false;
    if(estado && ganttEstadoDerivado(g)!==estado) return false;
    return true;
  });
}
function renderGanttResumen(){
  const wrap = document.getElementById("ganttResumen");
  const rows = ganttFiltrado();
  if(!rows.length){ wrap.innerHTML = '<div class="empty">Sin actividades para calcular el % de cumplimiento</div>'; return; }
  const total = rows.length;
  const completas = rows.filter(g=>ganttAvanceOf(g)>=100).length;
  const atrasadas = rows.filter(g=>ganttEstadoDerivado(g)==="atrasada").length;
  const sumAvance = rows.reduce((s,g)=>s+ganttAvanceOf(g), 0);
  const pctCumpl = Math.round(sumAvance/total);
  const pctPend = 100 - pctCumpl;
  wrap.innerHTML = `
    <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:center;">
      <div><div style="font-size:26px;font-weight:800;color:#0ca30c;">${pctCumpl}%</div><div style="font-size:12px;color:#777;">Cumplimiento (promedio de % de avance, ${completas}/${total} al 100%)</div></div>
      <div><div style="font-size:26px;font-weight:800;color:#2a78d6;">${pctPend}%</div><div style="font-size:12px;color:#777;">Pendiente${atrasadas?` (${atrasadas} actividad(es) atrasada(s))`:""}</div></div>
      <div style="flex:1;min-width:160px;height:14px;border-radius:7px;overflow:hidden;background:#e7e7e2;display:flex;">
        <div style="width:${pctCumpl}%;background:#0ca30c;"></div>
        <div style="width:${pctPend}%;background:#2a78d6;"></div>
      </div>
    </div>`;
}
function renderGanttTable(){
  const rows = ganttFiltrado().slice().sort((a,b)=>{
    const oa = a.orden==null? 9999 : a.orden, ob = b.orden==null? 9999 : b.orden;
    if(oa!==ob) return oa-ob;
    return new Date(a.fechaInicio) - new Date(b.fechaInicio);
  });
  let lastKey = null;
  const trs = rows.map(g=>{
    const key = `${g.protocoloId}|${g.etapa||""}|${g.grupo||""}`;
    let header = "";
    if(key !== lastKey){
      lastKey = key;
      const etiqueta = [protoName(g.protocoloId), g.etapa, g.grupo].filter(Boolean).join(" — ");
      header = `<tr><td colspan="9" style="background:#f3f3ee;font-weight:700;">${etiqueta}</td></tr>`;
    }
    const estado = ganttEstadoDerivado(g);
    const avance = ganttAvanceOf(g);
    return `${header}<tr>
      <td>${[g.etapa,g.grupo].filter(Boolean).join(" / ") || "–"}</td>
      <td>${g.actividad}</td>
      <td>${g.responsable || "–"}</td>
      <td>${fmtDate(g.fechaInicio)}</td>
      <td>${fmtDate(g.fechaFin)}</td>
      <td>${g.respaldo || "–"}</td>
      <td>${avance}%</td>
      <td><span class="pill ${estado==='cumplido'?'vigente':estado==='atrasada'?'vencido':'medio'}">${GANTT_ESTADO_LABEL[estado]}</span></td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-gantt-editar="${g.id}">Editar</button>
        <button class="subtle-btn" data-gantt-eliminar="${g.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join("");
  document.getElementById("ganttTable").innerHTML = trs || `<tr><td class="empty" colspan="9">Sin actividades registradas</td></tr>`;
}
on(document.getElementById("ganttTable"), "click", async (e)=>{
  const editBtn = e.target.closest("button[data-gantt-editar]");
  if(editBtn){ startEditGantt(editBtn.dataset.ganttEditar); return; }
  const delBtn = e.target.closest("button[data-gantt-eliminar]");
  if(delBtn){
    const rec = CACHE.ganttProtocolo.find(g=>g.id===delBtn.dataset.ganttEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar la actividad "${rec.actividad}" de ${protoName(rec.protocoloId)}? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("ganttProtocolo", rec.id);
    await loadCache();
    if(ganttEditingId===rec.id) resetGanttForm();
    renderGanttFiltros(); renderGanttTable(); renderGanttChart(); renderGanttResumen();
  }
});
["filterGanttProtocolo","filterGanttEstado"].forEach(id=>{
  document.getElementById(id).addEventListener("change", ()=>{ renderGanttTable(); renderGanttChart(); renderGanttResumen(); });
});
on(document.getElementById("exportGanttBtn"), "click", async () => {
  if(typeof XLSX === "undefined"){ alert("No se pudo cargar el generador de Excel (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const rows = ganttFiltrado().slice().sort((a,b)=>{
    const oa = a.orden==null? 9999 : a.orden, ob = b.orden==null? 9999 : b.orden;
    if(oa!==ob) return oa-ob;
    return new Date(a.fechaInicio) - new Date(b.fechaInicio);
  });
  if(!rows.length){ alert("No hay actividades para exportar con los filtros aplicados."); return; }
  const data = rows.map(g=>({
    "Protocolo": protoName(g.protocoloId),
    "Etapa": g.etapa || "",
    "Sub-etapa": g.grupo || "",
    "Actividad": g.actividad,
    "Responsable": g.responsable || "",
    "Fecha inicio": g.fechaInicio ? fmtDate(g.fechaInicio) : "",
    "Fecha término": g.fechaFin ? fmtDate(g.fechaFin) : "",
    "Respaldo / evidencia": g.respaldo || "",
    "% Avance": ganttAvanceOf(g),
    "Estado": GANTT_ESTADO_LABEL[ganttEstadoDerivado(g)],
  }));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, "Carta Gantt");
  const empresaNombre = (CACHE.empresa && CACHE.empresa.razonSocial) ? CACHE.empresa.razonSocial.replace(/[^a-zA-Z0-9]+/g,"_") : "Empresa";
  XLSX.writeFile(wb, `Carta_Gantt_Protocolos_${empresaNombre}_${new Date().toISOString().slice(0,10)}.xlsx`);
});
function renderGanttChart(){
  const wrap = document.getElementById("ganttChartWrap");
  const rows = ganttFiltrado();
  if(!rows.length){ wrap.innerHTML = '<div class="empty">Sin actividades para mostrar en la carta Gantt</div>'; return; }
  const starts = rows.map(g=>new Date(g.fechaInicio).getTime()).filter(t=>!isNaN(t));
  const ends = rows.map(g=>new Date(g.fechaFin).getTime()).filter(t=>!isNaN(t));
  const rangeStart = Math.min(...starts, ...ends);
  const rangeEnd = Math.max(...starts, ...ends);
  const totalMs = Math.max(1, rangeEnd - rangeStart);
  const months = [];
  let cursor = new Date(rangeStart); cursor.setDate(1);
  const endD = new Date(rangeEnd);
  let guard = 0;
  while(cursor <= endD && guard < 400){
    months.push(new Date(cursor));
    cursor.setMonth(cursor.getMonth()+1);
    guard++;
  }
  const headerHtml = months.map(m=>{
    const pos = ((m.getTime()-rangeStart)/totalMs)*100;
    return `<div style="position:absolute;left:${pos}%;top:0;font-size:10.5px;color:#777;border-left:1px solid #e2e2e2;padding-left:3px;height:100%;white-space:nowrap;">${MESES_NOMBRE[m.getMonth()]} ${m.getFullYear()}</div>`;
  }).join("");
  const byProtocolo = new Map();
  rows.forEach(g=>{
    if(!byProtocolo.has(g.protocoloId)) byProtocolo.set(g.protocoloId, []);
    byProtocolo.get(g.protocoloId).push(g);
  });
  const bodyHtml = Array.from(byProtocolo.entries()).map(([protocoloId, acts])=>{
    const filas = acts.map(g=>{
      const ini = new Date(g.fechaInicio).getTime(), fin = new Date(g.fechaFin).getTime();
      if(isNaN(ini) || isNaN(fin)) return "";
      const left = ((ini-rangeStart)/totalMs)*100;
      const width = Math.max(1.2, ((fin-ini)/totalMs)*100);
      const color = GANTT_ESTADO_COLOR[ganttEstadoDerivado(g)] || "#898781";
      return `<div style="position:relative;height:28px;margin-bottom:4px;">
        <div title="${g.actividad}: ${fmtDate(g.fechaInicio)} – ${fmtDate(g.fechaFin)}" style="position:absolute;left:${left}%;width:${width}%;top:2px;height:22px;background:${color};border-radius:5px;color:#fff;font-size:11px;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${g.actividad}</div>
      </div>`;
    }).join("");
    return `<div style="margin-bottom:14px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px;">${protoName(protocoloId)}</div>
      <div style="position:relative;">${filas}</div>
    </div>`;
  }).join("");
  wrap.innerHTML = `<div style="min-width:640px;">
    <div style="position:relative;height:20px;margin-bottom:10px;border-bottom:1px solid #e2e2e2;">${headerHtml}</div>
    ${bodyHtml}
  </div>`;
}

/* =========================================================
   HERRAMIENTA TMERT (v1.39)
   Replica el formato de la planilla Excel real "TMERT Aplicación"
   (Norma Técnica de Identificación y Evaluación de Factores de Riesgo
   de TMERT en Extremidades Superiores, MINSAL): caracterización del
   puesto de trabajo, identificación inicial de 7 factores de riesgo, e
   identificación avanzada (condición aceptable/crítica) para el factor
   "trabajo repetitivo de miembros superiores" — único factor para el
   que la planilla original trae la fórmula de aceptación/criticidad.
   ========================================================= */
const TMERT_PREGUNTAS_INICIAL = [
  {key:"repetitivo", label:"Trabajo repetitivo de miembros superiores", texto:"¿Existe una o más tareas donde utilice las manos y miembros superiores con una duración total de una hora o más durante la jornada laboral y con un tiempo total de 5 o más horas a la semana? Por ejemplo: donde se tenga que armar, limpiar, apretar, lanzar, cortar, presionar, desarmar, atornillar, desatornillar, digitar."},
  {key:"postura", label:"Postura de trabajo estática/forzada", texto:"¿Existen posturas de trabajo estáticas de cabeza/cuello, tronco y/o miembros superiores e inferiores, mantenidas durante más de 4 segundos? Por ejemplo: cabeza inclinada hacia adelante o atrás, hombros por delante de las caderas de manera continua, tronco rotado o inclinado para sostener o movilizar objetos."},
  {key:"mmcLevantamiento", label:"Manipulación manual de cargas — levantamiento/descenso/transporte", texto:"¿Existe levantamiento, descenso o transporte manual de un objeto de 3kg o más? Se observa que levanta, sostiene, transporta, desplaza, moviliza, ubica con precisión ordenando, empuja, arrastra o tracciona, apila, paletiza."},
  {key:"mmcTraccion", label:"Manipulación manual de cargas — tracción/empuje", texto:"¿Existe empuje o arrastre de una carga utilizando el cuerpo completo con 1 o 2 manos? Se observa el empuje y/o arrastre de carros, plataformas con rueda, superficies deslizantes, camillas, camas, sillas de rueda, grúas de uso manual, carretillas."},
  {key:"mmp", label:"Manejo manual de pacientes/personas", texto:"¿Se realiza alguna actividad que requiere fuerza para empujar, tirar, levantar, descender, transferir o de alguna manera mover o sostener una persona o parte del cuerpo de una persona?"},
  {key:"vibCompleto", label:"Vibración de cuerpo completo", texto:"¿Están los trabajadores/as expuestos/as a vibraciones por una fuente de vibración de cuerpo entero perceptible por el trabajador/a?"},
  {key:"vibManoBrazo", label:"Vibración segmento mano-brazo", texto:"¿Están los trabajadores/as en contacto con una fuente de vibración perceptible por el trabajador del segmento mano-brazo? Por ejemplo: herramientas neumáticas o eléctricas, atornilladores, martillos, cinceles, taladros."},
];
const TMERT_ACEPTABLE_PREGUNTAS = [
  {key:"q1", texto:"¿Los miembros superiores trabajan por menos del 50% de la duración total de la tarea repetitiva?"},
  {key:"q2", texto:"¿Los codos se mantienen por debajo del nivel de los hombros por al menos el 90% del total de la duración de la(s) tarea(s) repetitiva(s)?"},
  {key:"q3", texto:"¿Existe esfuerzo moderado (Escala de Borg CR-10 máximo 4) ejercido por el trabajador por no más de 1 hora mientras dura la tarea repetitiva?"},
  {key:"q4", texto:"Ausencia de esfuerzo máximo (esfuerzo percibido = 5 o más en la Escala de Borg CR-10)"},
  {key:"q5", texto:"Presencia de pausas programadas (excluyendo la pausa para almuerzo)"},
  {key:"q6", texto:"¿La duración total de las tareas repetitivas es menor a 4 horas totales dentro de la jornada laboral?"},
];
const TMERT_CRITICA_PREGUNTAS = [
  {key:"q1", texto:"¿Las acciones técnicas del miembro superior son tan rápidas que no se pueden contar con una simple observación directa?"},
  {key:"q2", texto:"Uno o ambos brazos están realizando la tarea con el codo sobre el nivel del hombro por el 50% o más del tiempo total de trabajo repetitivo"},
  {key:"q3", texto:"¿Se utiliza agarre en \"pinza\" (o todo tipo de tomada usando las puntas de los dedos) por más del 80% de la duración total del trabajo repetitivo?"},
  {key:"q4", texto:"¿Se aplica fuerza máxima por el trabajador (esfuerzo percibido = 5 o más en la Escala de Borg CR-10) por 10% o más del tiempo total de la tarea repetitiva?"},
  {key:"q5", texto:"¿No hay más de una pausa (incluyendo el almuerzo) en un turno de 6 a 8 horas?"},
  {key:"q6", texto:"¿La duración total de las tareas repetitivas excede las 4 horas totales dentro de la jornada laboral?"},
];
let tmertEditingId = null;

function drawTmertPreguntas(){
  document.getElementById("tmertIniWrap").innerHTML = TMERT_PREGUNTAS_INICIAL.map(p=>`
    <div style="margin-bottom:12px;">
      <label style="margin-bottom:2px;">${p.label}</label>
      <div class="desc" style="margin:0 0 4px;">${p.texto}</div>
      <select id="tmertIni_${p.key}" data-tmert-ini="${p.key}"><option value="NO">No</option><option value="SI">Sí</option></select>
    </div>`).join("");
  document.getElementById("tmertAvAceptableWrap").innerHTML = TMERT_ACEPTABLE_PREGUNTAS.map(p=>`
    <tr><td style="width:70%;">${p.texto}</td><td><select id="tmertAcep_${p.key}" data-tmert-acep="${p.key}"><option value="SI">Sí</option><option value="NO">No</option></select></td></tr>`).join("");
  document.getElementById("tmertAvCriticaWrap").innerHTML = TMERT_CRITICA_PREGUNTAS.map(p=>`
    <tr><td style="width:70%;">${p.texto}</td><td><select id="tmertCrit_${p.key}" data-tmert-crit="${p.key}"><option value="NO">No</option><option value="SI">Sí</option></select></td></tr>`).join("");
}
drawTmertPreguntas();

function tmertPillHtml(texto, color){
  return `<span class="pill ${color}">${texto}</span>`;
}
function tmertResultadoInicial(respuestas){
  const todasNo = TMERT_PREGUNTAS_INICIAL.every(p => (respuestas[p.key]||"NO") === "NO");
  return todasNo
    ? "Ausencia total del riesgo, reevaluar cada 3 años con nueva identificación inicial"
    : "Aplicar identificación avanzada — condición aceptable para cada tipo de factor de riesgo identificado";
}
function tmertResultadoAceptable(respuestas){
  const algunaNo = TMERT_ACEPTABLE_PREGUNTAS.some(p => (respuestas[p.key]||"SI") === "NO");
  return algunaNo ? "No Aceptable" : "Aceptable";
}
function tmertResultadoCritica(respuestas){
  const algunaSi = TMERT_CRITICA_PREGUNTAS.some(p => (respuestas[p.key]||"NO") === "SI");
  return algunaSi ? "Crítico — proceda a elaborar plan de acción" : "No crítico/Intermedio — solicitar evaluación por parte del OAL";
}
function leerRespuestasIni(){
  const r = {};
  TMERT_PREGUNTAS_INICIAL.forEach(p=>{ const el=document.getElementById(`tmertIni_${p.key}`); r[p.key] = el ? el.value : "NO"; });
  return r;
}
function leerRespuestasAcep(){
  const r = {};
  TMERT_ACEPTABLE_PREGUNTAS.forEach(p=>{ const el=document.getElementById(`tmertAcep_${p.key}`); r[p.key] = el ? el.value : "SI"; });
  return r;
}
function leerRespuestasCrit(){
  const r = {};
  TMERT_CRITICA_PREGUNTAS.forEach(p=>{ const el=document.getElementById(`tmertCrit_${p.key}`); r[p.key] = el ? el.value : "NO"; });
  return r;
}
function actualizarResultadosTmert(){
  const ini = leerRespuestasIni();
  const resIni = tmertResultadoInicial(ini);
  const iniEl = document.getElementById("tmertResultadoInicial");
  iniEl.textContent = resIni;
  iniEl.className = "pill " + (resIni.startsWith("Ausencia") ? "bajo" : "medio");

  const acep = leerRespuestasAcep();
  const resAcep = tmertResultadoAceptable(acep);
  const acepEl = document.getElementById("tmertResultadoAceptable");
  acepEl.textContent = resAcep;
  acepEl.className = "pill " + (resAcep === "Aceptable" ? "bajo" : "alto");

  const crit = leerRespuestasCrit();
  const resCrit = tmertResultadoCritica(crit);
  const critEl = document.getElementById("tmertResultadoCritica");
  critEl.textContent = resCrit;
  critEl.className = "pill " + (resCrit.startsWith("Crítico") ? "critico" : "medio");
}
on(document.getElementById("tmertIniWrap"), "change", actualizarResultadosTmert);
on(document.getElementById("tmertAvAceptableWrap"), "change", actualizarResultadosTmert);
on(document.getElementById("tmertAvCriticaWrap"), "change", actualizarResultadosTmert);

