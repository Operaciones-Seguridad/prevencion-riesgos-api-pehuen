  document.getElementById("eppEstPeligro").value = rec.peligro||"";
  document.getElementById("eppEstRiesgo").value = rec.riesgo||"";
  document.getElementById("eppEstEpp").value = rec.epp||"";
  document.getElementById("eppEstCertificacion").value = rec.certificacion||"";
