      <div class="card-header-row" id="hdrArbolCausal"><h2 id="arbolFormTitle">Análisis de causa raíz — Árbol causal</h2><button class="collapse-toggle" id="toggleArbolCausal" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyArbolCausal">
      <div class="desc">Investigación de causa raíz mediante la <strong>Metodología del Árbol de Causas</strong> (según la Guía para la Investigación de Accidentes): a partir del hecho central (el accidente/incidente) se reconstruye la cadena de hechos que lo hicieron posible, retrocediendo con la pregunta "¿qué fue necesario para que esto ocurriera?", hasta llegar a las causas raíz (hechos que ya no tienen un antecedente conocido). Cada hecho se clasifica según los 4 elementos del sistema de trabajo (Individuo, Tarea, Material, Medio/entorno; se agrega Gestión/organización como extensión para el DS 44), y un mismo hecho puede anteceder a más de un hecho posterior (divergencia) o varios hechos pueden ser necesarios en conjunto para uno posterior (conjunción/"Y"), como lo establece la metodología.</div>
      <div class="desc" style="background:#fff8e6;border:1px solid #e8d8a0;border-radius:8px;padding:8px 10px;">
        <strong>Regla clave del método: solo hechos, no interpretaciones ni juicios de valor.</strong> Un "hecho" es algo real, concreto y verificable (ej.: "el trabajador no usaba arnés de seguridad"). No son hechos las interpretaciones (ej.: "formación deficiente") ni los juicios de valor (ej.: "actuó de forma negligente", "debía haber revisado el equipo"): esas expresiones son opiniones que hay que traducir a un hecho verificable concreto antes de agregarlas al árbol.
      </div>
      <div class="form-grid">
        <div><label>Accidente / incidente a analizar</label><select id="arbolAccidenteSel"></select></div>
        <div><label>Responsable del análisis</label><input id="arbolResponsable" placeholder="Nombre / cargo"></div>
        <div><label>Fecha del análisis</label><input id="arbolFecha" type="date"></div>
      </div>
      <label>Relato del accidente</label>
      <div class="desc" style="margin:0 0 6px;">Antes de construir el árbol, redacta en tercera persona y en orden cronológico qué ocurrió (quién, qué, cuándo, dónde, cómo), incluyendo solo hechos verificables. Este relato es la base para identificar los hechos que se agregarán al árbol.</div>
      <textarea id="arbolRelato" placeholder="Ej: El día X, a las Y horas, el trabajador Z se encontraba realizando... "></textarea>
      <label style="margin-top:14px;">Hecho central (el accidente/incidente)</label>
      <textarea id="arbolHechoCentral" placeholder="Se completa automáticamente al seleccionar el accidente/incidente; puedes editarlo."></textarea>

      <div style="margin-top:18px;">
        <label style="margin-bottom:2px;">Agregar hecho antecedente</label>
        <div class="desc" style="margin:0 0 6px;">Un "hecho" es cualquier situación, acción u omisión que contribuyó a que ocurriera el hecho al que antecede. Ve retrocediendo: primero los hechos inmediatamente anteriores al accidente, y desde esos, sus propios antecedentes, y así sucesivamente hasta llegar a las causas raíz. Un hecho puede anteceder a más de un hecho posterior a la vez (mantén presionado Ctrl/Cmd para elegir varios): esto representa una <strong>disyunción</strong> (un mismo hecho origina más de una consecuencia). Cuando dos o más hechos distintos anteceden a un mismo hecho posterior, eso representa una <strong>conjunción ("Y")</strong>: ambos fueron necesarios en conjunto.</div>
        <div class="form-grid">
          <div><label>Antecede a (elige uno o varios)</label><select id="arbolAntecedeA" multiple size="4"></select></div>
          <div><label>Tipo de hecho</label>
            <select id="arbolHechoTipo">
              <option value="individuo">Individuo</option>
              <option value="tarea">Tarea / método</option>
              <option value="material">Material / equipo</option>
              <option value="entorno">Medio (entorno de trabajo)</option>
              <option value="gestion">Gestión / organización</option>
            </select>
          </div>
        </div>
        <label>Descripción del hecho</label>
        <input id="arbolHechoTexto" placeholder="Ej: El trabajador no usaba arnés de seguridad">
        <div id="arbolHechoJuicioAlerta" class="desc" style="display:none;background:#fdecea;border:1px solid #f0b7b0;border-radius:8px;padding:6px 10px;margin-top:4px;">⚠ Este texto parece una interpretación o un juicio de valor, no un hecho verificable. Intenta describir la situación concreta y observable en vez de calificarla.</div>
        <div style="margin-top:10px;"><button class="btn small secondary" id="addArbolHechoBtn">+ Agregar hecho al árbol</button></div>
      </div>

      <label style="margin-top:18px;">Árbol de causas</label>
      <div class="desc" style="margin:0 0 6px;">Se lee de izquierda a derecha: las causas raíz quedan a la izquierda y las flechas convergen hacia el hecho central, a la derecha, igual que en el esquema de la Guía de Investigación de Accidentes.</div>
      <div id="arbolTreeWrap" style="margin-top:6px;overflow-x:auto;"></div>

      <label style="margin-top:18px;">Medidas por causa raíz</label>
      <div class="desc" style="margin:0 0 6px;">Los hechos marcados como "Causa raíz" en el árbol aparecen aquí. Para cada uno se distingue la <strong>medida correctiva</strong> (evita que esta misma causa vuelva a producir este accidente) de la <strong>medida preventiva</strong> (aplica esa misma corrección a otras situaciones similares de la empresa donde pueda estar presente la misma causa), y se define un plazo de ejecución.</div>
      <div id="arbolMedidasWrap"></div>

      <label style="margin-top:18px;">Conclusión general</label>
      <textarea id="arbolConclusion" placeholder="Síntesis del análisis y recomendaciones generales"></textarea>

      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" id="saveArbolBtn">Guardar análisis</button>
        <button class="btn secondary" id="arbolDescargarPdfBtn">Descargar PDF</button>
        <button class="btn secondary" id="cancelEditArbolBtn" style="display:none;">Cancelar edición</button>
      </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header-row" id="hdrArbolCausalListado"><h2>Análisis de causa raíz registrados</h2><button class="collapse-toggle" id="toggleArbolCausalListado" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyArbolCausalListado">
      <table>
        <thead><tr><th>Fecha análisis</th><th>Accidente / incidente</th><th>Área</th><th>N° causas raíz</th><th>Responsable</th><th></th></tr></thead>
        <tbody id="arbolTable"></tbody>
      </table>
      </div>
    </div>
  </div>

