on(document.getElementById("grdPlanAccionTable"), "click", async (e) => {
  const editBtn = e.target.closest("button[data-grdaccion-editar]");
  if(editBtn){ startEditGrdAccion(editBtn.dataset.grdaccionEditar); return; }
  const delBtn = e.target.closest("button[data-grdaccion-eliminar]");
  if(delBtn){
    if(!confirm("¿Eliminar esta medida del plan de acción?")) return;
    await deleteRecord("grdPlanAccion", delBtn.dataset.grdaccionEliminar);
    await loadCache();
    if(grdAccionEditingId === delBtn.dataset.grdaccionEliminar) resetGrdAccionForm();
    renderEmergencia();
  }
});

