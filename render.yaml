on(document.getElementById("descargarInfractoresPdfBtn"), "click", () => descargarInfractoresPdf());

on(document.getElementById("infractoresTable"), "click", async (e)=>{
  const editBtn = e.target.closest("button[data-inf-editar]");
  if(editBtn){ startEditInf(editBtn.dataset.infEditar); return; }
  const delBtn = e.target.closest("button[data-inf-eliminar]");
  if(delBtn){
    const rec = CACHE.infractores.find(i=>i.id===delBtn.dataset.infEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar el registro de "${rec.nombre}" (${fmtDate(rec.fecha)})? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("infractores", rec.id);
    await loadCache();
    if(infEditingId===rec.id) resetInfForm();
    renderInfractores();
  }
});
["filterInfTexto","filterInfMotivo"].forEach(id=>{
  document.getElementById(id).addEventListener("input", ()=>renderInfractoresTable());
  document.getElementById(id).addEventListener("change", ()=>renderInfractoresTable());
});
function renderInfractores(){
  renderInfFiltros();
  renderInfractoresTable();
  const rows = CACHE.infractores;
  const personasUnicas = new Set(rows.map(i=>(i.rut||i.nombre||"").toLowerCase())).size;
  const porMotivo = new Map();
  rows.forEach(i=>{ const m = i.motivo||"Sin especificar"; porMotivo.set(m, (porMotivo.get(m)||0)+1); });
  const motivoTop = Array.from(porMotivo.entries()).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("infTiles").innerHTML = [
    tile("Infracciones registradas", rows.length, "acumulado del registro"),
    tile("Personas distintas", personasUnicas, "por RUT o nombre"),
    tile("Motivo más frecuente", motivoTop? motivoTop[0] : "—", motivoTop? (motivoTop[1]+" registro(s)") : "sin datos aún"),
  ].join("");
  const motivoRows = Array.from(porMotivo.entries()).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  renderBarChart(document.getElementById("chartInfMotivo"), motivoRows, (r)=>PALETTE[motivoRows.indexOf(r)%PALETTE.length]);

  const porPersona = new Map();
  rows.forEach(i=>{
    const key = (i.rut && i.rut.trim()) || i.nombre || "—";
    const label = i.rut? infractorNombreRut(i) : (i.nombre||"—");
    if(!porPersona.has(key)) porPersona.set(key, {label, value:0});
    porPersona.get(key).value++;
  });
  const reincidentesRows = Array.from(porPersona.values()).filter(r=>r.value>0).sort((a,b)=>b.value-a.value).slice(0,5);
  renderBarChart(document.getElementById("chartInfReincidentes"), reincidentesRows, ()=>"#e34948");
}

/* --- Ranking de infractores de velocidad --- */
function renderVelFiltros(){
  const patentesUnicas = Array.from(new Set(CACHE.rankingVelocidad.map(v=>v.patente).filter(Boolean))).sort();
  const conductoresUnicos = Array.from(new Set(CACHE.rankingVelocidad.map(v=>v.conductor).filter(Boolean))).sort();
  const currentP = document.getElementById("filterVelPatente").value;
  const currentC = document.getElementById("filterVelConductor").value;
  fillSelect(document.getElementById("filterVelPatente"), patentesUnicas.map(p=>({id:p,label:p})), true);
  fillSelect(document.getElementById("filterVelConductor"), conductoresUnicos.map(c=>({id:c,label:c})), true);
  if(patentesUnicas.includes(currentP)) document.getElementById("filterVelPatente").value = currentP;
  if(conductoresUnicos.includes(currentC)) document.getElementById("filterVelConductor").value = currentC;
}
function velocidadFiltrada(){
  const patente = document.getElementById("filterVelPatente").value;
  const conductor = document.getElementById("filterVelConductor").value;
  return CACHE.rankingVelocidad.filter(v=>{
    if(patente && v.patente!==patente) return false;
    if(conductor && v.conductor!==conductor) return false;
    return true;
  });
}
let velEditingId = null;
function resetVelForm(){
  velEditingId = null;
  document.getElementById("velFecha").value = "";
  document.getElementById("velPatente").value = "";
  document.getElementById("velConductor").value = "";
