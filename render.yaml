    responsableElaboracion: document.getElementById("docResponsableElaboracion").value.trim(),
    responsableRevision: document.getElementById("docResponsableRevision").value.trim(),
    responsableAprobacion: document.getElementById("docResponsableAprobacion").value.trim(),
    observaciones: document.getElementById("docObservaciones").value.trim(),
    contenido: document.getElementById("docContenido").value,
    archivoNombre: documentoArchivoPendiente ? documentoArchivoPendiente.nombre : (anterior && anterior.archivoNombre) || null,
    archivoData: documentoArchivoPendiente ? documentoArchivoPendiente.data : (anterior && anterior.archivoData) || null,
  };
