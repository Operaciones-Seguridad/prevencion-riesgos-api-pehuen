      <div class="toolbar">
        <div class="field"><label>Año</label><select id="compAnioSel"></select></div>
      </div>
      <div class="desc">Ingrese, para cada ítem y cada mes, cuántas veces se realizó la actividad. El % de cumplimiento de cada ítem considera solo los <strong>meses de revisión</strong> del ítem que ya transcurrieron (los meses que no son "de revisión" para ese ítem se muestran deshabilitados y no afectan su %).</div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th style="min-width:220px;">Actividad</th><th>Ene</th><th>Feb</th><th>Mar</th><th>Abr</th><th>May</th><th>Jun</th><th>Jul</th><th>Ago</th><th>Sep</th><th>Oct</th><th>Nov</th><th>Dic</th><th>% cumplimiento</th></tr></thead>
        <tbody id="compromisosMesesTable"></tbody>
      </table>
      </div>
    </div>

    <div class="card">
      <h2>Informe de cumplimiento</h2>
      <div class="desc">Genera un informe en PDF del nivel de cumplimiento de los compromisos, ya sea de un mes puntual o del año completo, listo para compartir o archivar.</div>
      <div class="toolbar">
        <div class="field"><label>Tipo de informe</label>
          <select id="compInformeTipo">
            <option value="mensual">Mensual</option>
            <option value="anual">Anual</option>
          </select>
        </div>
        <div class="field"><label>Año</label><select id="compInformeAnio"></select></div>
        <div class="field" id="compInformeMesWrap"><label>Mes</label><select id="compInformeMes"></select></div>
        <div><button class="btn small secondary" id="compInformeDescargarBtn" style="margin-top:20px;">⬇ Descargar informe PDF</button></div>
      </div>
