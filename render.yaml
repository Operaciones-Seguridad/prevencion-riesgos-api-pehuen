/* El subtipo (Procedimiento de trabajo seguro / Instructivo de trabajo) y el
   contenido solo tienen sentido cuando el tipo de documento es "procedimiento". */
function actualizarVisibilidadSubtipoDoc(){
  const tipo = document.getElementById("docTipo").value;
  const esProcedimiento = tipo === "procedimiento";
  const mostrarContenido = tipo === "procedimiento" || tipo === "politica" || tipo === "manual";
  const iaWrap = document.getElementById("docIaWrap");
  if(iaWrap) iaWrap.style.display = (mostrarContenido && storageMode === "api") ? "" : "none";
  document.getElementById("docSubtipoWrap").style.display = esProcedimiento ? "" : "none";
