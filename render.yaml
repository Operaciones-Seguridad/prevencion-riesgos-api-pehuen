    body: sims.length ? sims.map(s=>{ const a = amenazas.find(x=>x.id===s.amenazaId); return [fmtDate(s.fecha), s.tipo==="simulacro"?"Simulacro":"Simulación", a?grdAmenazaNombre(a):"—", String(s.participantes||0)]; }) : [["Sin ejercicios registrados","","",""]],
