    body: amenazas.length ? amenazas.map(a=>[grdAmenazaNombre(a), a.presente!==false?"Sí":"No", GRD_PRIORIDAD_LABEL[a.prioridad]||"—", grdAmenazaDiagnosticoCompleto(a)?"Completo":"Incompleto"]) : [["Sin amenazas registradas","","",""]],
    styles:{fontSize:8.5}, headStyles:{fillColor:[236,131,90]} });
  y = doc.lastAutoTable.finalY + 8;

  if(y > 230){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("Comité de Gestión del Riesgo de Desastres", 14, y); y += 4;
  const comite = CACHE.grdComite||[];
