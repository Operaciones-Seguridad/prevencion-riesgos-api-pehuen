/* --- Carta Gantt de protocolos --- */
const GANTT_ESTADO_LABEL = {cumplido:"Cumplido", pendiente:"Pendiente", atrasada:"Atrasada"};
const GANTT_ESTADO_COLOR = {cumplido:"#0ca30c", pendiente:"#2a78d6", atrasada:"#d03b3b"};
function ganttAvanceOf(g){
  if(typeof g.avance === "number") return Math.max(0, Math.min(100, g.avance));
  return g.cumplido ? 100 : 0;
}
function ganttEstadoDerivado(g){
  const avance = ganttAvanceOf(g);
  if(avance>=100) return "cumplido";
  if(g.fechaFin){
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const fin = new Date(g.fechaFin);
    if(!isNaN(fin) && fin < hoy) return "atrasada";
  }
  return "pendiente";
}
function renderGanttFiltros(){
  const aplicables = protocolosAplicables();
  const current = document.getElementById("ganttProtocolo").value;
  fillSelect(document.getElementById("ganttProtocolo"), aplicables.map(p=>({id:p.id,label:p.nombre})), true);
  if(aplicables.some(p=>p.id===current)) document.getElementById("ganttProtocolo").value = current;

  const currentF = document.getElementById("filterGanttProtocolo").value;
  const protocolosConGantt = CACHE.protocolos.filter(p=>CACHE.ganttProtocolo.some(g=>g.protocoloId===p.id));
  fillSelect(document.getElementById("filterGanttProtocolo"), protocolosConGantt.map(p=>({id:p.id,label:p.nombre})), true);
  if(protocolosConGantt.some(p=>p.id===currentF)) document.getElementById("filterGanttProtocolo").value = currentF;
}
let ganttEditingId = null;
function resetGanttForm(){
  ganttEditingId = null;
  document.getElementById("ganttProtocolo").value = "";
  document.getElementById("ganttEtapa").value = "";
  document.getElementById("ganttGrupo").value = "";
