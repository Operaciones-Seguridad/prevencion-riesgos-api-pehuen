on(document.getElementById("cancelEditCphysPgBtn"), "click", ()=> resetCphysPgForm());
on(document.getElementById("cphysProgramaTable"), "click", async (e)=>{
  const editBtn = e.target.closest("[data-cphyspg-editar]");
  if(editBtn){ startEditCphysPg(editBtn.dataset.cphyspgEditar); return; }
  const delBtn = e.target.closest("[data-cphyspg-eliminar]");
  if(delBtn){
    if(!confirm("¿Eliminar esta actividad del Programa de Seguridad del Comité?")) return;
    await deleteRecord("cphysPrograma", delBtn.dataset.cphyspgEliminar);
    await loadCache();
    if(cphysPgEditingId===delBtn.dataset.cphyspgEliminar) resetCphysPgForm();
    renderCphysPrograma();
  }
});
function renderCphysPrograma(){
  const rows = CACHE.cphysPrograma || [];
  const conEstado = rows.map(p=>({...p, _estado: estadoPrograma(p)}));
  const realizadas = conEstado.filter(p=>p._estado==="realizada").length;
  const atrasadas = conEstado.filter(p=>p._estado==="atrasada").length;
  const pendientes = conEstado.filter(p=>p._estado==="pendiente").length;
  const pct = rows.length ? Math.round((realizadas/rows.length)*100) : 0;
  document.getElementById("cphysProgramaTiles").innerHTML = [
    tile("Actividades del programa del Comité", rows.length, "registro propio del Comité"),
    tile("Realizadas", realizadas, pct+"% de cumplimiento"),
    tile("Atrasadas", atrasadas, "requieren atención del Comité", atrasadas>0?"alto":"bajo"),
    tile("Pendientes (en plazo)", pendientes, ""),
  ].join("");
  const ESTADO_PG_LABEL = {pendiente:"Pendiente", realizada:"Realizada", atrasada:"Atrasada"};
  document.getElementById("cphysProgramaTable").innerHTML = conEstado.length ? conEstado.slice().sort((a,b)=> new Date(a.fechaProgramada||0)-new Date(b.fechaProgramada||0)).map(p=>`
    <tr>
      <td>${p.nombre||"—"}</td>
      <td>${areaName(p.areaId)}</td>
      <td>${p.responsable||"—"}</td>
      <td>${p.fechaProgramada? fmtDate(p.fechaProgramada) : "—"}</td>
      <td><span class="pill ${p._estado==="realizada"?"vigente":(p._estado==="atrasada"?"critico":"")}">${ESTADO_PG_LABEL[p._estado]}</span></td>
      <td>${p.fechaRealizada? fmtDate(p.fechaRealizada) : "—"}</td>
      <td>
        <button class="subtle-btn" data-cphyspg-editar="${p.id}">Editar</button>
        <button class="subtle-btn" data-cphyspg-eliminar="${p.id}">Eliminar</button>
      </td>
    </tr>
  `).join("") : `<tr><td class="empty" colspan="7">Sin actividades registradas todavía en el Programa de Seguridad del Comité</td></tr>`;
}

