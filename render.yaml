      "Probabilidad": m.probabilidad,
      "Consecuencia": m.consecuencia,
      "P x C": m.probabilidad*m.consecuencia,
      "Nivel de riesgo": nivelLabel(m.nivel),
      "Controles": m.controles||"",
      "Jerarquías usadas (DS 44)": jerarquiasUsadas.join(", ") || "—",
      "Solo EPP (revisar)": soloEpp(m) ? "Sí" : "No",
      "Responsable": m.responsable||"",
      "Plazo": m.plazo||"",
      "Estado": estadoLabel[m.estado]||m.estado||"Pendiente",
      "N° hombres": m.hombres||0,
      "N° mujeres": m.mujeres||0,
      "N° otros": m.otros||0,
      "Especialmente sensible": m.sensible ? "Sí" : "No",
      "Grupo(s) especialmente sensible(s)": m.sensible ? (m.gruposSensibles||[]).join(", ") : "",
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{wch:14},{wch:20},{wch:28},{wch:14},{wch:26},{wch:26},{wch:32},{wch:12},{wch:12},{wch:8},{wch:14},{wch:32},{wch:16},{wch:14},{wch:18},{wch:12},{wch:12},{wch:10},{wch:10},{wch:10},{wch:16},{wch:32}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Matriz de riesgos");

  // Segunda hoja: una fila por cada medida de control individual, con su jerarquía DS 44.
  const jerData = [];
  rows.forEach(m=>{
    jerarquiaDe(m).forEach(it=>{
      jerData.push({
        "Área": areaName(m.areaId),
        "Proceso": m.proceso||"",
        "Actividad": m.actividad||"",
        "Peligro": m.peligro||"",
        "Jerarquía (DS 44)": it.jerarquia? `${it.jerarquia} - ${JERARQUIA_LABEL[it.jerarquia]}` : "Sin clasificar",
        "Medida de control": it.texto||"",
        "Responsable": it.responsable||"",
        "Fecha de implementación": it.plazo||"",
      });
    });
  });
  if(jerData.length){
    const ws2 = XLSX.utils.json_to_sheet(jerData);
    ws2["!cols"] = [{wch:14},{wch:20},{wch:28},{wch:26},{wch:26},{wch:40},{wch:18},{wch:16}];
    XLSX.utils.book_append_sheet(wb, ws2, "Medidas por jerarquía DS44");
  }

  const empresaNombre = (CACHE.empresa && CACHE.empresa.razonSocial) ? CACHE.empresa.razonSocial.replace(/[^a-zA-Z0-9]+/g,"_") : "Matriz";
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Matriz_Riesgos_${empresaNombre}_${fecha}.xlsx`);
});

/* =========================================================
   VIGILANCIA DE SALUD — reconstruida en v1.29 en torno a los
   protocolos MINSAL (DS 594) que efectivamente aplican a la
   empresa según su matriz de riesgos vigente. Un protocolo
   "aplica" automáticamente si existe al menos una línea de la
   matriz cuyo peligro/riesgo coincide con sus palabras clave
   (ej. PREXOR aplica si hay líneas de "Exposición a ruido"),
   con opción de forzar manualmente el resultado. A partir de
   ahí: matriz de riesgos por protocolo (formato tipo SUSESO),
   bitácora de cumplimiento y carta Gantt de actividades.
   ========================================================= */
const PROTOCOLO_KEYWORDS = {
  prexor: ["ruido"],
  planesi: ["silice","polvo","material particulado","particulas en suspension"],
  tmert: ["movimiento repetitivos","movimientos repetitivos","sobreesfuerzo","manejo manual","postural"],
  psicosocial: ["estres laboral","psicosocial","acoso","violencia"],
  uv: ["radiacion ultravioleta","radiacion solar","exteriores"],
  hipobaria: ["altitud","hipobaria","hiperbaria","buceo"],
};
function protocoloLineasMatriz(protocoloId){
  const keywords = (PROTOCOLO_KEYWORDS[protocoloId] || []).map(k=>quitarAcentos(k).toLowerCase());
  if(!keywords.length) return [];
  return CACHE.matriz.filter(m=>{
    const texto = quitarAcentos((m.peligro||"") + " " + (m.riesgo||"")).toLowerCase();
    return keywords.some(k=> texto.includes(k));
  });
}
function protocoloAplicaAuto(protocoloId){ return protocoloLineasMatriz(protocoloId).length > 0; }
function protocoloAplica(p){
  if(p.aplicaManual === true) return true;
  if(p.aplicaManual === false) return false;
  return protocoloAplicaAuto(p.id);
}
function protocolosAplicables(){ return CACHE.protocolos.filter(protocoloAplica); }
/* Vigencia de un protocolo según su bitácora de cumplimiento: se toma el
   registro "cumplido" más reciente y se suma la periodicidad del protocolo;
   usado tanto en el Dashboard como en las alertas de vencimiento próximo. */
function protocoloVigenciaBitacora(p){
  const registros = CACHE.bitacoraProtocolo.filter(b=>b.protocoloId===p.id && b.estado==="cumplido");
  if(!registros.length) return null;
  const ultima = registros.map(r=>r.fecha).sort().slice(-1)[0];
  const vigenteHasta = addMonths(ultima, p.periodicidadMeses);
  return { ultima, vigenteHasta, estado: estadoVencimiento(vigenteHasta) };
}

function renderProtocolosAplicaTable(){
  document.getElementById("protocolosAplicaTable").innerHTML = CACHE.protocolos.map(p=>{
    const lineas = protocoloLineasMatriz(p.id);
    const aplica = protocoloAplica(p);
    const areasTxt = lineas.length ? Array.from(new Set(lineas.map(l=>areaName(l.areaId)))).join(", ") : "";
    return `<tr>
      <td><strong>${p.nombre}</strong></td>
      <td>${p.agente||"—"}</td>
      <td>Cada ${p.periodicidadMeses} meses</td>
      <td>${lineas.length} línea(s)${areasTxt?` <span class="kv">(${areasTxt})</span>`:""}</td>
      <td><span class="pill ${aplica?'vigente':'vencido'}">${aplica?'Aplica':'No aplica'}</span>${p.aplicaManual!=null?` <span class="kv">(forzado)</span>`:""}</td>
      <td><select data-prot-field="aplicaManual" data-prot-id="${p.id}">
        <option value="" ${p.aplicaManual==null?"selected":""}>Automático (según matriz)</option>
        <option value="true" ${p.aplicaManual===true?"selected":""}>Forzar que aplica</option>
        <option value="false" ${p.aplicaManual===false?"selected":""}>Forzar que no aplica</option>
      </select></td>
    </tr>`;
  }).join("") || `<tr><td class="empty" colspan="6">Sin protocolos cargados</td></tr>`;
}
on(document.getElementById("protocolosAplicaTable"), "change", async (e) => {
  const el = e.target.closest("[data-prot-field]");
  if(!el) return;
  const rec = CACHE.protocolos.find(p=>p.id===el.dataset.protId);
