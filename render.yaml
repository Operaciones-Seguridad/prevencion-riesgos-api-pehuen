  document.getElementById("perfilVistasWrap").innerHTML = APP_VISTAS.map(v=>`
    <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin:0;">
      <input type="checkbox" data-perfilvista="${v.id}" ${set.has(v.id)?"checked":""} style="width:auto;min-height:auto;">${v.label}
    </label>`).join("");
}
function resetPerfilForm(){
  perfilEditingId = null;
  document.getElementById("perfilNombre").value = "";
  document.getElementById("perfilEsAdmin").checked = false;
  document.getElementById("perfilDescargaDashboard").checked = true;
  drawPerfilVistasCheckboxes(["dashboard"]);
  document.getElementById("savePerfilBtn").textContent = "Guardar perfil";
  document.getElementById("cancelEditPerfilBtn").style.display = "none";
}
on(document.getElementById("cancelEditPerfilBtn"), "click", ()=> resetPerfilForm());
function startEditPerfil(id){
  const rec = CACHE.accesoPerfiles.find(p=>p.id===id);
  if(!rec) return;
  perfilEditingId = id;
  document.getElementById("perfilNombre").value = rec.nombre || "";
  document.getElementById("perfilEsAdmin").checked = !!rec.esAdmin;
  document.getElementById("perfilDescargaDashboard").checked = rec.descargaDashboard !== false;
  drawPerfilVistasCheckboxes(rec.vistas||[]);
  document.getElementById("savePerfilBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditPerfilBtn").style.display = "";
  document.getElementById("hdrAccesos").scrollIntoView({behavior:"smooth", block:"start"});
}
on(document.getElementById("savePerfilBtn"), "click", async () => {
  const nombre = document.getElementById("perfilNombre").value.trim();
  if(!nombre){ alert("Escribe el nombre del perfil."); return; }
  const vistas = Array.from(document.querySelectorAll('#perfilVistasWrap input[data-perfilvista]:checked')).map(cb=>cb.dataset.perfilvista);
  if(!vistas.length){ alert("Marca al menos una pestaña visible para este perfil."); return; }
  const rec = { id: perfilEditingId || uid(), nombre, esAdmin: document.getElementById("perfilEsAdmin").checked, descargaDashboard: document.getElementById("perfilDescargaDashboard").checked, vistas };
  await put("accesoPerfiles", rec);
  await loadCache();
  resetPerfilForm();
  renderAccesos();
  aplicarPermisosSesion();
});
function renderPerfilesTable(){
  const rows = (CACHE.accesoPerfiles||[]).slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  document.getElementById("perfilesTable").innerHTML = rows.length ? rows.map(p=>`
    <tr>
      <td>${p.nombre}</td>
      <td><span class="pill ${p.esAdmin?'vigente':''}">${p.esAdmin?'Sí':'No'}</span></td>
      <td><span class="pill ${p.descargaDashboard!==false?'vigente':''}">${p.descargaDashboard!==false?'Sí':'No'}</span></td>
      <td>${(p.vistas||[]).map(v=>(APP_VISTAS.find(av=>av.id===v)||{}).label||v).join(", ")}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-perfil-editar="${p.id}">Editar</button>
        <button class="subtle-btn" data-perfil-eliminar="${p.id}">Eliminar</button>
      </td>
    </tr>`).join("") : `<tr><td class="empty" colspan="5">Aún no hay perfiles registrados</td></tr>`;
}
on(document.getElementById("perfilesTable"), "click", async (e) => {
  const editBtn = e.target.closest("button[data-perfil-editar]");
  if(editBtn){ startEditPerfil(editBtn.dataset.perfilEditar); return; }
  const delBtn = e.target.closest("button[data-perfil-eliminar]");
  if(delBtn){
    if((CACHE.accesoUsuarios||[]).some(u=>u.perfilId===delBtn.dataset.perfilEliminar)){
      alert("No se puede eliminar: hay usuarios con este perfil asignado. Reasígnalos a otro perfil primero.");
      return;
    }
    if(!confirm("¿Eliminar este perfil?")) return;
    await deleteRecord("accesoPerfiles", delBtn.dataset.perfilEliminar);
    await loadCache();
    if(perfilEditingId === delBtn.dataset.perfilEliminar) resetPerfilForm();
    renderAccesos();
    aplicarPermisosSesion();
  }
});

