/* =========================================================
   INICIO DE SESIÓN Y PERFILES DE ACCESO POR CARGO (v1.63)
   Control de VISIBILIDAD DEL MENÚ según el perfil del usuario que
   inició sesión (no es una autenticación real: la app sigue sin
   backend y la clave queda guardada en el propio navegador). El
   Administrador define, en Configuración → Gestión de accesos, qué
   perfiles existen y qué pestañas ve cada uno, y crea un usuario (con
   nombre, cargo, clave de acceso y perfil) por cada persona.
   Stores: "accesoPerfiles", "accesoUsuarios".
   ========================================================= */
const APP_VISTAS = [
  {id:"dashboard", label:"Dashboard"},
  {id:"realizar-inspecciones", label:"Realizar inspecciones"},
  {id:"inspecciones", label:"Inspecciones"},
  {id:"matriz", label:"Matriz de riesgos"},
  {id:"vigilancia", label:"Vigilancia de salud"},
  {id:"programa", label:"Programa de seguridad"},
  {id:"capacitacion", label:"Capacitación"},
  {id:"accidentabilidad", label:"Accidentabilidad"},
  {id:"seguridad", label:"Infractores"},
  {id:"epp", label:"Entrega EPP"},
  {id:"cumplimiento", label:"Cumplimiento legal"},
  {id:"riohys", label:"RIOHyS"},
  {id:"documentos", label:"Control Documental"},
  {id:"cphys", label:"CPHyS"},
  {id:"emergencia", label:"Emergencia"},
  {id:"compromisos", label:"Control de compromisos"},
  {id:"config", label:"Configuración"},
];
let SESION = { usuarioId: null };
const SESION_STORAGE_KEY = "cprSesionUsuarioId";

function usuarioDeSesion(){ return (CACHE.accesoUsuarios||[]).find(u=>u.id===SESION.usuarioId) || null; }
function perfilDeSesion(){
  const usuario = usuarioDeSesion();
  if(!usuario) return null;
  return (CACHE.accesoPerfiles||[]).find(p=>p.id===usuario.perfilId) || null;
}
/* Aplica el filtro de pestañas visibles según el perfil de la sesión
   activa, y muestra/oculta la sección de Gestión de accesos (solo
   Administrador). Se llama después de cargar datos y cada vez que
   cambia la sesión, los perfiles o los usuarios. */
function aplicarPermisosSesion(){
  /* Si había una sesión activa pero el usuario ya no existe (por
     ejemplo, tras "Restaurar datos de ejemplo", que regenera los
     usuarios con nuevos ID, o si el Administrador lo eliminó), la
     sesión queda inválida: se cierra y se vuelve a pedir el login,
     en vez de dejar el estado a medias (menú sin filtrar pero panel
     de Administrador oculto). */
  if(SESION.usuarioId && !usuarioDeSesion()){
    SESION.usuarioId = null;
    try{ localStorage.removeItem(SESION_STORAGE_KEY); }catch(e){}
    mostrarLogin();
  }
  const usuario = usuarioDeSesion();
  const perfil = perfilDeSesion();
  const permitidas = perfil ? (perfil.vistas||[]) : APP_VISTAS.map(v=>v.id);
  document.querySelectorAll("#mainNav button[data-view]").forEach(btn=>{
    btn.style.display = permitidas.includes(btn.dataset.view) ? "" : "none";
  });
  const activeBtn = document.querySelector("#mainNav button.active");
  if(activeBtn && activeBtn.style.display==="none" && permitidas.length){
    irAVista(permitidas[0]);
  }
  const esAdmin = !!(perfil && perfil.esAdmin);
  const accesosWrap = document.getElementById("accesosAdminWrap");
  if(accesosWrap) accesosWrap.style.display = esAdmin ? "" : "none";
  /* Permiso a nivel de acción (no solo de pestaña): si el perfil del
     usuario en sesión tiene descargaDashboard=false, se ocultan los
     botones de descarga del Dashboard (PDF/PPT para gerencia), aunque el
     perfil sí pueda ver la pestaña Dashboard. Sin perfil (o perfil sin
     este campo, de instalaciones anteriores a esta función) se permite
     por defecto. */
  const puedeDescargarDashboard = !perfil || perfil.descargaDashboard !== false;
  const pdfBtn = document.getElementById("dashboardGerenciaPdfBtn");
  const pptBtn = document.getElementById("dashboardGerenciaPptBtn");
  if(pdfBtn) pdfBtn.style.display = puedeDescargarDashboard ? "" : "none";
  if(pptBtn) pptBtn.style.display = puedeDescargarDashboard ? "" : "none";
  document.getElementById("sesionNombre").textContent = usuario ? usuario.nombre : "—";
  document.getElementById("sesionCargo").textContent = usuario ? (usuario.cargo || (perfil?perfil.nombre:"") || "—") : "—";
  if(typeof renderMisHallazgos === "function") renderMisHallazgos();
  if(typeof renderMisActividadesMensuales === "function") renderMisActividadesMensuales();
}
function renderLoginUsuarioSelect(){
  const sel = document.getElementById("loginUsuarioSel");
  const activos = (CACHE.accesoUsuarios||[]).filter(u=>u.activo!==false);
  sel.innerHTML = activos.map(u=>`<option value="${u.id}">${u.nombre}${u.cargo?" — "+u.cargo:""}</option>`).join("") || '<option value="">No hay usuarios activos — créalos en Configuración</option>';
}
async function mostrarLogin(){
  if(storageMode === "api") await cargarUsuariosPublicos();
  renderLoginUsuarioSelect();
  document.getElementById("loginClave").value = "";
  document.getElementById("loginError").style.display = "none";
  document.getElementById("loginOverlay").classList.remove("hidden");
}
function ocultarLogin(){ document.getElementById("loginOverlay").classList.add("hidden"); }
/* En modo API, entrar a una cuenta implica volver a cargar TODO desde
   el servidor (loadCache vía refreshAll), porque hasta este momento
   solo se tenía la lista pública de usuarios (sin datos protegidos). */
async function iniciarSesionConUsuario(usuarioId){
  SESION.usuarioId = usuarioId;
  try{ localStorage.setItem(SESION_STORAGE_KEY, usuarioId); }catch(e){}
  if(storageMode === "api"){
    await refreshAll();
    renderChecklistFor(document.getElementById("insTipo").value);
  }
  aplicarPermisosSesion();
  ocultarLogin();
}
async function iniciarSesionGuardada(){
  let guardada = null;
  try{ guardada = localStorage.getItem(SESION_STORAGE_KEY); }catch(e){}
  if(storageMode === "api"){
    if(!guardada || !authToken){ await mostrarLogin(); return; }
    try{
      await refreshAll();
      renderChecklistFor(document.getElementById("insTipo").value);
      const usuario = (CACHE.accesoUsuarios||[]).find(u=>u.id===guardada && u.activo!==false);
      if(usuario){ SESION.usuarioId = usuario.id; aplicarPermisosSesion(); ocultarLogin(); }
      else{ await mostrarLogin(); }
    }catch(e){
      // Si el token guardado ya no es válido, apiFetch ya limpió la
      // sesión y mostró el login; no queda nada más que hacer aquí.
    }
    return;
  }
  const usuario = guardada ? (CACHE.accesoUsuarios||[]).find(u=>u.id===guardada && u.activo!==false) : null;
  if(usuario){ iniciarSesionConUsuario(usuario.id); }
  else{ mostrarLogin(); }
}
on(document.getElementById("loginBtn"), "click", async () => {
  const usuarioId = document.getElementById("loginUsuarioSel").value;
  const clave = document.getElementById("loginClave").value;
  if(storageMode === "api"){
    const resp = await apiLogin(usuarioId, clave);
    if(!resp){ document.getElementById("loginError").style.display = ""; return; }
    authToken = resp.token;
    try{ localStorage.setItem(AUTH_TOKEN_KEY, authToken); }catch(e){}
    await iniciarSesionConUsuario(usuarioId);
    return;
  }
  const usuario = (CACHE.accesoUsuarios||[]).find(u=>u.id===usuarioId);
  if(!usuario || usuario.clave !== clave){
    document.getElementById("loginError").style.display = "";
    return;
  }
  iniciarSesionConUsuario(usuario.id);
});
on(document.getElementById("loginClave"), "keydown", (e) => { if(e.key==="Enter") document.getElementById("loginBtn").click(); });
on(document.getElementById("cerrarSesionBtn"), "click", () => {
  SESION.usuarioId = null;
  authToken = null;
  try{ localStorage.removeItem(SESION_STORAGE_KEY); localStorage.removeItem(AUTH_TOKEN_KEY); }catch(e){}
  cerrarSidebarMovil();
  mostrarLogin();
});

/* --- Perfiles por cargo --- */
let perfilEditingId = null;
