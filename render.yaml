  tmertEditingId = id;
  document.getElementById("tmertArea").value = rec.areaId || "";
  document.getElementById("tmertPuesto").value = rec.puesto || "";
  document.getElementById("tmertTareas").value = rec.tareas || "";
  document.getElementById("tmertHorario").value = rec.horario || "";
  document.getElementById("tmertHorasExtraDia").value = rec.horasExtraDia ?? "";
  document.getElementById("tmertHorasExtraSemana").value = rec.horasExtraSemana ?? "";
  document.getElementById("tmertTrabHombres").value = rec.trabHombres ?? "";
  document.getElementById("tmertTrabMujeres").value = rec.trabMujeres ?? "";
  document.getElementById("tmertTipoContrato").value = rec.tipoContrato || "Indefinido";
  document.getElementById("tmertTipoRemuneracion").value = rec.tipoRemuneracion || "Fijo";
  document.getElementById("tmertDuracionMin").value = rec.duracionMin ?? "";
  document.getElementById("tmertPausas").value = rec.pausas || "";
  document.getElementById("tmertRotacion").value = rec.rotacion || "No";
  document.getElementById("tmertEquipos").value = rec.equipos || "";
  document.getElementById("tmertDescripcionTarea").value = rec.descripcionTarea || "";
  document.getElementById("tmertAmbiente").value = rec.ambiente || "";
  document.getElementById("tmertDisposicion").value = rec.disposicion || "";
  document.getElementById("tmertHerramientas").value = rec.herramientas || "";
  drawTmertPreguntas();
  TMERT_PREGUNTAS_INICIAL.forEach(p=>{ const el=document.getElementById(`tmertIni_${p.key}`); if(el) el.value = (rec.identificacionInicial||{})[p.key] || "NO"; });
  TMERT_ACEPTABLE_PREGUNTAS.forEach(p=>{ const el=document.getElementById(`tmertAcep_${p.key}`); if(el) el.value = (rec.avanzadaAceptable||{})[p.key] || "SI"; });
  TMERT_CRITICA_PREGUNTAS.forEach(p=>{ const el=document.getElementById(`tmertCrit_${p.key}`); if(el) el.value = (rec.avanzadaCritica||{})[p.key] || "NO"; });
  document.getElementById("tmertPlanResponsable").value = rec.planResponsable || "";
  document.getElementById("tmertPlanFecha").value = rec.planFecha || "";
  document.getElementById("tmertPlanEvidencia").value = rec.planEvidencia || "";
  document.getElementById("tmertFechaRegistro").value = rec.fechaRegistro || new Date().toISOString().slice(0,10);
  document.getElementById("tmertPlanAdmin").value = rec.planAdmin || "";
  document.getElementById("tmertPlanIngenieria").value = rec.planIngenieria || "";
  actualizarResultadosTmert();
  document.getElementById("tmertFormTitle").textContent = `Editando TMERT — ${rec.puesto||"puesto de trabajo"}`;
  document.getElementById("saveTmertBtn").textContent = "Guardar cambios";
  document.getElementById("cancelEditTmertBtn").style.display = "";
  document.getElementById("tmertFormTitle").scrollIntoView({behavior:"smooth", block:"start"});
}

function leerFormTmert(){
  const areaId = document.getElementById("tmertArea").value;
  const puesto = document.getElementById("tmertPuesto").value.trim();
  if(!areaId || !puesto) return null;
  return {
    areaId, puesto,
    tareas: document.getElementById("tmertTareas").value.trim(),
    horario: document.getElementById("tmertHorario").value.trim(),
    horasExtraDia: document.getElementById("tmertHorasExtraDia").value ? +document.getElementById("tmertHorasExtraDia").value : null,
    horasExtraSemana: document.getElementById("tmertHorasExtraSemana").value ? +document.getElementById("tmertHorasExtraSemana").value : null,
    trabHombres: document.getElementById("tmertTrabHombres").value ? +document.getElementById("tmertTrabHombres").value : null,
    trabMujeres: document.getElementById("tmertTrabMujeres").value ? +document.getElementById("tmertTrabMujeres").value : null,
    tipoContrato: document.getElementById("tmertTipoContrato").value,
    tipoRemuneracion: document.getElementById("tmertTipoRemuneracion").value,
    duracionMin: document.getElementById("tmertDuracionMin").value ? +document.getElementById("tmertDuracionMin").value : null,
    pausas: document.getElementById("tmertPausas").value.trim(),
    rotacion: document.getElementById("tmertRotacion").value,
    equipos: document.getElementById("tmertEquipos").value.trim(),
    descripcionTarea: document.getElementById("tmertDescripcionTarea").value.trim(),
    ambiente: document.getElementById("tmertAmbiente").value.trim(),
    disposicion: document.getElementById("tmertDisposicion").value.trim(),
    herramientas: document.getElementById("tmertHerramientas").value.trim(),
    identificacionInicial: leerRespuestasIni(),
    avanzadaAceptable: leerRespuestasAcep(),
    avanzadaCritica: leerRespuestasCrit(),
    planResponsable: document.getElementById("tmertPlanResponsable").value.trim(),
    planFecha: document.getElementById("tmertPlanFecha").value,
    planEvidencia: document.getElementById("tmertPlanEvidencia").value.trim(),
    fechaRegistro: document.getElementById("tmertFechaRegistro").value || new Date().toISOString().slice(0,10),
    planAdmin: document.getElementById("tmertPlanAdmin").value.trim(),
    planIngenieria: document.getElementById("tmertPlanIngenieria").value.trim(),
  };
}

on(document.getElementById("tmertDescargarPdfBtn"), "click", () => {
  const datos = leerFormTmert();
  if(!datos){ alert("Completa al menos el área y el puesto de trabajo antes de descargar el PDF."); return; }
  descargarTmertPdf(datos);
});

on(document.getElementById("saveTmertBtn"), "click", async () => {
  const datos = leerFormTmert();
  if(!datos){ alert("Completa al menos el área y el puesto de trabajo."); return; }
  if(tmertEditingId){
    const anterior = CACHE.tmertRegistros.find(t=>t.id===tmertEditingId);
    if(!anterior){ alert("El registro que estabas editando ya no existe."); resetTmertForm(); return; }
    const rec = { ...anterior, ...datos };
    await put("tmertRegistros", rec);
    await loadCache();
    resetTmertForm();
    renderTmertTable();
    alert("Registro TMERT actualizado.");
    return;
  }
  const rec = { id: uid(), ...datos };
  await put("tmertRegistros", rec);
  await loadCache();
  resetTmertForm();
  renderTmertTable();
  alert("Registro TMERT guardado.");
});

function renderTmertFiltros(){
  const sel = document.getElementById("filterTmertArea");
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todas</option>' + CACHE.areas.map(a=>`<option value="${a.id}">${a.nombre}</option>`).join("");
  sel.value = cur;
}
function renderTmertResumen(){
  const regs = CACHE.tmertRegistros || [];
  const total = regs.length;
  const ausenciaTotal = regs.filter(r => tmertResultadoInicial(r.identificacionInicial||{}).startsWith("Ausencia")).length;
  const requierenAvanzada = total - ausenciaTotal;
  const repetitivos = regs.filter(r => (r.identificacionInicial||{}).repetitivo === "SI");
  const aceptables = repetitivos.filter(r => tmertResultadoAceptable(r.avanzadaAceptable||{}) === "Aceptable").length;
  const noAceptables = repetitivos.length - aceptables;
  const criticos = repetitivos.filter(r => tmertResultadoCritica(r.avanzadaCritica||{}).startsWith("Crítico")).length;
  document.getElementById("tmertResumenWrap").innerHTML = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      ${tile("Puestos evaluados", total)}
      ${tile("Ausencia total del riesgo", ausenciaTotal)}
      ${tile("Requieren identificación avanzada", requierenAvanzada)}
      ${tile("Trabajo repetitivo — Aceptable", aceptables)}
      ${tile("Trabajo repetitivo — No aceptable", noAceptables)}
      ${tile("Trabajo repetitivo — Crítico", criticos)}
    </div>`;
}
function renderTmertTable(){
  renderTmertFiltros();
  renderTmertResumen();
  const fArea = document.getElementById("filterTmertArea").value;
  const rows = (CACHE.tmertRegistros||[])
    .filter(r => !fArea || r.areaId===fArea)
    .sort((a,b)=> new Date(b.fechaRegistro||0)-new Date(a.fechaRegistro||0));
  document.getElementById("tmertTable").innerHTML = rows.map(r=>{
    const resIni = tmertResultadoInicial(r.identificacionInicial||{});
    const esRepetitivo = (r.identificacionInicial||{}).repetitivo === "SI";
    const resAcep = esRepetitivo ? tmertResultadoAceptable(r.avanzadaAceptable||{}) : "—";
    const resCrit = esRepetitivo ? tmertResultadoCritica(r.avanzadaCritica||{}) : "—";
    return `<tr>
      <td>${areaName(r.areaId)}</td>
      <td>${r.puesto}</td>
      <td>${tmertPillHtml(resIni.startsWith("Ausencia")?"Ausencia total":"Aplicar avanzada", resIni.startsWith("Ausencia")?"bajo":"medio")}</td>
      <td>${esRepetitivo ? tmertPillHtml(resAcep, resAcep==="Aceptable"?"bajo":"alto") : "—"}</td>
      <td>${esRepetitivo ? tmertPillHtml(resCrit.startsWith("Crítico")?"Crítico":"No crítico", resCrit.startsWith("Crítico")?"critico":"medio") : "—"}</td>
      <td>${fmtDate(r.fechaRegistro)}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-tmert-editar="${r.id}">Editar</button>
        <button class="btn small" data-tmert-pdf="${r.id}">Descargar PDF</button>
        <button class="subtle-btn" data-tmert-eliminar="${r.id}">Eliminar</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td class="empty" colspan="7">Aún no hay puestos de trabajo evaluados con la herramienta TMERT</td></tr>`;
}
document.getElementById("filterTmertArea").addEventListener("change", renderTmertTable);
on(document.getElementById("tmertTable"), "click", async (e) => {
  const editBtn = e.target.closest("button[data-tmert-editar]");
  if(editBtn){ startEditTmert(editBtn.dataset.tmertEditar); return; }
  const delBtn = e.target.closest("button[data-tmert-eliminar]");
  if(delBtn){
    const rec = CACHE.tmertRegistros.find(r=>r.id===delBtn.dataset.tmertEliminar);
    if(!rec) return;
    if(!confirm(`¿Eliminar el registro TMERT del puesto "${rec.puesto}"? Esta acción no se puede deshacer.`)) return;
    await deleteRecord("tmertRegistros", rec.id);
    await loadCache();
    if(tmertEditingId === rec.id) resetTmertForm();
    renderTmertTable();
    return;
  }
  const pdfBtn = e.target.closest("button[data-tmert-pdf]");
  if(pdfBtn){
    const rec = CACHE.tmertRegistros.find(r=>r.id===pdfBtn.dataset.tmertPdf);
    if(rec) descargarTmertPdf(rec);
  }
});

function descargarTmertPdf(rec){
  const JsPDFClass = getJsPDF();
  if(!JsPDFClass){ alert("No se pudo cargar el generador de PDF (revisa tu conexión a internet e intenta de nuevo)."); return; }
  const doc = new JsPDFClass();
  addLogoPdf(doc);
  let y = 16;
  doc.setFontSize(15);
  doc.text("Herramienta TMERT — Identificación y evaluación de riesgo", 14, y); y += 8;
  doc.setFontSize(10);
  doc.text(`Empresa: ${(CACHE.empresa&&CACHE.empresa.razonSocial)||"—"}`, 14, y); y += 6;
  const lineaDatos = datosEmpresaLineaPdf();
  if(lineaDatos){ doc.text(lineaDatos, 14, y); y += 6; }
  y += 2;

  doc.setFontSize(12); doc.text("1. Caracterización del puesto de trabajo", 14, y); y += 4;
  doc.autoTable({ startY:y, head:[["Dato","Detalle"]], body:[
    ["Área", areaName(rec.areaId)],
    ["Puesto de trabajo", rec.puesto || "—"],
    ["Tareas del puesto", rec.tareas || "—"],
    ["Descripción de la tarea", rec.descripcionTarea || "—"],
    ["Horario de funcionamiento", rec.horario || "—"],
    ["Horas extra (día / semana)", `${rec.horasExtraDia ?? "—"} / ${rec.horasExtraSemana ?? "—"}`],
    ["N° trabajadores expuestos (H/M)", `${rec.trabHombres ?? "—"} / ${rec.trabMujeres ?? "—"}`],
    ["Tipo de contrato / remuneración", `${rec.tipoContrato||"—"} / ${rec.tipoRemuneracion||"—"}`],
    ["Duración de la tarea (min)", rec.duracionMin ?? "—"],
    ["Pausas de trabajo", rec.pausas || "—"],
    ["Rotación de tarea", rec.rotacion || "—"],
    ["Equipos y herramientas", rec.equipos || "—"],
    ["Características del ambiente", rec.ambiente || "—"],
    ["Disposición espacial", rec.disposicion || "—"],
    ["Herramientas utilizadas", rec.herramientas || "—"],
  ], styles:{fontSize:8.5}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 8;

  if(y > 230){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("2. Identificación inicial", 14, y); y += 4;
  doc.autoTable({ startY:y, head:[["Factor de riesgo","Respuesta"]],
    body: TMERT_PREGUNTAS_INICIAL.map(p=>[p.label, (rec.identificacionInicial||{})[p.key]||"NO"]),
    styles:{fontSize:8.5}, headStyles:{fillColor:[42,120,214]} });
  y = doc.lastAutoTable.finalY + 6;
  doc.setFontSize(9);
  const resIni = tmertResultadoInicial(rec.identificacionInicial||{});
  doc.text(`Resultado: ${resIni}`, 14, y, {maxWidth:182}); y += 10;

  const esRepetitivo = (rec.identificacionInicial||{}).repetitivo === "SI";
  if(esRepetitivo){
    if(y > 220){ doc.addPage(); y = 16; }
    doc.setFontSize(12); doc.text("3. Identificación avanzada — Trabajo repetitivo de miembros superiores", 14, y, {maxWidth:182}); y += 8;
    doc.setFontSize(10); doc.text("Tabla II — Condición aceptable", 14, y); y += 4;
    doc.autoTable({ startY:y, head:[["Pregunta","Respuesta"]],
      body: TMERT_ACEPTABLE_PREGUNTAS.map(p=>[p.texto, (rec.avanzadaAceptable||{})[p.key]||"SI"]),
      styles:{fontSize:8}, headStyles:{fillColor:[236,131,90]}, columnStyles:{0:{cellWidth:150}} });
    y = doc.lastAutoTable.finalY + 6;
    doc.setFontSize(9);
    doc.text(`Condición aceptable: ${tmertResultadoAceptable(rec.avanzadaAceptable||{})}`, 14, y); y += 10;

    if(y > 190){ doc.addPage(); y = 16; }
    doc.setFontSize(10); doc.text("Tabla VI — Condición crítica", 14, y); y += 4;
    doc.autoTable({ startY:y, head:[["Pregunta","Respuesta"]],
      body: TMERT_CRITICA_PREGUNTAS.map(p=>[p.texto, (rec.avanzadaCritica||{})[p.key]||"NO"]),
      styles:{fontSize:8}, headStyles:{fillColor:[236,131,90]}, columnStyles:{0:{cellWidth:150}} });
    y = doc.lastAutoTable.finalY + 6;
    doc.setFontSize(9);
    doc.text(`Condición crítica: ${tmertResultadoCritica(rec.avanzadaCritica||{})}`, 14, y, {maxWidth:182}); y += 10;
  }

  if(y > 230){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("4. Plan de acción", 14, y); y += 4;
  doc.autoTable({ startY:y, head:[["Dato","Detalle"]], body:[
    ["Medidas de control administrativas", rec.planAdmin || "—"],
    ["Medidas de control de ingeniería", rec.planIngenieria || "—"],
    ["Responsable de aplicación", rec.planResponsable || "—"],
    ["Fecha de aplicación", rec.planFecha ? fmtDate(rec.planFecha) : "—"],
    ["Evidencia", rec.planEvidencia || "—"],
    ["Fecha de registro", rec.fechaRegistro ? fmtDate(rec.fechaRegistro) : "—"],
  ], styles:{fontSize:8.5}, headStyles:{fillColor:[42,120,214]} });

  doc.save(`TMERT_${(rec.puesto||"puesto").replace(/[^a-zA-Z0-9]+/g,"_")}.pdf`);
}

