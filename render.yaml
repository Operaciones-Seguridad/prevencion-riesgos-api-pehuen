/* Registrar la realización de una actividad del programa: permite indicar la
   fecha REAL en que se realizó (no forzosamente hoy) y adjuntar un documento
   probatorio (certificado, lista de asistencia, fotografía, etc.). Reutiliza
   el modal genérico ya usado en Inspecciones. */
let pgModalDocPendiente = null;
function openProgramaModal(id){
  const rec = CACHE.programa.find(p=>p.id===id);
  if(!rec) return;
  pgModalDocPendiente = null;
  openModal(`
    <h3>Registrar realización</h3>
    <div class="kv" style="margin-bottom:10px;">${rec.nombre} · ${PG_TIPO_LABEL[rec.tipo]||rec.tipo} · Área: ${areaName(rec.areaId)} · Responsable: ${rec.responsable||"—"}</div>
    <label>Fecha en que se realizó la actividad</label>
    <input type="date" id="pgModalFecha" value="${rec.fechaRealizada||""}">
    <label>Documento probatorio (certificado, lista de asistencia, foto, etc.)</label>
    <input type="file" id="pgModalDoc" accept="image/*,.pdf,.doc,.docx">
    ${rec.documento? `<div class="kv" style="margin-top:6px;">Documento actual: <a href="${rec.documento}" download="${rec.documentoNombre||'documento'}">${rec.documentoNombre||"Descargar"}</a></div>` : ""}
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" id="pgModalGuardarBtn">Guardar</button>
      ${rec.fechaRealizada? `<button class="btn secondary" id="pgModalQuitarBtn">Quitar registro de realización</button>` : ""}
      <button class="btn secondary" id="pgModalCerrarBtn">Cancelar</button>
    </div>
  `);
  document.getElementById("pgModalDoc").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ pgModalDocPendiente = {data: reader.result, nombre: file.name}; };
    reader.readAsDataURL(file);
  });
  on(document.getElementById("pgModalGuardarBtn"), "click", async () => {
    const fecha = document.getElementById("pgModalFecha").value;
    if(!fecha){ alert("Indique la fecha en que se realizó la actividad."); return; }
    rec.fechaRealizada = fecha;
    if(pgModalDocPendiente){ rec.documento = pgModalDocPendiente.data; rec.documentoNombre = pgModalDocPendiente.nombre; }
    await put("programa", rec);
    await loadCache();
    renderProgramaTable();
    renderProgramaCumplimientoPorResponsable();
    if(typeof renderMisActividadesMensuales === "function") renderMisActividadesMensuales();
    closeModal();
  });
  const quitarBtn = document.getElementById("pgModalQuitarBtn");
  if(quitarBtn) on(quitarBtn, "click", async () => {
    if(!confirm("¿Quitar el registro de realización de esta actividad? Volverá a quedar pendiente/atrasada.")) return;
    rec.fechaRealizada = null; rec.documento = null; rec.documentoNombre = null;
    await put("programa", rec);
    await loadCache();
    renderProgramaTable();
    renderProgramaCumplimientoPorResponsable();
    if(typeof renderMisActividadesMensuales === "function") renderMisActividadesMensuales();
    closeModal();
  });
  document.getElementById("pgModalCerrarBtn").addEventListener("click", closeModal);
}

/* Barras donde cada entrada ya es un porcentaje propio (0-100), a diferencia
   de chartBarsHtml que normaliza el ancho respecto a la suma de todas las
   entradas (útil para conteos, no para tasas de cumplimiento independientes). */
function chartPercentBarsHtml(entries, colorFor){
  return entries.map(([label,pct],i)=>`<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);margin-bottom:4px;">
        <span>${label}</span><span>${pct}%</span>
      </div>
      <div style="background:var(--grid);border-radius:6px;height:14px;overflow:hidden;">
        <div style="width:${pct}%;background:${colorFor(label,i)};height:100%;"></div>
      </div>
    </div>`).join("");
}

/* Estadística de cumplimiento por responsable */
function renderProgramaCumplimientoPorResponsable(){
  const fMes = document.getElementById("filterPgMes").value;
  const fResp = document.getElementById("filterPgResponsable").value;
  const filtrados = CACHE.programa
    .filter(p=> !fMes || (p.fechaProgramada||"").slice(0,7)===fMes)
    .filter(p=> !fResp || (p.responsable||"").trim()===fResp);
  const porResp = new Map();
  filtrados.forEach(p=>{
    const resp = (p.responsable||"").trim() || "(sin responsable asignado)";
    if(!porResp.has(resp)) porResp.set(resp, {programadas:0, realizadas:0});
    const st = porResp.get(resp);
    st.programadas++;
    if(p.fechaRealizada) st.realizadas++;
  });
  const entries = Array.from(porResp.entries()).sort((a,b)=>b[1].programadas-a[1].programadas);
  document.getElementById("chartPgResponsableWrap").innerHTML = entries.length
    ? chartPercentBarsHtml(entries.map(([resp,st])=>[resp, st.programadas? Math.round(st.realizadas/st.programadas*100):0]), (label,i)=> AREA_CHART_PALETTE[i % AREA_CHART_PALETTE.length])
    : '<div class="empty">Sin actividades registradas</div>';
  document.getElementById("statsPgResponsableTable").innerHTML = entries.map(([resp,st])=>{
    const pct = st.programadas? Math.round(st.realizadas/st.programadas*100) : 0;
    return `<tr><td>${resp}</td><td>${st.programadas}</td><td>${st.realizadas}</td><td><span class="pill ${pct>=80?'bajo':pct>=50?'medio':'alto'}">${pct}%</span></td></tr>`;
  }).join("") || `<tr><td class="empty" colspan="4">Sin actividades registradas</td></tr>`;
}

