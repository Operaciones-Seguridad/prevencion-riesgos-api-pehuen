const FUF_ITEMS = [{"seccion": "Sistema de Gestión de Seguridad y Salud en el Trabajo  (SGSST)", "numero": "1", "texto": "La entidad empleadora cuenta con un Sistema de Gestión de Seguridad y Salud en el Trabajo, que contiene como mínimo: a) Una Política de Seguridad y Salud en el Trabajo; b) La estructura organizacional de la entidad empleadora para la gestión preventiva de los riesgos laborales; c) El diagnóstico, la planificación y programación de la actividad preventiva; d) La evaluación o auditoría periódica del desempeño del Sistema de SST; e) La acción en promoción de mejoras continuas o correctivas", "articulo": "22, inc. 1, 64, inc. 1"}, {"seccion": "Identificación de Peligros y Evaluación de Riesgos", "numero": "2", "texto": "¿Cuenta con Matriz de Identificación de Peligros y Evaluación de los Riesgos laborales (En adelante MIPER) que incorpore todos los procesos, tareas y puestos de trabajo?", "articulo": "7, inc. 1"}, {"seccion": "Identificación de Peligros y Evaluación de Riesgos", "numero": "3", "texto": "¿La MIPER considera la exposición a todos los agentes y factores de riesgos existentes en el lugar de trabajo (tales como los riesgos ergonómicos, psicosociales, la violencia y el acoso en el trabajo, los accidentes del trabajo y enfermedades profesionales que se hayan producido, a los riesgos asociados a los programas de vigilancia ocupacional, con enfoque de género)", "articulo": "7, inc. 2"}, {"seccion": "Identificación de Peligros y Evaluación de Riesgos", "numero": "4", "texto": "¿La MIPER se encuentra disponible en los lugares de trabajo y ha sido informada a las personas trabajadoras, comité paritario, delegado de Seguridad y Salud en el Trabajo, los dirigentes sindicales y a toda la línea de mando?", "articulo": "7, inc. 9"}, {"seccion": "Identificación de Peligros y Evaluación de Riesgos", "numero": "5", "texto": "La MIPER contiene los siguientes elementos mínimos, y éstos se ajustan a los requisitos normativos y técnicos en la materia a) La identificación de los peligros del puesto de trabajo; b) La evaluación de los riesgos; c) Magnitud o el nivel de riesgo, y d) Medidas preventivas de control y de emergencias adicionales.", "articulo": "7, inc. 3"}, {"seccion": "Identificación de Peligros y Evaluación de Riesgos", "numero": "6", "texto": "¿La MIPER tiene fecha de elaboración y es revisada al menos anualmente o cuando cambien las condiciones de trabajo, ocurra un accidente del trabajo, se diagnostique una enfermedad profesional o se genere una situación de riesgo grave e inminente?", "articulo": "7, inc. 9 64, inc. 2"}, {"seccion": "Identificación de Peligros y Evaluación de Riesgos", "numero": "7", "texto": "¿La entidad empleadora de hasta 25 personas trabajadoras, identifica y evalúa sus condiciones ambientales, psicosociales y ergonómicas y el cumplimiento normativo, con el instrumento de autoevaluación del Organismo Administrador del Seguro de la Ley 16.744?", "articulo": "64, inc. 1"}, {"seccion": "Identificación de Peligros y Evaluación de Riesgos", "numero": "8", "texto": "El procedimiento de evaluación de los riesgos laborales a que se refiere el DS 44 /2024, se regirá por la “Guía Técnica para la Identificación y Evaluación primaria de Riesgos en los Ambientes de Trabajo”, del Instituto de Salud Pública (ISP)", "articulo": ""}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "9", "texto": "¿La entidad empleadora cuenta con el programa de trabajo preventivo confeccionado, o actualizado, a partir de la MIPER, en un plazo de 30 días corridos desde la confección o actualización de la MIPER?", "articulo": "8, inc. 1"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "10", "texto": "¿El programa de trabajo preventivo se encuentra por escrito y aprobado por el representante legal?", "articulo": "8, inc. 1"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "11", "texto": "El programa de trabajo preventivo contiene: a) Las medidas preventivas y correctivas a implementar de acuerdo con lo señalado en la MIPER; b) Los plazos de implementación; c) Los responsables de implementación; d) Las actividades de promoción para prevenir los factores de riesgos asociados al consumo de alcohol y drogas en los lugares de trabajo; e) Difusión de un estilo de vida y alimentación saludables. f) Actividades para prevenir factores de riesgos asociados a la conducción de vehículos motorizados cuando corresponda. g) Fechas de modificaciones y aprobación", "articulo": "8, inc. 1, 2 y 3"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "12", "texto": "¿El programa de trabajo preventivo ha sido difundido en los lugares de trabajo a las personas trabajadoras y remitido un ejemplar al Comité Paritario?", "articulo": "8, inc. 3"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "13", "texto": "En relación con el uso de máquinas, equipos y elementos de trabajo: a) ¿Se Informa convenientemente acerca de sus riesgos y de su manejo adecuado y seguro? b) ¿Informa sobre el contenido sustancial de los manuales (cuando existan), instrucciones y fichas técnicas de las máquinas, equipos y elementos de trabajo? c) ¿Cuenta con procedimiento de trabajo seguro? d) ¿Informa y capacita sobre la forma de uso correcto y seguro de las maquinarias?", "articulo": "10, inc. 1 y 2"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "14", "texto": "¿Se adoptan medidas de prevención de los riesgos laborales, según la prelación de medidas, que privilegien el uso de mecanismos o equipos de protección colectiva de las personas trabajadoras por sobre el uso de elementos de protección personal (En adelante EPP)?", "articulo": "12"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "15", "texto": "Ante el riesgo residual ¿Se proporciona a las personas trabajadoras, libres de costo los EPP?", "articulo": "13, inc. 1"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "16", "texto": "¿Los EPP son adecuados al riesgo a cubrir?", "articulo": "13, inc. 1"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "17", "texto": "¿Los EPP cumplen con las normas vigentes de certificación de calidad o encontrarse registrados en el Instituto de Salud Pública de Chile (ISP)?", "articulo": "13, inc. 2"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "18", "texto": "¿Cuenta con un procedimiento que considere la utilización, mantenimiento, reposicion o recambio de los EPP?", "articulo": "13, inc. 2"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "19", "texto": "¿Las personas trabajadoras se encuentran capacitadas sobre el uso y mantención de los EPP? Nota: Curso de duración mínima de 1 hora, en el que se considere las partes que componen el elemento de protección personal a utilizar, su colocación, limitaciones de uso, limpieza, almacenamiento y prueba de chequeo diario.", "articulo": "13, inc. 3"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "20", "texto": "¿Cuenta con registro de las actividades de capacitación en EPP? Nota: El registro debe considerar como mínimo: a) Actividades teóricas y prácticas b) Asistentes c) Relatores d) Resultados de las evaluaciones de aprendizaje e) Actividades de reforzamiento", "articulo": "13, inc. 4"}, {"seccion": "Programa de Trabajo  en Prevención de Riesgos Laborales", "numero": "21", "texto": "¿Se realiza, al menos anualmente, una evaluación del cumplimiento del programa de trabajo preventivo, especialmente la eficacia de las acciones programadas y se disponen las medidas de mejora continua?", "articulo": "14, 52"}, {"seccion": "Información y formación en Seguridad y Salud en el Trabajo", "numero": "22", "texto": "Se informa los riesgos que entrañan sus labores, las medidas preventivas y los métodos o procedimientos de trabajo correctos, determinados conforme a la matriz de riesgos y el programa de trabajo preventivo, a las personas trabajadoras, de forma: a) Oportuna y adecuada b) Previa al inicio de las labores y cada vez que exista un nuevo proceso productivo, cambien las tecnologías, los materiales o sustancias utilizados", "articulo": "15, inc. 1"}, {"seccion": "Información y formación en Seguridad y Salud en el Trabajo", "numero": "23", "texto": "La información de los riesgos laborales entregada a las personas trabajadoras considera a lo menos: a) Las características mínimas que debe reunir el lugar de trabajo en el que se ejecutarán las labores. b) Los riesgos a los que podrían estar expuestas y las respectivas medidas preventivas, incluidos los derivados de emergencias, catástrofes y desastres. c) Los procedimientos de trabajo seguro. d) Las características de los productos y sustancias que se manipularán. e) Los riesgos derivados de emergencias, catástrofes o desastres, considerados en el Plan de gestión, reducción y respuesta, los mecanismos de actuación frente a ellas y el procedimiento de evacuación y traslado de las personas afectadas", "articulo": "15, inc. 3 19, inc. 1"}, {"seccion": "Información y formación en Seguridad y Salud en el Trabajo", "numero": "24", "texto": "Se efectuó capacitación teórica o práctica en prevención de riesgos laborales a las personas trabajadoras, y esta: a) Fue realizada en las oportunidades y con la periodicidad definida en el programa de trabajo preventivo, que no podrá exceder de dos años; b) Contiene las principales medidas de seguridad y salud; que deben tenerse presente para desempeñar las labores c) Considera un enfoque de género; d) Tiene una duración de al menos 8 horas, preferentemente dentro de la jornada; e) Considera metodologías que procuren un adecuado aprendizaje", "articulo": "16, inc. 1"}, {"seccion": "Información y formación en Seguridad y Salud en el Trabajo", "numero": "25", "texto": "La capacitación (teórica o práctica) aborda los siguientes temas: a) Factores de riesgos presentes en el lugar en el que deban ejecutarse las labores b) Efectos en la salud por la exposición a factores de riesgos, causantes de enfermedades profesionales; c) Medidas preventivas para el control de los riesgos identificados y evaluados o inherentes a las tareas encomendadas d) Prestaciones médicas y económicas a las que tiene derecho la persona trabajadora e) EL establecimiento asistencial del respectivo organismo administrador, al que deberán concurrir en caso de accidente del trabajo o enfermedad profesional f) Plan de gestión de riesgos de emergencia, catástrofe o desastre de la entidad empleadora g) Señalética en los lugares de trabajo, y h) Prevención de riesgos de incendio", "articulo": "16, inc. 1"}, {"seccion": "Consulta y participación", "numero": "26", "texto": "¿Se promueve la consulta y participación de los representantes de las personas trabajadoras, en la gestión preventiva? Notas: - Se Consulta al Comité Paritario de Higiene y Seguridad, cuando ante los cambios en los procesos de trabajo. - La entidad empleadora deberá promover la participación de las personas trabajadoras y sus representantes, sea directamente o a través del Comité Paritario y el Departamento de Prevención de Riesgos Profesionales, en la investigación las causas de accidentes del trabajo o se diagnostique una enfermedad profesional.", "articulo": "17, inc. 1 37, inc. 2, numeral 4 71, inc. .1"}, {"seccion": "Riesgo Grave e Inminente y Plan de Gestión para  la Reducción de Riesgos de Emergencias, Catástrofes o Desastres", "numero": "27", "texto": "La entidad empleadora ante un riesgo grave e inminente realizó lo siguiente: a) Informar inmediatamente a todas las personas trabajadoras afectadas sobre la existencia del mencionado riesgo, así como las medidas adoptadas para eliminarlo o atenuarlo. b) Adoptar medidas para la suspensión inmediata de las faenas afectadas y su evacuación, en caso de que el riesgo no se pueda eliminar o atenuar", "articulo": "18, inc. 1"}, {"seccion": "Riesgo Grave e Inminente y Plan de Gestión para  la Reducción de Riesgos de Emergencias, Catástrofes o Desastres", "numero": "28", "texto": "¿Se cuenta con uno o más planes de gestión, reducción y respuesta de los riesgos en caso de emergencias, catástrofe o desastres u otros eventos o incidentes conocidos, probables y previsibles de naturaleza interna o externa a la empresa?", "articulo": "19, inc. 1"}, {"seccion": "Riesgo Grave e Inminente y Plan de Gestión para  la Reducción de Riesgos de Emergencias, Catástrofes o Desastres", "numero": "29", "texto": "¿Se realiza a lo menos una vez al año pruebas de ensayo del o los planes de gestión, reducción y respuesta frente a los riesgos de emergencias, catástrofe o desastres u otros eventos o incidentes conocidos?", "articulo": "19, inc. 1"}, {"seccion": "Coordinación y Cooperación de la Actividad Preventiva de Entidades Empleadoras", "numero": "30", "texto": "¿Existe coordinación, cooperación e información mutua, en el lugar de trabajo, cuando presten servicios más de una entidad empleadora, o al menos una entidad empleadora y una o más personas trabajadoras independientes, para la adecuada aplicación de las medidas de seguridad y salud que sean exigibles para la protección de las personas trabajadoras que presten servicios en dicho lugar?", "articulo": "20, inc. 1"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "31", "texto": "¿Se encuentra constituido el Comité Paritario de Higiene y Seguridad en la empresa, faena, sucursal o agencia en que trabajen más de 25 personas?", "articulo": "23, inc. 1"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "32", "texto": "¿Se toman las medidas para que los integrantes electos del Comité Paritario de Higiene y Seguridad que no cuenten con el curso de orientación de prevención de riesgos lo realicen durante el primer semestre de su mandato?", "articulo": "32, inc. 1"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "33", "texto": "¿Se registró el acta de constitución del Comité Paritario en el sitio web de la Dirección el Trabajo, y esto fue realizado dentro de los 15 días hábiles siguientes a la fecha de la elección de representantes de las personas trabajadoras?", "articulo": "36"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "34", "texto": "¿La entidad empleadora otorga las facilidades y adopta las medidas necesarias para que funcione adecuadamente el o los Comités Paritarios de Higiene y Seguridad?", "articulo": "37"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "35", "texto": "El Comité Paritario de Higiene y Seguridad efectúa reuniones mensuales en forma ordinaria, y en forma extraordinaria en los siguientes casos: a) A petición conjunta de miembros del Comité b) Cuando ocurra un accidente del trabajo fatal o grave c) Cuando exista riesgo grave e inminente", "articulo": "39, inc. 1 y 2"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "36", "texto": "¿Se cuenta con actas de las reuniones efectuada por el Comité Paritario de Higiene y Seguridad, donde se consigne como mínimo: las materias tratadas, los acuerdos, y en caso de adoptarse medidas preventivas, ¿y el plazo cumplimiento?", "articulo": "39, inc. 4 42, inc. 1"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "37", "texto": "¿Los acuerdos del Comité Paritario de Higiene y Seguridad se le comunican por escrito a la entidad empleadora?", "articulo": "42, inc. 2"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "38", "texto": "¿Se proporciona toda la documentación de prevención de riesgos laborales de la respectiva entidad empleadora, faena, sucursal o agencia, al Comité Paritario de Higiene y Seguridad, para cumplir su rol en la gestión de la Seguridad y Salud en el Trabajo?.", "articulo": "46, inc. 3"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "39", "texto": "¿El Comité Paritario de Higiene y Seguridad cumple con las funciones mínimas? Las funciones mínimas son: a) Asesorar e instruir a las personas trabajadoras para la correcta utilización de los instrumentos de protección. b) Vigilar el cumplimiento de las medidas de prevención o de seguridad y salud en el trabajo. c) Investigar las causas de los accidentes del trabajo y enfermedades profesionales que se produzcan en la entidad empleadora. d) Decidir si el accidente del trabajo o la enfermedad profesional cuyas causas hubiere investigado previamente, se debió a negligencia inexcusable de la persona trabajadora. e) Indicar la adopción de todas las medidas de seguridad y salud que sirvan para la prevención de los riesgos laborales; f) Promover la realización de cursos destinados a la capacitación profesional de las personas trabajadoras. g) Informar a la entidad empleadora, cuando detectare que en el lugar de trabajo hubiese sobrevenido un riesgo grave e inminente para la vida o salud de las personas trabajadoras. h) Cumplir las demás funciones o misiones que le encomiende el Organismo Administrador del Seguro de la Ley 16744.", "articulo": "47"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "40", "texto": "En todo lugar de trabajo o faena, donde laboren entre 10 y hasta 25 personas trabajadoras, ¿cuenta con Delegado de Seguridad y Salud en el Trabajo, que participe en la implementación del Sistema de Gestión para empresas de menor tamaño y demás intervenciones legales asignadas?", "articulo": "66, inc. 1 64 37"}, {"seccion": "Comités Paritarios de Higiene y Seguridad", "numero": "41", "texto": "¿El Delegado de Seguridad y Salud en el Trabajo, es elegido cada 2 años, mediante realización de asamblea de las personas trabajadoras de la faena o lugar de trabajo, dejando acta de esta?", "articulo": "66, inc. 2"}, {"seccion": "Departamentos de Prevención de Riesgos", "numero": "42", "texto": "¿Cuenta con Departamento de Prevención de Riesgos, si la entidad empleadora tiene más de 100 personas trabajadoras, dirigido por un experto, inscrito en los registros de la Seremi de Salud?", "articulo": "50 55, inc. 2"}, {"seccion": "Departamentos de Prevención de Riesgos", "numero": "43", "texto": "¿Se proporciona al Departamento de Prevención de Riesgos todos los medios y el personal necesario para dar cumplimiento a las funciones y las actividades programadas?", "articulo": "51, inc. 1"}, {"seccion": "Departamentos de Prevención de Riesgos", "numero": "44", "texto": "¿El Departamento de Prevención de Riesgos cumple con sus funciones?", "articulo": "52"}, {"seccion": "Departamentos de Prevención de Riesgos", "numero": "45", "texto": "¿La categoría y tiempo de dedicación mínima del encargado del Departamento de Prevención de Riesgos es determinada en base al número de personas trabajadoras y cotización genérica?", "articulo": "54 55, inc. 1"}, {"seccion": "Departamentos de Prevención de Riesgos", "numero": "46", "texto": "¿El encargado del Departamento de Prevención de Riesgos registra asistencia, dando cumplimiento al tiempo de atención definido conforme la norma, según el número de personas trabajadoras y cotización genérica?", "articulo": "55, inc. 1 y 3"}, {"seccion": "Departamentos de Prevención de Riesgos", "numero": "47", "texto": "El Departamento de Prevención de Riesgos mantiene: a) Registro de Incidentes o sucesos peligrosos; b) Registros de todos los accidentes del trabajo, trayecto y de enfermedades profesionales; c) Registro de personas trabajadoras en vigilancia de la salud; d) Estadísticas (tasas) de seguridad y salud. - Tasa de accidentabilidad - Tasa mensual de frecuencia - Tasa semestral de gravedad y, (Se incluirán en las tasas de frecuencia y de gravedad, los lesionados cuya ausencia al trabajo haya sido igual o superior a una jornada laboral). e) Los registros se encuentran diferenciados por sexo (perspectiva de género). Notas: 