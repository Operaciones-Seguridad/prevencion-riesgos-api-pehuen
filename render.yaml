/* Cruce inverso: peligros de la matriz cuya medida de control ya llegó a
   EPP (jerarquía E) pero que todavía no tienen ningún cargo/puesto cubierto
   por un estudio de necesidad de EPP para esa misma área+peligro. Ayuda a
   detectar vacíos entre la matriz de riesgos y el estudio de EPP. */
function renderEppEstudioCobertura(){
  const cubiertos = new Set(CACHE.estudioEpp.map(r=>`${r.areaId}||${(r.peligro||"").trim()}`));
  const faltantes = new Map();
  CACHE.matriz.forEach(m=>{
    if(!soloEppAlgunaMedida(m)) return;
    const key = `${m.areaId||""}||${(m.peligro||"").trim()}`;
    if(cubiertos.has(key)) return;
    if(!faltantes.has(key)) faltantes.set(key, {areaId:m.areaId, peligro:m.peligro, riesgo:m.riesgo, count:0});
    faltantes.get(key).count++;
  });
  const lista = Array.from(faltantes.values()).sort((a,b)=> areaName(a.areaId).localeCompare(areaName(b.areaId)));
  document.getElementById("eppEstudioCoberturaWrap").innerHTML = lista.length
    ? `<div class="desc" style="margin-bottom:8px;"><strong>${lista.length} peligro(s)</strong> de la matriz de riesgos tienen una medida de control tipo EPP pero todavía no tienen ningún cargo/puesto cubierto en este estudio:</div>
       <table><thead><tr><th>Área</th><th>Peligro</th><th>Riesgo</th><th>Línea(s) de la matriz</th></tr></thead><tbody>${
         lista.map(f=>`<tr><td>${areaName(f.areaId)}</td><td>${f.peligro}</td><td>${f.riesgo||"—"}</td><td>${f.count}</td></tr>`).join("")
       }</tbody></table>`
    : '<div class="empty">Todos los peligros con medida de control tipo EPP en la matriz tienen al menos un cargo/puesto cubierto en el estudio.</div>';
}
/* Igual que soloEpp(), pero considera que BASTA con que exista AL MENOS una
   medida tipo E entre las de la línea (no que todas lo sean), ya que aquí
   interesa detectar cualquier peligro que ya dependa de algún EPP. */
function soloEppAlgunaMedida(m){
  const items = jerarquiaDe(m);
  return items.some(it=>it.jerarquia==="E");
}

/* =========================================================
   MAPA DE RIESGOS POR ÁREA / PROCESO
   Resumen visual (tipo semáforo) del nivel de riesgo más alto
   presente en cada área, desglosado por proceso cuando un área
   agrupa más de uno, con sus peligros más relevantes. No es un
   plano físico de las instalaciones — es un mapa por área/proceso,
   que fue lo que se definió con el usuario.
   ========================================================= */
const NIVEL_ORDEN_VALOR = {bajo:1, medio:2, alto:3, critico:4};
function nivelMasAlto(rows){
  return rows.map(m=>nivelRiesgo(m.probabilidad,m.consecuencia))
    .reduce((max,n)=> NIVEL_ORDEN_VALOR[n]>NIVEL_ORDEN_VALOR[max]? n : max, "bajo");
}
function topPeligrosDe(rows, n=4){
  const map = new Map();
  rows.forEach(m=>{
    const k = m.peligro || "(sin peligro)";
    if(!map.has(k)) map.set(k, {nombre:k, count:0, maxPC:0});
    const it = map.get(k);
    it.count++;
    it.maxPC = Math.max(it.maxPC, m.probabilidad*m.consecuencia);
  });
  return Array.from(map.values()).sort((a,b)=> b.maxPC-a.maxPC || b.count-a.count).slice(0,n);
}
function mapaTileHtml(nombre, rows){
  if(!rows.length){
    return `<div class="tile" style="border-top:4px solid var(--grid);">
      <div class="label">${nombre}</div>
      <div style="color:var(--muted);font-size:14px;margin-top:6px;">Sin líneas registradas en la matriz</div>
    </div>`;
  }
  const counts = {bajo:0, medio:0, alto:0, critico:0};
  rows.forEach(m=> counts[nivelRiesgo(m.probabilidad,m.consecuencia)]++);
  const nMax = nivelMasAlto(rows);
  const color = NIVEL_CHART_COLORS[nMax];
  const procesos = new Map();
  rows.forEach(m=>{
    const p = m.proceso || "(sin proceso)";
    if(!procesos.has(p)) procesos.set(p, []);
    procesos.get(p).push(m);
  });
  const procesosHtml = procesos.size>1 ? `<div style="margin-top:10px;border-top:1px solid var(--grid);padding-top:8px;">
      <div class="kv" style="font-weight:600;margin-bottom:4px;">Por proceso:</div>
      ${Array.from(procesos.entries()).map(([p, prows])=>{
        const pn = nivelMasAlto(prows);
        return `<div class="kv">${p}: <span class="pill ${pn}">${nivelLabel(pn)}</span> (${prows.length})</div>`;
      }).join("")}
    </div>` : "";
  return `<div class="tile" style="border-top:4px solid ${color};">
    <div class="label">${nombre}</div>
    <div class="value" style="color:${color};font-size:22px;">${nivelLabel(nMax)}</div>
    <div class="foot">Nivel más alto presente · ${rows.length} línea(s)</div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
      <span class="pill bajo">${counts.bajo} bajo</span>
      <span class="pill medio">${counts.medio} medio</span>
      <span class="pill alto">${counts.alto} alto</span>
      <span class="pill critico">${counts.critico} crítico</span>
    </div>
    <div style="margin-top:10px;">
      <div class="kv" style="font-weight:600;margin-bottom:4px;">Principales peligros:</div>
      ${topPeligrosDe(rows).map(p=>`<div class="kv">• ${p.nombre} (${p.count})</div>`).join("")}
    </div>
    ${procesosHtml}
  </div>`;
}
function mapaRiesgosPorArea(){
  const porArea = new Map();
  CACHE.matriz.forEach(m=>{
    const key = m.areaId || "";
    if(!porArea.has(key)) porArea.set(key, []);
    porArea.get(key).push(m);
  });
  const areasOrdenadas = CACHE.areas.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const idsConocidos = new Set(areasOrdenadas.map(a=>a.id));
  const bloques = areasOrdenadas.map(a=>({nombre:a.nombre, rows: porArea.get(a.id)||[]}));
  Array.from(porArea.keys()).filter(id=>id && !idsConocidos.has(id)).forEach(id=>{
    bloques.push({nombre:"(área eliminada — líneas sin área asignada)", rows: porArea.get(id)});
  });
  if(porArea.has("")) bloques.push({nombre:"(sin área asignada)", rows: porArea.get("")});
  return bloques;
}
