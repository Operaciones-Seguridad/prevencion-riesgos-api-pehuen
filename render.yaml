    body: comite.length ? comite.map(m=>[m.nombre, m.cargo||"—", GRD_ROL_LABEL[m.rol]||m.rol, m.vigenciaHasta?fmtDate(m.vigenciaHasta):"Indefinida"]) : [["Sin miembros registrados","","",""]],
    styles:{fontSize:8.5}, headStyles:{fillColor:[236,131,90]} });
  y = doc.lastAutoTable.finalY + 8;

  if(y > 220){ doc.addPage(); y = 16; }
  doc.setFontSize(12); doc.text("Etapa 2 — Planes de respuesta ACCEDER", 14, y); y += 4;
  const planes = CACHE.grdPlanRespuesta||[];
  doc.autoTable({ startY:y, head:[["Amenaza","Pasos ACCEDER completos"]],
    body: planes.length ? planes.map(p=>{ const a = amenazas.find(x=>x.id===p.amenazaId); return [a?grdAmenazaNombre(a):"(amenaza eliminada)", grdPlanRespuestaPasosCompletos(p)+" / "+GRD_ACCEDER_CAMPOS.length]; }) : [["Sin planes de respuesta registrados",""]],
    styles:{fontSize:8.5}, headStyles:{fillColor:[236,131,90]} });
