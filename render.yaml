/* =========================================================
   MAPA DE RIESGOS — PLANO DE PLANTA Y SIMBOLOGÍA
   Reemplaza al mapa de calor P×C (v1.19) a pedido del usuario.
   Muestra un ícono por cada categoría de peligro presente en
   cada área (coloreado según el nivel de riesgo más alto de esa
   categoría en esa área), agrupados por área. Si el usuario sube
   una imagen del plano real de las instalaciones, las marcas de
   área se pueden arrastrar hasta su ubicación real; si no hay
   plano subido, se muestra un esquema de cajas por área.
   ========================================================= */
const CATEGORIA_ICONOS = {
  "Mecánico": "⚙️",
  "Ergonómico": "🧍",
  "Emergencias": "🔥",
  "Físico": "🔊",
  "Eléctrico": "⚡",
  "Psicosociales": "🧠",
  "Químico": "🧪",
  "Biológico": "🦠",
  "Locativo": "🏗️",
};
function iconoCategoria(cat){ return CATEGORIA_ICONOS[cat] || "⚠️"; }
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   LECTURA AUTOMÁTICA DE NOMBRES DESDE UN DOCUMENTO DE RESPALDO
   (actas de capacitación, listas de asistencia, difusión de IAP)
   Intenta extraer el TEXTO del documento subido (funciona bien con
   PDF generados digitalmente o archivos .txt/.csv con los nombres
   escritos; NO reconoce nombres manuscritos en actas escaneadas,
   ya que eso requeriría reconocimiento de escritura a mano, no
   disponible en esta app sin conexión a un servicio externo).
   Si logra extraer texto, compara cada trabajador de la lista
   candidata contra ese texto (nombre normalizado, sin tildes) y
   entrega quiénes calzan, para marcarlos automáticamente — el
   usuario siempre puede revisar y ajustar la marca manualmente.
   ========================================================= */
async function extraerTextoDeArchivo(file){
  const nombreLower = (file.name||"").toLowerCase();
  if(file.type==="text/plain" || file.type==="text/csv" || nombreLower.endsWith(".txt") || nombreLower.endsWith(".csv")){
    return await file.text();
  }
  if(file.type==="application/pdf" || nombreLower.endsWith(".pdf")){
    if(typeof pdfjsLib === "undefined") throw new Error("pdfjs-no-disponible");
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
    let texto = "";
    for(let i=1; i<=pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      texto += content.items.map(it=>it.str).join(" ") + "\n";
    }
    return texto;
  }
  return ""; // imágenes, .doc/.docx: no se intenta extraer texto
}
function normalizarNombreTexto(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
}
function nombreCoincideEnTexto(nombreCompleto, textoNormalizado){
  const partes = normalizarNombreTexto(nombreCompleto).split(" ").filter(p=>p.length>2);
  if(!partes.length) return false;
  const requeridas = Math.min(2, partes.length);
  const encontradas = partes.filter(p=>textoNormalizado.includes(p)).length;
  return encontradas >= requeridas;
}
/* Devuelve {ok:boolean, motivo, coincidencias:[trabajador,...]}. ok=false
   cuando no se pudo extraer texto útil (imagen/escaneo manuscrito,
   .doc/.docx, o pdf.js no cargó por falta de conexión). */
async function intentarDetectarNombresEnArchivo(file, trabajadoresCandidatos){
  let texto = "";
  try{
    texto = await extraerTextoDeArchivo(file);
  }catch(e){
    return {ok:false, motivo:"No se pudo leer el documento (revise su conexión a internet, ya que la lectura de PDF requiere una librería externa).", coincidencias:[]};
  }
  if(!texto || texto.trim().length < 8){
    return {ok:false, motivo:"No se encontró texto legible en el documento (es una imagen o un acta manuscrita/escaneada). Marque la asistencia manualmente; el documento igualmente quedó guardado como respaldo.", coincidencias:[]};
  }
  const textoNorm = normalizarNombreTexto(texto);
  const coincidencias = trabajadoresCandidatos.filter(t=>nombreCoincideEnTexto(t.nombre, textoNorm));
  return {ok:true, motivo:null, coincidencias};
}
function planoConfigActual(){
  const rec = (CACHE.planoRiesgos && CACHE.planoRiesgos[0]);
  return rec ? {...rec, marcas: rec.marcas||{}} : {id:"config", imagen:null, marcas:{}};
}
async function savePlanoConfig(rec){
  rec.id = "config";
  await put("planoRiesgos", rec);
  await loadCache();
}
function categoriasDeFilas(rows){
  const map = new Map();
  rows.forEach(m=>{
    const cat = m.categoria || "Sin categoría";
    const nivel = nivelRiesgo(m.probabilidad, m.consecuencia);
    if(!map.has(cat)) map.set(cat, {categoria:cat, nivel, count:0});
    const it = map.get(cat);
    it.count++;
    if(NIVEL_ORDEN_VALOR[nivel] > NIVEL_ORDEN_VALOR[it.nivel]) it.nivel = nivel;
  });
  return Array.from(map.values()).sort((a,b)=> NIVEL_ORDEN_VALOR[b.nivel]-NIVEL_ORDEN_VALOR[a.nivel]);
}
function planoIconosHtml(rows, size){
  const s = size || 34;
  const cats = categoriasDeFilas(rows);
  if(!cats.length) return `<div style="color:#999;font-size:12.5px;">Sin líneas registradas</div>`;
  return cats.map(c=>{
    const color = NIVEL_CHART_COLORS[c.nivel];
    return `<span title="${c.categoria} — ${nivelLabel(c.nivel)} (${c.count} línea(s))" style="display:inline-flex;align-items:center;justify-content:center;width:${s}px;height:${s}px;border-radius:50%;background:${color};font-size:${Math.round(s*0.52)}px;margin:3px;border:2px solid #fff;box-shadow:0 0 0 1px ${color};">${iconoCategoria(c.categoria)}</span>`;
  }).join("");
}
