  <!-- EMERGENCIA (v1.61) -->
  <div class="view" id="view-emergencia">
    <div class="card">
      <div class="card-header-row" id="hdrGrdResumen"><h2>Gestión del Riesgo de Desastres (GRD) — Resumen</h2><button class="collapse-toggle" id="toggleGrdResumen" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyGrdResumen">
      <div class="desc">Módulo basado en la metodología de <strong>Gestión del Riesgo de Desastres (GRD)</strong> de Mutual de Seguridad (ficha "Plan de Gestión del Riesgo frente a Emergencias y Desastres") y la Guía para la Implementación del Plan para la Reducción del Riesgo de Desastres (PRRD) de la Superintendencia de Seguridad Social, con base legal en el Código del Trabajo (art. 184, 184 bis) y el DS N°44/2024. Se organiza en 3 etapas: <strong>Etapa 1 — Diagnóstico</strong> (metodología AIDEP: Análisis histórico, Investigación de amenazas, Definición de prioridades, Elaboración de mapas, Planificación), <strong>Etapa 2 — Planificación de la respuesta</strong> (metodología ACCEDER: Alerta/alarma, Comunicación, Coordinación, Evaluación preliminar, Decisiones, Evaluación secundaria, Readecuación), y <strong>Etapa 3 — Implementación, ejercitación y mejora continua</strong> (simulacros y simulaciones, con revisión semestral).</div>
      <div class="grid-tiles" id="grdResumenTiles"></div>
      <div style="margin-top:14px;"><button class="btn secondary" id="grdDescargarPdfBtn">Descargar PDF del estado GRD</button></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header-row" id="hdrGrdAmenazas"><h2 id="grdAmenazaFormTitle">Etapa 1 — Diagnóstico AIDEP: amenazas y vulnerabilidad</h2><button class="collapse-toggle" id="toggleGrdAmenazas" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyGrdAmenazas">
      <div class="desc">Toda empresa debe diagnosticar, como mínimo, las 5 amenazas obligatorias (Sismo, Corte de agua potable, Incendio estructural, Corte de energía eléctrica, Asalto/robo), y puede agregar otras según su exposición (ej.: caída de material en altura para montaje de líneas eléctricas, contacto con energía eléctrica, tormentas). Para cada una se registra si está identificada en este centro de trabajo, su análisis histórico, vulnerabilidad, recursos básicos disponibles y medidas de control ya implementadas.</div>
      <div class="form-grid">
        <div><label>Amenaza</label>
          <select id="grdAmenazaTipo">
            <option value="sismo">Sismo</option>
            <option value="corteAgua">Corte de agua potable</option>
            <option value="incendio">Incendio estructural</option>
            <option value="corteElectrico">Corte de energía eléctrica</option>
            <option value="asaltoRobo">Asalto / robo</option>
            <option value="otra">Otra amenaza</option>
          </select>
        </div>
        <div id="grdAmenazaOtroWrap" style="display:none;"><label>Nombre de la otra amenaza</label><input id="grdAmenazaOtro" placeholder="Ej: Caída de material en altura"></div>
        <div><label>Prioridad</label>
          <select id="grdAmenazaPrioridad">
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:22px;"><input type="checkbox" id="grdAmenazaPresente" style="width:auto;" checked><label style="margin:0;">Identificada en este centro de trabajo</label></div>
      </div>
      <label>Análisis histórico (A)</label>
      <textarea id="grdAmenazaHistorico" placeholder="Emergencias o desastres anteriores que afectaron o podrían afectar este centro de trabajo o su entorno"></textarea>
      <label>Vulnerabilidad (D)</label>
      <textarea id="grdAmenazaVulnerabilidad" placeholder="Condiciones que hacen a la empresa/trabajadores susceptibles de sufrir daño ante esta amenaza"></textarea>
      <label>Recursos básicos disponibles</label>
      <textarea id="grdAmenazaRecursos" placeholder="Ej: detección/extinción de incendios, luces de emergencia, señalética, vías de evacuación, generador de respaldo"></textarea>
      <label>Medidas de control / prevención implementadas</label>
      <textarea id="grdAmenazaMedidas" placeholder="Medidas ya implementadas para reducir el riesgo ante esta amenaza"></textarea>
      <div class="toolbar" style="margin-top:10px;">
        <button class="btn" id="saveGrdAmenazaBtn">Guardar amenaza</button>
        <button class="btn secondary" id="cancelEditGrdAmenazaBtn" style="display:none;">Cancelar edición</button>
      </div>
      <h2 style="margin-top:22px;">Amenazas diagnosticadas</h2>
      <table>
        <thead><tr><th>Amenaza</th><th>Identificada</th><th>Prioridad</th><th>Diagnóstico</th><th>Acciones</th></tr></thead>
        <tbody id="grdAmenazasTable"></tbody>
      </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header-row" id="hdrGrdComite"><h2 id="grdComiteFormTitle">Comité de Gestión del Riesgo de Desastres (CGRD)</h2><button class="collapse-toggle" id="toggleGrdComite" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyGrdComite">
      <div class="desc">La alta administración debe designar un Coordinador del Plan con atribuciones para tomar decisiones operativas, y conformar un comité con representantes de la empresa, de los trabajadores y, cuando corresponda, enlaces con organismos externos (bomberos, salud, seguridad, municipio).</div>
      <div class="form-grid">
        <div><label>Nombre</label><input id="grdComiteNombre"></div>
        <div><label>Cargo</label><input id="grdComiteCargo" placeholder="Ej: Jefe de Obra, Prevencionista..."></div>
        <div><label>Rol en el Comité</label>
          <select id="grdComiteRol">
            <option value="coordinador">Coordinador del Plan</option>
            <option value="enlace">Enlace con organismos externos</option>
            <option value="miembro">Miembro</option>
          </select>
        </div>
        <div><label>Área</label><select id="grdComiteArea"></select></div>
        <div><label>Teléfono / contacto</label><input id="grdComiteTelefono"></div>
        <div><label>Vigencia hasta</label><input type="date" id="grdComiteVigencia"></div>
      </div>
      <div class="toolbar" style="margin-top:10px;">
        <button class="btn" id="saveGrdComiteBtn">Guardar</button>
        <button class="btn secondary" id="cancelEditGrdComiteBtn" style="display:none;">Cancelar edición</button>
      </div>
      <table style="margin-top:14px;">
        <thead><tr><th>Nombre</th><th>Cargo</th><th>Rol</th><th>Área</th><th>Contacto</th><th>Vigencia</th><th>Acciones</th></tr></thead>
        <tbody id="grdComiteTable"></tbody>
      </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header-row" id="hdrGrdRespuesta"><h2 id="grdRespuestaFormTitle">Etapa 2 — Plan de respuesta ACCEDER</h2><button class="collapse-toggle" id="toggleGrdRespuesta" type="button" aria-label="Contraer o expandir">▾</button></div>
      <div class="collapsible-body" id="bodyGrdRespuesta">
      <div class="desc">Para cada amenaza identificada, define cómo se responderá ante el riesgo residual (el que queda después de las medidas de prevención), siguiendo los 7 pasos de la metodología ACCEDER.</div>
      <div class="form-grid">
        <div><label>Amenaza</label><select id="grdRespuestaAmenaza"></select></div>
      </div>
      <label>Alerta y Alarma (A)</label>
      <textarea id="grdRespAlerta" placeholder="Cómo se detecta y se avisa: sirenas, luces, aviso por radio, monitoreo de alertas externas..."></textarea>
      <label>Comunicación e información (C)</label>
      <textarea id="grdRespComunicacion" placeholder="Quién comunica, a quién, cuándo y cómo (interno: trabajadores/gerencia; externo: familias, bomberos, salud, municipio)"></textarea>
      <label>Coordinación (C)</label>
      <textarea id="grdRespCoordinacion" placeholder="Coordinador de la emergencia, líderes de evacuación por área, zonas de encuentro"></textarea>
      <label>Evaluación preliminar (E)</label>
      <textarea id="grdRespEvalPreliminar" placeholder="Qué se evalúa apenas ocurre la emergencia: tipo, lesionados, daños, insumos, materiales peligrosos"></textarea>
      <label>Decisiones (D)</label>
      <textarea id="grdRespDecisiones" placeholder="Quién decide activar atención médica, suspender faenas, restringir áreas, convocar personal de emergencia"></textarea>
