6. Gestión de riesgos
ANGOLEC SPA mantiene actualizada su Matriz de Identificación de Peligros y Evaluación de Riesgos (IPER), aplicando la jerarquía de controles del DS N°44 (eliminación, sustitución, controles de ingeniería, controles administrativos y elementos de protección personal), priorizando los controles en la fuente por sobre el uso exclusivo de EPP.

