        <button class="btn secondary small" data-epp-est-eliminar="${r.id}">Eliminar</button>
      </td>
    </tr>
  `).join("") || `<tr><td class="empty" colspan="8">Sin necesidades de EPP registradas para el filtro seleccionado</td></tr>`;
}
on(document.getElementById("eppEstudioTable"), "click", async (e) => {
  const editBtn = e.target.closest("button[data-epp-est-editar]");
  const delBtn = e.target.closest("button[data-epp-est-eliminar]");
  if(editBtn){ startEditEppEst(editBtn.dataset.eppEstEditar); return; }
