services:
  - type: web
    name: prevencion-riesgos-api-pehuen
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prevencion-riesgos-db-pehuen
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: prevencion-riesgos-db-pehuen
    plan: basic-256mb
