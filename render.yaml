    <div class="card">
      <h2>Control de compromisos (reuniones y otros)</h2>
      <div class="desc">Seguimiento del nivel de cumplimiento mensual de los compromisos e instancias periódicas de gestión de prevención (reportes, reuniones de comités, jornadas de seguridad, etc.). Cada ítem tiene una meta de actividad(es) por mes; para cada mes se registra cuántas veces se realizó.</div>
      <div class="toolbar" style="margin-bottom:6px;">
        <div class="field"><label>Ver indicadores</label>
          <select id="compTilesPeriodoTipo">
            <option value="mensual">Por mes</option>
            <option value="anual">Todo el año (acumulado)</option>
          </select>
        </div>
        <div class="field" id="compTilesMesWrap"><label>Mes</label><select id="compTilesMes"></select></div>
        <div class="field"><label>Año</label><select id="compTilesAnio"></select></div>
      </div>
      <div class="grid-tiles" id="compromisosTilesWrap"></div>
    </div>

    <div class="card">
      <div class="card-header-row" id="hdrCompromisosItems"><h2>Ítems de control</h2><button class="collapse-toggle" id="toggleCompromisosItems" type="button" aria-label="Contraer o expandir">▾</button></div>
